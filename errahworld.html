<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Strength Log – 1RM Tracking</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />

<style>
:root{
  --bg-main:#0c0e12;
  --bg-panel:#14161c;
  --bg-header:#1b1e26;
  --border:#2a2d36;
  --text:#d9dbe1;
  --muted:#9da1ac;
  --accent:#bfc6d6;
}

body{
  visibility:hidden;
  font-family:"Segoe UI",Arial,sans-serif;
  background:radial-gradient(circle at top,#12141b,var(--bg-main));
  color:var(--text);
  padding:24px;
}

/* 🔒 VIEWER LOCK */
.locked-content,
.locked-content *{
  pointer-events:none !important;
  user-select:none !important;
  caret-color:transparent !important;
}

/* LAYOUT */
.top-bar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  max-width:1020px;
  margin-bottom:12px;
}

#authBox input,#authBox button{
  background:transparent;
  border:1px solid var(--border);
  color:var(--accent);
  padding:6px 10px;
  border-radius:6px;
}

/* TABLE */
table{
  width:100%;
  max-width:1020px;
  border-collapse:collapse;
  background:var(--bg-panel);
  box-shadow:0 0 0 1px var(--border);
}

th,td{
  border:1px solid var(--border);
  padding:10px;
  text-align:center;
}

th{
  background:var(--bg-header);
  font-size:.75rem;
}

td.left{text-align:left}

.last-updated{
  font-size:.75rem;
  color:var(--muted);
}

/* 🏋️ BARBELL CALCULATOR */
.calculator{
  max-width:1020px;
  background:var(--bg-panel);
  border:1px solid var(--border);
  padding:16px;
  margin:16px 0 24px;
  border-radius:8px;
}

.calc-row{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:14px;
}

.calc-row input,.calc-row select,.calc-row button{
  background:#0e1016;
  border:1px solid var(--border);
  color:var(--text);
  padding:8px;
  border-radius:6px;
}

.calc-row button{cursor:pointer}

/* BARBELL VISUAL */
.barbell{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  margin-top:18px;
}

.bar{
  height:10px;
  width:280px;
  background:linear-gradient(90deg,#777,#aaa,#777);
  border-radius:6px;
}

/* PLATES */
.plates{
  display:flex;
  align-items:flex-end;
  gap:4px;
}

.plate{
  border-radius:4px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:.6rem;
  font-weight:600;
  color:#000;
}

/* Plate sizing (heaviest → lightest) */
.p45{width:28px;height:78px;background:#d32f2f}
.p35{width:26px;height:72px;background:#1976d2}
.p25{width:24px;height:66px;background:#fbc02d}
.p15{width:22px;height:60px;background:#8bc34a}
.p10{width:20px;height:54px;background:#388e3c}
.p5{width:16px;height:44px;background:#ff9800}
.p2_5{width:14px;height:38px;background:#9c27b0}

.calc-note{
  font-size:.75rem;
  color:var(--muted);
  margin-top:10px;
  text-align:center;
}

.calc-warning{
  margin-top:8px;
  font-size:.75rem;
  color:#ffb74d;
  text-align:center;
}
</style>
</head>

<body>

<h1 id="title"></h1>
<p id="desc"></p>

<!-- 🏋️ BARBELL CALCULATOR -->
<div class="calculator">
  <h3>Barbell Calculator (LB)</h3>

  <div class="calc-row">
    <input id="target" type="number" placeholder="Target weight (lb)">
    <select id="bar">
      <option value="45">45 lb Olympic bar</option>
      <option value="65">65 lb Trap bar</option>
    </select>
    <button onclick="calculate()">Calculate</button>
  </div>

  <div class="barbell">
    <div id="leftPlates" class="plates"></div>
    <div class="bar"></div>
    <div id="rightPlates" class="plates"></div>
  </div>

  <div id="warning" class="calc-warning"></div>

  <div class="calc-note">
    Heaviest plates are closest to the bar. Plates are mirrored per side.
  </div>
</div>

<div class="top-bar">
  <div id="authBox">
    <input id="email" placeholder="admin email">
    <input id="password" type="password" placeholder="password">
    <button id="loginBtn">Login</button>
    <button id="logoutBtn" style="display:none">Logout</button>
  </div>
  <div id="lastUpdated" class="last-updated"></div>
</div>

<table id="table" class="locked-content">
<thead>
<tr>
  <th class="left">Lift</th>
  <th>Current</th>
  <th>1RM</th>
  <th>Strength Level</th>
</tr>
</thead>
<tbody id="tbody"></tbody>
</table>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>
firebase.initializeApp({
  apiKey:"AIzaSyBoePuKarSCVgvxQQBGvkMKq16DvKmBYBE",
  authDomain:"strenght-a9f37.firebaseapp.com",
  databaseURL:"https://strenght-a9f37-default-rtdb.firebaseio.com",
  projectId:"strenght-a9f37",
  storageBucket:"strenght-a9f37.firebasestorage.app",
  messagingSenderId:"469926449178",
  appId:"1:469926449178:web:b9623947a1c1865b0f81a3"
});

/* 🏋️ BARBELL LOGIC */
const PLATES=[45,35,25,15,10,5,2.5];

function plateClass(w){
  return w===2.5 ? "p2_5" : "p"+w;
}

function calculate(){
  leftPlates.innerHTML="";
  rightPlates.innerHTML="";
  warning.innerText="";

  const target=+document.getElementById("target").value;
  const bar=+document.getElementById("bar").value;
  const rawPerSide=(target-bar)/2;
  if(rawPerSide<=0) return;

  const minIncrement=2.5;
  const roundedPerSide=Math.round(rawPerSide/minIncrement)*minIncrement;

  if(Math.abs(rawPerSide-roundedPerSide)>0.001){
    warning.innerText=
      `Exact load not possible. Rounded to ${(roundedPerSide*2+bar).toFixed(1)} lb total.`;
  }

  let remain=roundedPerSide;
  const used=[];

  PLATES.forEach(p=>{
    while(remain>=p-0.001){
      remain-=p;
      used.push(p);
    }
  });

  /* Heaviest closest to bar */
  used.forEach(p=>{
    const l=document.createElement("div");
    l.className=`plate ${plateClass(p)}`;
    l.textContent=p;
    leftPlates.prepend(l);

    const r=l.cloneNode(true);
    rightPlates.appendChild(r);
  });
}
</script>

</body>
</html>
