<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Strength Log – 1RM Tracking</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />

<style>
:root{
 --bg-main:#0c0e12;
 --bg-panel:#14161c;
 --bg-header:#1b1e26;
 --border:#2a2d36;
 --text:#d9dbe1;
 --muted:#9da1ac;
 --accent:#bfc6d6;
}

body{
 visibility:hidden;
 font-family:"Segoe UI",Arial,sans-serif;
 background:radial-gradient(circle at top,#12141b,var(--bg-main));
 color:var(--text);
 padding:24px;
}

/* 🔒 VIEWER LOCK */
.locked-content, .locked-content *{
 pointer-events:none !important;
 user-select:none !important;
 caret-color:transparent !important;
}

*{ box-sizing:border-box }
*:focus{ outline:none !important; box-shadow:none !important; }

.top-bar{
 display:flex;
 justify-content:space-between;
 align-items:center;
 max-width:1020px;
 margin-bottom:12px;
}

#authBox input,#authBox button{
 background:transparent;
 border:1px solid var(--border);
 color:var(--accent);
 padding:6px 10px;
 border-radius:6px;
 margin-right:4px;
}

table{
 width:100%;
 max-width:1020px;
 border-collapse:collapse;
 background:var(--bg-panel);
 box-shadow:0 0 0 1px var(--border);
}

th,td{
 border:1px solid var(--border);
 padding:10px;
 text-align:center;
}

th{
 background:var(--bg-header);
 color:var(--accent);
 font-size:.75rem;
}

td.left{text-align:left}

.last-updated{
 font-size:.75rem;
 color:var(--muted);
}

/* ========================= */
/* 🏋️ BARBELL CALCULATOR */
/* ========================= */

.calculator{
 max-width:1020px;
 margin-top:28px;
 padding:18px;
 background:var(--bg-panel);
 border:1px solid var(--border);
 border-radius:10px;
}

.calc-controls{
 display:flex;
 gap:10px;
 flex-wrap:wrap;
 margin-bottom:14px;
}

.calc-controls input,
.calc-controls select,
.calc-controls button{
 background:#0e1016;
 border:1px solid var(--border);
 color:var(--text);
 padding:8px 10px;
 border-radius:6px;
}

.calc-controls button{
 cursor:pointer;
 background:#1b1e26;
}

.barbell-wrap{
 margin-top:20px;
 display:flex;
 justify-content:center;
}

.barbell{
 display:flex;
 align-items:center;
}

.sleeve{
 display:flex;
 align-items:center;
 min-height:70px;
}

.bar{
 width:180px;
 height:10px;
 background:#555;
 border-radius:6px;
 margin:0 8px;
}

.plate{
 height:60px;
 border-radius:4px;
 margin:0 2px;
 background:#888;
}

.p45{ width:34px }
.p35{ width:30px }
.p25{ width:26px }
.p15{ width:22px }
.p10{ width:18px }
.p5{ width:14px }
.p2_5{ width:10px }

.round-warning{
 margin-top:10px;
 color:#ffb84d;
 font-size:.8rem;
 text-align:center;
}
</style>
</head>

<body>

<h1 id="title"></h1>
<p id="desc"></p>

<div class="top-bar">
 <div id="authBox">
  <input id="email" placeholder="admin email">
  <input id="password" type="password" placeholder="password">
  <button id="loginBtn">Login</button>
  <button id="logoutBtn" style="display:none">Logout</button>
 </div>
 <div id="lastUpdated" class="last-updated"></div>
</div>

<table id="table" class="locked-content">
 <thead>
  <tr>
   <th class="left">Lift</th>
   <th>Current</th>
   <th>1RM</th>
   <th>Strength Level</th>
  </tr>
 </thead>
 <tbody id="tbody"></tbody>
</table>

<!-- 🏋️ BARBELL CALCULATOR -->
<div class="calculator">
 <h3>Barbell Calculator</h3>

 <div class="calc-controls">
  <select id="unit">
   <option value="lb">LB</option>
   <option value="kg">KG</option>
  </select>

  <input id="targetWeight" type="number" placeholder="Target weight">

  <button onclick="calculatePlates()">Calculate</button>
 </div>

 <div class="barbell-wrap">
  <div class="barbell">
   <div id="leftSleeve" class="sleeve"></div>
   <div class="bar"></div>
   <div id="rightSleeve" class="sleeve"></div>
  </div>
 </div>

 <div id="roundMsg" class="round-warning"></div>
</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>
firebase.initializeApp({
 apiKey:"AIzaSyBoePuKarSCVgvxQQBGvkMKq16DvKmBYBE",
 authDomain:"strenght-a9f37.firebaseapp.com",
 databaseURL:"https://strenght-a9f37-default-rtdb.firebaseio.com",
 projectId:"strenght-a9f37",
 storageBucket:"strenght-a9f37.firebasestorage.app",
 messagingSenderId:"469926449178",
 appId:"1:469926449178:web:b9623947a1c1865b0f81a3"
});

const auth=firebase.auth();
const db=firebase.database();

let isAdmin=false;
let firstLoad=true;

/* 🚫 VIEWER SHIELD (FIXED) */
function viewerShield(e){
 if(isAdmin) return;
 if(e.target.closest("#authBox")) return;
 if(e.target.closest(".calculator")) return; // ✅ ALLOW CALCULATOR
 e.preventDefault();
 e.stopPropagation();
 return false;
}

["touchstart","touchend","click","focus"].forEach(evt=>{
 document.addEventListener(evt,viewerShield,true);
});

/* BARBELL LOGIC */
const plates=[45,35,25,15,10,5,2.5];

function calculatePlates(){
 const unit=document.getElementById("unit").value;
 const input=parseFloat(document.getElementById("targetWeight").value);
 const barWeight=unit==="lb"?45:20;

 const left=document.getElementById("leftSleeve");
 const right=document.getElementById("rightSleeve");
 const msg=document.getElementById("roundMsg");

 left.innerHTML="";
 right.innerHTML="";
 msg.innerText="";

 if(isNaN(input) || input<=barWeight) return;

 let remaining=(input-barWeight)/2;
 let used=[];
 let rounded=false;

 plates.forEach(p=>{
  while(remaining>=p-0.001){
   used.push(p);
   remaining-=p;
  }
 });

 if(remaining>0.01) rounded=true;

 used.forEach(p=>{
  const cls="plate p"+String(p).replace(".","_");
  const l=document.createElement("div");
  const r=document.createElement("div");
  l.className=cls;
  r.className=cls;
  left.appendChild(l);
  right.prepend(r);
 });

 if(rounded){
  msg.innerText="⚠ Weight rounded to closest achievable load with available plates.";
 }
}
</script>

</body>
</html>
