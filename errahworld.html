<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Strength Log – 1RM Tracking</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />

<style>
:root{
  --bg-main:#0c0e12;
  --bg-panel:#14161c;
  --bg-header:#1b1e26;
  --border:#2a2d36;
  --text:#d9dbe1;
  --muted:#9da1ac;
  --accent:#bfc6d6;
}

body{
  visibility:hidden;
  font-family:"Segoe UI", Arial, sans-serif;
  background:radial-gradient(circle at top,#12141b,var(--bg-main));
  color:var(--text);
  padding:24px;
}

.locked-content,
.locked-content *{
  pointer-events:none !important;
  user-select:none !important;
  caret-color:transparent !important;
}

*:focus{ outline:none !important; }

.top-bar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  max-width:1020px;
  margin-bottom:12px;
}

#authBox input,
#authBox button{
  background:transparent;
  border:1px solid var(--border);
  color:var(--accent);
  padding:6px 10px;
  border-radius:6px;
  margin-right:4px;
}

table{
  width:100%;
  max-width:1020px;
  border-collapse:collapse;
  background:var(--bg-panel);
  box-shadow:0 0 0 1px var(--border);
}

th,td{
  border:1px solid var(--border);
  padding:10px;
  text-align:center;
}

th{
  background:var(--bg-header);
  color:var(--accent);
  font-size:.75rem;
}

td.left{text-align:left;}

.last-updated{
  font-size:.75rem;
  color:var(--muted);
}

/* ===== BARBELL ===== */
.calculator{
  max-width:1020px;
  margin-top:32px;
  padding:16px;
  background:var(--bg-panel);
  border:1px solid var(--border);
  border-radius:8px;
}

.calculator input,
.calculator label{
  background:transparent;
  border:1px solid var(--border);
  color:var(--accent);
  padding:8px 12px;
  border-radius:6px;
  margin-right:6px;
}

.calculator input[type="number"]::-webkit-inner-spin-button,
.calculator input[type="number"]::-webkit-outer-spin-button{
  -webkit-appearance:none;
}
.calculator input[type="number"]{ -moz-appearance:textfield; }

.barbell{
  margin-top:20px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.bar{
  width:260px;
  height:8px;
  background:#777;
  border-radius:4px;
}

.side{ display:flex; align-items:center; }

.plate{
  height:60px;
  border-radius:4px;
  margin:0 2px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:.7rem;
  font-weight:600;
  color:#111;
}

.p45{width:26px;background:#c0392b;}
.p35{width:24px;background:#d35400;}
.p25{width:22px;background:#f1c40f;}
.p10{width:18px;background:#3498db;color:#fff;}
.p5{width:14px;background:#2ecc71;}
.p2_5{width:10px;background:#95a5a6;}

.note{font-size:.75rem;color:var(--muted);margin-top:8px;}
.total{font-size:.85rem;margin-top:6px;}
</style>
</head>

<body>

<h1 id="title"></h1>
<p id="desc"></p>

<div class="top-bar">
  <div id="authBox">
    <input id="email" placeholder="admin email">
    <input id="password" type="password" placeholder="password">
    <button id="loginBtn">Login</button>
    <button id="logoutBtn" style="display:none">Logout</button>
  </div>
  <div id="lastUpdated" class="last-updated"></div>
</div>

<table id="table" class="locked-content">
<thead>
<tr>
<th class="left">Lift</th>
<th>Current</th>
<th>1RM</th>
<th>Strength Level</th>
</tr>
</thead>
<tbody id="tbody"></tbody>
</table>

<!-- BARBELL -->
<div class="calculator">
<h3>Barbell Target Weight (lbs)</h3>

<input id="targetWeight" type="number" placeholder="Target weight">
<input id="barWeight" type="number" value="45" placeholder="Bar weight">

<label>
<input type="checkbox" id="includeBar" checked> Include bar
</label>

<div class="barbell">
<div id="leftSide" class="side"></div>
<div class="bar"></div>
<div id="rightSide" class="side"></div>
</div>

<div id="roundNote" class="note"></div>
<div id="totalWeight" class="total"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>
firebase.initializeApp({
  apiKey:"AIzaSyBoePuKarSCVgvxQQBGvkMKq16DvKmBYBE",
  authDomain:"strenght-a9f37.firebaseapp.com",
  databaseURL:"https://strenght-a9f37-default-rtdb.firebaseio.com",
  projectId:"strenght-a9f37",
  storageBucket:"strenght-a9f37.appspot.com",
  messagingSenderId:"469926449178",
  appId:"1:469926449178:web:b9623947a1c1865b0f81a3"
});

const auth = firebase.auth();
const db = firebase.database();

const titleEl = document.getElementById("title");
const descEl = document.getElementById("desc");
const tbody = document.getElementById("tbody");
const table = document.getElementById("table");
const lastUpdatedEl = document.getElementById("lastUpdated");

const emailEl = document.getElementById("email");
const passEl = document.getElementById("password");
const loginBtn = document.getElementById("loginBtn");
const logoutBtn = document.getElementById("logoutBtn");

let isAdmin = false;

function lockAll(){
  isAdmin=false;
  table.classList.add("locked-content");
  titleEl.contentEditable="false";
  descEl.contentEditable="false";
}

loginBtn.onclick=()=>{
  auth.signInWithEmailAndPassword(emailEl.value,passEl.value)
    .catch(e=>alert(e.message));
};
logoutBtn.onclick=()=>auth.signOut();

auth.onAuthStateChanged(user=>{
  if(user){
    isAdmin=true;
    table.classList.remove("locked-content");
    titleEl.contentEditable="true";
    descEl.contentEditable="true";
    loginBtn.style.display="none";
    logoutBtn.style.display="inline-block";
  }else{
    lockAll();
    loginBtn.style.display="inline-block";
    logoutBtn.style.display="none";
  }
});

db.ref("log").once("value").then(s=>{
  const d=s.val();
  if(!d) return;
  titleEl.innerText=d.title;
  descEl.innerHTML=d.desc;
  tbody.innerHTML=d.table;
  lastUpdatedEl.innerText="Last updated: "+d.updated;
  document.body.style.visibility="visible";
});

/* ===== LIVE BARBELL ===== */
const plates=[45,35,25,10,5,2.5];

function updateBarbell(){
  const target=+targetWeight.value;
  const barW=+barWeight.value||0;
  const include=includeBar.checked;

  leftSide.innerHTML="";
  rightSide.innerHTML="";
  roundNote.innerText="";
  totalWeight.innerText="";

  if(!target) return;

  const bar=include?barW:0;
  let rem=(target-bar)/2;
  if(rem<0) return;

  let used=[];
  plates.forEach(p=>{
    while(rem>=p){ rem-=p; used.push(p); }
  });

  if(rem>0) roundNote.innerText="Rounded down to nearest achievable weight.";

  let plateTotal=0;

  used.forEach(p=>{
    plateTotal+=p*2;
    const c=p===2.5?"p2_5":"p"+p;
    rightSide.innerHTML+=`<div class="plate ${c}">${p}</div>`;
  });

  [...used].reverse().forEach(p=>{
    const c=p===2.5?"p2_5":"p"+p;
    leftSide.innerHTML+=`<div class="plate ${c}">${p}</div>`;
  });

  totalWeight.innerText="Total loaded weight: "+(plateTotal+bar)+" lb";
}

["input","change"].forEach(e=>{
  targetWeight.addEventListener(e,updateBarbell);
  barWeight.addEventListener(e,updateBarbell);
  includeBar.addEventListener(e,updateBarbell);
});

lockAll();
</script>

</body>
</html>
