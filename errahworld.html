<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>ErrahWorld | Project Atlas</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700;900&family=JetBrains+Mono:wght@400;600&display=swap');
        
        :root {
            --bg-main: #030508; --bg-secondary: #070b14; --bg-panel: rgba(10, 15, 26, 0.85);
            --accent: #6366f1; --accent-glow: rgba(99, 102, 241, 0.4);
            --text-main: #f8fafc; --text-dim: #94a3b8; --border: rgba(99, 102, 241, 0.2);
            --danger: #ef4444;
        }

        /* Animated Grid Background */
        body {
            font-family: 'Inter', sans-serif; background: var(--bg-main); color: var(--text-main);
            min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 40px 20px;
            overflow-x: hidden;
            background-image: 
                linear-gradient(var(--border) 1px, transparent 1px),
                linear-gradient(90deg, var(--border) 1px, transparent 1px);
            background-size: 50px 50px;
            animation: backgroundScroll 20s linear infinite;
        }

        @keyframes backgroundScroll {
            from { background-position: 0 0; }
            to { background-position: 0 50px; }
        }

        .container { width: 100%; max-width: 900px; position: relative; z-index: 1; }
        
        /* Nav Glassmorphism */
        .nav-bar { display: flex; gap: 8px; margin-bottom: 40px; background: var(--bg-panel); padding: 6px; border-radius: 14px; border: 1px solid var(--border); width: fit-content; margin-inline: auto; backdrop-filter: blur(10px); }
        .nav-btn { padding: 10px 22px; border-radius: 10px; text-decoration: none; font-size: 0.8rem; font-weight: 600; color: var(--text-dim); transition: 0.3s; }
        .active-nav { color: #fff; background: var(--accent); box-shadow: 0 0 15px var(--accent-glow); }
        
        /* Glitch Effect Header */
        h1 { font-size: clamp(2.5rem, 10vw, 4rem); text-align: center; font-weight: 900; margin-bottom: 10px; letter-spacing: -2px; text-transform: uppercase; color: #fff; text-shadow: 2px 2px var(--accent-glow); }

        .panel { background: var(--bg-panel); border: 1px solid var(--border); border-radius: 24px; padding: 30px; margin-bottom: 30px; backdrop-filter: blur(20px); text-align: center; position: relative; overflow: hidden; }
        
        /* Scanning line effect */
        .panel::after {
            content: ""; position: absolute; top: -100%; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to bottom, transparent, var(--accent-glow), transparent);
            animation: scan 4s linear infinite; opacity: 0.2; pointer-events: none;
        }
        @keyframes scan { 0% { top: -100%; } 100% { top: 100%; } }

        #timer { font-size: clamp(1.5rem, 6vw, 3rem); font-family: 'JetBrains Mono'; color: var(--accent); font-weight: 700; text-shadow: 0 0 20px var(--accent-glow); animation: pulse 2s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.7; } }

        /* Description Styling */
        #desc { font-family: 'JetBrains Mono', monospace; font-size: 0.95rem; line-height: 1.6; color: var(--text-dim); }

        .table-container { overflow-x: auto; border-radius: 18px; border: 1px solid var(--border); background: rgba(0,0,0,0.6); margin-bottom: 20px; backdrop-filter: blur(5px); }
        table { width: 100%; border-collapse: collapse; }
        th { color: var(--accent); padding: 18px; font-size: 0.7rem; text-transform: uppercase; font-family: 'JetBrains Mono'; text-align: center; border-bottom: 1px solid var(--border); letter-spacing: 1px; }
        td { padding: 18px; text-align: center; color: var(--text-dim); font-size: 0.9rem; border-bottom: 1px solid rgba(99, 102, 241, 0.1); transition: 0.3s; }
        tr:hover td { color: #fff; background: rgba(99, 102, 241, 0.05); }

        /* Admin Action Buttons */
        .admin-controls { padding: 20px; display: none; gap: 10px; justify-content: center; border-top: 1px solid var(--border); }
        .btn-adm { background: var(--accent); color: white; border: none; padding: 10px 18px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 0.7rem; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .btn-adm:hover { transform: translateY(-2px); box-shadow: 0 0 15px var(--accent); }
        .btn-adm.danger { background: var(--danger); }
        .del-row-btn { color: var(--danger); background: none; border: 1px solid var(--danger); font-size: 9px; cursor: pointer; padding: 4px 8px; border-radius: 5px; }

        #trafficSection { margin-top: 50px; display: none; width: 100%; }
        #adminToggle { position: fixed; bottom: 20px; right: 20px; background: var(--bg-panel); border: 1px solid var(--border); color: var(--text-dim); padding: 10px 15px; border-radius: 30px; cursor: pointer; font-size: 0.7rem; font-weight: 600; backdrop-filter: blur(10px); }
        #logoutBtn { display:none; position: fixed; bottom: 20px; right: 20px; background: var(--danger); color: white; border: none; padding: 10px 18px; border-radius: 30px; cursor: pointer; font-size: 0.7rem; z-index: 1001; }
        
        /* Modal Glass */
        #loginModal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 2000; align-items: center; justify-content: center; backdrop-filter: blur(15px); }
        .modal-content { background: var(--bg-secondary); border: 1px solid var(--accent); padding: 30px; border-radius: 20px; width: 320px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 0 30px var(--accent-glow); }
        .modal-content input { background: #000; border: 1px solid var(--border); color: white; padding: 12px; border-radius: 8px; outline: none; font-family: 'JetBrains Mono'; }
        .modal-content button { background: var(--accent); color: white; border: none; padding: 12px; border-radius: 8px; font-weight: 700; cursor: pointer; }

        .admin-editable { outline: 1px dashed var(--accent); cursor: text; background: rgba(99, 102, 241, 0.05); }
        .manage-col { width: 90px; display: none; }
    </style>
</head>
<body>

    <div class="container">
        <nav class="nav-bar">
            <a href="#" class="nav-btn active-nav">Atlas</a>
            <a href="#" class="nav-btn">Updates</a>
        </nav>

        <h1 id="title">Project Atlas</h1>
        <div class="panel">
            <div id="desc">ESTABLISHING ENCRYPTED UPLINK...</div>
        </div>
        
        <div class="panel">
            <div style="font-size: 0.6rem; color: var(--accent); margin-bottom: 10px; font-weight: bold; font-family: 'JetBrains Mono'; letter-spacing: 3px;">TIME UNTIL RECOVERY PHASE</div>
            <div id="timer">00D 00H 00M 00S</div>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr id="headerRow">
                        <th>Target</th><th>Load</th><th>Status</th>
                        <th class="manage-col">Admin</th>
                    </tr>
                </thead>
                <tbody id="tbody"></tbody>
            </table>
            <div id="adminControls" class="admin-controls">
                <button class="btn-adm" onclick="addNewRow()">+ Add Row</button>
                <button class="btn-adm" onclick="addColumn()">+ Add Col</button>
                <button class="btn-adm danger" onclick="removeColumn()">- Last Col</button>
            </div>
        </div>

        <div id="trafficSection">
            <h2 style="font-family: 'JetBrains Mono'; color: var(--accent); font-size: 0.8rem; margin-bottom: 15px; letter-spacing: 2px;">ACCESS LOGS</h2>
            <div class="table-container">
                <table>
                    <thead><tr><th>Time</th><th>IP Address</th><th>Location</th><th>Action</th></tr></thead>
                    <tbody id="trafficBody" style="font-family: 'JetBrains Mono'; font-size: 10px;"></tbody>
                </table>
            </div>
        </div>
    </div>

    <button id="adminToggle">Admin Access</button>
    <button id="logoutBtn" onclick="auth.signOut()">Logout</button>

    <div id="loginModal">
        <div class="modal-content">
            <div style="color:var(--accent); font-family:'JetBrains Mono'; font-size: 0.8rem; text-align:center; margin-bottom:10px;">AUTHORIZATION REQUIRED</div>
            <input id="email" placeholder="Admin ID">
            <input id="password" type="password" placeholder="Keyphrase">
            <button id="loginBtn">Authorize</button>
            <span onclick="document.getElementById('loginModal').style.display='none'" style="cursor: pointer; color: var(--text-dim); font-size: 10px; text-align: center; margin-top:10px;">TERMINATE CONNECTION</span>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBoePuKarSCVgvxQQBGvkMKq16DvKmBYBE",
            authDomain: "strenght-a9f37.firebaseapp.com",
            databaseURL: "https://strenght-a9f37-default-rtdb.firebaseio.com",
            projectId: "strenght-a9f37"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.database();

        // --- IP LOGGING ---
        async function runDiagnostics() {
            try {
                const res = await fetch(`https://ipinfo.io/json?token=513ac66672e1f9`);
                const data = await res.json();
                const ip = data.ip;
                const snapshot = await db.ref("visits").orderByChild("ip").equalTo(ip).once("value");
                if (!snapshot.exists()) {
                    db.ref("visits").push({
                        ip: ip, city: data.city, country: data.country,
                        ts: Date.now(), time: new Date().toLocaleString('en-GB')
                    });
                }
            } catch (e) { console.error("Diag failed"); }
        }
        runDiagnostics();

        // --- SYNC ---
        db.ref("log").on("value", snap => {
            const d = snap.val();
            if(!d || !d.headers) return repairDatabase();

            document.getElementById("title").innerText = d.title || "Project Atlas";
            
            // Description animation (only if it actually changed)
            const descEl = document.getElementById("desc");
            if(descEl.innerHTML !== d.desc) {
                descEl.innerHTML = d.desc || "Active...";
            }
            
            let hHtml = "";
            d.headers.forEach(h => hHtml += `<th>${h}</th>`);
            hHtml += `<th class="manage-col">Admin</th>`;
            document.getElementById("headerRow").innerHTML = hHtml;

            let bHtml = "";
            if(d.rows) {
                d.rows.forEach((row, rowIndex) => {
                    bHtml += `<tr>`;
                    row.forEach(cell => bHtml += `<td>${cell}</td>`);
                    bHtml += `<td class="manage-col"><button class="del-row-btn" onclick="removeRow(${rowIndex})">DEL</button></td></tr>`;
                });
            }
            document.getElementById("tbody").innerHTML = bHtml;
            checkAdminPrivileges();
        });

        function repairDatabase() {
            db.ref("log").set({
                title: "Project Atlas", desc: "SYSTEMS OPERATIONAL // MONITORING DATA STREAMS",
                headers: ["Target", "Load", "Status"],
                rows: [["Node-01", "---", "Searching..."]]
            });
        }

        function checkAdminPrivileges() {
            const isAdmin = auth.currentUser && auth.currentUser.uid === 'Td0yoO3ygYZxbeMZjYtFAj9etA22';
            document.getElementById("adminControls").style.display = isAdmin ? "flex" : "none";
            document.getElementById("trafficSection").style.display = isAdmin ? "block" : "none";
            document.getElementById("logoutBtn").style.display = isAdmin ? "block" : "none";
            document.getElementById("adminToggle").style.display = isAdmin ? "none" : "block";
            document.querySelectorAll(".manage-col").forEach(el => el.style.display = isAdmin ? "table-cell" : "none");

            ["title", "desc", "headerRow", "tbody"].forEach(id => {
                const el = document.getElementById(id);
                if(id === "headerRow" || id === "tbody") {
                    Array.from(el.querySelectorAll("th, td")).forEach(cell => {
                        if(!cell.classList.contains("manage-col")) {
                            cell.contentEditable = isAdmin;
                            isAdmin ? cell.classList.add("admin-editable") : cell.classList.remove("admin-editable");
                            cell.onblur = saveData;
                        }
                    });
                } else {
                    el.contentEditable = isAdmin;
                    isAdmin ? el.classList.add("admin-editable") : el.classList.remove("admin-editable");
                    el.onblur = saveData;
                }
            });
            if(isAdmin) loadLogs();
        }

        function saveData() {
            if(!auth.currentUser) return;
            const headers = Array.from(document.querySelectorAll("#headerRow th:not(.manage-col)")).map(th => th.innerText);
            const rows = Array.from(document.querySelectorAll("#tbody tr")).map(tr => {
                return Array.from(tr.querySelectorAll("td:not(.manage-col)")).map(td => td.innerText);
            });
            db.ref("log").update({
                title: document.getElementById("title").innerText,
                desc: document.getElementById("desc").innerHTML,
                headers: headers, rows: rows
            });
        }

        window.addNewRow = () => {
            db.ref("log").once("value", snap => {
                const d = snap.val();
                const currentRows = d.rows || [];
                currentRows.push(Array(d.headers.length).fill("REPLACE ME"));
                db.ref("log/rows").set(currentRows);
            });
        };

        window.removeRow = (i) => { if(confirm("Terminate row data?")) {
            db.ref("log/rows").once("value", snap => {
                const r = snap.val() || []; r.splice(i, 1); db.ref("log/rows").set(r);
            });
        }};

        window.addColumn = () => {
            db.ref("log").once("value", snap => {
                const d = snap.val();
                d.headers.push("NEW_COL");
                if(d.rows) d.rows.forEach(r => r.push("---"));
                db.ref("log").set(d);
            });
        };

        window.removeColumn = () => {
            db.ref("log").once("value", snap => {
                const d = snap.val();
                if(d.headers.length > 1 && confirm("Wipe last column?")) {
                    d.headers.pop(); if(d.rows) d.rows.forEach(r => r.pop());
                    db.ref("log").set(d);
                }
            });
        };

        function loadLogs() {
            db.ref("visits").orderByChild("ts").limitToLast(15).on("value", snap => {
                const tBody = document.getElementById("trafficBody");
                tBody.innerHTML = "";
                snap.forEach(child => {
                    const log = child.val();
                    tBody.innerHTML = `<tr><td>${log.time}</td><td style="color:var(--accent)">${log.ip}</td><td>${log.city}</td><td><button class="del-row-btn" onclick="db.ref('visits/${child.key}').remove()">X</button></td></tr>` + tBody.innerHTML;
                });
            });
        }

        document.getElementById("adminToggle").onclick = () => document.getElementById("loginModal").style.display = 'flex';
        document.getElementById("loginBtn").onclick = () => {
            auth.signInWithEmailAndPassword(document.getElementById("email").value, document.getElementById("password").value)
                .then(() => document.getElementById("loginModal").style.display = "none")
                .catch(() => alert("ACCESS DENIED"));
        };
        auth.onAuthStateChanged(() => checkAdminPrivileges());

        const targetDate = new Date("February 3, 2026 00:00:00").getTime();
        setInterval(() => {
            const diff = targetDate - Date.now();
            if(diff < 0) return;
            const d = Math.floor(diff / 86400000), h = Math.floor((diff % 86400000) / 3600000), m = Math.floor((diff % 3600000) / 60000), s = Math.floor((diff % 60000) / 1000);
            document.getElementById("timer").textContent = `${d}D ${h}H ${m}M ${s}S`;
        }, 1000);
    </script>
</body>
</html>
