<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Strength Log – 1RM Tracking</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />

<style>
:root{
  --bg-main:#0c0e12;
  --bg-panel:#14161c;
  --bg-header:#1b1e26;
  --border:#2a2d36;
  --text:#d9dbe1;
  --muted:#9da1ac;
  --accent:#bfc6d6;
}

body{
  visibility:hidden;
  font-family:"Segoe UI", Arial, sans-serif;
  background:radial-gradient(circle at top,#12141b,var(--bg-main));
  color:var(--text);
  padding:24px;
}

/* 🔒 HARD READ-ONLY LOCK */
.locked-content,
.locked-content *{
  pointer-events:none !important;
  user-select:none !important;
  -webkit-user-select:none !important;
  touch-action:none !important;
  caret-color:transparent !important;
}

.top-bar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  max-width:1020px;
  margin-bottom:12px;
}

#authBox input,
#authBox button{
  background:transparent;
  border:1px solid var(--border);
  color:var(--accent);
  padding:6px 10px;
  border-radius:6px;
  margin-right:4px;
}

table{
  width:100%;
  max-width:1020px;
  border-collapse:collapse;
  background:var(--bg-panel);
  box-shadow:0 0 0 1px var(--border);
}

th, td{
  border:1px solid var(--border);
  padding:10px;
  text-align:center;
}

th{
  background:var(--bg-header);
  color:var(--accent);
  font-size:.75rem;
}

td.left{ text-align:left; }

.last-updated{
  font-size:.75rem;
  color:var(--muted);
}

/* 🌍 IP INFO DISPLAY */
.ipinfo{
  max-width:1020px;
  margin:8px 0 14px;
  font-size:.75rem;
  color:var(--muted);
}

/* 🏋️ BARBELL */
.calculator{
  max-width:1020px;
  margin-top:32px;
  padding:16px;
  background:var(--bg-panel);
  border:1px solid var(--border);
  border-radius:8px;
}

.calculator input,
.calculator label{
  background:transparent;
  border:1px solid var(--border);
  color:var(--accent);
  padding:8px 12px;
  border-radius:6px;
  margin-right:6px;
}

.barbell{
  margin-top:20px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.bar{ width:260px;height:8px;background:#777;border-radius:4px; }
.side{ display:flex;align-items:center; }

.plate{
  height:60px;
  border-radius:4px;
  margin:0 2px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:.7rem;
  font-weight:600;
  color:#111;
}

.p45{ width:26px;background:#c0392b; }
.p35{ width:24px;background:#d35400; }
.p25{ width:22px;background:#f1c40f; }
.p10{ width:18px;background:#3498db;color:#fff; }
.p5{ width:14px;background:#2ecc71; }
.p2_5{ width:10px;background:#95a5a6; }

.note{ font-size:.75rem;color:var(--muted);margin-top:8px; }
.total{ margin-top:6px;font-size:.85rem; }
</style>
</head>

<body>

<h1 id="title"></h1>
<p id="desc"></p>

<div class="top-bar">
  <div id="authBox">
    <input id="email" placeholder="admin email">
    <input id="password" type="password" placeholder="password">
    <button id="loginBtn">Login</button>
    <button id="logoutBtn" style="display:none">Logout</button>
  </div>
  <div id="lastUpdated" class="last-updated"></div>
</div>

<div id="ipInfo" class="ipinfo">Loading IP info…</div>

<table id="table" class="locked-content">
  <thead>
    <tr>
      <th class="left">Lift</th>
      <th>Current</th>
      <th>1RM</th>
      <th>Strength Level</th>
    </tr>
  </thead>
  <tbody id="tbody"></tbody>
</table>

<div class="calculator">
  <h3>Barbell Calculator (lbs)</h3>

  <input id="targetWeight" type="number" placeholder="Loaded weight">
  <input id="barWeight" type="number" value="45">

  <label>
    <input type="checkbox" id="includeBar" checked>
    Include bar for plates
  </label>

  <div class="barbell">
    <div id="leftSide" class="side"></div>
    <div class="bar"></div>
    <div id="rightSide" class="side"></div>
  </div>

  <div id="roundNote" class="note"></div>
  <div id="trueLoad" class="total"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>
/* 🔥 FIREBASE */
firebase.initializeApp({
  apiKey: "AIzaSyBoePuKarSCVgvxQQBGvkMKq16DvKmBYBE",
  authDomain: "strenght-a9f37.firebaseapp.com",
  databaseURL: "https://strenght-a9f37-default-rtdb.firebaseio.com",
  projectId: "strenght-a9f37",
  storageBucket: "strenght-a9f37.firebasestorage.app",
  messagingSenderId: "469926449178",
  appId: "1:469926449178:web:b9623947a1c1865b0f81a3"
});

const auth = firebase.auth();
const db = firebase.database();

/* 🌍 IPINFO (COUNTS + SHOWS IN DASHBOARD) */
fetch("https://api.ipinfo.io/json?token=513ac66672e1f9", {
  cache: "no-store"
})
.then(r => r.json())
.then(d => {
  document.getElementById("ipInfo").innerText =
    `IP: ${d.ip} · ${d.city}, ${d.region}, ${d.country}`;
})
.catch(() => {
  document.getElementById("ipInfo").innerText = "IP info unavailable";
});

/* 🔐 AUTH */
const titleEl = document.getElementById("title");
const descEl = document.getElementById("desc");
const tbody = document.getElementById("tbody");
const table = document.getElementById("table");
const lastUpdatedEl = document.getElementById("lastUpdated");

loginBtn.onclick = () =>
  auth.signInWithEmailAndPassword(email.value, password.value)
    .catch(e => alert(e.message));

logoutBtn.onclick = () => auth.signOut();

auth.onAuthStateChanged(user=>{
  table.classList.toggle("locked-content", !user);
  [titleEl, descEl, tbody].forEach(el=>{
    el.contentEditable = !!user;
    if(!user) el.blur();
  });
  loginBtn.style.display = user ? "none" : "inline-block";
  logoutBtn.style.display = user ? "inline-block" : "none";
});

/* 📥 LOAD */
db.ref("log").once("value").then(s=>{
  const d = s.val();
  if(!d) return;
  titleEl.innerText = d.title;
  descEl.innerHTML = d.desc;
  tbody.innerHTML = d.table;
  lastUpdatedEl.innerText = "Last updated: " + d.updated;
  document.body.style.visibility = "visible";
});

/* 💾 SAVE */
function saveData(){
  if(!auth.currentUser) return;
  const updated = new Date().toLocaleString();
  db.ref("log").set({
    title:titleEl.innerText,
    desc:descEl.innerHTML,
    table:tbody.innerHTML,
    updated
  });
  lastUpdatedEl.innerText = "Last updated: " + updated;
}
["input","keyup","paste","blur"].forEach(e=>{
  titleEl.addEventListener(e, saveData);
  descEl.addEventListener(e, saveData);
  tbody.addEventListener(e, saveData);
});

/* 🏋️ BARBELL */
const plates=[45,35,25,10,5,2.5];
function updateBarbell(){
  leftSide.innerHTML=rightSide.innerHTML=roundNote.innerText="";
  const t=+targetWeight.value,b=+barWeight.value||0;
  if(!t) return;
  let r=(includeBar.checked?(t-b):t)/2;
  if(r<0){roundNote.innerText="Target less than bar.";return;}
  let u=[];
  plates.forEach(p=>{while(r>=p){r-=p;u.push(p)}});
  if(r>0) roundNote.innerText="Rounded down.";
  u.forEach(p=>rightSide.innerHTML+=`<div class="plate p${p==2.5?"2_5":p}">${p}</div>`);
  [...u].reverse().forEach(p=>leftSide.innerHTML+=`<div class="plate p${p==2.5?"2_5":p}">${p}</div>`);
  trueLoad.innerText=`Loaded: ${t} lbs · True load: ${includeBar.checked?t:(u.reduce((s,p)=>s+p*2,0)+b)} lbs`;
}
[targetWeight,barWeight,includeBar].forEach(e=>e.addEventListener("input",updateBarbell));
</script>

</body>
</html>
