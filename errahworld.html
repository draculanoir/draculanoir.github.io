<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>ERRAHWORLD | THE ALTAR OF ATLAS</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cinzel:wght@400;700&family=Montserrat:wght@200;400;800&display=swap');
        
        :root {
            --gold: #f3cf7a;
            --gold-glow: rgba(243, 207, 122, 0.4);
            --void: #020205;
            --celestial: #a5b4fc;
        }

        * { box-sizing: border-box; cursor: none; } /* Custom cursor logic below */
        
        body {
            margin: 0; padding: 0;
            background-color: var(--void);
            color: #fff;
            font-family: 'Montserrat', sans-serif;
            overflow-x: hidden;
            perspective: 1000px;
        }

        /* Cinematic Background */
        #nebula-canvas { position: fixed; top: 0; left: 0; z-index: -1; }

        /* Custom Divine Cursor */
        #cursor {
            position: fixed; width: 40px; height: 40px;
            border: 2px solid var(--gold); border-radius: 50%;
            pointer-events: none; z-index: 9999;
            transition: transform 0.1s ease-out;
            box-shadow: 0 0 15px var(--gold-glow);
            mix-blend-mode: difference;
        }

        .main-stage {
            display: flex; flex-direction: column; align-items: center;
            padding: 80px 20px;
            transform-style: preserve-3d;
        }

        /* The Title: A Monument */
        .title-wrap {
            position: relative; margin-bottom: 60px;
            animation: float 6s infinite ease-in-out;
        }
        
        h1 {
            font-family: 'Cinzel Decorative', serif;
            font-size: clamp(4rem, 18vw, 10rem);
            margin: 0; font-weight: 900;
            background: linear-gradient(180deg, #fff 0%, var(--gold) 50%, #866a2d 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 30px rgba(243, 207, 122, 0.3));
            letter-spacing: 15px;
        }

        .subtitle {
            font-family: 'Cinzel', serif;
            letter-spacing: 12px; font-size: 0.9rem; color: var(--gold);
            text-align: center; margin-top: -20px; text-transform: uppercase;
        }

        /* Perspective Cards */
        .glass-tablet {
            width: 100%; max-width: 900px;
            background: linear-gradient(135deg, rgba(255,255,255,0.05) 0%, rgba(255,255,255,0.01) 100%);
            border: 1px solid rgba(243, 207, 122, 0.2);
            padding: 50px; border-radius: 4px;
            backdrop-filter: blur(25px);
            box-shadow: 0 50px 100px rgba(0,0,0,0.8);
            margin-bottom: 60px;
            transition: transform 0.2s ease-out;
        }

        #desc {
            font-size: 1.3rem; line-height: 2; color: var(--celestial);
            text-align: center; font-weight: 200; font-style: italic;
        }

        /* Massive Countdown */
        .countdown-shrine {
            text-align: center; margin-bottom: 80px;
        }
        .countdown-label { font-family: 'Cinzel'; color: var(--gold); letter-spacing: 6px; font-size: 0.8rem; margin-bottom: 20px; }
        #timer {
            font-size: clamp(3rem, 10vw, 6rem);
            font-weight: 800; font-family: 'Montserrat';
            background: linear-gradient(90deg, #fff, var(--gold), #fff);
            background-size: 200% auto;
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            animation: shine 4s linear infinite;
        }

        /* The Eternal Table */
        .table-wrap {
            width: 100%; max-width: 1000px; overflow-x: auto;
            border-radius: 8px; border: 1px solid var(--border-gold);
        }
        table { width: 100%; border-collapse: collapse; background: rgba(0,0,0,0.6); }
        th { 
            font-family: 'Cinzel'; color: var(--gold); padding: 30px; 
            text-transform: uppercase; letter-spacing: 4px; border-bottom: 1px solid var(--gold);
            font-size: 0.75rem;
        }
        td { 
            padding: 35px 20px; text-align: center; 
            font-size: 1.4rem; font-weight: 200; 
            border-bottom: 1px solid rgba(243, 207, 122, 0.1);
        }
        tr:hover td { background: rgba(243, 207, 122, 0.05); color: var(--gold); }

        /* Auth UI */
        #authBox { display: flex; gap: 20px; margin-bottom: 50px; }
        input { 
            background: transparent; border: 1px solid var(--gold); 
            color: #fff; padding: 15px 25px; font-family: 'Cinzel'; 
            outline: none; transition: 0.3s;
        }
        input:focus { box-shadow: 0 0 20px var(--gold-glow); }
        button { 
            background: var(--gold); color: #000; border: none; 
            padding: 15px 40px; font-family: 'Cinzel'; font-weight: 900;
            letter-spacing: 2px;
        }

        /* Animations */
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-20px); } }
        @keyframes shine { to { background-position: 200% center; } }

    </style>
</head>
<body onmousemove="handleParallax(event)">

    <div id="cursor"></div>
    <canvas id="nebula-canvas"></canvas>

    <div class="main-stage" id="stage">
        <div class="title-wrap">
            <h1 id="title">ATLAS</h1>
            <div class="subtitle">Architect of Strength</div>
        </div>

        <div class="glass-tablet" id="tilt-card">
            <div id="desc">Mortal, document your burdens here. Only those who record their struggle shall transcend the weight of the heavens.</div>
        </div>

        <div class="countdown-shrine">
            <div class="countdown-label">NEXT DIVINE ASCENSION</div>
            <div id="timer">00:00:00:00</div>
        </div>

        <div id="authBox">
            <input id="email" placeholder="IDENTITY">
            <input id="password" type="password" placeholder="SIGIL">
            <button id="loginBtn" onclick="shockwave()">AWAKEN</button>
            <button id="logoutBtn" style="display:none">DORMANT</button>
        </div>

        <div class="table-wrap">
            <table id="table">
                <thead>
                    <tr><th>ORDEAL</th><th>WEIGHT</th><th>LIMIT</th><th>STATUS</th></tr>
                </thead>
                <tbody id="tbody">
                    <tr><td colspan="4">Summoning Records...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <script>
        // --- 3D PARALLAX ENGINE ---
        const stage = document.getElementById('stage');
        const tiltCard = document.getElementById('tilt-card');
        const cursor = document.getElementById('cursor');

        function handleParallax(e) {
            // Cursor move
            cursor.style.left = e.clientX + 'px';
            cursor.style.top = e.clientY + 'px';

            // 3D Tilt
            const x = (window.innerWidth / 2 - e.clientX) / 25;
            const y = (window.innerHeight / 2 - e.clientY) / 25;
            tiltCard.style.transform = `rotateY(${x}deg) rotateX(${y}deg)`;
            stage.style.transform = `translateX(${x * 0.5}px) translateY(${y * 0.5}px)`;
        }

        // --- CELESTIAL CANVAS ---
        const canvas = document.getElementById('nebula-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function initCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            particles = [];
            for(let i=0; i<200; i++) {
                particles.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    z: Math.random() * canvas.width,
                    o: Math.random()
                });
            }
        }

        function drawCelestial() {
            ctx.fillStyle = '#020205';
            ctx.fillRect(0,0,canvas.width, canvas.height);
            particles.forEach(p => {
                p.z -= 2;
                if(p.z <= 0) p.z = canvas.width;
                const sx = (p.x - canvas.width/2) * (canvas.width/p.z) + canvas.width/2;
                const sy = (p.y - canvas.height/2) * (canvas.width/p.z) + canvas.height/2;
                const size = (canvas.width/p.z) * 1.5;
                ctx.fillStyle = `rgba(243, 207, 122, ${1 - p.z/canvas.width})`;
                ctx.beginPath();
                ctx.arc(sx, sy, size, 0, Math.PI*2);
                ctx.fill();
            });
            requestAnimationFrame(drawCelestial);
        }
        initCanvas(); drawCelestial();

        // --- FIREBASE LOGIC ---
        firebase.initializeApp({
            apiKey:"AIzaSyBoePuKarSCVgvxQQBGvkMKq16DvKmBYBE",
            authDomain:"strenght-a9f37.firebaseapp.com",
            databaseURL:"https://strenght-a9f37-default-rtdb.firebaseio.com",
            projectId:"strenght-a9f37",
            storageBucket:"strenght-a9f37.firebasestorage.app",
            messagingSenderId:"469926449178",
            appId:"1:469926449178:web:b9623947a1c1865b0f81a3"
        });

        const auth = firebase.auth();
        const db = firebase.database();
        const titleEl = document.getElementById("title"),
              descEl = document.getElementById("desc"),
              tbody = document.getElementById("tbody");

        db.ref("log").on("value", snap => {
            const d = snap.val() || {};
            titleEl.innerText = d.title || "ATLAS";
            descEl.innerHTML = d.desc || "Document your ascent into godhood.";
            tbody.innerHTML = d.table || "";
        });

        // Admin Interactions
        auth.onAuthStateChanged(user => {
            const isAdmin = !!user;
            [titleEl, descEl, tbody].forEach(el => el.contentEditable = isAdmin);
            document.getElementById("loginBtn").style.display = user ? "none" : "block";
            document.getElementById("logoutBtn").style.display = user ? "block" : "none";
        });

        function saveData() {
            if(!auth.currentUser) return;
            db.ref("log").set({ title: titleEl.innerText, desc: descEl.innerHTML, table: tbody.innerHTML });
        }
        [titleEl, descEl, tbody].forEach(el => el.addEventListener("blur", saveData));

        // Timer
        const targetDate = new Date("February 3, 2026 00:00:00").getTime();
        setInterval(() => {
            const diff = targetDate - Date.now();
            const d = Math.floor(diff/86400000), h = Math.floor(diff/3600000)%24, m = Math.floor(diff/60000)%60, s = Math.floor(diff/1000)%60;
            document.getElementById("timer").textContent = `${d}D ${h}H ${m}M ${s}S`;
        }, 1000);

        function shockwave() {
            auth.signInWithEmailAndPassword(document.getElementById("email").value, document.getElementById("password").value);
        }
    </script>
</body>
</html>
