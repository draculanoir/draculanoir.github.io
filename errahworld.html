<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Strength Log – 1RM Tracking</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />

<style>
:root{
  --bg-main:#0c0e12;
  --bg-panel:#14161c;
  --bg-header:#1b1e26;
  --border:#2a2d36;
  --text:#d9dbe1;
  --muted:#9da1ac;
  --accent:#bfc6d6;
}

body{
  visibility:hidden;
  font-family:"Segoe UI",Arial,sans-serif;
  background:radial-gradient(circle at top,#12141b,var(--bg-main));
  color:var(--text);
  padding:24px;
}

/* 🔒 VIEWER LOCK */
.locked-content,
.locked-content *{
  pointer-events:none !important;
  user-select:none !important;
  caret-color:transparent !important;
}

*:focus{outline:none}

/* LAYOUT */
.top-bar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  max-width:1020px;
  margin-bottom:12px;
}

#authBox input,#authBox button{
  background:transparent;
  border:1px solid var(--border);
  color:var(--accent);
  padding:6px 10px;
  border-radius:6px;
}

/* TABLE */
table{
  width:100%;
  max-width:1020px;
  border-collapse:collapse;
  background:var(--bg-panel);
  box-shadow:0 0 0 1px var(--border);
}

th,td{
  border:1px solid var(--border);
  padding:10px;
  text-align:center;
}

th{
  background:var(--bg-header);
  font-size:.75rem;
}

td.left{text-align:left}

.last-updated{
  font-size:.75rem;
  color:var(--muted);
}

/* 🏋️ BARBELL CALCULATOR */
.calculator{
  max-width:1020px;
  background:var(--bg-panel);
  border:1px solid var(--border);
  padding:16px;
  margin:16px 0 24px;
  border-radius:8px;
}

.calc-row{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:12px;
}

.calc-row input,.calc-row select,.calc-row button{
  background:#0e1016;
  border:1px solid var(--border);
  color:var(--text);
  padding:8px;
  border-radius:6px;
}

.calc-row button{
  cursor:pointer;
}

.plates{
  display:flex;
  gap:6px;
  margin-top:12px;
  align-items:flex-end;
}

.plate{
  width:28px;
  border-radius:4px;
  text-align:center;
  font-size:.65rem;
  color:#000;
}

.p25{height:70px;background:#d32f2f}
.p20{height:64px;background:#1976d2}
.p15{height:58px;background:#fbc02d}
.p10{height:52px;background:#388e3c}
.p5{height:42px;background:#ff9800}
.p2{height:34px;background:#9c27b0}
.p1{height:28px;background:#aaa}

.calc-note{
  font-size:.75rem;
  color:var(--muted);
  margin-top:8px;
}
</style>
</head>

<body>

<h1 id="title"></h1>
<p id="desc"></p>

<!-- 🏋️ BARBELL CALCULATOR -->
<div class="calculator">
  <h3>Barbell Calculator</h3>

  <div class="calc-row">
    <select id="unit">
      <option value="kg">KG</option>
      <option value="lb">LB</option>
    </select>

    <input id="target" type="number" placeholder="Target weight">

    <select id="bar">
      <option value="20">20 kg / 45 lb bar</option>
      <option value="15">15 kg bar</option>
      <option value="25">Trap bar (25)</option>
    </select>

    <button onclick="calculate()">Calculate</button>
  </div>

  <strong>Plates per side:</strong>
  <div id="plates" class="plates"></div>

  <div class="calc-note">
    Displays plates for ONE side only.
  </div>
</div>

<div class="top-bar">
  <div id="authBox">
    <input id="email" placeholder="admin email">
    <input id="password" type="password" placeholder="password">
    <button id="loginBtn">Login</button>
    <button id="logoutBtn" style="display:none">Logout</button>
  </div>
  <div id="lastUpdated" class="last-updated"></div>
</div>

<table id="table" class="locked-content">
<thead>
<tr>
  <th class="left">Lift</th>
  <th>Current</th>
  <th>1RM</th>
  <th>Strength Level</th>
</tr>
</thead>
<tbody id="tbody"></tbody>
</table>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>
firebase.initializeApp({
  apiKey:"AIzaSyBoePuKarSCVgvxQQBGvkMKq16DvKmBYBE",
  authDomain:"strenght-a9f37.firebaseapp.com",
  databaseURL:"https://strenght-a9f37-default-rtdb.firebaseio.com",
  projectId:"strenght-a9f37",
  storageBucket:"strenght-a9f37.firebasestorage.app",
  messagingSenderId:"469926449178",
  appId:"1:469926449178:web:b9623947a1c1865b0f81a3"
});

const auth=firebase.auth();
const db=firebase.database();

const titleEl=document.getElementById("title");
const descEl=document.getElementById("desc");
const tbody=document.getElementById("tbody");
const table=document.getElementById("table");
const lastUpdatedEl=document.getElementById("lastUpdated");
const loginBtn=document.getElementById("loginBtn");
const logoutBtn=document.getElementById("logoutBtn");

let isAdmin=false;
let firstLoad=true;

/* 🔐 AUTH */
loginBtn.onclick=()=>auth.signInWithEmailAndPassword(
  email.value,password.value
).catch(e=>alert(e.message));

logoutBtn.onclick=()=>auth.signOut();

auth.onAuthStateChanged(user=>{
  isAdmin=!!user;
  table.classList.toggle("locked-content",!isAdmin);
  loginBtn.style.display=user?"none":"inline-block";
  logoutBtn.style.display=user?"inline-block":"none";
});

/* 📥 LOAD */
db.ref("log").once("value").then(s=>{
  const d=s.val();
  if(!d) return;
  titleEl.innerText=d.title;
  descEl.innerHTML=d.desc;
  tbody.innerHTML=d.table;
  lastUpdatedEl.innerText="Last updated: "+d.updated;
  document.body.style.visibility="visible";
});

/* 🔁 LIVE VIEW */
db.ref("log").on("value",s=>{
  if(firstLoad){firstLoad=false;return;}
  if(isAdmin) return;
  const d=s.val();
  titleEl.innerText=d.title;
  descEl.innerHTML=d.desc;
  tbody.innerHTML=d.table;
  lastUpdatedEl.innerText="Last updated: "+d.updated;
});

/* 💾 SAVE */
document.addEventListener("input",()=>{
  if(!isAdmin) return;
  const n=new Date();
  db.ref("log").set({
    title:titleEl.innerText,
    desc:descEl.innerHTML,
    table:tbody.innerHTML,
    updated:n.toLocaleDateString("en-GB",{day:"numeric",month:"long",year:"numeric"})+
      " · "+n.toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit"})
  });
});

/* 🏋️ BARBELL LOGIC */
const platesKg=[25,20,15,10,5,2.5,1.25];

function calculate(){
  const unit=unitSel.value;
  const target=+targetInput.value;
  const bar=+barSel.value;
  const side=(target-bar)/2;

  platesDiv.innerHTML="";
  if(side<=0) return;

  let remain=side;
  platesKg.forEach(p=>{
    while(remain>=p-0.01){
      remain-=p;
      const d=document.createElement("div");
      d.className="plate p"+Math.floor(p);
      d.textContent=p;
      platesDiv.appendChild(d);
    }
  });
}

const unitSel=document.getElementById("unit");
const targetInput=document.getElementById("target");
const barSel=document.getElementById("bar");
const platesDiv=document.getElementById("plates");
</script>

</body>
</html>
