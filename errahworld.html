<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>ErrahWorld | AI Strength Log</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        
        :root {
            --bg-main: #0a0c13;
            --bg-panel: rgba(22, 26, 42, 0.88);
            --bg-header: rgba(32, 38, 64, 0.95);
            --border: rgba(255, 255, 255, 0.08);
            --text: #eef0f6;
            --muted: #9aa1b3;
            --accent: #cfd6ff;
            --shadow: 0 10px 40px rgba(0,0,0,0.6);
        }

        * { box-sizing: border-box; }
        
        body {
            margin: 0; padding: 20px; font-family: "Inter", sans-serif;
            background: radial-gradient(1200px 600px at top, #1c2340, transparent 60%), var(--bg-main);
            color: var(--text);
            padding-bottom: 120px; 
        }

        /* Navigation */
        .nav-bar { display: flex; gap: 8px; margin-bottom: 20px; justify-content: center; }
        .nav-btn { background: rgba(255,255,255,0.05); border: 1px solid var(--border); color: var(--accent); padding: 8px 12px; border-radius: 10px; text-decoration: none; font-size: 0.85rem; flex: 1; text-align: center; transition: 0.3s; }
        .active-nav { background: var(--accent); color: #000; font-weight: 700; }

        .last-updated-banner { font-size: 0.75rem; color: var(--accent); text-align: center; margin-bottom: 15px; font-weight: 600; letter-spacing: 0.5px; opacity: 0.8; }
        h1 { margin: 0 0 10px; font-size: 2.2rem; text-align: center; font-weight: 800; }
        #desc { padding: 18px; margin-bottom: 20px; background: rgba(255,255,255,0.04); border: 1px solid var(--border); border-radius: 18px; color: var(--muted); line-height: 1.6; outline: none; }

        /* Countdown */
        .countdown {
            margin: 10px 0 20px; padding: 15px; background: linear-gradient(135deg, #2b3160, #1b1f3d);
            border-radius: 15px; display: flex; justify-content: space-between; align-items: center; font-size: 0.85rem; border: 1px solid var(--border);
        }
        #timer { font-weight: 700; color: var(--accent); }

        /* Auth */
        #authBox { display: flex; gap: 10px; padding: 12px; background: rgba(255,255,255,0.05); border-radius: 15px; border: 1px solid var(--border); margin-bottom: 20px; }
        #authBox input { background: rgba(0,0,0,0.25); border: 1px solid var(--border); color: var(--accent); padding: 10px; border-radius: 10px; width: 100%; outline: none; }
        #authBox button { background: #3a43a0; border: none; color: #fff; padding: 10px 15px; border-radius: 10px; cursor: pointer; font-weight: 600; }

        /* Table */
        table { width: 100%; border-collapse: collapse; background: var(--bg-panel); border-radius: 18px; overflow: hidden; box-shadow: var(--shadow); }
        th, td { padding: 14px; text-align: center; border-bottom: 1px solid var(--border); outline: none; }
        th { background: var(--bg-header); color: var(--accent); text-transform: uppercase; font-size: 0.65rem; letter-spacing: 0.1em; }
        .locked-content { pointer-events: none; opacity: 0.9; }

        /* JARVIS UI */
        #jarvis-container { position: fixed; bottom: 30px; right: 25px; z-index: 9999; display: flex; flex-direction: column; align-items: flex-end; }
        #jarvis-bubble { display: none; background: rgba(10, 12, 19, 0.96); border: 1px solid var(--accent); padding: 20px; border-radius: 24px; width: 280px; margin-bottom: 20px; backdrop-filter: blur(20px); box-shadow: 0 0 30px rgba(207, 214, 255, 0.2); color: var(--text); border-bottom-right-radius: 4px; transition: 0.3s; }
        #jarvis-status { font-size: 0.65rem; color: var(--accent); font-weight: 800; text-transform: uppercase; margin-bottom: 8px; letter-spacing: 1.5px; }
        #jarvis-text { font-size: 0.95rem; line-height: 1.5; font-weight: 400; }
        #jarvis-orb { width: 70px; height: 70px; background: #000; border: 2px solid var(--accent); border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; position: relative; transition: 0.5s; box-shadow: 0 0 20px rgba(207, 214, 255, 0.3); }
        #inner-glow { position: absolute; width: 100%; height: 100%; border-radius: 50%; box-shadow: inset 0 0 20px var(--accent); opacity: 0.4; }
        .voice-bars { display: flex; gap: 4px; align-items: center; }
        .voice-bars div { width: 3px; height: 12px; background: var(--accent); border-radius: 3px; transition: 0.2s; }
        
        .listening-active #v-bars div { animation: wave 0.4s infinite ease-in-out; background: #ff6b6b; }
        @keyframes wave { 0%, 100% { height: 10px; } 50% { height: 30px; } }
        #jarvis-orb.speaking { box-shadow: 0 0 40px var(--accent); border-color: #fff; }
    </style>
</head>
<body>

    <div class="nav-bar">
        <a href="errahworld.html" class="nav-btn active-nav">🏋️ Log</a>
        <a href="updates.html" class="nav-btn">📢 Updates</a>
    </div>

    <div id="lastUpdateBanner" class="last-updated-banner">NEURAL SYNC...</div>

    <h1 id="title">Strength Log</h1>
    <div id="desc">Accessing secure server...</div>

    <div class="countdown">
        <strong>Time to Peak 🏋️</strong>
        <div id="timer">--d --h --m --s</div>
    </div>

    <div id="authBox">
        <input id="email" placeholder="Admin Identification">
        <input id="password" type="password" placeholder="Keyphrase">
        <button id="loginBtn">Login</button>
        <button id="logoutBtn" style="display:none">Logout</button>
    </div>

    <table id="table" class="locked-content">
        <thead>
            <tr><th style="text-align:left">Exercise</th><th>Current</th><th>1RM</th><th>Status</th></tr>
        </thead>
        <tbody id="tbody"></tbody>
    </table>

    <div id="jarvis-container">
        <div id="jarvis-bubble">
            <div id="jarvis-status">AI ACTIVE</div>
            <div id="jarvis-text">Scanning environment...</div>
        </div>
        <div id="jarvis-orb">
            <div id="inner-glow"></div>
            <div class="voice-bars" id="v-bars">
                <div></div><div></div><div></div><div></div>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <script>
        firebase.initializeApp({
            apiKey:"AIzaSyBoePuKarSCVgvxQQBGvkMKq16DvKmBYBE",
            authDomain:"strenght-a9f37.firebaseapp.com",
            databaseURL:"https://strenght-a9f37-default-rtdb.firebaseio.com",
            projectId:"strenght-a9f37",
            storageBucket:"strenght-a9f37.firebasestorage.app",
            messagingSenderId:"469926449178",
            appId:"1:469926449178:web:b9623947a1c1865b0f81a3"
        });

        const auth = firebase.auth();
        const db = firebase.database();
        auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);

        const emailEl = document.getElementById("email"), passEl = document.getElementById("password"),
              loginBtn = document.getElementById("loginBtn"), logoutBtn = document.getElementById("logoutBtn"),
              titleEl = document.getElementById("title"), descEl = document.getElementById("desc"),
              tbody = document.getElementById("tbody"), table = document.getElementById("table"),
              updateBanner = document.getElementById("lastUpdateBanner");

        let isAdmin = false;

        function getFormattedDate() {
            const now = new Date();
            const months = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
            return `${now.getDate()} ${months[now.getMonth()]} ${now.getFullYear()} ${now.getHours() % 12 || 12}:${String(now.getMinutes()).padStart(2, '0')} ${now.getHours() >= 12 ? 'PM' : 'AM'}`;
        }

        loginBtn.onclick = () => auth.signInWithEmailAndPassword(emailEl.value, passEl.value).catch(e => alert(e.message));
        logoutBtn.onclick = () => { if(confirm("Terminate session?")) auth.signOut(); };

        auth.onAuthStateChanged(user => {
            isAdmin = !!user;
            table.classList.toggle("locked-content", !isAdmin);
            [titleEl, descEl, tbody].forEach(el => el.contentEditable = isAdmin);
            loginBtn.style.display = user ? "none" : "inline-block";
            emailEl.style.display = user ? "none" : "inline-block";
            passEl.style.display = user ? "none" : "inline-block";
            logoutBtn.style.display = user ? "inline-block" : "none";
        });

        db.ref("log").once("value", snap => {
            const d = snap.val() || {};
            titleEl.innerText = d.title || "Strength Log";
            descEl.innerHTML = d.desc || "Neural link active. Edit description...";
            tbody.innerHTML = d.table || "";
        });

        db.ref("meta/lastUpdate").on("value", snap => {
            updateBanner.innerText = "SYSTEM LAST UPDATED: " + (snap.val() || "UNKNOWN");
        });

        function saveData() {
            if(!isAdmin) return;
            const dateStr = getFormattedDate();
            db.ref("log").set({ title: titleEl.innerText, desc: descEl.innerHTML, table: tbody.innerHTML });
            db.ref("meta/lastUpdate").set(dateStr);
        }
        [titleEl, descEl, tbody].forEach(el => el.addEventListener("blur", saveData));

        // TIMER
        const targetDate = new Date("February 3, 2026 00:00:00").getTime();
        setInterval(() => {
            const diff = targetDate - Date.now();
            if(diff <= 0) { document.getElementById("timer").textContent = "LIMIT BREAKER DAY 🔥"; return; }
            const d = Math.floor(diff/86400000), h = Math.floor(diff/3600000)%24, m = Math.floor(diff/60000)%60, s = Math.floor(diff/1000)%60;
            document.getElementById("timer").textContent = `${d}D ${h}H ${m}M ${s}S`;
        }, 1000);

        // --- MODERN AI JARVIS (FEMALE + ECHO) ---
        const orb = document.getElementById('jarvis-orb');
        const bubble = document.getElementById('jarvis-bubble');
        const jText = document.getElementById('jarvis-text');
        const jStatus = document.getElementById('jarvis-status');
        const synth = window.speechSynthesis;
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        const recognition = SpeechRecognition ? new SpeechRecognition() : null;

        function jarvisSay(msg) {
            synth.cancel();
            const utter = new SpeechSynthesisUtterance(msg);
            
            // Voice selection: prioritize Female AI
            const voices = synth.getVoices();
            utter.voice = voices.find(v => (v.name.includes("Google US English") || v.name.includes("Female") || v.name.includes("Zira")) && v.lang.includes("en")) || voices[0];
            
            utter.pitch = 1.15; // Slightly higher for that AI feel
            utter.rate = 1.05;
            
            jText.innerText = msg;
            orb.classList.add('speaking');

            // Simulate "Echo/Futuristic" cadence by splitting sentences if needed, 
            // but for now, we rely on the clean modern female voice profile.
            synth.speak(utter);
            utter.onend = () => orb.classList.remove('speaking');
        }

        function getRecord(liftName) {
            const rows = document.querySelectorAll("#tbody tr");
            let found = "My database has no record for " + liftName;
            rows.forEach(row => {
                if(row.innerText.toLowerCase().includes(liftName.toLowerCase())) {
                    found = `Archive found. For ${row.cells[0].innerText}, your current is ${row.cells[1].innerText}. Estimated max is ${row.cells[2].innerText}. Status: ${row.cells[3].innerText}.`;
                }
            });
            return found;
        }

        orb.onclick = () => {
            bubble.style.display = (bubble.style.display === 'none' || !bubble.style.display) ? 'block' : 'none';
            if(bubble.style.display === 'block') {
                if(isAdmin) {
                    jarvisSay("Neural link established. Welcome back, Sir. Analyzing your current strength metrics.");
                    jStatus.innerText = "CO-PILOT MODE";
                } else {
                    jarvisSay("Public access granted. I am ready to provide Errah's performance statistics.");
                    jStatus.innerText = "ANALYTIC MODE";
                }
            }
        };

        if(recognition) {
            recognition.lang = 'en-US';
            orb.onmousedown = () => { 
                recognition.start(); 
                orb.classList.add('listening-active'); 
                jStatus.innerText = "LISTENING..."; 
            };
            orb.onmouseup = () => { 
                recognition.stop(); 
                orb.classList.remove('listening-active'); 
            };

            recognition.onresult = (event) => {
                const speech = event.results[0][0].transcript.toLowerCase();
                const contains = (words) => words.some(word => speech.includes(word));

                if(isAdmin) {
                    if(contains(["level", "doing", "progress"])) jarvisSay("My sensors indicate consistent growth. Your neural-muscular efficiency is peaking, Sir.");
                    else if(contains(["stats", "record", "max", "lift", "much"])) {
                        let lift = speech.replace(/what is|my|record|for|stats|on|show|me|how/g, "").trim();
                        jarvisSay(getRecord(lift || "squat"));
                    }
                    else if(contains(["tired", "hard", "heavy", "exhausted"])) jarvisSay("Input acknowledged. However, the log requires data. Execute the set, Sir.");
                    else jarvisSay("Data processed, but I require clearer parameters for that request.");
                } else {
                    if(contains(["record", "stats", "lift", "max", "much"])) {
                        let lift = speech.replace(/what is|his|record|for|stats|on|show|me/g, "").trim();
                        jarvisSay(getRecord(lift || "squat"));
                    } else jarvisSay("My core protocols only allow me to share public performance data.");
                }
            };
        }
    </script>
</body>
</html>
