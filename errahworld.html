<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Strength Log – 1RM Tracking</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

:root{
  --bg-main:#0a0c13;
  --bg-panel:rgba(22,26,42,.88);
  --bg-header:rgba(32,38,64,.95);
  --border:rgba(255,255,255,.08);
  --text:#eef0f6;
  --muted:#9aa1b3;
  --accent:#cfd6ff;
  --shadow:0 18px 40px rgba(0,0,0,.55);
}

*{ box-sizing:border-box; }

body{
  margin:0;
  padding:28px;
  font-family:"Inter",system-ui,sans-serif;
  background:
    radial-gradient(1200px 600px at top,#1c2340,transparent 60%),
    radial-gradient(900px 500px at bottom,#0b0f22,transparent 60%),
    var(--bg-main);
  color:var(--text);
}

@keyframes float{
  0%,100%{ transform:translateY(0); }
  50%{ transform:translateY(-6px); }
}

/* 🔒 HARD READ-ONLY LOCK */
.locked-content,
.locked-content *{
  pointer-events:none!important;
  user-select:none!important;
  caret-color:transparent!important;
}

h1{
  margin:0 0 12px;
  font-size:2.2rem;
  font-weight:700;
}

#desc{
  max-width:900px;
  padding:18px 22px;
  margin-bottom:26px;
  background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.02));
  border:1px solid var(--border);
  border-radius:18px;
  color:var(--muted);
  line-height:1.55;
  box-shadow:var(--shadow);
  backdrop-filter:blur(14px);
  animation:float 9s ease-in-out infinite;
}

.countdown{
  max-width:1020px;
  margin:18px 0 28px;
  padding:18px 22px;
  background:linear-gradient(135deg,#2b3160,#1b1f3d);
  border-radius:18px;
  box-shadow:var(--shadow);
  display:flex;
  justify-content:space-between;
  align-items:center;
  animation:float 8s ease-in-out infinite;
}

#timer{ font-weight:700; color:var(--accent); }

.top-bar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  max-width:1020px;
  margin-bottom:18px;
  gap:12px;
  flex-wrap:wrap;
}

#authBox{
  display:flex;
  gap:10px;
  padding:14px 16px;
  background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.03));
  border:1px solid var(--border);
  border-radius:20px;
  box-shadow:var(--shadow);
  backdrop-filter:blur(16px);
  animation:float 10s ease-in-out infinite;
}

#authBox input{
  background:rgba(0,0,0,.25);
  border:1px solid var(--border);
  color:var(--accent);
  padding:10px 14px;
  border-radius:12px;
  min-width:160px;
}

#authBox button{
  background:linear-gradient(135deg,#3a43a0,#2a2f66);
  border:none;
  color:#fff;
  padding:10px 18px;
  border-radius:14px;
  font-weight:600;
  cursor:pointer;
}

.last-updated{ font-size:.75rem; color:var(--muted); }

table{
  width:100%;
  max-width:1020px;
  border-collapse:collapse;
  background:var(--bg-panel);
  border-radius:22px;
  overflow:hidden;
  box-shadow:var(--shadow);
  animation:float 11s ease-in-out infinite;
}

th,td{
  padding:16px;
  text-align:center;
  border-bottom:1px solid var(--border);
}

th{
  background:var(--bg-header);
  font-size:.7rem;
  letter-spacing:.16em;
  text-transform:uppercase;
  color:var(--accent);
}

td.left{ text-align:left; }

/* 🔔 NOTIFICATIONS */
.notification{
  max-width:1020px;
  margin:20px 0;
  padding:18px 22px;
  background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(255,255,255,.03));
  border:1px solid var(--border);
  border-radius:18px;
  box-shadow:var(--shadow);
  backdrop-filter:blur(14px);
}
.notification.hidden{ display:none; }

.notif-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
}

#notifDate{ font-size:.75rem; color:var(--muted); }

#toggleNotif{
  background:none;
  border:none;
  color:var(--accent);
  cursor:pointer;
  font-weight:600;
}

.notification.admin input{
  width:100%;
  margin:10px 0;
  padding:12px;
  border-radius:12px;
  border:1px solid var(--border);
  background:rgba(0,0,0,.3);
  color:var(--text);
}

.notification.admin button{
  padding:10px 16px;
  border-radius:12px;
  border:none;
  background:linear-gradient(135deg,#3a43a0,#2a2f66);
  color:#fff;
  cursor:pointer;
}
</style>
</head>

<body>

<h1 id="title"></h1>
<p id="desc"></p>

<div class="countdown">
  <strong>Road to RM Drop 🏋️</strong>
  <div id="timer">Loading…</div>
</div>

<!-- 🔔 NOTIFICATION -->
<div id="notification" class="notification hidden">
  <div class="notif-header">
    <strong>Update</strong>
    <span id="notifDate"></span>
    <button id="toggleNotif">Hide</button>
  </div>
  <div id="notifBody"></div>
</div>

<!-- 🔔 ADMIN NOTIFICATION PANEL -->
<div id="notifAdmin" class="notification admin hidden">
  <h4>Post Notification</h4>
  <input id="notifInput" placeholder="Write notification..." />
  <button id="postNotif">Post</button>
</div>

<div class="top-bar">
  <div id="authBox">
    <input id="email" placeholder="admin email">
    <input id="password" type="password" placeholder="password">
    <button id="loginBtn">Login</button>
    <button id="logoutBtn" style="display:none">Logout</button>
  </div>
  <div id="lastUpdated" class="last-updated"></div>
</div>

<table id="table" class="locked-content">
<thead>
<tr>
<th class="left">Lift</th>
<th>Current</th>
<th>1RM</th>
<th>Strength Level</th>
</tr>
</thead>
<tbody id="tbody"></tbody>
</table>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>
firebase.initializeApp({
  apiKey:"AIzaSyBoePuKarSCVgvxQQBGvkMKq16DvKmBYBE",
  authDomain:"strenght-a9f37.firebaseapp.com",
  databaseURL:"https://strenght-a9f37-default-rtdb.firebaseio.com",
  projectId:"strenght-a9f37",
  storageBucket:"strenght-a9f37.firebasestorage.app",
  messagingSenderId:"469926449178",
  appId:"1:469926449178:web:b9623947a1c1865b0f81a3"
});

const auth=firebase.auth();
const db=firebase.database();

const titleEl=document.getElementById("title");
const descEl=document.getElementById("desc");
const tbody=document.getElementById("tbody");
const table=document.getElementById("table");
const lastUpdatedEl=document.getElementById("lastUpdated");

const emailEl=document.getElementById("email");
const passEl=document.getElementById("password");
const loginBtn=document.getElementById("loginBtn");
const logoutBtn=document.getElementById("logoutBtn");

let isAdmin=false;

function formatDate(d){
  return d.toLocaleString("en-US",{day:"2-digit",month:"long",year:"numeric",hour:"numeric",minute:"2-digit",hour12:true});
}

loginBtn.onclick=()=>auth.signInWithEmailAndPassword(emailEl.value,passEl.value).catch(e=>alert(e.message));
logoutBtn.onclick=()=>auth.signOut();

auth.onAuthStateChanged(user=>{
  isAdmin=!!user;
  table.classList.toggle("locked-content",!isAdmin);
  [titleEl,descEl,tbody].forEach(el=>el.contentEditable=isAdmin);
  loginBtn.style.display=user?"none":"inline-block";
  logoutBtn.style.display=user?"inline-block":"none";
  document.getElementById("notifAdmin").classList.toggle("hidden",!user);
});

const notifRef=db.ref("notification");

notifRef.on("value",s=>{
  const d=s.val();
  if(!d) return;
  notifBody.innerText=d.text;
  notifDate.innerText=d.date;
  const hidden=localStorage.getItem("hideNotif")==="1";
  notification.classList.toggle("hidden",hidden);
});

toggleNotif.onclick=()=>{
  const h=notification.classList.toggle("hidden");
  localStorage.setItem("hideNotif",h?"1":"0");
};

postNotif.onclick=()=>{
  if(!isAdmin||!notifInput.value.trim())return;
  notifRef.set({ text:notifInput.value.trim(), date:formatDate(new Date()) });
  notifInput.value="";
};
</script>

<script>
const targetDate=new Date("February 3, 2026 00:00:00").getTime();
const timerEl=document.getElementById("timer");
function updateTimer(){
  const diff=targetDate-Date.now();
  if(diff<=0){ timerEl.textContent="RM DAY 🔥"; return; }
  const d=Math.floor(diff/86400000);
  const h=Math.floor(diff/3600000)%24;
  const m=Math.floor(diff/60000)%60;
  const s=Math.floor(diff/1000)%60;
  timerEl.textContent=`${d}d ${h}h ${m}m ${s}s`;
}
updateTimer();
setInterval(updateTimer,1000);
</script>

</body>
</html>
