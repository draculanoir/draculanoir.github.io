<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getDatabase, ref, update, onValue } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyBoePuKarSCVgvxQQBGvkMKq16DvKmBYBE",
  authDomain: "strenght-a9f37.firebaseapp.com",
  databaseURL: "https://strenght-a9f37-default-rtdb.firebaseio.com",
  projectId: "strenght-a9f37"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);
const dataRef = ref(db, "strengthLog");

const body = document.body;
const title = document.getElementById("title");
const desc = document.getElementById("desc");
const tbody = document.getElementById("tbody");
const lastUpdated = document.getElementById("lastUpdated");
const loginBtn = document.getElementById("loginBtn");
const logoutBtn = document.getElementById("logoutBtn");

let isAdmin = false;
let saveTimer = null;

/* 🔁 LOAD DATA (READERS ONLY) */
onValue(dataRef, snap => {
  if (!snap.exists()) return;
  if (isAdmin) return; // ⛔ DO NOT OVERRIDE ADMIN INPUT

  const d = snap.val();
  title.textContent = d.title;
  desc.innerHTML = d.desc;
  tbody.innerHTML = d.table;
  lastUpdated.textContent = "Last updated: " + d.date;

  body.removeAttribute("data-loading");
});

/* ⏳ DEBOUNCED SAVE */
function scheduleSave() {
  if (!isAdmin) return;

  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveAll, 400);
}

/* 💾 FAST UPDATE */
function saveAll() {
  if (!auth.currentUser) return;

  const n = new Date();
  const f =
    `${String(n.getDate()).padStart(2,"0")}/` +
    `${String(n.getMonth()+1).padStart(2,"0")}/` +
    `${n.getFullYear()} · ` +
    `${String(n.getHours()).padStart(2,"0")}:` +
    `${String(n.getMinutes()).padStart(2,"0")}`;

  update(dataRef, {
    title: title.textContent,
    desc: desc.innerHTML,
    table: tbody.innerHTML,
    date: f
  });
}

/* 🔐 AUTH */
loginBtn.onclick = () => {
  const email = prompt("Admin email:");
  const pass = prompt("Password:");
  if (!email || !pass) return;
  signInWithEmailAndPassword(auth, email, pass).catch(e => alert(e.message));
};

logoutBtn.onclick = () => signOut(auth);

onAuthStateChanged(auth, user => {
  if (user) {
    isAdmin = true;
    body.classList.add("admin");
    loginBtn.style.display = "none";
    logoutBtn.style.display = "inline-block";

    [title, desc, ...document.querySelectorAll("td")].forEach(el => {
      el.contentEditable = "true";
      el.oninput = scheduleSave;
    });
  } else {
    isAdmin = false;
    body.classList.remove("admin");
    loginBtn.style.display = "inline-block";
    logoutBtn.style.display = "none";

    [title, desc, ...document.querySelectorAll("td")].forEach(el => {
      el.removeAttribute("contenteditable");
      el.oninput = null;
    });
  }
});
</script>
