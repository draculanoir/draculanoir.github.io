<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>ErrahWorld | AI Strength Log</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;600&display=swap');
        :root {
            --bg-main: #0a0e1a; --bg-secondary: #0f1423; --bg-panel: rgba(15, 20, 35, 0.85);
            --accent-primary: #6366f1; --accent-secondary: #8b5cf6; --accent-glow: rgba(99, 102, 241, 0.35);
            --text-primary: #f8fafc; --text-secondary: #cbd5e1; --border-glass: rgba(255, 255, 255, 0.12);
        }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', sans-serif; background: linear-gradient(135deg, var(--bg-main) 0%, var(--bg-secondary) 100%);
            color: var(--text-primary); min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 40px 20px;
        }
        .container { width: 100%; max-width: 920px; animation: fadeInUp 1.2s ease forwards; }
        
        /* Nav Fixed */
        .nav-bar { 
            display: flex; gap: 6px; margin-bottom: 50px; background: var(--bg-panel); padding: 8px; 
            border-radius: 20px; border: 1px solid var(--border-glass); width: fit-content; margin-inline: auto;
        }
        .nav-btn { 
            padding: 12px 28px; border-radius: 16px; text-decoration: none; font-size: 0.875rem; 
            font-weight: 600; color: var(--text-secondary); transition: 0.3s;
        }
        .active-nav { color: #fff; background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary)); }

        .last-updated-banner { font-size: 0.7rem; font-weight: 800; color: var(--accent-primary); text-align: center; margin-bottom: 16px; letter-spacing: 2px; font-family: 'JetBrains Mono'; }
        h1 { margin: 0 0 20px; font-size: clamp(3rem, 12vw, 4.5rem); text-align: center; font-weight: 900; color: white; }
        #desc { padding: 32px 40px; margin-bottom: 48px; border-radius: 28px; background: var(--bg-panel); border: 1px solid var(--border-glass); text-align: center; }
        .countdown { margin-bottom: 48px; padding: 40px; background: rgba(99, 102, 241, 0.1); border-radius: 32px; border: 1px solid var(--border-glass); text-align: center; }
        #timer { font-size: 2.5rem; font-weight: 900; font-family: 'JetBrains Mono'; color: var(--accent-primary); }
        .table-container { overflow: hidden; border-radius: 32px; border: 1px solid var(--border-glass); background: var(--bg-panel); }
        table { width: 100%; border-collapse: collapse; }
        th { color: var(--accent-primary); padding: 20px; font-size: 0.7rem; text-transform: uppercase; font-family: 'JetBrains Mono'; }
        td { padding: 20px; text-align: center; color: var(--text-secondary); border-bottom: 1px solid rgba(255,255,255,0.05); }
        #authBox { display: flex; gap: 10px; margin-top: 40px; justify-content: center; }
        input { background: rgba(0,0,0,0.3); border: 1px solid var(--border-glass); color: #fff; padding: 12px; border-radius: 12px; }
        button { background: var(--accent-primary); color: white; border: none; padding: 12px 24px; border-radius: 12px; cursor: pointer; font-weight: 700; }
        .admin-editable { outline: 1px dashed var(--accent-primary); }
    </style>
</head>
<body>
    <div class="container">
        <nav class="nav-bar">
            <a href="index.html" class="nav-btn active-nav">Project Atlas</a>
            <a href="updates.html" class="nav-btn">Updates</a>
        </nav>
        <div id="lastUpdateBanner" class="last-updated-banner">NEURAL LINK ACTIVE</div>
        <h1 id="title">Syncing</h1>
        <div id="desc">Decrypting strength data...</div>
        <div class="countdown">
            <strong>NEXT RM CYCLE</strong>
            <div id="timer">00D 00H 00M 00S</div>
        </div>
        <div class="table-container">
            <table>
                <thead><tr><th>Exercise</th><th>Current</th><th>1RM</th><th>Status</th></tr></thead>
                <tbody id="tbody"></tbody>
            </table>
        </div>
        <div id="authBox">
            <input id="email" placeholder="Admin ID">
            <input id="password" type="password" placeholder="Keyphrase">
            <button id="loginBtn">Login</button>
            <button id="logoutBtn" style="display:none; background:#ef4444;">Logout</button>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <script>
        firebase.initializeApp({
            apiKey: "AIzaSyBoePuKarSCVgvxQQBGvkMKq16DvKmBYBE",
            authDomain: "strenght-a9f37.firebaseapp.com",
            databaseURL: "https://strenght-a9f37-default-rtdb.firebaseio.com",
            projectId: "strenght-a9f37"
        });
        const auth = firebase.auth();
        const db = firebase.database();
        const titleEl = document.getElementById("title");
        const descEl = document.getElementById("desc");
        const tbody = document.getElementById("tbody");

        db.ref("log").on("value", snap => {
            const d = snap.val() || {};
            titleEl.innerText = d.title || "Strength Log";
            descEl.innerHTML = d.desc || "Neural link active...";
            tbody.innerHTML = d.table || "<tr><td colspan='4'>No data</td></tr>";
        });

        let isAdmin = false;
        auth.onAuthStateChanged(user => {
            isAdmin = !!user;
            [titleEl, descEl, tbody].forEach(el => {
                el.contentEditable = isAdmin;
                isAdmin ? el.classList.add("admin-editable") : el.classList.remove("admin-editable");
            });
            document.getElementById("loginBtn").style.display = user ? "none" : "block";
            document.getElementById("logoutBtn").style.display = user ? "block" : "none";
        });

        document.getElementById("loginBtn").onclick = () => auth.signInWithEmailAndPassword(document.getElementById("email").value, document.getElementById("password").value);
        document.getElementById("logoutBtn").onclick = () => auth.signOut();

        function saveData() {
            if(!isAdmin) return;
            db.ref("log").set({ title: titleEl.innerText, desc: descEl.innerHTML, table: tbody.innerHTML });
        }
        [titleEl, descEl, tbody].forEach(el => el.addEventListener("blur", saveData));

        const targetDate = new Date("February 3, 2026 00:00:00").getTime();
        setInterval(() => {
            const diff = targetDate - Date.now();
            const d = Math.floor(diff / 86400000), h = Math.floor((diff % 86400000) / 3600000), m = Math.floor((diff % 3600000) / 60000), s = Math.floor((diff % 60000) / 1000);
            document.getElementById("timer").textContent = `${d}D ${h}H ${m}M ${s}S`;
        }, 1000);
    </script>
</body>
</html>
