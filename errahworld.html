<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>ErrahWorld | AI Strength Log</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap');
        
        :root {
            --bg-main: #06080f;
            --bg-panel: rgba(10, 14, 28, 0.75);
            --accent: #7c89ff;
            --accent-glow: rgba(124, 137, 255, 0.4);
            --text-main: #ffffff;
            --text-muted: #8a91ad;
            --border-glass: rgba(255, 255, 255, 0.08);
            --card-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
        }

        /* Entrance Animations */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); filter: blur(10px); }
            to { opacity: 1; transform: translateY(0); filter: blur(0); }
        }

        @keyframes scanline {
            0% { transform: translateY(-100%); }
            100% { transform: translateY(100%); }
        }

        @keyframes pulseGlow {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 0.8; }
        }

        * { box-sizing: border-box; transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
        
        body {
            margin: 0; padding: 20px; font-family: "Plus Jakarta Sans", sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            min-height: 100vh;
            overflow-x: hidden;
            display: flex; flex-direction: column; align-items: center;
        }

        /* Animated Background */
        #bg-canvas {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1; opacity: 0.4; pointer-events: none;
        }

        .container {
            width: 100%; max-width: 850px; margin: 0 auto;
            animation: fadeInUp 1s ease-out forwards;
        }

        /* Premium Nav */
        .nav-bar { 
            display: flex; gap: 8px; margin-bottom: 30px; 
            background: rgba(255,255,255,0.03); padding: 6px; 
            border-radius: 18px; border: 1px solid var(--border-glass);
            width: fit-content; margin-inline: auto;
            backdrop-filter: blur(15px);
        }
        .nav-btn { 
            padding: 10px 24px; border-radius: 14px; 
            text-decoration: none; font-size: 0.85rem; font-weight: 600;
            color: var(--text-muted);
        }
        .active-nav { background: var(--accent); color: #000; box-shadow: 0 0 20px var(--accent-glow); }

        /* Typography & Header */
        .last-updated-banner { 
            font-size: 0.6rem; color: var(--accent); text-align: center; 
            margin-bottom: 10px; font-weight: 800; letter-spacing: 3px;
            animation: pulseGlow 2s infinite ease-in-out;
        }
        h1 { 
            margin: 0 0 10px; font-size: clamp(2.5rem, 10vw, 3.8rem); text-align: center; font-weight: 800; 
            background: linear-gradient(180deg, #fff 30%, var(--accent));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            letter-spacing: -2px;
        }
        #desc { 
            padding: 25px; margin-bottom: 35px; border-radius: 28px; 
            background: var(--bg-panel); border: 1px solid var(--border-glass);
            color: var(--text-muted); text-align: center; backdrop-filter: blur(20px);
            box-shadow: inset 0 0 20px rgba(255,255,255,0.02);
        }

        /* Countdown Card */
        .countdown {
            margin-bottom: 35px; padding: 25px; 
            background: linear-gradient(145deg, rgba(30,40,80,0.3), rgba(10,12,20,0.5));
            border-radius: 32px; border: 1px solid rgba(124,137,255,0.2);
            box-shadow: var(--card-shadow); display: flex; flex-direction: column; align-items: center;
            position: relative; overflow: hidden;
        }
        .countdown::after {
            content: ""; position: absolute; top: -100%; left: 0; width: 100%; height: 100%;
            background: linear-gradient(transparent, rgba(124,137,255,0.05), transparent);
            animation: scanline 4s linear infinite;
        }
        #timer { font-size: 2.5rem; font-weight: 800; text-shadow: 0 0 25px var(--accent-glow); }

        /* Table Loading State */
        .loading-shimmer {
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.05), transparent);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
        }
        @keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }

        /* Modern Table */
        .table-container { 
            overflow-x: auto; border-radius: 32px; border: 1px solid var(--border-glass); 
            box-shadow: var(--card-shadow); background: var(--bg-panel); backdrop-filter: blur(20px);
        }
        table { width: 100%; border-collapse: collapse; }
        th { 
            background: rgba(255,255,255,0.02); color: var(--accent); 
            padding: 22px; font-size: 0.7rem; letter-spacing: 2px; text-transform: uppercase;
        }
        td { padding: 22px; text-align: center; border-bottom: 1px solid var(--border-glass); font-size: 1rem; }
        tr:hover td { background: rgba(124, 137, 255, 0.08); color: #fff; transform: scale(1.01); }

        /* Input Fields */
        #authBox { display: flex; gap: 10px; margin-bottom: 30px; justify-content: center; }
        input { 
            background: rgba(0,0,0,0.4); border: 1px solid var(--border-glass); 
            color: #fff; padding: 14px 20px; border-radius: 16px; outline: none;
        }
        button { 
            background: #fff; border: none; padding: 14px 28px; border-radius: 16px; 
            font-weight: 800; cursor: pointer;
        }
        button:hover { transform: scale(1.05); box-shadow: 0 0 20px rgba(255,255,255,0.2); }

    </style>
</head>
<body>

    <canvas id="bg-canvas"></canvas>

    <div class="container">
        <div class="nav-bar">
            <a href="errahworld.html" class="nav-btn active-nav">Project Atlas</a>
            <a href="updates.html" class="nav-btn">Updates</a>
        </div>

        <div id="lastUpdateBanner" class="last-updated-banner">ESTABLISHING NEURAL LINK...</div>

        <h1 id="title">Syncing</h1>
        <div id="desc">Decrypting strength data from secure servers...</div>

        <div class="countdown">
            <strong>NEXT RM CYCLE</strong>
            <div id="timer">00D 00H 00M 00S</div>
        </div>

        <div id="authBox">
            <input id="email" placeholder="Admin ID">
            <input id="password" type="password" placeholder="Keyphrase">
            <button id="loginBtn">Login</button>
            <button id="logoutBtn" style="display:none">Logout</button>
        </div>

        <div class="table-container">
            <table id="table" class="locked-content">
                <thead>
                    <tr>
                        <th style="text-align:left">Exercise</th>
                        <th>Current</th>
                        <th>1RM</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="tbody">
                    <tr class="loading-shimmer"><td colspan="4" style="height: 60px; opacity: 0.3;">INITIALIZING DATABASE...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <script>
        // BACKGROUND ANIMATION (Neural Grid)
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        let dots = [];
        function initCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            dots = [];
            for(let i=0; i<60; i++) dots.push({x: Math.random()*canvas.width, y: Math.random()*canvas.height, vx: Math.random()-0.5, vy: Math.random()-0.5});
        }
        function draw() {
            ctx.clearRect(0,0,canvas.width, canvas.height);
            ctx.fillStyle = "rgba(124, 137, 255, 0.5)";
            dots.forEach(d => {
                d.x += d.vx; d.y += d.vy;
                if(d.x<0 || d.x>canvas.width) d.vx *= -1;
                if(d.y<0 || d.y>canvas.height) d.vy *= -1;
                ctx.beginPath(); ctx.arc(d.x, d.y, 1.5, 0, Math.PI*2); ctx.fill();
            });
            requestAnimationFrame(draw);
        }
        window.onresize = initCanvas;
        initCanvas(); draw();

        // FIREBASE SETUP
        firebase.initializeApp({
            apiKey:"AIzaSyBoePuKarSCVgvxQQBGvkMKq16DvKmBYBE",
            authDomain:"strenght-a9f37.firebaseapp.com",
            databaseURL:"https://strenght-a9f37-default-rtdb.firebaseio.com",
            projectId:"strenght-a9f37",
            storageBucket:"strenght-a9f37.firebasestorage.app",
            messagingSenderId:"469926449178",
            appId:"1:469926449178:web:b9623947a1c1865b0f81a3"
        });

        const auth = firebase.auth();
        const db = firebase.database();
        const titleEl = document.getElementById("title"), 
              descEl = document.getElementById("desc"),
              tbody = document.getElementById("tbody"),
              updateBanner = document.getElementById("lastUpdateBanner");

        // DATA SYNC WITH FADE-IN
        db.ref("log").on("value", snap => {
            const d = snap.val() || {};
            tbody.style.opacity = 0;
            setTimeout(() => {
                titleEl.innerText = d.title || "Strength Log";
                descEl.innerHTML = d.desc || "Neural link active...";
                tbody.innerHTML = d.table || "<tr><td colspan='4'>No data available</td></tr>";
                tbody.style.opacity = 1;
            }, 300);
        });

        db.ref("meta/lastUpdate").on("value", snap => {
            updateBanner.innerText = "SYSTEM ACTIVE // LAST SYNC: " + (snap.val() || "UNKNOWN");
        });

        // AUTH & TIMER LOGIC (Existing from your code)
        const loginBtn = document.getElementById("loginBtn"), logoutBtn = document.getElementById("logoutBtn");
        const emailEl = document.getElementById("email"), passEl = document.getElementById("password");
        let isAdmin = false;

        loginBtn.onclick = () => auth.signInWithEmailAndPassword(emailEl.value, passEl.value).catch(e => alert(e.message));
        logoutBtn.onclick = () => auth.signOut();

        auth.onAuthStateChanged(user => {
            isAdmin = !!user;
            document.getElementById("table").classList.toggle("locked-content", !isAdmin);
            [titleEl, descEl, tbody].forEach(el => el.contentEditable = isAdmin);
            loginBtn.style.display = user ? "none" : "inline-block";
            emailEl.style.display = user ? "none" : "inline-block";
            passEl.style.display = user ? "none" : "inline-block";
            logoutBtn.style.display = user ? "inline-block" : "none";
        });

        function saveData() {
            if(!isAdmin) return;
            const now = new Date();
            const dateStr = `${now.getDate()} ${now.toLocaleString('default', { month: 'long' })} ${now.getFullYear()}`;
            db.ref("log").set({ title: titleEl.innerText, desc: descEl.innerHTML, table: tbody.innerHTML });
            db.ref("meta/lastUpdate").set(dateStr);
        }
        [titleEl, descEl, tbody].forEach(el => el.addEventListener("blur", saveData));

        const targetDate = new Date("February 3, 2026 00:00:00").getTime();
        setInterval(() => {
            const diff = targetDate - Date.now();
            if(diff <= 0) { document.getElementById("timer").textContent = "LIMIT BREAKER 🔥"; return; }
            const d = Math.floor(diff/86400000), h = Math.floor(diff/3600000)%24, m = Math.floor(diff/60000)%60, s = Math.floor(diff/1000)%60;
            document.getElementById("timer").textContent = `${d}D ${h}H ${m}M ${s}S`;
        }, 1000);
    </script>
</body>
</html>
