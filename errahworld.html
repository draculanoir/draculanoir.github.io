<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Strength Log – 1RM Tracking</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />

<style>
:root{
  --bg-main:#0c0e12;
  --bg-panel:#14161c;
  --bg-header:#1b1e26;
  --border:#2a2d36;
  --text:#d9dbe1;
  --muted:#9da1ac;
  --accent:#bfc6d6;
}

body{
  visibility:hidden;
  font-family:"Segoe UI",Arial,sans-serif;
  background:radial-gradient(circle at top,#12141b,var(--bg-main));
  color:var(--text);
  padding:24px;
}

.locked-content,
.locked-content *{
  pointer-events:none!important;
  user-select:none!important;
}

table{
  width:100%;
  max-width:1020px;
  border-collapse:collapse;
  background:var(--bg-panel);
}

th,td{
  border:1px solid var(--border);
  padding:10px;
  text-align:center;
}

.calculator{
  max-width:1020px;
  margin-top:40px;
  background:var(--bg-panel);
  border:1px solid var(--border);
  padding:20px;
  border-radius:10px;
}

.calc-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

button{
  background:transparent;
  border:1px solid var(--border);
  color:var(--text);
  padding:6px 10px;
  border-radius:6px;
  cursor:pointer;
}

.barbell{
  display:flex;
  justify-content:center;
  align-items:center;
  margin:25px 0;
}

.bar{
  width:260px;
  height:8px;
  background:#888;
  border-radius:4px;
}

.sleeve{display:flex;align-items:center}
.plate{margin:0 2px;border-radius:4px}

/* Sizes */
.xl{height:90px;width:28px}
.lg{height:82px;width:25px}
.md{height:70px;width:21px}
.sm{height:55px;width:17px}
.xs{height:42px;width:13px}

/* Colors */
.red{background:#d32f2f}
.blue{background:#1976d2}
.yellow{background:#fbc02d}
.green{background:#388e3c}
.gray{background:#666}
.light{background:#999}

.plates{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  justify-content:center;
}

.total{
  text-align:center;
  font-size:1.2rem;
  margin-top:12px;
  color:var(--accent);
}
</style>
</head>

<body>

<h2>Barbell Calculator</h2>

<div class="calculator">

  <!-- UNIT + BAR -->
  <div class="calc-header">
    <div>
      <button onclick="setUnit('kg')">KG</button>
      <button onclick="setUnit('lb')">LB</button>
    </div>

    <div>
      <button onclick="setBar(20)">20</button>
      <button onclick="setBar(15)">15</button>
      <button onclick="setBar(45)">45</button>
      <button onclick="setBar(0)">No Bar</button>
    </div>
  </div>

  <!-- BARBELL -->
  <div class="barbell">
    <div id="left" class="sleeve"></div>
    <div id="bar" class="bar"></div>
    <div id="right" class="sleeve"></div>
  </div>

  <!-- PLATES -->
  <div class="plates" id="plateBtns"></div>

  <div class="plates">
    <button onclick="undo()">Undo</button>
    <button onclick="resetAll()">Reset</button>
  </div>

  <div class="total" id="total"></div>
</div>

<script>
const left=document.getElementById("left");
const right=document.getElementById("right");
const barEl=document.getElementById("bar");
const totalEl=document.getElementById("total");
const btns=document.getElementById("plateBtns");

let unit="kg";
let barWeight=20;
let plates=[];

const config={
  kg:[
    {w:25,c:"xl red"},
    {w:20,c:"lg blue"},
    {w:15,c:"md yellow"},
    {w:10,c:"sm green"},
    {w:5,c:"xs gray"},
    {w:2.5,c:"xs light"},
    {w:1.25,c:"xs light"}
  ],
  lb:[
    {w:45,c:"xl red"},
    {w:35,c:"lg blue"},
    {w:25,c:"md yellow"},
    {w:10,c:"sm green"},
    {w:5,c:"xs gray"},
    {w:2.5,c:"xs light"}
  ]
};

function setUnit(u){
  unit=u;
  plates=[];
  build();
  render();
}

function setBar(w){
  barWeight=w;
  barEl.style.display=w===0?"none":"block";
  render();
}

function build(){
  btns.innerHTML="";
  config[unit].forEach(p=>{
    const b=document.createElement("button");
    b.textContent=`+${p.w} ${unit}`;
    b.onclick=()=>{plates.push(p);render()};
    btns.appendChild(b);
  });
}

function undo(){plates.pop();render()}
function resetAll(){plates=[];render()}

function render(){
  left.innerHTML="";
  right.innerHTML="";
  let total=barWeight;

  plates.forEach(p=>{
    left.innerHTML+=`<div class="plate ${p.c}"></div>`;
    right.innerHTML+=`<div class="plate ${p.c}"></div>`;
    total+=p.w*2;
  });

  totalEl.textContent=`Total: ${total} ${unit}`;
}

setUnit("kg");
</script>

</body>
</html>
