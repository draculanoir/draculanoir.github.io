<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>ErrahWorld | Project Atlas</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&family=JetBrains+Mono:wght@400;700&display=swap');
        
        :root {
            --bg-deep: #03050a;
            --accent-primary: #7c89ff;
            --accent-secondary: #ff7eb3;
            --glass: rgba(15, 18, 35, 0.6);
            --glass-border: rgba(255, 255, 255, 0.08);
            --text-bright: #ffffff;
            --text-dim: #94a3b8;
            --glow: 0 0 25px rgba(124, 137, 255, 0.3);
        }

        /* Animated Mesh Gradient Background */
        body {
            margin: 0;
            padding: 20px;
            font-family: "Plus Jakarta Sans", sans-serif;
            background: var(--bg-deep);
            color: var(--text-bright);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            perspective: 1000px;
        }

        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: 
                radial-gradient(circle at 10% 20%, rgba(124, 137, 255, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(255, 126, 179, 0.05) 0%, transparent 40%);
            z-index: -2;
        }

        #bg-canvas {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1; opacity: 0.5;
        }

        .container {
            width: 100%;
            max-width: 900px;
            animation: containerEntry 1.2s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        @keyframes containerEntry {
            from { opacity: 0; transform: translateY(40px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* Ultra-Modern Nav */
        .nav-bar { 
            display: flex; gap: 5px; margin: 20px auto 40px; 
            background: var(--glass); 
            padding: 8px; 
            border-radius: 20px; 
            border: 1px solid var(--glass-border);
            width: fit-content;
            backdrop-filter: blur(20px);
            box-shadow: var(--card-shadow);
        }

        .nav-btn { 
            padding: 12px 28px; border-radius: 14px; 
            text-decoration: none; font-size: 0.85rem; font-weight: 700;
            color: var(--text-dim);
            transition: 0.3s;
        }

        .nav-btn:hover { color: var(--text-bright); background: rgba(255,255,255,0.05); }

        .active-nav { 
            background: var(--accent-primary) !important; 
            color: #000 !important; 
            box-shadow: 0 4px 15px rgba(124, 137, 255, 0.4);
        }

        /* Typography */
        .last-updated-banner { 
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.65rem; color: var(--accent-primary); text-align: center; 
            margin-bottom: 12px; font-weight: 700; letter-spacing: 4px;
            text-transform: uppercase;
        }

        h1 { 
            margin: 0; font-size: clamp(3rem, 12vw, 4.5rem); text-align: center; font-weight: 800; 
            letter-spacing: -3px; line-height: 0.9;
            background: linear-gradient(to bottom, #fff, #a5b4fc);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 20px rgba(124, 137, 255, 0.2));
        }

        #desc { 
            padding: 20px; margin: 25px 0 40px; border-radius: 24px; 
            color: var(--text-dim); text-align: center; font-size: 1.1rem;
            line-height: 1.6;
        }

        /* The Timer Card (The Hero) */
        .countdown {
            margin-bottom: 40px; padding: 40px; 
            background: var(--glass);
            border-radius: 35px; border: 1px solid var(--glass-border);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            display: flex; flex-direction: column; align-items: center;
            position: relative; overflow: hidden;
            backdrop-filter: blur(30px);
        }

        .countdown strong {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem; letter-spacing: 5px; color: var(--accent-secondary);
            margin-bottom: 15px;
        }

        #timer { 
            font-size: 3.5rem; font-weight: 800; 
            font-variant-numeric: tabular-nums;
            background: linear-gradient(45deg, #fff, var(--accent-primary));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            text-shadow: 0 0 40px rgba(124, 137, 255, 0.3);
        }

        /* Modern HUD Table */
        .table-container { 
            overflow: hidden; border-radius: 30px; 
            border: 1px solid var(--glass-border); 
            background: var(--glass); 
            backdrop-filter: blur(20px);
            margin-bottom: 50px;
        }

        table { width: 100%; border-collapse: collapse; }
        
        th { 
            background: rgba(255,255,255,0.03); color: var(--text-dim); 
            padding: 24px; font-size: 0.7rem; letter-spacing: 2px; text-transform: uppercase;
            border-bottom: 1px solid var(--glass-border);
        }

        td { 
            padding: 24px; text-align: center; 
            border-bottom: 1px solid rgba(255,255,255,0.03); 
            font-size: 1.1rem; 
            font-weight: 500;
        }

        tr:last-child td { border: none; }

        tr:hover td { 
            background: rgba(124, 137, 255, 0.05); 
            color: var(--accent-primary); 
            cursor: default;
        }

        /* Inputs & Interaction */
        #authBox { display: flex; gap: 12px; margin-bottom: 40px; justify-content: center; }
        
        input { 
            background: rgba(255, 255, 255, 0.05); border: 1px solid var(--glass-border); 
            color: #fff; padding: 16px 24px; border-radius: 18px; outline: none;
            font-family: inherit; width: 180px;
        }

        input:focus { border-color: var(--accent-primary); background: rgba(255, 255, 255, 0.08); }

        button { 
            background: var(--text-bright); border: none; padding: 16px 32px; border-radius: 18px; 
            font-weight: 800; cursor: pointer; color: #000;
            box-shadow: 0 4px 15px rgba(255,255,255,0.1);
        }

        button:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(255,255,255,0.2); }

        /* Mobile Optimization */
        @media (max-width: 600px) {
            #timer { font-size: 2rem; }
            .countdown { padding: 30px 15px; }
            #authBox { flex-direction: column; align-items: center; }
            input { width: 100%; }
        }

    </style>
</head>
<body>

    <canvas id="bg-canvas"></canvas>

    <div class="container">
        <div class="nav-bar">
            <a href="#" class="nav-btn active-nav">PROJECT ATLAS</a>
            <a href="#" class="nav-btn">UPDATES</a>
        </div>

        <div id="lastUpdateBanner" class="last-updated-banner">ESTABLISHING NEURAL LINK...</div>

        <h1 id="title">Syncing</h1>
        <div id="desc">Accessing encrypted strength metrics from the Atlas Protocol...</div>

        <div class="countdown">
            <strong>NEXT RM CYCLE</strong>
            <div id="timer">00D 00H 00M 00S</div>
        </div>

        <div id="authBox">
            <input id="email" placeholder="Admin ID">
            <input id="password" type="password" placeholder="Keyphrase">
            <button id="loginBtn">AUTHORIZE</button>
            <button id="logoutBtn" style="display:none">TERMINATE</button>
        </div>

        <div class="table-container">
            <table id="table">
                <thead>
                    <tr>
                        <th style="text-align:left">Metric / Exercise</th>
                        <th>Current Load</th>
                        <th>Projected 1RM</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="tbody">
                    <tr><td colspan="4" style="opacity: 0.3; padding: 60px;">INITIALIZING CORE DATABASE...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <script>
        // BACKGROUND ANIMATION (Neural Grid)
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        let dots = [];
        
        function initCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            dots = [];
            for(let i=0; i<80; i++) {
                dots.push({
                    x: Math.random()*canvas.width, 
                    y: Math.random()*canvas.height, 
                    vx: (Math.random()-0.5) * 0.5, 
                    vy: (Math.random()-0.5) * 0.5,
                    r: Math.random() * 2
                });
            }
        }

        function draw() {
            ctx.clearRect(0,0,canvas.width, canvas.height);
            ctx.strokeStyle = "rgba(124, 137, 255, 0.05)";
            ctx.fillStyle = "rgba(124, 137, 255, 0.3)";
            
            dots.forEach((d, i) => {
                d.x += d.vx; d.y += d.vy;
                if(d.x<0 || d.x>canvas.width) d.vx *= -1;
                if(d.y<0 || d.y>canvas.height) d.vy *= -1;
                
                ctx.beginPath(); 
                ctx.arc(d.x, d.y, d.r, 0, Math.PI*2); 
                ctx.fill();

                for(let j=i+1; j<dots.length; j++) {
                    const d2 = dots[j];
                    const dist = Math.hypot(d.x-d2.x, d.y-d2.y);
                    if(dist < 150) {
                        ctx.lineWidth = 1 - dist/150;
                        ctx.beginPath(); ctx.moveTo(d.x, d.y); ctx.lineTo(d2.x, d2.y); ctx.stroke();
                    }
                }
            });
            requestAnimationFrame(draw);
        }
        window.onresize = initCanvas;
        initCanvas(); draw();

        // Firebase logic remains identical to your working version to ensure functionality
        firebase.initializeApp({
            apiKey:"AIzaSyBoePuKarSCVgvxQQBGvkMKq16DvKmBYBE",
            authDomain:"strenght-a9f37.firebaseapp.com",
            databaseURL:"https://strenght-a9f37-default-rtdb.firebaseio.com",
            projectId:"strenght-a9f37",
            storageBucket:"strenght-a9f37.firebasestorage.app",
            messagingSenderId:"469926449178",
            appId:"1:469926449178:web:b9623947a1c1865b0f81a3"
        });

        const auth = firebase.auth();
        const db = firebase.database();
        const titleEl = document.getElementById("title"), 
              descEl = document.getElementById("desc"),
              tbody = document.getElementById("tbody"),
              updateBanner = document.getElementById("lastUpdateBanner");

        db.ref("log").on("value", snap => {
            const d = snap.val() || {};
            tbody.style.opacity = 0;
            setTimeout(() => {
                titleEl.innerText = d.title || "Strength Log";
                descEl.innerHTML = d.desc || "Neural link active...";
                tbody.innerHTML = d.table || "<tr><td colspan='4'>No data available</td></tr>";
                tbody.style.opacity = 1;
            }, 300);
        });

        db.ref("meta/lastUpdate").on("value", snap => {
            updateBanner.innerText = "SYSTEM ACTIVE // LAST SYNC: " + (snap.val() || "UNKNOWN");
        });

        const loginBtn = document.getElementById("loginBtn"), logoutBtn = document.getElementById("logoutBtn");
        const emailEl = document.getElementById("email"), passEl = document.getElementById("password");
        let isAdmin = false;

        loginBtn.onclick = () => auth.signInWithEmailAndPassword(emailEl.value, passEl.value).catch(e => alert(e.message));
        logoutBtn.onclick = () => auth.signOut();

        auth.onAuthStateChanged(user => {
            isAdmin = !!user;
            [titleEl, descEl, tbody].forEach(el => el.contentEditable = isAdmin);
            loginBtn.style.display = user ? "none" : "inline-block";
            emailEl.style.display = user ? "none" : "inline-block";
            passEl.style.display = user ? "none" : "inline-block";
            logoutBtn.style.display = user ? "inline-block" : "none";
        });

        function saveData() {
            if(!isAdmin) return;
            const now = new Date();
            const dateStr = `${now.getDate()} ${now.toLocaleString('default', { month: 'long' })} ${now.getFullYear()}`;
            db.ref("log").set({ title: titleEl.innerText, desc: descEl.innerHTML, table: tbody.innerHTML });
            db.ref("meta/lastUpdate").set(dateStr);
        }
        [titleEl, descEl, tbody].forEach(el => el.addEventListener("blur", saveData));

        const targetDate = new Date("February 3, 2026 00:00:00").getTime();
        setInterval(() => {
            const diff = targetDate - Date.now();
            if(diff <= 0) { document.getElementById("timer").textContent = "LIMIT BREAKER 🔥"; return; }
            const d = Math.floor(diff/86400000), h = Math.floor(diff/3600000)%24, m = Math.floor(diff/60000)%60, s = Math.floor(diff/1000)%60;
            document.getElementById("timer").textContent = 
                `${String(d).padStart(2,'0')}D ${String(h).padStart(2,'0')}H ${String(m).padStart(2,'0')}M ${String(s).padStart(2,'0')}S`;
        }, 1000);
    </script>
</body>
</html>
