<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>ErrahWorld | Gemini AI Log</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        :root {
            --bg-main: #0a0c13; --bg-panel: rgba(22, 26, 42, 0.95);
            --border: rgba(255, 255, 255, 0.1); --text: #eef0f6;
            --accent: #cfd6ff; --shadow: 0 0 30px rgba(207, 214, 255, 0.15);
        }
        body { margin: 0; padding: 20px; font-family: "Inter", sans-serif; background: var(--bg-main); color: var(--text); padding-bottom: 120px; }
        
        /* Nav & UI */
        .nav-bar { display: flex; gap: 10px; margin-bottom: 25px; }
        .nav-btn { background: rgba(255,255,255,0.05); border: 1px solid var(--border); color: var(--accent); padding: 12px; border-radius: 12px; text-decoration: none; flex: 1; text-align: center; font-size: 0.9rem; }
        .active-nav { background: var(--accent); color: #000; font-weight: 700; }
        
        table { width: 100%; border-collapse: collapse; background: var(--bg-panel); border-radius: 20px; overflow: hidden; box-shadow: var(--shadow); }
        th, td { padding: 15px; text-align: center; border-bottom: 1px solid var(--border); }
        th { background: rgba(255,255,255,0.05); color: var(--accent); font-size: 0.7rem; text-transform: uppercase; }

        /* JARVIS ORB */
        #jarvis-container { position: fixed; bottom: 30px; right: 25px; z-index: 9999; display: flex; flex-direction: column; align-items: flex-end; }
        #jarvis-bubble { display: none; background: #161a2a; border: 1px solid var(--accent); padding: 20px; border-radius: 24px; width: 280px; margin-bottom: 20px; box-shadow: var(--shadow); border-bottom-right-radius: 4px; }
        #jarvis-orb { width: 75px; height: 75px; background: #000; border: 2px solid var(--accent); border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; position: relative; transition: 0.5s; }
        
        .voice-bars { display: flex; gap: 4px; }
        .voice-bars div { width: 4px; height: 15px; background: var(--accent); border-radius: 4px; }
        
        .listening-active { box-shadow: 0 0 30px #ff6b6b !important; border-color: #ff6b6b !important; }
        .listening-active div { animation: wave 0.4s infinite ease-in-out; background: #ff6b6b !important; }
        .speaking { box-shadow: 0 0 40px var(--accent) !important; animation: pulse 1.5s infinite; }
        
        @keyframes wave { 0%, 100% { height: 10px; } 50% { height: 35px; } }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
    </style>
</head>
<body>

    <div class="nav-bar">
        <a href="errahworld.html" class="nav-btn active-nav">🏋️ Log</a>
        <a href="updates.html" class="nav-btn">📢 Updates</a>
    </div>

    <h1 style="text-align:center">Strength Log</h1>
    <div id="desc" style="text-align:center; color:gray; margin-bottom:20px;">Gemini Neural Link: Ready.</div>

    <table id="table">
        <thead><tr><th>Exercise</th><th>Current</th><th>1RM</th><th>Status</th></tr></thead>
        <tbody id="tbody"></tbody>
    </table>

    <div id="jarvis-container">
        <div id="jarvis-bubble">
            <div id="jarvis-status" style="font-size:0.7rem; color:var(--accent); font-weight:800; margin-bottom:5px;">GEMINI INTELLIGENCE</div>
            <div id="jarvis-text" style="font-size:0.95rem;">Awaiting your command, Errah.</div>
        </div>
        <div id="jarvis-orb">
            <div class="voice-bars" id="v-bars"><div></div><div></div><div></div><div></div></div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

    <script>
        // CONFIG
        const GEMINI_API_KEY = "AIzaSyBsRLrUe67LLSPgr_lQaKB-xINgUgSuzmI";
        firebase.initializeApp({
            apiKey:"AIzaSyBoePuKarSCVgvxQQBGvkMKq16DvKmBYBE",
            authDomain:"strenght-a9f37.firebaseapp.com",
            databaseURL:"https://strenght-a9f37-default-rtdb.firebaseio.com",
            projectId:"strenght-a9f37"
        });

        const db = firebase.database();
        const auth = firebase.auth();
        let isAdmin = false;

        auth.onAuthStateChanged(user => { isAdmin = !!user; });

        // LOAD DATA
        db.ref("log").on("value", snap => {
            const d = snap.val() || {};
            document.getElementById("tbody").innerHTML = d.table || "";
        });

        // --- GEMINI BRAIN ---
        const orb = document.getElementById('jarvis-orb');
        const jText = document.getElementById('jarvis-text');
        const synth = window.speechSynthesis;
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        const recognition = SpeechRecognition ? new SpeechRecognition() : null;

        async function askGemini(prompt) {
            jText.innerText = "Thinking...";
            // Get current table data to give to Gemini
            const tableData = document.getElementById("tbody").innerText;
            
            const systemInstruction = `You are JARVIS, a futuristic female AI coach. You are helping Errah. 
            Be concise, slightly robotic but encouraging. Here is Errah's workout data: ${tableData}. 
            Answer questions based on this data or provide motivation. Always refer to Errah as 'Sir'.`;

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: systemInstruction + "\n\nUser says: " + prompt }] }]
                    })
                });
                const data = await response.json();
                const aiResponse = data.candidates[0].content.parts[0].text;
                jarvisSay(aiResponse);
            } catch (e) {
                jarvisSay("Sir, I encountered a connection error with the Gemini core.");
            }
        }

        function jarvisSay(msg) {
            synth.cancel();
            const utter = new SpeechSynthesisUtterance(msg);
            const voices = synth.getVoices();
            utter.voice = voices.find(v => v.name.includes("Google") && v.lang.includes("en")) || voices[0];
            utter.pitch = 1.2; utter.rate = 1.0;
            jText.innerText = msg;
            orb.classList.add('speaking');
            synth.speak(utter);
            utter.onend = () => orb.classList.remove('speaking');
        }

        orb.onclick = () => {
            document.getElementById("jarvis-bubble").style.display = "block";
            jarvisSay("Neural link established. How can I assist your training session, Sir?");
        };

        if(recognition) {
            recognition.lang = 'en-US';
            orb.onmousedown = () => { recognition.start(); orb.classList.add('listening-active'); };
            orb.onmouseup = () => { recognition.stop(); orb.classList.remove('listening-active'); };
            recognition.onresult = (e) => {
                const speech = e.results[0][0].transcript;
                askGemini(speech);
            };
        }
    </script>
</body>
</html>
