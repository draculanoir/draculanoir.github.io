<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Strength Log – 1RM Tracking</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

:root{
  --bg-main:#0a0c13;
  --bg-panel:rgba(22,26,42,.88);
  --bg-header:rgba(32,38,64,.95);
  --border:rgba(255,255,255,.08);
  --text:#eef0f6;
  --muted:#9aa1b3;
  --accent:#cfd6ff;
  --shadow:0 18px 40px rgba(0,0,0,.55);
}

*{ box-sizing:border-box; }

body{
  margin:0;
  padding:28px;
  font-family:"Inter",system-ui,sans-serif;
  background:
    radial-gradient(1200px 600px at top,#1c2340,transparent 60%),
    radial-gradient(900px 500px at bottom,#0b0f22,transparent 60%),
    var(--bg-main);
  color:var(--text);
}

@keyframes float{
  0%,100%{ transform:translateY(0); }
  50%{ transform:translateY(-6px); }
}

/* 🔒 HARD READ-ONLY LOCK */
.locked-content,
.locked-content *{
  pointer-events:none!important;
  user-select:none!important;
  caret-color:transparent!important;
}

/* TITLE */
h1{
  margin:0 0 12px;
  font-size:2.2rem;
  font-weight:700;
}

/* DESCRIPTION */
#desc{
  max-width:900px;
  padding:18px 22px;
  margin-bottom:26px;
  background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.02));
  border:1px solid var(--border);
  border-radius:18px;
  color:var(--muted);
  line-height:1.55;
  box-shadow:var(--shadow);
  backdrop-filter:blur(14px);
  animation:float 9s ease-in-out infinite;
}

/* COUNTDOWN */
.countdown{
  max-width:1020px;
  margin:18px 0 28px;
  padding:18px 22px;
  background:linear-gradient(135deg,#2b3160,#1b1f3d);
  border-radius:18px;
  box-shadow:var(--shadow);
  display:flex;
  justify-content:space-between;
  align-items:center;
  animation:float 8s ease-in-out infinite;
}

#timer{
  font-weight:700;
  color:var(--accent);
}

/* 🔔 NOTIFICATION */
.notification{
  max-width:1020px;
  margin:20px 0;
  padding:18px 22px;
  background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(255,255,255,.03));
  border:1px solid var(--border);
  border-radius:18px;
  box-shadow:var(--shadow);
  backdrop-filter:blur(14px);
}

.notification.hidden{ display:none; }

.notif-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

#notifDate{
  font-size:.75rem;
  color:var(--muted);
}

#toggleNotif{
  background:none;
  border:none;
  color:var(--accent);
  cursor:pointer;
  font-weight:600;
}

/* AUTH */
.top-bar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  max-width:1020px;
  margin-bottom:18px;
}

#authBox{
  display:flex;
  gap:10px;
  padding:14px 16px;
  background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.03));
  border:1px solid var(--border);
  border-radius:20px;
  box-shadow:var(--shadow);
}

#authBox input{
  background:rgba(0,0,0,.25);
  border:1px solid var(--border);
  color:var(--accent);
  padding:10px 14px;
  border-radius:12px;
}

#authBox button{
  background:linear-gradient(135deg,#3a43a0,#2a2f66);
  border:none;
  color:#fff;
  padding:10px 18px;
  border-radius:14px;
  cursor:pointer;
}

/* TABLE */
table{
  width:100%;
  max-width:1020px;
  border-collapse:collapse;
  background:var(--bg-panel);
  border-radius:22px;
  overflow:hidden;
  box-shadow:var(--shadow);
}

th,td{
  padding:16px;
  text-align:center;
  border-bottom:1px solid var(--border);
}

th{
  background:var(--bg-header);
  font-size:.7rem;
  letter-spacing:.16em;
  text-transform:uppercase;
  color:var(--accent);
}

td.left{ text-align:left; }

/* CALCULATOR */
.calculator{
  max-width:1020px;
  margin-top:54px;
  padding:26px;
  background:var(--bg-panel);
  border-radius:24px;
  border:1px solid var(--border);
  box-shadow:var(--shadow);
}

.calculator-controls{
  display:flex;
  gap:12px;
  flex-wrap:wrap;
}

.calculator input,
.calculator label{
  background:rgba(255,255,255,.06);
  border:1px solid var(--border);
  color:var(--accent);
  padding:12px 16px;
  border-radius:14px;
}

.barbell{
  margin-top:30px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.bar{
  width:300px;
  height:12px;
  background:linear-gradient(#bbb,#666);
  border-radius:8px;
}

.side{ display:flex; }

.plate{
  height:68px;
  margin:0 2px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:.7rem;
  font-weight:700;
  color:#111;
  border-radius:7px;
}

.p45{ width:30px; background:#c0392b; }
.p35{ width:28px; background:#d35400; }
.p25{ width:26px; background:#f1c40f; }
.p10{ width:22px; background:#3498db; color:#fff; }
.p5 { width:18px; background:#2ecc71; }
.p2_5{ width:14px; background:#bdc3c7; }
</style>
</head>

<body>

<h1 id="title"></h1>
<p id="desc"></p>

<div class="countdown">
  <strong>Road to RM Drop 🏋️</strong>
  <div id="timer"></div>
</div>

<div id="notification" class="notification hidden">
  <div class="notif-header">
    <strong>Update</strong>
    <span id="notifDate"></span>
    <button id="toggleNotif">Hide</button>
  </div>
  <div id="notifBody"></div>
</div>

<div class="top-bar">
  <div id="authBox">
    <input id="email" placeholder="admin email">
    <input id="password" type="password">
    <button id="loginBtn">Login</button>
    <button id="logoutBtn" style="display:none">Logout</button>
  </div>
  <div id="lastUpdated"></div>
</div>

<table id="table" class="locked-content">
<thead>
<tr>
<th class="left">Lift</th>
<th>Current</th>
<th>1RM</th>
<th>Strength Level</th>
</tr>
</thead>
<tbody id="tbody"></tbody>
</table>

<div class="calculator">
<h3>Barbell Calculator (lbs)</h3>
<div class="calculator-controls">
<input id="targetWeight" type="number" placeholder="Loaded weight">
<input id="barWeight" type="number" value="45">
<label><input type="checkbox" id="includeBar" checked> Include bar</label>
</div>

<div class="barbell">
<div id="leftSide" class="side"></div>
<div class="bar"></div>
<div id="rightSide" class="side"></div>
</div>

<div id="trueLoad"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>
firebase.initializeApp({
  apiKey:"AIzaSyBoePuKarSCVgvxQQBGvkMKq16DvKmBYBE",
  authDomain:"strenght-a9f37.firebaseapp.com",
  databaseURL:"https://strenght-a9f37-default-rtdb.firebaseio.com",
  projectId:"strenght-a9f37",
  storageBucket:"strenght-a9f37.firebasestorage.app",
  messagingSenderId:"469926449178",
  appId:"1:469926449178:web:b9623947a1c1865b0f81a3"
});

const auth=firebase.auth();
const db=firebase.database();

/* === ORIGINAL LOG DATA === */
db.ref("log").once("value").then(s=>{
  const d=s.val()||{};
  title.innerText=d.title||"";
  desc.innerHTML=d.desc||"";
  tbody.innerHTML=d.table||"";
  lastUpdated.innerText=d.updated?"Last updated: "+d.updated:"";
});

/* === NOTIFICATION (SEPARATE NODE) === */
const notifRef=db.ref("notification");
notifRef.on("value",s=>{
  const d=s.val();
  if(!d) return;
  notifBody.innerText=d.text;
  notifDate.innerText=d.date;
  notification.classList.toggle("hidden",localStorage.getItem("hideNotif")==="1");
});

toggleNotif.onclick=()=>{
  const h=notification.classList.toggle("hidden");
  localStorage.setItem("hideNotif",h?"1":"0");
};

/* === BARBELL === */
const plates=[45,35,25,10,5,2.5];
function updateBarbell(){
  leftSide.innerHTML="";
  rightSide.innerHTML="";
  let t=+targetWeight.value;
  let b=+barWeight.value||0;
  if(!t) return;
  let r=(includeBar.checked?(t-b):t)/2;
  let u=[];
  plates.forEach(p=>{while(r>=p){r-=p;u.push(p);}});
  u.forEach(p=>rightSide.innerHTML+=`<div class="plate ${p===2.5?"p2_5":"p"+p}">${p}</div>`);
  [...u].reverse().forEach(p=>leftSide.innerHTML+=`<div class="plate ${p===2.5?"p2_5":"p"+p}">${p}</div>`);
  trueLoad.innerText=`Loaded: ${t} lbs`;
}
[targetWeight,barWeight,includeBar].forEach(e=>e.addEventListener("input",updateBarbell));
</script>

<script>
const targetDate=new Date("February 3, 2026").getTime();
setInterval(()=>{
  const d=targetDate-Date.now();
  timer.innerText=d<=0?"RM DAY 🔥":Math.floor(d/86400000)+" days";
},1000);
</script>

</body>
</html>
