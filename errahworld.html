<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Strength Log – 1RM Tracking</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />

<style>
:root{
  --bg-main:#0c0e12;
  --bg-panel:#14161c;
  --bg-header:#1b1e26;
  --border:#2a2d36;
  --text:#d9dbe1;
  --muted:#9da1ac;
  --accent:#bfc6d6;
}

body{
  font-family:"Segoe UI", Arial, sans-serif;
  background:radial-gradient(circle at top,#12141b,var(--bg-main));
  color:var(--text);
  padding:24px;
}

/* 🔒 HARD READ-ONLY LOCK */
.locked-content,
.locked-content *{
  pointer-events:none !important;
  user-select:none !important;
  caret-color:transparent !important;
}

/* Layout */
.top-bar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  max-width:1020px;
  margin-bottom:12px;
  gap:8px;
  flex-wrap:wrap;
}

#authBox input,
#authBox button{
  background:transparent;
  border:1px solid var(--border);
  color:var(--accent);
  padding:6px 10px;
  border-radius:6px;
}

/* Main table */
table{
  width:100%;
  max-width:1020px;
  border-collapse:collapse;
  background:var(--bg-panel);
  box-shadow:0 0 0 1px var(--border);
}

th, td{
  border:1px solid var(--border);
  padding:8px;
  text-align:center;
  font-size:.8rem;
}

th{
  background:var(--bg-header);
  color:var(--accent);
}

td.left{ text-align:left; }

.last-updated{
  font-size:.75rem;
  color:var(--muted);
}

/* Calculator */
.calculator{
  max-width:1020px;
  margin-top:32px;
  padding:16px;
  background:var(--bg-panel);
  border:1px solid var(--border);
  border-radius:8px;
}

.calculator-controls{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

.calculator input{
  background:transparent;
  border:1px solid var(--border);
  color:var(--accent);
  padding:8px;
  border-radius:6px;
}

.calculator label{
  display:flex;
  gap:6px;
  align-items:center;
}

.barbell{
  margin-top:16px;
  display:flex;
  justify-content:center;
  align-items:center;
}

.bar{ width:260px;height:8px;background:#777;border-radius:4px; }
.side{ display:flex; }

.plate{ height:60px;margin:0 2px;display:flex;align-items:center;justify-content:center;font-size:.7rem;font-weight:600;color:#111;border-radius:4px; }
.p45{width:26px;background:#c0392b;}
.p35{width:24px;background:#d35400;}
.p25{width:22px;background:#f1c40f;}
.p10{width:18px;background:#3498db;color:#fff;}
.p5{width:14px;background:#2ecc71;}
.p2_5{width:10px;background:#95a5a6;}

.note,.total{font-size:.75rem;color:var(--muted);margin-top:6px}

/* 🔐 ADMIN DASHBOARD */
#adminPanel{
  display:none;
  max-width:1020px;
  margin-top:40px;
  padding:16px;
  background:var(--bg-panel);
  border:1px solid var(--border);
  border-radius:8px;
}

#adminPanel h3{
  margin-bottom:10px;
}

#visitTable{
  width:100%;
  font-size:.7rem;
}

#visitTable th{
  position:sticky;
  top:0;
}

.scroll{
  max-height:320px;
  overflow:auto;
  border:1px solid var(--border);
}

@media(max-width:600px){
  body{padding:12px}
  th,td{font-size:.7rem}
}
</style>
</head>

<body>

<h1 id="title"></h1>
<p id="desc"></p>

<div class="top-bar">
  <div id="authBox">
    <input id="email" placeholder="admin email">
    <input id="password" type="password" placeholder="password">
    <button id="loginBtn">Login</button>
    <button id="logoutBtn" style="display:none">Logout</button>
  </div>
  <div id="lastUpdated" class="last-updated"></div>
</div>

<table id="table" class="locked-content">
<thead>
<tr>
  <th class="left">Lift</th>
  <th>Current</th>
  <th>1RM</th>
  <th>Strength</th>
</tr>
</thead>
<tbody id="tbody"></tbody>
</table>

<!-- 🏋️ Calculator -->
<div class="calculator">
<h3>Barbell Calculator (lbs)</h3>
<div class="calculator-controls">
  <input id="targetWeight" type="number" placeholder="Loaded weight">
  <input id="barWeight" type="number" value="45">
  <label><input type="checkbox" id="includeBar" checked> Include bar</label>
</div>

<div class="barbell">
  <div id="leftSide" class="side"></div>
  <div class="bar"></div>
  <div id="rightSide" class="side"></div>
</div>

<div id="trueLoad" class="total"></div>
</div>

<!-- 🔐 ADMIN DASHBOARD -->
<div id="adminPanel">
<h3>Visitor Dashboard</h3>
<p id="visitCount" class="note"></p>

<div class="scroll">
<table id="visitTable">
<thead>
<tr>
  <th>IP</th>
  <th>Location</th>
  <th>Org</th>
  <th>Device</th>
  <th>Time</th>
</tr>
</thead>
<tbody id="visitBody"></tbody>
</table>
</div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>
firebase.initializeApp({
  apiKey:"AIzaSyBoePuKarSCVgvxQQBGvkMKq16DvKmBYBE",
  authDomain:"strenght-a9f37.firebaseapp.com",
  databaseURL:"https://strenght-a9f37-default-rtdb.firebaseio.com"
});

const auth=firebase.auth();
const db=firebase.database();

const adminPanel=document.getElementById("adminPanel");
const visitBody=document.getElementById("visitBody");
const visitCount=document.getElementById("visitCount");

auth.onAuthStateChanged(user=>{
  adminPanel.style.display=user?"block":"none";
  if(user) loadVisits();
});

function loadVisits(){
  db.ref("visits").limitToLast(200).on("value",snap=>{
    visitBody.innerHTML="";
    let count=0;
    snap.forEach(s=>{
      count++;
      const v=s.val();
      visitBody.innerHTML+=`
      <tr>
        <td>${v.ip||""}</td>
        <td>${v.city||""}, ${v.country||""}</td>
        <td>${v.org||""}</td>
        <td>${v.ua?.slice(0,30)||""}</td>
        <td>${new Date(v.time).toLocaleString()}</td>
      </tr>`;
    });
    visitCount.innerText=`Total logged visits: ${count}`;
  });
}
</script>

</body>
</html>
