<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Strength Log</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
:root{
  --bg-main:#0a0c13; --bg-panel:rgba(22,26,42,.88); --bg-header:rgba(32,38,64,.95);
  --border:rgba(255,255,255,.08); --text:#eef0f6; --muted:#9aa1b3; --accent:#cfd6ff;
}
*{ box-sizing:border-box; }
body{
  margin:0; padding:20px; font-family:"Inter",sans-serif;
  background: radial-gradient(1200px 600px at top,#1c2340,transparent 60%), var(--bg-main);
  color:var(--text);
  padding-bottom: 100px;
}

/* Nav */
.nav-bar { display: flex; gap: 8px; margin-bottom: 20px; justify-content: center; }
.nav-btn { background: rgba(255,255,255,0.05); border: 1px solid var(--border); color: var(--accent); padding: 8px 12px; border-radius: 10px; text-decoration: none; font-size: 0.85rem; flex: 1; text-align: center; }
.active-nav { background: var(--accent); color: #000; font-weight: bold; }

h1{ margin:0 0 10px; font-size:2rem; text-align: center; font-weight: 700; }
#desc{ padding:18px; margin-bottom:20px; background:rgba(255,255,255,.04); border:1px solid var(--border); border-radius:18px; color:var(--muted); line-height: 1.6; outline: none; }

.countdown{ margin: 10px 0 20px; padding:15px; background:linear-gradient(135deg,#2b3160,#1b1f3d); border-radius:15px; display:flex; justify-content:space-between; align-items:center; font-size: 0.85rem; }
#timer{ font-weight:700; color:var(--accent); }

#authBox{ display:flex; gap:10px; padding:12px; background:rgba(255,255,255,.05); border-radius:15px; border: 1px solid var(--border); margin-bottom: 18px; }
#authBox input{ background:rgba(0,0,0,.25); border:1px solid var(--border); color:var(--accent); padding:10px; border-radius:10px; width: 100%; outline: none; }
#authBox button{ background:#3a43a0; border:none; color:#fff; padding:10px 15px; border-radius:10px; cursor:pointer; font-weight: 600; }

table{ width:100%; border-collapse:collapse; background:var(--bg-panel); border-radius:18px; overflow:hidden; }
th,td{ padding:12px; text-align:center; border-bottom:1px solid var(--border); outline: none; }
th{ background:var(--bg-header); color:var(--accent); text-transform:uppercase; font-size: 0.65rem; }
.locked-content{ pointer-events:none; opacity:0.8; }

/* JARVIS UI */
#jarvis-container { position: fixed; bottom: 25px; right: 25px; z-index: 9999; display: flex; flex-direction: column; align-items: flex-end; }
#jarvis-bubble { display: none; background: #161a2a; border: 1px solid var(--accent); padding: 15px; border-radius: 15px; width: 260px; margin-bottom: 15px; color: var(--text); font-size: 0.85rem; box-shadow: 0 5px 25px rgba(0,0,0,0.6); }
#jarvis-orb { width: 65px; height: 65px; background: black; border: 2px solid var(--accent); border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 15px var(--accent); transition: 0.3s; }

/* Glowing States */
.thinking { animation: pulse-blue 1s infinite; border-color: #5da9ff !important; box-shadow: 0 0 20px #5da9ff !important; }
.listening-active { border-color: #ff6b6b !important; box-shadow: 0 0 25px #ff6b6b !important; }
.speaking { border-color: #fff !important; box-shadow: 0 0 25px #fff !important; }
.error-glow { border-color: #ff4444 !important; box-shadow: 0 0 30px #ff4444 !important; }

@keyframes pulse-blue { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }
</style>
</head>
<body>

<div class="nav-bar">
  <a href="errahworld.html" class="nav-btn active-nav">🏋️ Log</a>
  <a href="updates.html" class="nav-btn">📢 Updates</a>
</div>

<h1 id="title">Strength Log</h1>
<div id="desc">Neural Link: Online.</div>

<div class="countdown">
  <strong>Road to RM Drop 🏋️</strong>
  <div id="timer">--d --h --m --s</div>
</div>

<div id="authBox">
    <input id="email" placeholder="Admin ID">
    <input id="password" type="password" placeholder="Passphrase">
    <button id="loginBtn">Login</button>
    <button id="logoutBtn" style="display:none">Logout</button>
</div>

<table id="table" class="locked-content">
  <thead><tr><th style="text-align:left">Lift</th><th>Current</th><th>1RM</th><th>Level</th></tr></thead>
  <tbody id="tbody"></tbody>
</table>

<div id="jarvis-container">
    <div id="jarvis-bubble"><div id="jarvis-text">Ready for instructions, Sir.</div></div>
    <div id="jarvis-orb"><span style="color:var(--accent); font-weight:bold; font-size:11px; letter-spacing:1px;">JARVIS</span></div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>
const GEMINI_KEY = "AIzaSyBsRLrUe67LLSPgr_lQaKB-xINgUgSuzmI";

firebase.initializeApp({
  apiKey:"AIzaSyBoePuKarSCVgvxQQBGvkMKq16DvKmBYBE",
  authDomain:"strenght-a9f37.firebaseapp.com",
  databaseURL:"https://strenght-a9f37-default-rtdb.firebaseio.com",
  projectId:"strenght-a9f37"
});

const auth=firebase.auth();
const db=firebase.database();

const orb = document.getElementById('jarvis-orb');
const jText = document.getElementById('jarvis-text');
const jBubble = document.getElementById('jarvis-bubble');
const synth = window.speechSynthesis;

// 1. FIREBASE SYNC
auth.onAuthStateChanged(user=>{
  const isAdmin = !!user;
  document.getElementById("table").classList.toggle("locked-content", !isAdmin);
  document.getElementById("loginBtn").style.display = user ? "none" : "inline-block";
  document.getElementById("logoutBtn").style.display = user ? "inline-block" : "none";
  [document.getElementById("title"), document.getElementById("desc"), document.getElementById("tbody")].forEach(el => el.contentEditable = isAdmin);
});

document.getElementById("loginBtn").onclick=()=>auth.signInWithEmailAndPassword(document.getElementById("email").value, document.getElementById("password").value);
document.getElementById("logoutBtn").onclick=()=>auth.signOut();

db.ref("log").on("value", snap=>{
  const d=snap.val()||{};
  document.getElementById("title").innerText=d.title||"Strength Log";
  document.getElementById("desc").innerHTML=d.desc||"";
  document.getElementById("tbody").innerHTML=d.table||"";
});

// 2. VOICE OUTPUT
function jarvisSay(msg) {
  synth.cancel();
  orb.className = ""; 
  const utter = new SpeechSynthesisUtterance(msg);
  const voices = synth.getVoices();
  utter.voice = voices.find(v => (v.name.includes("Google") || v.name.includes("Female") || v.name.includes("Zira")) && v.lang.includes("en")) || voices[0];
  utter.pitch = 1.25; 
  utter.rate = 1.0;
  jText.innerText = msg;
  orb.classList.add('speaking');
  synth.speak(utter);
  utter.onend = () => orb.classList.remove('speaking');
}

// 3. GEMINI CORE (UPDATED TO V1 STABLE)
async function askGemini(userInput) {
  jBubble.style.display = "block";
  jText.innerText = "Analyzing neural data...";
  orb.className = "thinking"; 

  const tableData = document.getElementById("tbody").innerText;
  
  const payload = {
    contents: [{
      parts: [{ text: `You are JARVIS, a robotic female AI. Errah is your user (call him Sir). Data: ${tableData}. Briefly answer: ${userInput}` }]
    }]
  };

  try {
    const response = await fetch(`https://generativelanguage.googleapis.com/v1/models/gemini-1.5-flash:generateContent?key=${GEMINI_KEY}`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    });

    const result = await response.json();

    if (result.error) throw new Error(result.error.message);

    if (result.candidates && result.candidates[0].content) {
        const reply = result.candidates[0].content.parts[0].text;
        jarvisSay(reply);
    } else {
        throw new Error("Response empty or blocked.");
    }
  } catch (error) {
    orb.className = "error-glow";
    jText.innerHTML = `<span style="color:#ff6b6b">LINK ERROR:</span><br>${error.message}`;
    console.error(error);
  }
}

// 4. VOICE INPUT
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
if(SpeechRecognition) {
  const recognition = new SpeechRecognition();
  recognition.lang = 'en-US';
  recognition.onresult = (e) => askGemini(e.results[0][0].transcript);
  recognition.onerror = () => orb.className = "error-glow";
  
  orb.onmousedown = () => { recognition.start(); orb.className = "listening-active"; };
  orb.onmouseup = () => { recognition.stop(); };
}

orb.onclick = () => {
    if(jBubble.style.display === "none" || !jBubble.style.display) {
        jBubble.style.display = "block";
        jarvisSay("Neural link established. At your service, Sir.");
    }
};

// TIMER
const targetDate=new Date("February 3, 2026 00:00:00").getTime();
setInterval(()=>{
  const diff=targetDate-Date.now();
  const d=Math.floor(diff/86400000), h=Math.floor(diff/3600000)%24, m=Math.floor(diff/60000)%60, s=Math.floor(diff/1000)%60;
  document.getElementById("timer").textContent=`${d}d ${h}h ${m}m ${s}s`;
},1000);

window.speechSynthesis.onvoiceschanged = () => synth.getVoices();
</script>
</body>
</html>
