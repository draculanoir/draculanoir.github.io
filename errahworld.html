<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>ErrahWorld | The Altar of Strength</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Plus+Jakarta+Sans:wght@300;400;600&display=swap');
        
        :root {
            --godly-gold: #e2c275;
            --ethereal-blue: #a5b4fc;
            --bg-void: #020308;
            --glass: rgba(255, 255, 255, 0.03);
            --border-gold: rgba(226, 194, 117, 0.2);
            --text-main: #f8fafc;
        }

        @keyframes god-rays {
            0% { text-shadow: 0 0 20px rgba(226, 194, 117, 0); }
            50% { text-shadow: 0 0 40px rgba(226, 194, 117, 0.4); }
            100% { text-shadow: 0 0 20px rgba(226, 194, 117, 0); }
        }

        * { box-sizing: border-box; cursor: crosshair; }
        
        body {
            margin: 0; padding: 20px; font-family: "Plus Jakarta Sans", sans-serif;
            background-color: var(--bg-void); color: var(--text-main);
            min-height: 100vh; overflow-x: hidden;
            display: flex; flex-direction: column; align-items: center;
        }

        canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none; }

        .container { 
            width: 100%; max-width: 900px; 
            animation: fadeIn 2s ease-out;
            z-index: 10;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Divine Header */
        h1 { 
            font-family: 'Cinzel', serif;
            margin: 40px 0 10px; font-size: clamp(3rem, 15vw, 6rem); text-align: center; font-weight: 900; 
            background: linear-gradient(to bottom, #fff, var(--godly-gold));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            letter-spacing: 8px; text-transform: uppercase;
            animation: god-rays 4s infinite ease-in-out;
        }

        .subtitle {
            text-align: center; font-family: 'Cinzel', serif; color: var(--godly-gold);
            letter-spacing: 4px; font-size: 0.8rem; margin-bottom: 50px; opacity: 0.8;
        }

        /* Description: The Tablet of Wisdom */
        #desc { 
            padding: 40px; margin-bottom: 50px; border-radius: 2px; 
            background: linear-gradient(145deg, rgba(255,255,255,0.02), rgba(0,0,0,0.4));
            border: 1px solid var(--border-gold);
            color: var(--ethereal-blue); text-align: center; font-size: 1.1rem;
            backdrop-filter: blur(15px); line-height: 1.8;
            box-shadow: 0 30px 60px rgba(0,0,0,0.5);
            font-style: italic;
        }

        /* Countdown: The Eternal Clock */
        .countdown {
            margin-bottom: 50px; padding: 40px; border-top: 1px solid var(--border-gold); border-bottom: 1px solid var(--border-gold);
            display: flex; flex-direction: column; align-items: center; gap: 15px;
            background: radial-gradient(circle, rgba(226, 194, 117, 0.05), transparent);
        }
        .countdown strong { font-family: 'Cinzel'; font-size: 0.9rem; letter-spacing: 5px; color: var(--godly-gold); }
        #timer { font-size: 3.5rem; font-weight: 300; letter-spacing: 2px; font-family: 'Plus Jakarta Sans'; }

        /* The Altar (Table) */
        .table-container { 
            background: var(--glass); border: 1px solid var(--border-gold);
            box-shadow: 0 0 100px rgba(0,0,0,0.8); backdrop-filter: blur(20px);
        }
        table { width: 100%; border-collapse: collapse; }
        th { 
            font-family: 'Cinzel'; padding: 25px; color: var(--godly-gold); 
            border-bottom: 1px solid var(--border-gold); font-size: 0.8rem; letter-spacing: 2px;
        }
        td { padding: 30px 20px; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 1.2rem; }
        tr:hover td { background: rgba(226, 194, 117, 0.05); text-shadow: 0 0 10px var(--godly-gold); color: #fff; }

        /* Auth */
        #authBox { display: flex; gap: 15px; margin-bottom: 50px; justify-content: center; }
        input { background: transparent; border: 1px solid var(--border-gold); color: #fff; padding: 12px 20px; outline: none; font-family: 'Cinzel'; }
        button { background: var(--godly-gold); color: #000; border: none; padding: 12px 30px; font-family: 'Cinzel'; font-weight: 900; }
        button:hover { filter: brightness(1.2); }

        .nav-bar { display: flex; gap: 30px; margin-bottom: 20px; font-family: 'Cinzel'; }
        .nav-btn { color: #fff; text-decoration: none; letter-spacing: 3px; font-size: 0.7rem; opacity: 0.6; }
        .active-nav { opacity: 1; border-bottom: 1px solid var(--godly-gold); padding-bottom: 5px; }

    </style>
</head>
<body onclick="createShockwave(event)">

    <canvas id="starfield"></canvas>
    <canvas id="fx-layer"></canvas>

    <div class="container">
        <div class="nav-bar">
            <a href="#" class="nav-btn active-nav">PROJECT ATLAS</a>
            <a href="#" class="nav-btn">CHRONICLES</a>
        </div>

        <h1 id="title">ATLAS</h1>
        <div class="subtitle">THE ARCHIVE OF STRENGTH</div>

        <div id="desc">The weight of the world is not meant for the weak. Document your ascent into godhood.</div>

        <div class="countdown">
            <strong>ASCENSION IN</strong>
            <div id="timer">00D 00H 00M 00S</div>
        </div>

        <div id="authBox">
            <input id="email" placeholder="IDENTITY">
            <input id="password" type="password" placeholder="SIGIL">
            <button id="loginBtn">ENTER</button>
            <button id="logoutBtn" style="display:none">LEAVE</button>
        </div>

        <div class="table-container">
            <table id="table" class="locked-content">
                <thead>
                    <tr><th>CHALLENGE</th><th>BURDEN</th><th>PEAK</th><th>DIVINITY</th></tr>
                </thead>
                <tbody id="tbody">
                    <tr><td colspan="4" style="color:var(--godly-gold)">Awakening Ancient Records...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <script>
        // --- CELESTIAL BACKGROUND ---
        const starCanvas = document.getElementById('starfield');
        const sCtx = starCanvas.getContext('2d');
        let stars = [];

        function initStars() {
            starCanvas.width = window.innerWidth;
            starCanvas.height = window.innerHeight;
            stars = [];
            for(let i=0; i<150; i++) stars.push({x: Math.random()*starCanvas.width, y: Math.random()*starCanvas.height, size: Math.random()*1.5, opacity: Math.random()});
        }

        function drawStars() {
            sCtx.clearRect(0,0,starCanvas.width, starCanvas.height);
            stars.forEach(s => {
                sCtx.fillStyle = `rgba(255, 255, 255, ${s.opacity})`;
                sCtx.beginPath(); sCtx.arc(s.x, s.y, s.size, 0, Math.PI*2); sCtx.fill();
                s.opacity += (Math.random()-0.5)*0.01;
            });
            requestAnimationFrame(drawStars);
        }
        window.onresize = initStars;
        initStars(); drawStars();

        // --- SHOCKWAVE FX ---
        const fxCanvas = document.getElementById('fx-layer');
        const fCtx = fxCanvas.getContext('2d');
        let shockwaves = [];

        function createShockwave(e) {
            shockwaves.push({x: e.clientX, y: e.clientY, r: 0, a: 1});
        }

        function drawFX() {
            fxCanvas.width = window.innerWidth; fxCanvas.height = window.innerHeight;
            fCtx.clearRect(0,0,fxCanvas.width, fxCanvas.height);
            shockwaves.forEach((s, i) => {
                fCtx.strokeStyle = `rgba(226, 194, 117, ${s.a})`;
                fCtx.lineWidth = 2;
                fCtx.beginPath(); fCtx.arc(s.x, s.y, s.r, 0, Math.PI*2); fCtx.stroke();
                s.r += 10; s.a -= 0.02;
                if(s.a <= 0) shockwaves.splice(i, 1);
            });
            requestAnimationFrame(drawFX);
        }
        drawFX();

        // --- FIREBASE INTEGRATION ---
        firebase.initializeApp({
            apiKey:"AIzaSyBoePuKarSCVgvxQQBGvkMKq16DvKmBYBE",
            authDomain:"strenght-a9f37.firebaseapp.com",
            databaseURL:"https://strenght-a9f37-default-rtdb.firebaseio.com",
            projectId:"strenght-a9f37",
            storageBucket:"strenght-a9f37.firebasestorage.app",
            messagingSenderId:"469926449178",
            appId:"1:469926449178:web:b9623947a1c1865b0f81a3"
        });

        const auth = firebase.auth();
        const db = firebase.database();
        const titleEl = document.getElementById("title"),
              descEl = document.getElementById("desc"),
              tbody = document.getElementById("tbody");

        db.ref("log").on("value", snap => {
            const d = snap.val() || {};
            titleEl.innerText = d.title || "ATLAS";
            descEl.innerHTML = d.desc || "The weight of the world is not meant for the weak.";
            tbody.innerHTML = d.table || "";
        });

        const loginBtn = document.getElementById("loginBtn"), logoutBtn = document.getElementById("logoutBtn");
        auth.onAuthStateChanged(user => {
            const isAdmin = !!user;
            [titleEl, descEl, tbody].forEach(el => el.contentEditable = isAdmin);
            loginBtn.style.display = user ? "none" : "inline-block";
            document.querySelectorAll("#authBox input").forEach(i => i.style.display = user ? "none" : "inline-block");
            logoutBtn.style.display = user ? "inline-block" : "none";
        });

        loginBtn.onclick = () => auth.signInWithEmailAndPassword(document.getElementById("email").value, document.getElementById("password").value);
        logoutBtn.onclick = () => auth.signOut();

        function saveData() {
            if(!auth.currentUser) return;
            db.ref("log").set({ title: titleEl.innerText, desc: descEl.innerHTML, table: tbody.innerHTML });
            db.ref("meta/lastUpdate").set(new Date().toDateString());
        }
        [titleEl, descEl, tbody].forEach(el => el.addEventListener("blur", saveData));

        // Timer
        const targetDate = new Date("February 3, 2026 00:00:00").getTime();
        setInterval(() => {
            const diff = targetDate - Date.now();
            if(diff <= 0) { document.getElementById("timer").textContent = "GODHOOD ACHIEVED"; return; }
            const d = Math.floor(diff/86400000), h = Math.floor(diff/3600000)%24, m = Math.floor(diff/60000)%60, s = Math.floor(diff/1000)%60;
            document.getElementById("timer").textContent = `${d}D ${h}H ${m}M ${s}S`;
        }, 1000);
    </script>
</body>
</html>
