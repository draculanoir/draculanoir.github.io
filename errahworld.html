
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>ErrahWorld | AI Strength Log</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;600&display=swap');
        
        :root {
            --bg-main: #0a0e1a;
            --bg-secondary: #0f1423;
            --bg-panel: rgba(15, 20, 35, 0.85);
            --accent-primary: #6366f1;
            --accent-secondary: #8b5cf6;
            --accent-glow: rgba(99, 102, 241, 0.35);
            --text-primary: #f8fafc;
            --text-secondary: #cbd5e1;
            --text-muted: #64748b;
            --border-subtle: rgba(148, 163, 184, 0.1);
            --border-glass: rgba(255, 255, 255, 0.12);
            --success: #10b981;
            --warning: #f59e0b;
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.12);
            --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.2);
            --shadow-lg: 0 20px 60px rgba(0, 0, 0, 0.35);
            --shadow-xl: 0 30px 90px rgba(0, 0, 0, 0.5);
        }

        /* Premium Animations */
        @keyframes fadeInUp {
            from { 
                opacity: 0; 
                transform: translateY(30px); 
                filter: blur(8px); 
            }
            to { 
                opacity: 1; 
                transform: translateY(0); 
                filter: blur(0); 
            }
        }

        @keyframes slideInLeft {
            from { 
                opacity: 0; 
                transform: translateX(-30px); 
            }
            to { 
                opacity: 1; 
                transform: translateX(0); 
            }
        }

        @keyframes scanline {
            0% { transform: translateY(-100%); opacity: 0; }
            50% { opacity: 1; }
            100% { transform: translateY(200%); opacity: 0; }
        }

        @keyframes pulseGlow {
            0%, 100% { opacity: 0.6; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.02); }
        }

        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        @keyframes gradientShift {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        /* Base Styles */
        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, var(--bg-main) 0%, var(--bg-secondary) 100%);
            background-attachment: fixed;
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
            display: flex; 
            flex-direction: column; 
            align-items: center;
            padding: 40px 20px;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* Premium Animated Background */
        #bg-canvas {
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%;
            z-index: -1; 
            opacity: 0.25;
            pointer-events: none;
            filter: blur(1px);
        }

        /* Gradient Orbs Background */
        body::before {
            content: "";
            position: fixed;
            top: -50%;
            right: -50%;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, var(--accent-glow) 0%, transparent 70%);
            opacity: 0.15;
            animation: float 20s ease-in-out infinite;
            z-index: -1;
        }

        body::after {
            content: "";
            position: fixed;
            bottom: -50%;
            left: -50%;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(139, 92, 246, 0.2) 0%, transparent 70%);
            opacity: 0.15;
            animation: float 25s ease-in-out infinite reverse;
            z-index: -1;
        }

        .container {
            width: 100%; 
            max-width: 920px; 
            margin: 0 auto;
            animation: fadeInUp 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            position: relative;
            z-index: 1;
        }

        /* Premium Navigation */
        .nav-bar { 
            display: flex; 
            gap: 6px; 
            margin-bottom: 50px; 
            background: var(--bg-panel);
            padding: 8px; 
            border-radius: 20px; 
            border: 1px solid var(--border-glass);
            width: fit-content; 
            margin-inline: auto;
            backdrop-filter: blur(24px) saturate(180%);
            box-shadow: var(--shadow-lg), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            animation: slideInLeft 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .nav-btn { 
            padding: 12px 28px; 
            border-radius: 16px; 
            text-decoration: none; 
            font-size: 0.875rem; 
            font-weight: 600;
            color: var(--text-secondary);
            position: relative;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            letter-spacing: -0.01em;
        }

        .nav-btn:hover {
            color: var(--text-primary);
            transform: translateY(-1px);
        }

        .nav-btn::before {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: 16px;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .active-nav { 
            color: #ffffff;
            font-weight: 700;
        }

        .active-nav::before {
            opacity: 1;
        }

        .active-nav span {
            position: relative;
            z-index: 1;
        }

        /* Premium Banner */
        .last-updated-banner { 
            font-size: 0.7rem; 
            font-weight: 800;
            color: var(--accent-primary); 
            text-align: center; 
            margin-bottom: 16px;
            letter-spacing: 3px;
            text-transform: uppercase;
            animation: pulseGlow 3s ease-in-out infinite;
            font-family: 'JetBrains Mono', monospace;
            text-shadow: 0 0 20px var(--accent-glow);
        }

        /* Premium Typography */
        h1 { 
            margin: 0 0 20px; 
            font-size: clamp(3rem, 12vw, 4.5rem); 
            text-align: center; 
            font-weight: 900; 
            background: linear-gradient(135deg, #ffffff 0%, var(--accent-primary) 50%, var(--accent-secondary) 100%);
            background-size: 200% auto;
            -webkit-background-clip: text; 
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.04em;
            line-height: 1.1;
            animation: gradientShift 8s ease infinite;
            filter: drop-shadow(0 4px 24px var(--accent-glow));
        }

        /* Premium Description Card */
        #desc { 
            padding: 32px 40px; 
            margin-bottom: 48px; 
            border-radius: 28px; 
            background: var(--bg-panel);
            border: 1px solid var(--border-glass);
            color: var(--text-secondary); 
            text-align: center; 
            backdrop-filter: blur(32px) saturate(180%);
            box-shadow: var(--shadow-lg), inset 0 1px 0 rgba(255, 255, 255, 0.08);
            font-size: 1.05rem;
            font-weight: 400;
            line-height: 1.7;
            position: relative;
            overflow: hidden;
        }

        #desc::before {
            content: "";
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--accent-primary), transparent);
            animation: scanline 3s linear infinite;
        }

        /* Premium Countdown Card */
        .countdown {
            margin-bottom: 48px; 
            padding: 40px; 
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.1) 0%, rgba(139, 92, 246, 0.05) 100%);
            border-radius: 32px; 
            border: 1px solid var(--border-glass);
            box-shadow: var(--shadow-xl), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            display: flex; 
            flex-direction: column; 
            align-items: center;
            gap: 20px;
            position: relative; 
            overflow: hidden;
            backdrop-filter: blur(32px) saturate(180%);
        }

        .countdown::after {
            content: "";
            position: absolute;
            top: -100%;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(transparent, rgba(99, 102, 241, 0.08), transparent);
            animation: scanline 6s linear infinite;
            pointer-events: none;
        }

        .countdown strong {
            font-size: 0.8rem;
            font-weight: 800;
            letter-spacing: 3px;
            color: var(--text-muted);
            text-transform: uppercase;
            font-family: 'JetBrains Mono', monospace;
        }

        #timer { 
            font-size: clamp(2rem, 8vw, 3.5rem); 
            font-weight: 900; 
            background: linear-gradient(135deg, var(--text-primary), var(--accent-primary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 40px var(--accent-glow);
            letter-spacing: 0.05em;
            font-family: 'JetBrains Mono', monospace;
            position: relative;
            z-index: 1;
        }

        /* Premium Auth Box */
        #authBox { 
            display: flex; 
            gap: 12px; 
            margin-bottom: 48px; 
            justify-content: center;
            flex-wrap: wrap;
        }

        input { 
            background: rgba(15, 20, 35, 0.7);
            border: 1px solid var(--border-subtle);
            color: var(--text-primary); 
            padding: 16px 24px; 
            border-radius: 16px; 
            outline: none;
            font-size: 0.95rem;
            font-weight: 500;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            backdrop-filter: blur(12px);
            min-width: 200px;
            font-family: inherit;
        }

        input::placeholder {
            color: var(--text-muted);
        }

        input:focus { 
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 4px var(--accent-glow), var(--shadow-md);
            transform: translateY(-2px);
            background: rgba(15, 20, 35, 0.9);
        }

        input:hover {
            border-color: var(--border-glass);
        }

        /* Premium Buttons */
        button { 
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            border: none; 
            color: #ffffff;
            padding: 16px 32px; 
            border-radius: 16px; 
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: var(--shadow-md), inset 0 1px 0 rgba(255, 255, 255, 0.2);
            position: relative;
            overflow: hidden;
            letter-spacing: -0.01em;
            font-family: inherit;
        }

        button::before {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.2), transparent);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 32px var(--accent-glow), var(--shadow-lg);
        }

        button:hover::before {
            opacity: 1;
        }

        button:active {
            transform: translateY(-1px);
        }

        #logoutBtn {
            background: rgba(248, 113, 113, 0.2);
            border: 1px solid rgba(248, 113, 113, 0.3);
            color: #fca5a5;
        }

        #logoutBtn:hover {
            background: rgba(248, 113, 113, 0.3);
            box-shadow: 0 8px 24px rgba(248, 113, 113, 0.3);
        }

        /* Premium Table Container */
        .table-container { 
            overflow: hidden;
            border-radius: 32px; 
            border: 1px solid var(--border-glass);
            box-shadow: var(--shadow-xl), inset 0 1px 0 rgba(255, 255, 255, 0.08);
            background: var(--bg-panel);
            backdrop-filter: blur(32px) saturate(180%);
            position: relative;
        }

        /* Premium Table */
        table { 
            width: 100%; 
            border-collapse: collapse;
        }

        thead {
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.08), rgba(139, 92, 246, 0.05));
            border-bottom: 1px solid var(--border-glass);
        }

        th { 
            color: var(--accent-primary);
            padding: 24px 28px; 
            font-size: 0.75rem; 
            font-weight: 800;
            letter-spacing: 2px; 
            text-transform: uppercase;
            font-family: 'JetBrains Mono', monospace;
            text-align: center;
        }

        th:first-child {
            text-align: left;
        }

        tbody tr {
            border-bottom: 1px solid var(--border-subtle);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        tbody tr:last-child {
            border-bottom: none;
        }

        td { 
            padding: 24px 28px; 
            text-align: center; 
            font-size: 1rem;
            font-weight: 500;
            color: var(--text-secondary);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        td:first-child {
            text-align: left;
            font-weight: 600;
            color: var(--text-primary);
        }

        tbody tr:hover {
            background: linear-gradient(90deg, rgba(99, 102, 241, 0.08), rgba(139, 92, 246, 0.05));
            transform: scale(1.005);
        }

        tbody tr:hover td {
            color: var(--text-primary);
        }

        /* Premium Loading State */
        .loading-shimmer {
            background: linear-gradient(
                90deg, 
                transparent 0%, 
                rgba(99, 102, 241, 0.1) 50%, 
                transparent 100%
            );
            background-size: 200% 100%;
            animation: shimmer 2s infinite ease-in-out;
        }

        /* Locked Content Blur */
        .locked-content {
            filter: blur(8px);
            pointer-events: none;
            user-select: none;
        }

        /* Premium Scrollbar */
        ::-webkit-scrollbar {
            width: 12px;
            height: 12px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-secondary);
        }

        ::-webkit-scrollbar-thumb {
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            border-radius: 6px;
            border: 2px solid var(--bg-secondary);
        }

        ::-webkit-scrollbar-thumb:hover {
            background: linear-gradient(135deg, var(--accent-secondary), var(--accent-primary));
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            body {
                padding: 20px 16px;
            }

            .nav-bar {
                gap: 4px;
                padding: 6px;
            }

            .nav-btn {
                padding: 10px 20px;
                font-size: 0.8rem;
            }

            h1 {
                margin-bottom: 16px;
            }

            #desc {
                padding: 24px 28px;
                font-size: 0.95rem;
                margin-bottom: 36px;
            }

            .countdown {
                padding: 28px;
                margin-bottom: 36px;
            }

            #authBox {
                flex-direction: column;
                width: 100%;
            }

            input, button {
                width: 100%;
                min-width: unset;
            }

            th, td {
                padding: 16px 12px;
                font-size: 0.85rem;
            }

            th {
                font-size: 0.65rem;
            }

            .table-container {
                overflow-x: auto;
            }
        }

        /* Selection Styling */
        ::selection {
            background: var(--accent-primary);
            color: white;
        }

        /* Focus Visible */
        *:focus-visible {
            outline: 2px solid var(--accent-primary);
            outline-offset: 2px;
        }

    </style>
</head>
<body>

    <canvas id="bg-canvas"></canvas>

    <div class="container">
        <nav class="nav-bar" role="navigation">
            <a href="errahworld.html" class="nav-btn active-nav"><span>Project Atlas</span></a>
            <a href="updates.html" class="nav-btn"><span>Updates</span></a>
        </nav>

        <div id="lastUpdateBanner" class="last-updated-banner">ESTABLISHING NEURAL LINK...</div>

        <h1 id="title">Syncing</h1>
        <div id="desc">Decrypting strength data from secure servers...</div>

        <div class="countdown">
            <strong>NEXT RM CYCLE</strong>
            <div id="timer">00D 00H 00M 00S</div>
        </div>

        <div id="authBox">
            <input id="email" placeholder="Admin ID" type="email" autocomplete="username">
            <input id="password" type="password" placeholder="Keyphrase" autocomplete="current-password">
            <button id="loginBtn">Login</button>
            <button id="logoutBtn" style="display:none">Logout</button>
        </div>

        <div class="table-container">
            <table id="table" class="locked-content">
                <thead>
                    <tr>
                        <th style="text-align:left">Exercise</th>
                        <th>Current</th>
                        <th>1RM</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="tbody">
                    <tr class="loading-shimmer">
                        <td colspan="4" style="height: 80px; opacity: 0.5; font-weight: 600;">INITIALIZING DATABASE...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <script>
        // PREMIUM BACKGROUND ANIMATION (Enhanced Neural Grid)
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        let dots = [];
        let connections = [];
        
        function initCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            dots = [];
            
            const dotCount = Math.min(80, Math.floor((canvas.width * canvas.height) / 15000));
            
            for(let i = 0; i < dotCount; i++) {
                dots.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    vx: (Math.random() - 0.5) * 0.5,
                    vy: (Math.random() - 0.5) * 0.5,
                    radius: Math.random() * 2 + 1
                });
            }
        }
        
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Update and draw dots
            dots.forEach((dot, i) => {
                dot.x += dot.vx;
                dot.y += dot.vy;
                
                if(dot.x < 0 || dot.x > canvas.width) dot.vx *= -1;
                if(dot.y < 0 || dot.y > canvas.height) dot.vy *= -1;
                
                // Draw dot with gradient
                const gradient = ctx.createRadialGradient(dot.x, dot.y, 0, dot.x, dot.y, dot.radius * 3);
                gradient.addColorStop(0, 'rgba(99, 102, 241, 0.8)');
                gradient.addColorStop(1, 'rgba(99, 102, 241, 0)');
                
                ctx.fillStyle = gradient;
                ctx.beginPath();
                ctx.arc(dot.x, dot.y, dot.radius, 0, Math.PI * 2);
                ctx.fill();
                
                // Draw connections
                dots.forEach((otherDot, j) => {
                    if(i !== j) {
                        const dx = dot.x - otherDot.x;
                        const dy = dot.y - otherDot.y;
                        const distance = Math.sqrt(dx * dx + dy * dy);
                        
                        if(distance < 150) {
                            const opacity = (1 - distance / 150) * 0.3;
                            ctx.strokeStyle = `rgba(99, 102, 241, ${opacity})`;
                            ctx.lineWidth = 0.5;
                            ctx.beginPath();
                            ctx.moveTo(dot.x, dot.y);
                            ctx.lineTo(otherDot.x, otherDot.y);
                            ctx.stroke();
                        }
                    }
                });
            });
            
            requestAnimationFrame(draw);
        }
        
        window.addEventListener('resize', initCanvas);
        initCanvas();
        draw();

        // FIREBASE SETUP
        firebase.initializeApp({
            apiKey: "AIzaSyBoePuKarSCVgvxQQBGvkMKq16DvKmBYBE",
            authDomain: "strenght-a9f37.firebaseapp.com",
            databaseURL: "https://strenght-a9f37-default-rtdb.firebaseio.com",
            projectId: "strenght-a9f37",
            storageBucket: "strenght-a9f37.firebasestorage.app",
            messagingSenderId: "469926449178",
            appId: "1:469926449178:web:b9623947a1c1865b0f81a3"
        });

        const auth = firebase.auth();
        const db = firebase.database();
        const titleEl = document.getElementById("title");
        const descEl = document.getElementById("desc");
        const tbody = document.getElementById("tbody");
        const updateBanner = document.getElementById("lastUpdateBanner");

        // DATA SYNC WITH SMOOTH TRANSITIONS
        db.ref("log").on("value", snap => {
            const d = snap.val() || {};
            
            // Smooth fade transition
            tbody.style.transition = 'opacity 0.4s cubic-bezier(0.4, 0, 0.2, 1)';
            tbody.style.opacity = '0';
            
            setTimeout(() => {
                titleEl.innerText = d.title || "Strength Log";
                descEl.innerHTML = d.desc || "Neural link active...";
                tbody.innerHTML = d.table || "<tr><td colspan='4' style='padding: 40px; color: var(--text-muted)'>No data available</td></tr>";
                tbody.style.opacity = '1';
            }, 400);
        });

        db.ref("meta/lastUpdate").on("value", snap => {
            updateBanner.innerText = "SYSTEM ACTIVE // LAST SYNC: " + (snap.val() || "UNKNOWN");
        });

        // AUTH LOGIC
        const loginBtn = document.getElementById("loginBtn");
        const logoutBtn = document.getElementById("logoutBtn");
        const emailEl = document.getElementById("email");
        const passEl = document.getElementById("password");
        let isAdmin = false;

        loginBtn.onclick = () => {
            loginBtn.innerText = "Authenticating...";
            auth.signInWithEmailAndPassword(emailEl.value, passEl.value)
                .catch(e => {
                    alert("Authentication failed: " + e.message);
                    loginBtn.innerText = "Login";
                });
        };

        logoutBtn.onclick = () => auth.signOut();

        auth.onAuthStateChanged(user => {
            isAdmin = !!user;
            
            const tableEl = document.getElementById("table");
            tableEl.classList.toggle("locked-content", !isAdmin);
            
            [titleEl, descEl, tbody].forEach(el => {
                el.contentEditable = isAdmin;
                if(isAdmin) {
                    el.style.cursor = "text";
                }
            });
            
            loginBtn.style.display = user ? "none" : "inline-block";
            emailEl.style.display = user ? "none" : "inline-block";
            passEl.style.display = user ? "none" : "inline-block";
            logoutBtn.style.display = user ? "inline-block" : "none";
            
            if(user) {
                loginBtn.innerText = "Login";
            }
        });

        // SAVE DATA WITH DEBOUNCE
        let saveTimeout;
        function saveData() {
            if(!isAdmin) return;
            
            clearTimeout(saveTimeout);
            saveTimeout = setTimeout(() => {
                const now = new Date();
                const dateStr = `${now.getDate()} ${now.toLocaleString('default', { month: 'long' })} ${now.getFullYear()}`;
                
                db.ref("log").set({ 
                    title: titleEl.innerText, 
                    desc: descEl.innerHTML, 
                    table: tbody.innerHTML 
                });
                
                db.ref("meta/lastUpdate").set(dateStr);
            }, 1000);
        }
        
        [titleEl, descEl, tbody].forEach(el => {
            el.addEventListener("blur", saveData);
            el.addEventListener("input", saveData);
        });

        // PREMIUM COUNTDOWN TIMER
        const targetDate = new Date("February 3, 2026 00:00:00").getTime();
        
        function updateTimer() {
            const now = Date.now();
            const diff = targetDate - now;
            
            if(diff <= 0) {
                document.getElementById("timer").innerHTML = "LIMIT BREAKER 🔥";
                return;
            }
            
            const days = Math.floor(diff / 86400000);
            const hours = Math.floor((diff % 86400000) / 3600000);
            const minutes = Math.floor((diff % 3600000) / 60000);
            const seconds = Math.floor((diff % 60000) / 1000);
            
            const pad = (num) => String(num).padStart(2, '0');
            
            document.getElementById("timer").textContent = 
                `${pad(days)}D ${pad(hours)}H ${pad(minutes)}M ${pad(seconds)}S`;
        }
        
        updateTimer();
        setInterval(updateTimer, 1000);

        // SMOOTH SCROLL BEHAVIOR
        document.querySelectorAll('a[href^="#"]').forEach(anchor => {
            anchor.addEventListener('click', function (e) {
                e.preventDefault();
                const target = document.querySelector(this.getAttribute('href'));
                if(target) {
                    target.scrollIntoView({ behavior: 'smooth', block: 'start' });
                }
            });
        });

        // KEYBOARD SHORTCUTS FOR PREMIUM UX
        document.addEventListener('keydown', (e) => {
            // Ctrl/Cmd + S to save (when admin)
            if((e.ctrlKey || e.metaKey) && e.key === 's' && isAdmin) {
                e.preventDefault();
                saveData();
                // Visual feedback
                updateBanner.style.color = '#10b981';
                setTimeout(() => {
                    updateBanner.style.color = '';
                }, 1000);
            }
        });

    </script>
</body>
</html>
