<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Strength Log – 1RM Tracking</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />

<style>
:root {
  --bg-main:#0c0e12;
  --bg-panel:#14161c;
  --bg-header:#1b1e26;
  --border:#2a2d36;
  --text:#d9dbe1;
  --muted:#9da1ac;
  --accent:#bfc6d6;
}

body {
  visibility:hidden;
  font-family:"Segoe UI",Arial,sans-serif;
  background:radial-gradient(circle at top,#12141b,var(--bg-main));
  color:var(--text);
  padding:24px;
}

.locked-content,
.locked-content * {
  pointer-events:none !important;
  user-select:none !important;
  caret-color:transparent !important;
}

*:focus {
  outline:none !important;
  box-shadow:none !important;
}

.top-bar {
  display:flex;
  justify-content:space-between;
  align-items:center;
  max-width:1020px;
  margin-bottom:12px;
}

#authBox input,
#authBox button {
  background:transparent;
  border:1px solid var(--border);
  color:var(--accent);
  padding:6px 10px;
  border-radius:6px;
  margin-right:4px;
}

table {
  width:100%;
  max-width:1020px;
  border-collapse:collapse;
  background:var(--bg-panel);
  box-shadow:0 0 0 1px var(--border);
}

th,td {
  border:1px solid var(--border);
  padding:10px;
  text-align:center;
}

th {
  background:var(--bg-header);
  color:var(--accent);
  font-size:.75rem;
}

td.left { text-align:left; }

.last-updated {
  font-size:.75rem;
  color:var(--muted);
}
</style>
</head>

<body>

<h1 id="title"></h1>
<p id="desc"></p>

<div class="top-bar">
  <div id="authBox">
    <input id="email" placeholder="admin email">
    <input id="password" type="password" placeholder="password">
    <button id="loginBtn">Login</button>
    <button id="logoutBtn" style="display:none">Logout</button>
  </div>
  <div class="last-updated" id="lastUpdated"></div>
</div>

<table id="table" class="locked-content">
<thead>
<tr>
  <th class="left">Lift</th>
  <th>Current</th>
  <th>1RM</th>
  <th>Strength Level</th>
</tr>
</thead>
<tbody id="tbody"></tbody>
</table>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>
firebase.initializeApp({
  apiKey: "AIzaSyBoePuKarSCVgvxQQBGvkMKq16DvKmBYBE",
  authDomain: "strenght-a9f37.firebaseapp.com",
  databaseURL: "https://strenght-a9f37-default-rtdb.firebaseio.com",
  projectId: "strenght-a9f37",
  storageBucket: "strenght-a9f37.firebasestorage.app",
  messagingSenderId: "469926449178",
  appId: "1:469926449178:web:b9623947a1c1865b0f81a3"
});

const auth = firebase.auth();
const db = firebase.database();

const table = document.getElementById("table");
const tbody = document.getElementById("tbody");
const title = document.getElementById("title");
const desc = document.getElementById("desc");
const lastUpdated = document.getElementById("lastUpdated");
const loginBtn = document.getElementById("loginBtn");
const logoutBtn = document.getElementById("logoutBtn");
const email = document.getElementById("email");
const password = document.getElementById("password");

let isAdmin = false;
let firstLoad = true;

/* ⛔ BLOCK INPUT WHEN NOT ADMIN */
document.addEventListener("keydown", e => {
  if (!isAdmin && !e.target.closest("#authBox")) e.preventDefault();
});

/* 🔒 LOCK */
function lockAll() {
  isAdmin = false;
  table.classList.add("locked-content");
  title.contentEditable = "false";
  desc.contentEditable = "false";
  document.querySelectorAll("td").forEach(td => {
    td.contentEditable = "false";
    td.blur();
  });
}

/* ✏️ EDIT */
function enableEdit() {
  isAdmin = true;
  table.classList.remove("locked-content");
  title.contentEditable = "true";
  desc.contentEditable = "true";
  document.querySelectorAll("td").forEach(td => td.contentEditable = "true");
}

/* 🔐 AUTH */
loginBtn.onclick = () =>
  auth.signInWithEmailAndPassword(email.value, password.value)
    .catch(e => alert(e.message));

logoutBtn.onclick = () => auth.signOut();

auth.onAuthStateChanged(user => {
  if (user) {
    enableEdit();
    loginBtn.style.display = "none";
    logoutBtn.style.display = "inline-block";
  } else {
    lockAll();
    loginBtn.style.display = "inline-block";
    logoutBtn.style.display = "none";
  }
});

/* ⏳ COUNTDOWN */
function daysUntil(dateStr) {
  const today = new Date();
  const target = new Date(dateStr);
  today.setHours(0,0,0,0);
  target.setHours(0,0,0,0);
  return Math.max(0, Math.ceil((target - today) / 86400000));
}

function renderDesc(template) {
  const days = daysUntil("2026-02-04");
  return template.replace(
    "{{COUNTDOWN_DAYS}}",
    `<strong>${days}</strong>`
  );
}

/* 📥 LOAD */
db.ref("log").once("value").then(snap => {
  const d = snap.val();
  title.innerText = d.title;
  tbody.innerHTML = d.table;
  desc.innerHTML = renderDesc(d.desc);
  lastUpdated.innerText = "Last updated: " + d.updated;
  document.body.style.visibility = "visible";
});

/* 🔁 LIVE UPDATES (NO CURSOR JUMP) */
db.ref("log").on("value", snap => {
  if (firstLoad) {
    firstLoad = false;
    return;
  }
  if (isAdmin) return;

  const d = snap.val();
  title.innerText = d.title;
  tbody.innerHTML = d.table;
  desc.innerHTML = renderDesc(d.desc);
  lastUpdated.innerText = "Last updated: " + d.updated;
});

/* 💾 SAVE (STORE TEMPLATE) */
document.addEventListener("input", () => {
  if (!isAdmin) return;

  const now = new Date();
  const formatted =
    String(now.getDate()).padStart(2,"0") + "/" +
    String(now.getMonth()+1).padStart(2,"0") + "/" +
    now.getFullYear() + " · " +
    String(now.getHours()).padStart(2,"0") + ":" +
    String(now.getMinutes()).padStart(2,"0");

  const cleanDesc = desc.innerHTML.replace(
    /<strong>\d+<\/strong>/g,
    "{{COUNTDOWN_DAYS}}"
  );

  db.ref("log").set({
    title: title.innerText,
    desc: cleanDesc,
    table: tbody.innerHTML,
    updated: formatted
  });
});

lockAll();
</script>

</body>
</html>
