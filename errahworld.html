<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Strength Log</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
:root{
  --bg-main:#0a0c13; --bg-panel:rgba(22,26,42,.88); --bg-header:rgba(32,38,64,.95);
  --border:rgba(255,255,255,.08); --text:#eef0f6; --muted:#9aa1b3; --accent:#cfd6ff;
}
*{ box-sizing:border-box; }
body{
  margin:0; padding:20px; font-family:"Inter",sans-serif;
  background: radial-gradient(1200px 600px at top,#1c2340,transparent 60%), var(--bg-main);
  color:var(--text);
}

/* Nav */
.nav-bar { display: flex; gap: 8px; margin-bottom: 20px; justify-content: center; }
.nav-btn { background: rgba(255,255,255,0.05); border: 1px solid var(--border); color: var(--accent); padding: 8px 12px; border-radius: 10px; text-decoration: none; font-size: 0.85rem; flex: 1; text-align: center; }
.active-nav { background: var(--accent); color: #000; }

.last-updated-banner { font-size: 0.75rem; color: var(--accent); text-align: center; margin-bottom: 15px; opacity: 0.9; font-weight: 600; }

.locked-content, .locked-content *{ pointer-events:none!important; user-select:none!important; }
h1{ margin:0 0 10px; font-size:2rem; text-align: center; font-weight: 700; }
#desc{ padding:18px; margin-bottom:20px; background:rgba(255,255,255,.04); border:1px solid var(--border); border-radius:18px; color:var(--muted); line-height: 1.6; outline: none; }

.countdown{
  margin: 10px 0 20px; padding:15px; background:linear-gradient(135deg,#2b3160,#1b1f3d);
  border-radius:15px; display:flex; justify-content:space-between; align-items:center; font-size: 0.85rem;
}
#timer{ font-weight:700; color:var(--accent); }

.top-bar{ display:flex; flex-direction: column; gap: 15px; margin-bottom:18px; }
#authBox{ display:flex; gap:10px; padding:12px; background:rgba(255,255,255,.05); border-radius:15px; border: 1px solid var(--border); }
#authBox input{ background:rgba(0,0,0,.25); border:1px solid var(--border); color:var(--accent); padding:10px; border-radius:10px; width: 100%; outline: none; }
#authBox button{ background:#3a43a0; border:none; color:#fff; padding:10px 15px; border-radius:10px; cursor:pointer; font-weight: 600; }

table{ width:100%; border-collapse:collapse; background:var(--bg-panel); border-radius:18px; overflow:hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
th,td{ padding:12px; text-align:center; border-bottom:1px solid var(--border); outline: none; }
th{ background:var(--bg-header); color:var(--accent); text-transform:uppercase; font-size: 0.65rem; letter-spacing: 0.1em; }

/* JARVIS UI */
#jarvis-container { position: fixed; bottom: 25px; right: 25px; z-index: 9999; display: flex; flex-direction: column; align-items: flex-end; }
#jarvis-bubble { display: none; background: var(--bg-panel); border: 1px solid var(--accent); padding: 15px; border-radius: 15px; width: 250px; margin-bottom: 15px; backdrop-filter: blur(10px); color: var(--text); font-size: 0.85rem; }
#jarvis-orb { width: 60px; height: 60px; background: black; border: 2px solid var(--accent); border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 15px var(--accent); transition: 0.3s; }
.listening-active { border-color: #ff6b6b !important; box-shadow: 0 0 20px #ff6b6b !important; }
.speaking { animation: pulse 1.5s infinite; box-shadow: 0 0 25px #fff; }
@keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
</style>
</head>
<body>

<div class="nav-bar">
  <a href="errahworld.html" class="nav-btn active-nav">🏋️ Log</a>
  <a href="updates.html" class="nav-btn">📢 Updates</a>
</div>

<div id="lastUpdateBanner" class="last-updated-banner">Syncing...</div>

<h1 id="title">Strength Log</h1>
<p id="desc">Loading...</p>

<div class="countdown">
  <strong>Road to RM Drop 🏋️</strong>
  <div id="timer">Loading…</div>
</div>

<div class="top-bar">
  <div id="authBox">
    <input id="email" placeholder="Email">
    <input id="password" type="password" placeholder="Password">
    <button id="loginBtn">Login</button>
    <button id="logoutBtn" style="display:none">Logout</button>
  </div>
</div>

<table id="table" class="locked-content">
  <thead><tr><th style="text-align:left">Lift</th><th>Current</th><th>1RM</th><th>Level</th></tr></thead>
  <tbody id="tbody"></tbody>
</table>

<div id="jarvis-container">
    <div id="jarvis-bubble"><div id="jarvis-text">Awaiting orders, Sir.</div></div>
    <div id="jarvis-orb"><div style="color:var(--accent); font-weight:bold; font-size:10px;">JARVIS</div></div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>
firebase.initializeApp({
  apiKey:"AIzaSyBoePuKarSCVgvxQQBGvkMKq16DvKmBYBE",
  authDomain:"strenght-a9f37.firebaseapp.com",
  databaseURL:"https://strenght-a9f37-default-rtdb.firebaseio.com",
  projectId:"strenght-a9f37"
});

const auth=firebase.auth();
const db=firebase.database();

const emailEl=document.getElementById("email"), passEl=document.getElementById("password"),
      loginBtn=document.getElementById("loginBtn"), logoutBtn=document.getElementById("logoutBtn"),
      titleEl=document.getElementById("title"), descEl=document.getElementById("desc"),
      tbody=document.getElementById("tbody"), table=document.getElementById("table"),
      updateBanner=document.getElementById("lastUpdateBanner");

let isAdmin=false;

loginBtn.onclick=()=>auth.signInWithEmailAndPassword(emailEl.value,passEl.value);
logoutBtn.onclick=()=>auth.signOut();

auth.onAuthStateChanged(user=>{
  isAdmin=!!user;
  table.classList.toggle("locked-content",!isAdmin);
  [titleEl,descEl,tbody].forEach(el=>el.contentEditable=isAdmin);
  loginBtn.style.display=user?"none":"inline-block";
  emailEl.style.display=user?"none":"inline-block";
  passEl.style.display=user?"none":"inline-block";
  logoutBtn.style.display=user?"inline-block":"none";
});

db.ref("log").on("value", snap=>{
  const d=snap.val()||{};
  titleEl.innerText=d.title||"Strength Log";
  descEl.innerHTML=d.desc||"";
  tbody.innerHTML=d.table||"";
});

// --- GEMINI LOGIC ---
const orb = document.getElementById('jarvis-orb');
const jText = document.getElementById('jarvis-text');
const synth = window.speechSynthesis;
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
const recognition = SpeechRecognition ? new SpeechRecognition() : null;
const API_KEY = "AIzaSyBsRLrUe67LLSPgr_lQaKB-xINgUgSuzmI";

async function askGemini(input) {
  jText.innerText = "Thinking...";
  const data = document.getElementById("tbody").innerText;
  const prompt = `Context: This is Errah's Strength Log. Table Data: ${data}. Role: You are JARVIS, a modern female AI coach. Call him Sir. Be brief. Question: ${input}`;
  
  try {
    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
    });
    const json = await res.json();
    const reply = json.candidates[0].content.parts[0].text;
    jarvisSay(reply);
  } catch (e) {
    jarvisSay("Sir, the neural link is failing. Check the console.");
  }
}

function jarvisSay(msg) {
  synth.cancel();
  const utter = new SpeechSynthesisUtterance(msg);
  const voices = synth.getVoices();
  utter.voice = voices.find(v => v.name.includes("Google") && v.lang.includes("en")) || voices[0];
  utter.pitch = 1.2;
  jText.innerText = msg;
  orb.classList.add('speaking');
  synth.speak(utter);
  utter.onend = () => orb.classList.remove('speaking');
}

orb.onclick = () => {
  document.getElementById("jarvis-bubble").style.display = "block";
  jarvisSay("Neural link established, Sir.");
};

if(recognition) {
  recognition.onresult = (e) => askGemini(e.results[0][0].transcript);
  orb.onmousedown = () => { recognition.start(); orb.classList.add('listening-active'); };
  orb.onmouseup = () => { recognition.stop(); orb.classList.remove('listening-active'); };
}

// TIMER
const targetDate=new Date("February 3, 2026 00:00:00").getTime();
setInterval(()=>{
  const diff=targetDate-Date.now();
  if(diff<=0){ document.getElementById("timer").textContent="RM DAY 🔥"; return; }
  const d=Math.floor(diff/86400000), h=Math.floor(diff/3600000)%24, m=Math.floor(diff/60000)%60, s=Math.floor(diff/1000)%60;
  document.getElementById("timer").textContent=`${d}d ${h}h ${m}m ${s}s`;
},1000);
</script>
</body>
</html>
