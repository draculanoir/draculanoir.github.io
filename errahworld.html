<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Strength Log</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0"/>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
:root{
  --bg-main:#0a0c13; --bg-panel:rgba(22,26,42,.88); --accent:#cfd6ff; --text:#eef0f6; --border:rgba(255,255,255,.08);
}
body{ margin:0; padding:20px; font-family:"Inter",sans-serif; background:var(--bg-main); color:var(--text); padding-bottom:120px; }
.nav-bar { display: flex; gap: 8px; margin-bottom: 20px; }
.nav-btn { background: rgba(255,255,255,0.05); border: 1px solid var(--border); color: var(--accent); padding: 10px; border-radius: 10px; text-decoration: none; flex: 1; text-align: center; font-size: 0.8rem; }
.active-nav { background: var(--accent); color: #000; font-weight: bold; }
h1{ text-align: center; font-size: 1.8rem; margin: 10px 0; }
#desc{ padding:15px; background:rgba(255,255,255,.04); border-radius:15px; color:#9aa1b3; font-size: 0.9rem; margin-bottom: 20px; }
table{ width:100%; border-collapse:collapse; background:var(--bg-panel); border-radius:15px; overflow:hidden; }
th,td{ padding:12px; text-align:center; border-bottom:1px solid var(--border); }
th{ background:rgba(32,38,64,.95); color:var(--accent); font-size: 0.7rem; text-transform: uppercase; }

#jarvis-container { position: fixed; bottom: 25px; right: 25px; z-index: 9999; display: flex; flex-direction: column; align-items: flex-end; }
#jarvis-bubble { display: none; background: #161a2a; border: 1px solid var(--accent); padding: 15px; border-radius: 15px; width: 260px; margin-bottom: 12px; box-shadow: 0 8px 32px rgba(0,0,0,0.5); }
#jarvis-text { font-size: 0.85rem; line-height: 1.4; margin-bottom: 10px; word-wrap: break-word; }
#jarvis-input { width: 100%; background: rgba(0,0,0,0.3); border: 1px solid var(--border); color: white; padding: 8px; border-radius: 8px; display: none; outline: none; }
#jarvis-orb { width: 65px; height: 65px; background: black; border: 2px solid var(--accent); border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 15px var(--accent); transition: 0.3s; }
.thinking { animation: pulse 1s infinite; border-color: #5da9ff !important; }
@keyframes pulse { 0%,100%{ opacity:1; } 50%{ opacity:0.3; } }
</style>
</head>
<body>

<div class="nav-bar">
  <a href="errahworld.html" class="nav-btn active-nav">🏋️ Log</a>
  <a href="updates.html" class="nav-btn">📢 Updates</a>
</div>

<h1 id="title">Strength Log</h1>
<div id="desc">Neural Link: Online.</div>

<table id="table">
  <thead><tr><th style="text-align:left">Lift</th><th>Current</th><th>1RM</th><th>Level</th></tr></thead>
  <tbody id="tbody"></tbody>
</table>

<div id="jarvis-container">
    <div id="jarvis-bubble">
        <div id="jarvis-text">Neural Link Ready.</div>
        <input type="text" id="jarvis-input" placeholder="Enter command...">
    </div>
    <div id="jarvis-orb"><span style="color:var(--accent); font-weight:bold; font-size:10px;">JARVIS</span></div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>
// YOUR VERIFIED API KEY
const API_KEY = "AIzaSyDt1hwb3KRmnS5XURo3m424nKxTinRpyzM";

firebase.initializeApp({
  apiKey:"AIzaSyBoePuKarSCVgvxQQBGvkMKq16DvKmBYBE",
  authDomain:"strenght-a9f37.firebaseapp.com",
  databaseURL:"https://strenght-a9f37-default-rtdb.firebaseio.com",
  projectId:"strenght-a9f37"
});

const db = firebase.database();
const orb = document.getElementById('jarvis-orb');
const jText = document.getElementById('jarvis-text');
const jBubble = document.getElementById('jarvis-bubble');
const jInput = document.getElementById('jarvis-input');

db.ref("log").on("value", snap => {
    const d = snap.val() || {};
    document.getElementById("title").innerText = d.title || "Strength Log";
    document.getElementById("tbody").innerHTML = d.table || "";
});

function jarvisSay(msg) {
    window.speechSynthesis.cancel();
    orb.className = "";
    const utter = new SpeechSynthesisUtterance(msg);
    utter.pitch = 1.2;
    jText.innerText = msg;
    window.speechSynthesis.speak(utter);
}

async function askGemini(userInput) {
    if(!userInput) return;
    jBubble.style.display = "block";
    jText.innerText = "Processing...";
    orb.className = "thinking";

    const tableData = document.getElementById("tbody").innerText;
    
    const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${API_KEY}`;
    
    const requestOptions = {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        referrerPolicy: "no-referrer", // THIS BYPASSES THE "LINK FAILURE" BROWSER BLOCK
        body: JSON.stringify({
            contents: [{ parts: [{ text: `You are JARVIS. User: Errah. Data: ${tableData}. Briefly answer: ${userInput}` }] }]
        })
    };

    try {
        const response = await fetch(url, requestOptions);
        const data = await response.json();

        if (data.error) {
            throw new Error(`API ${data.error.code}: ${data.error.message}`);
        }

        const reply = data.candidates[0].content.parts[0].text;
        jarvisSay(reply);

    } catch (err) {
        orb.className = "";
        jText.innerHTML = `<span style="color:#ff6b6b">LINK ERROR:</span><br>${err.message}`;
        console.error(err);
    }
}

// Manual Input Trigger
orb.onclick = () => {
    if(jBubble.style.display === "block") {
        jInput.style.display = "block";
        jInput.focus();
    } else {
        jBubble.style.display = "block";
        jarvisSay("Neural link established, Sir.");
    }
};

jInput.onkeypress = (e) => {
    if(e.key === "Enter") {
        askGemini(jInput.value);
        jInput.value = "";
    }
};

// Voice Trigger (Standard)
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
if (SpeechRecognition) {
    const recognition = new SpeechRecognition();
    recognition.onresult = (e) => askGemini(e.results[0][0].transcript);
    orb.onpointerdown = (e) => { e.preventDefault(); recognition.start(); };
    orb.onpointerup = () => { recognition.stop(); };
}
</script>
</body>
</html>
