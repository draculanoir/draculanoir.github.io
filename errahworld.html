<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Strength Log – 1RM Tracking</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />

<style>
:root{
  --bg-main:#0c0e12;--bg-panel:#14161c;--bg-header:#1b1e26;
  --border:#2a2d36;--text-main:#d9dbe1;--text-muted:#9da1ac;
  --accent:#bfc6d6;
}
body{
  font-family:"Segoe UI",sans-serif;
  background:radial-gradient(circle at top,#12141b 0%,var(--bg-main) 60%);
  color:var(--text-main);
  padding:24px;
  display:none; /* 🔒 HIDE UNTIL FIREBASE READY */
}
h1{color:var(--accent);font-weight:500}
.bw{color:var(--accent);opacity:.85;max-width:1020px}
.top-bar{
  max-width:1020px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-top:12px;
}
button{
  background:transparent;
  border:1px solid var(--border);
  color:var(--accent);
  padding:6px 14px;
  border-radius:6px;
  cursor:pointer;
}
.last-updated{font-size:.75rem;color:var(--text-muted)}
table{
  margin-top:26px;
  width:100%;
  max-width:1020px;
  border-collapse:collapse;
  background:var(--bg-panel);
}
th,td{
  border:1px solid var(--border);
  padding:11px;
  text-align:center;
}
th{
  background:var(--bg-header);
  color:var(--accent);
  font-size:.78rem;
  text-transform:uppercase;
}
td.left{text-align:left;padding-left:14px}
.locked{
  pointer-events:none;
  user-select:none;
  caret-color:transparent;
}
[contenteditable="true"]{background:rgba(255,255,255,.05)}
</style>
</head>

<body>

<h1 id="title" contenteditable="false"></h1>

<p class="bw locked" id="description" contenteditable="false"></p>

<div class="top-bar">
  <div>
    <button id="loginBtn">Admin Login</button>
    <button id="logoutBtn" style="display:none;">Logout</button>
  </div>
  <div class="last-updated" id="lastUpdated"></div>
</div>

<table id="logTable" class="locked">
<thead>
<tr>
<th class="left">Lift</th>
<th>Current</th>
<th>1RM</th>
<th>Strength Level</th>
</tr>
</thead>
<tbody id="tableBody"></tbody>
</table>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

/* 🔥 FIREBASE CONFIG */
const firebaseConfig={
  apiKey:"AIzaSyBoePuKarSCVgvxQQBGvkMKq16DvKmBYBE",
  authDomain:"strenght-a9f37.firebaseapp.com",
  databaseURL:"https://strenght-a9f37-default-rtdb.firebaseio.com",
  projectId:"strenght-a9f37",
  storageBucket:"strenght-a9f37.firebasestorage.app",
  messagingSenderId:"469926449178",
  appId:"1:469926449178:web:b9623947a1c1865b0f81a3"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getDatabase(app);

/* DOM */
const body=document.body;
const title=document.getElementById("title");
const desc=document.getElementById("description");
const table=document.getElementById("logTable");
const tbody=document.getElementById("tableBody");
const lastUpdated=document.getElementById("lastUpdated");
const loginBtn=document.getElementById("loginBtn");
const logoutBtn=document.getElementById("logoutBtn");

let isAdmin=false;
let isTyping=false;
let dataLoaded=false;

/* 🔒 HARD LOCK EVERYTHING IMMEDIATELY */
lockAll();

/* 🔄 LOAD DATA FIRST — THEN SHOW PAGE */
onValue(ref(db,"content"),snap=>{
  if(!snap.exists()) return;
  if(isTyping) return;

  const d=snap.val();
  title.innerText=d.title;
  desc.innerHTML=d.desc;
  tbody.innerHTML=d.table;
  lastUpdated.textContent="Last updated: "+d.updated;

  if(!dataLoaded){
    dataLoaded=true;
    body.style.display="block"; // 👈 SHOW ONLY NOW
  }
});

/* 🔐 AUTH STATE */
onAuthStateChanged(auth,user=>{
  if(user) enableAdmin();
  else disableAdmin();
});

/* LOGIN */
loginBtn.onclick=()=>{
  const email=prompt("Admin email:");
  const pass=prompt("Password:");
  if(!email||!pass) return;
  signInWithEmailAndPassword(auth,email,pass)
    .catch(()=>alert("Login failed"));
};

/* LOGOUT */
logoutBtn.onclick=()=>signOut(auth);

/* FUNCTIONS */
function lockAll(){
  title.contentEditable="false";
  desc.contentEditable="false";
  table.classList.add("locked");
}

function enableAdmin(){
  isAdmin=true;
  table.classList.remove("locked");
  title.contentEditable="true";
  desc.contentEditable="true";
  desc.classList.remove("locked");

  loginBtn.style.display="none";
  logoutBtn.style.display="inline-block";

  document.querySelectorAll("td").forEach(td=>{
    td.contentEditable="true";
    td.oninput=save;
  });
  title.oninput=save;
  desc.oninput=save;
}

function disableAdmin(){
  isAdmin=false;
  lockAll();
  loginBtn.style.display="inline-block";
  logoutBtn.style.display="none";
}

function save(){
  if(!isAdmin) return;
  isTyping=true;

  const n=new Date();
  const f=`${String(n.getDate()).padStart(2,"0")}/${String(n.getMonth()+1).padStart(2,"0")}/${n.getFullYear()} · ${String(n.getHours()).padStart(2,"0")}:${String(n.getMinutes()).padStart(2,"0")}`;

  set(ref(db,"content"),{
    title:title.innerText,
    desc:desc.innerHTML,
    table:tbody.innerHTML,
    updated:f
  }).then(()=>isTyping=false);
}
</script>

</body>
</html>
