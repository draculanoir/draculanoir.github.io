<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Strength Log – 1RM Tracking</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
:root{
  --bg-main:#0a0c13;
  --bg-panel:rgba(22,26,42,.88);
  --bg-header:rgba(32,38,64,.95);
  --border:rgba(255,255,255,.08);
  --text:#eef0f6;
  --muted:#9aa1b3;
  --accent:#cfd6ff;
  --shadow:0 18px 40px rgba(0,0,0,.55);
}
*{ box-sizing:border-box; }
body{
  margin:0; padding:28px; font-family:"Inter",sans-serif;
  background: radial-gradient(1200px 600px at top,#1c2340,transparent 60%), var(--bg-main);
  color:var(--text);
}
.nav-bar { display: flex; gap: 15px; margin-bottom: 25px; }
.nav-btn { background: rgba(255,255,255,0.05); border: 1px solid var(--border); color: var(--accent); padding: 8px 16px; border-radius: 10px; text-decoration: none; font-weight: 500; }
.locked-content, .locked-content *{ pointer-events:none!important; user-select:none!important; }
h1{ margin:0 0 12px; font-size:2.2rem; }
#desc{ padding:18px; margin-bottom:26px; background:rgba(255,255,255,.04); border:1px solid var(--border); border-radius:18px; color:var(--muted); }
.top-bar{ display:flex; justify-content:space-between; align-items:center; margin-bottom:18px; }
#authBox{ display:flex; gap:10px; padding:14px; background:rgba(255,255,255,.05); border-radius:20px; }
#authBox input{ background:rgba(0,0,0,.25); border:1px solid var(--border); color:var(--accent); padding:10px; border-radius:12px; }
#authBox button{ background:linear-gradient(135deg,#3a43a0,#2a2f66); border:none; color:#fff; padding:10px 18px; border-radius:14px; cursor:pointer; }
table{ width:100%; border-collapse:collapse; background:var(--bg-panel); border-radius:22px; overflow:hidden; }
th,td{ padding:16px; text-align:center; border-bottom:1px solid var(--border); }
th{ background:var(--bg-header); color:var(--accent); font-size:.7rem; text-transform:uppercase; }
</style>
</head>
<body>

<div class="nav-bar">
  <a href="errahworld.html" class="nav-btn">🏋️ Log</a>
  <a href="updates.html" class="nav-btn">📢 Updates</a>
</div>

<h1 id="title"></h1>
<p id="desc"></p>

<div class="top-bar">
  <div id="authBox">
    <input id="email" placeholder="admin email">
    <input id="password" type="password" placeholder="password">
    <button id="loginBtn">Login</button>
    <button id="logoutBtn" style="display:none">Logout</button>
  </div>
  <div id="lastUpdated" class="last-updated"></div>
</div>

<table id="table" class="locked-content">
  <thead><tr><th style="text-align:left">Lift</th><th>Current</th><th>1RM</th><th>Strength Level</th></tr></thead>
  <tbody id="tbody"></tbody>
</table>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>
firebase.initializeApp({
  apiKey:"AIzaSyBoePuKarSCVgvxQQBGvkMKq16DvKmBYBE",
  authDomain:"strenght-a9f37.firebaseapp.com",
  databaseURL:"https://strenght-a9f37-default-rtdb.firebaseio.com",
  projectId:"strenght-a9f37",
  storageBucket:"strenght-a9f37.firebasestorage.app",
  messagingSenderId:"469926449178",
  appId:"1:469926449178:web:b9623947a1c1865b0f81a3"
});

const auth=firebase.auth();
const db=firebase.database();

// Keep login across pages
auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);

const emailEl=document.getElementById("email"), passEl=document.getElementById("password"),
      loginBtn=document.getElementById("loginBtn"), logoutBtn=document.getElementById("logoutBtn"),
      titleEl=document.getElementById("title"), descEl=document.getElementById("desc"),
      tbody=document.getElementById("tbody"), table=document.getElementById("table");

let isAdmin=false;

loginBtn.onclick=()=>auth.signInWithEmailAndPassword(emailEl.value,passEl.value).catch(e=>alert(e.message));
logoutBtn.onclick=()=>auth.signOut();

auth.onAuthStateChanged(user=>{
  isAdmin=!!user;
  table.classList.toggle("locked-content",!isAdmin);
  [titleEl,descEl,tbody].forEach(el=>el.contentEditable=isAdmin);
  loginBtn.style.display=user?"none":"inline-block";
  emailEl.style.display=user?"none":"inline-block";
  passEl.style.display=user?"none":"inline-block";
  logoutBtn.style.display=user?"inline-block":"none";
});

db.ref("log").on("value", snap=>{
  const d=snap.val()||{};
  titleEl.innerText=d.title||"Strength Log";
  descEl.innerHTML=d.desc||"Description here...";
  tbody.innerHTML=d.table||"";
});

function saveData(){
  if(!isAdmin) return;
  db.ref("log").set({
    title:titleEl.innerText,
    desc:descEl.innerHTML,
    table:tbody.innerHTML,
    updated: new Date().toLocaleString()
  });
}
["input","blur"].forEach(e=>{ titleEl.addEventListener(e,saveData); descEl.addEventListener(e,saveData); tbody.addEventListener(e,saveData); });
</script>
</body>
</html>
