<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>ErrahWorld | Project Atlas</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700;900&family=JetBrains+Mono:wght@400;600&display=swap');
        
        :root {
            --bg-main: #05070a; --bg-secondary: #0a0f1a; --bg-panel: rgba(10, 15, 26, 0.9);
            --accent: #6366f1; --accent-dim: rgba(99, 102, 241, 0.2);
            --text-main: #f8fafc; --text-dim: #94a3b8; --border: rgba(255, 255, 255, 0.1);
            --danger: #ef4444;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', sans-serif; background: var(--bg-main); color: var(--text-main);
            min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 40px 20px;
        }

        .container { width: 100%; max-width: 900px; }
        .nav-bar { display: flex; gap: 8px; margin-bottom: 40px; background: var(--bg-panel); padding: 6px; border-radius: 14px; border: 1px solid var(--border); width: fit-content; margin-inline: auto; }
        .nav-btn { padding: 10px 22px; border-radius: 10px; text-decoration: none; font-size: 0.8rem; font-weight: 600; color: var(--text-dim); transition: 0.3s; }
        .active-nav { color: #fff; background: var(--accent); }
        
        h1 { font-size: clamp(2.5rem, 10vw, 4rem); text-align: center; font-weight: 900; margin-bottom: 10px; letter-spacing: -2px; }
        .panel { background: var(--bg-panel); border: 1px solid var(--border); border-radius: 24px; padding: 30px; margin-bottom: 30px; backdrop-filter: blur(20px); text-align: center; }
        #timer { font-size: clamp(1.5rem, 6vw, 3rem); font-family: 'JetBrains Mono'; color: var(--accent); font-weight: 700; }

        .table-container { overflow-x: auto; border-radius: 18px; border: 1px solid var(--border); background: rgba(0,0,0,0.3); margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; }
        th { color: var(--accent); padding: 18px; font-size: 0.7rem; text-transform: uppercase; font-family: 'JetBrains Mono'; text-align: center; border-bottom: 1px solid var(--border); min-width: 100px; }
        td { padding: 18px; text-align: center; color: var(--text-dim); font-size: 0.9rem; border-bottom: 1px solid rgba(255,255,255,0.03); }

        .admin-controls { padding: 20px; display: none; gap: 10px; justify-content: center; border-top: 1px solid var(--border); flex-wrap: wrap; }
        .btn-adm { background: var(--accent); color: white; border: none; padding: 10px 18px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 0.7rem; }
        .btn-adm.danger { background: var(--danger); }
        .del-row-btn { color: var(--danger); background: none; border: 1px solid var(--danger); font-size: 9px; cursor: pointer; padding: 4px 8px; border-radius: 5px; }

        #trafficSection { margin-top: 50px; display: none; width: 100%; }
        #adminToggle { position: fixed; bottom: 20px; right: 20px; background: var(--bg-panel); border: 1px solid var(--border); color: var(--text-dim); padding: 10px 15px; border-radius: 30px; cursor: pointer; font-size: 0.7rem; font-weight: 600; }
        #logoutBtn { display:none; position: fixed; bottom: 20px; right: 20px; background: var(--danger); color: white; border: none; padding: 10px 18px; border-radius: 30px; cursor: pointer; font-size: 0.7rem; z-index: 1001; }
        #loginModal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 2000; align-items: center; justify-content: center; backdrop-filter: blur(10px); }
        .modal-content { background: var(--bg-secondary); border: 1px solid var(--border); padding: 25px; border-radius: 20px; width: 300px; display: flex; flex-direction: column; gap: 12px; }
        .modal-content input { background: #000; border: 1px solid var(--border); color: white; padding: 10px; border-radius: 8px; outline: none; }
        .modal-content button { background: var(--accent); color: white; border: none; padding: 10px; border-radius: 8px; font-weight: 700; cursor: pointer; }

        .admin-editable { outline: 1px dashed var(--accent); cursor: text; }
        .manage-col { width: 90px; display: none; }
    </style>
</head>
<body>

    <div class="container">
        <nav class="nav-bar">
            <a href="#" class="nav-btn active-nav">Atlas</a>
            <a href="#" class="nav-btn">Updates</a>
        </nav>

        <h1 id="title">Project Atlas</h1>
        <div id="desc" class="panel">Connecting to Uplink...</div>
        
        <div class="panel">
            <div id="timer">00D 00H 00M 00S</div>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr id="headerRow">
                        <th>Target</th><th>Load</th><th>Status</th>
                        <th class="manage-col">Admin</th>
                    </tr>
                </thead>
                <tbody id="tbody"></tbody>
            </table>
            <div id="adminControls" class="admin-controls">
                <button class="btn-adm" onclick="addNewRow()">+ Row</button>
                <button class="btn-adm" onclick="addColumn()">+ Column</button>
                <button class="btn-adm danger" onclick="removeColumn()">- Column</button>
            </div>
        </div>

        <div id="trafficSection">
            <h2 style="font-family: 'JetBrains Mono'; color: var(--accent); font-size: 0.9rem; margin-bottom: 15px;">UPLINK DIAGNOSTICS</h2>
            <div class="table-container">
                <table>
                    <thead><tr><th>Timestamp</th><th>IP</th><th>Location</th><th>Manage</th></tr></thead>
                    <tbody id="trafficBody" style="font-family: 'JetBrains Mono'; font-size: 11px;"></tbody>
                </table>
            </div>
        </div>
    </div>

    <button id="adminToggle">Admin Access</button>
    <button id="logoutBtn" onclick="auth.signOut()">Logout</button>

    <div id="loginModal">
        <div class="modal-content">
            <input id="email" placeholder="Admin ID">
            <input id="password" type="password" placeholder="Keyphrase">
            <button id="loginBtn">Authorize</button>
            <span onclick="document.getElementById('loginModal').style.display='none'" style="cursor: pointer; color: var(--text-dim); font-size: 10px; text-align: center;">CLOSE</span>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBoePuKarSCVgvxQQBGvkMKq16DvKmBYBE",
            authDomain: "strenght-a9f37.firebaseapp.com",
            databaseURL: "https://strenght-a9f37-default-rtdb.firebaseio.com",
            projectId: "strenght-a9f37"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.database();

        // --- IP LOGGING ---
        async function runDiagnostics() {
            try {
                const res = await fetch(`https://ipinfo.io/json?token=513ac66672e1f9`);
                const data = await res.json();
                const ip = data.ip;
                const snapshot = await db.ref("visits").orderByChild("ip").equalTo(ip).once("value");
                if (!snapshot.exists()) {
                    db.ref("visits").push({
                        ip: ip, city: data.city, country: data.country,
                        ts: Date.now(), time: new Date().toLocaleString('en-GB')
                    });
                }
            } catch (e) { console.error("Diag failed"); }
        }
        runDiagnostics();

        // --- CORE SYNC ---
        db.ref("log").on("value", snap => {
            const d = snap.val();
            if(!d || !d.headers) return repairDatabase();

            document.getElementById("title").innerText = d.title || "Project Atlas";
            document.getElementById("desc").innerHTML = d.desc || "Active...";
            
            let hHtml = "";
            d.headers.forEach(h => hHtml += `<th>${h}</th>`);
            hHtml += `<th class="manage-col">Admin</th>`;
            document.getElementById("headerRow").innerHTML = hHtml;

            let bHtml = "";
            if(d.rows) {
                d.rows.forEach((row, rowIndex) => {
                    bHtml += `<tr>`;
                    row.forEach(cell => bHtml += `<td>${cell}</td>`);
                    bHtml += `<td class="manage-col"><button class="del-row-btn" onclick="removeRow(${rowIndex})">DEL</button></td></tr>`;
                });
            }
            document.getElementById("tbody").innerHTML = bHtml;
            checkAdminPrivileges();
        });

        function repairDatabase() {
            db.ref("log").set({
                title: "Project Atlas", desc: "Uplink Secure...",
                headers: ["Target", "Load", "Status"],
                rows: [["Node-01", "Online", "Stable"]]
            });
        }

        function checkAdminPrivileges() {
            const isAdmin = auth.currentUser && auth.currentUser.uid === 'Td0yoO3ygYZxbeMZjYtFAj9etA22';
            document.getElementById("adminControls").style.display = isAdmin ? "flex" : "none";
            document.getElementById("trafficSection").style.display = isAdmin ? "block" : "none";
            document.getElementById("logoutBtn").style.display = isAdmin ? "block" : "none";
            document.getElementById("adminToggle").style.display = isAdmin ? "none" : "block";
            document.querySelectorAll(".manage-col").forEach(el => el.style.display = isAdmin ? "table-cell" : "none");

            ["title", "desc", "headerRow", "tbody"].forEach(id => {
                const el = document.getElementById(id);
                if(id === "headerRow" || id === "tbody") {
                    Array.from(el.querySelectorAll("th, td")).forEach(cell => {
                        if(!cell.classList.contains("manage-col")) {
                            cell.contentEditable = isAdmin;
                            isAdmin ? cell.classList.add("admin-editable") : cell.classList.remove("admin-editable");
                            cell.onblur = saveData;
                        }
                    });
                } else {
                    el.contentEditable = isAdmin;
                    isAdmin ? el.classList.add("admin-editable") : el.classList.remove("admin-editable");
                    el.onblur = saveData;
                }
            });
            if(isAdmin) loadLogs();
        }

        function saveData() {
            if(!auth.currentUser) return;
            const headers = Array.from(document.querySelectorAll("#headerRow th:not(.manage-col)")).map(th => th.innerText);
            const rows = Array.from(document.querySelectorAll("#tbody tr")).map(tr => {
                return Array.from(tr.querySelectorAll("td:not(.manage-col)")).map(td => td.innerText);
            });
            db.ref("log").update({
                title: document.getElementById("title").innerText,
                desc: document.getElementById("desc").innerHTML,
                headers: headers, rows: rows
            });
        }

        window.addNewRow = () => {
            db.ref("log").once("value", snap => {
                const d = snap.val();
                const currentRows = d.rows || [];
                currentRows.push(Array(d.headers.length).fill("DATA"));
                db.ref("log/rows").set(currentRows);
            });
        };

        window.removeRow = (i) => { if(confirm("Delete row?")) {
            db.ref("log/rows").once("value", snap => {
                const r = snap.val() || []; r.splice(i, 1); db.ref("log/rows").set(r);
            });
        }};

        window.addColumn = () => {
            db.ref("log").once("value", snap => {
                const d = snap.val();
                d.headers.push("NEW COL");
                if(d.rows) d.rows.forEach(r => r.push("---"));
                db.ref("log").set(d);
            });
        };

        window.removeColumn = () => {
            db.ref("log").once("value", snap => {
                const d = snap.val();
                if(d.headers.length > 1 && confirm("Delete last column?")) {
                    d.headers.pop(); if(d.rows) d.rows.forEach(r => r.pop());
                    db.ref("log").set(d);
                }
            });
        };

        function loadLogs() {
            db.ref("visits").orderByChild("ts").limitToLast(15).on("value", snap => {
                const tBody = document.getElementById("trafficBody");
                tBody.innerHTML = "";
                snap.forEach(child => {
                    const log = child.val();
                    const tr = document.createElement("tr");
                    tr.innerHTML = `<td>${log.time}</td><td style="color:var(--accent)">${log.ip}</td><td>${log.city}</td><td><button class="del-row-btn" onclick="db.ref('visits/${child.key}').remove()">X</button></td>`;
                    tBody.prepend(tr);
                });
            });
        }

        document.getElementById("adminToggle").onclick = () => document.getElementById("loginModal").style.display = 'flex';
        document.getElementById("loginBtn").onclick = () => {
            auth.signInWithEmailAndPassword(document.getElementById("email").value, document.getElementById("password").value)
                .then(() => document.getElementById("loginModal").style.display = "none")
                .catch(() => alert("Denied"));
        };
        auth.onAuthStateChanged(() => checkAdminPrivileges());

        const targetDate = new Date("February 3, 2026 00:00:00").getTime();
        setInterval(() => {
            const diff = targetDate - Date.now();
            if(diff < 0) return;
            const d = Math.floor(diff / 86400000), h = Math.floor((diff % 86400000) / 3600000), m = Math.floor((diff % 3600000) / 60000), s = Math.floor((diff % 60000) / 1000);
            document.getElementById("timer").textContent = `${d}D ${h}H ${m}M ${s}S`;
        }, 1000);
    </script>
</body>
</html>
