<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>ErrahWorld | AI Strength Log</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;600&display=swap');
        
        :root {
            --bg-main: #0a0e1a;
            --bg-secondary: #0f1423;
            --bg-panel: rgba(15, 20, 35, 0.85);
            --accent-primary: #6366f1;
            --accent-secondary: #8b5cf6;
            --accent-glow: rgba(99, 102, 241, 0.35);
            --text-primary: #f8fafc;
            --text-secondary: #cbd5e1;
            --text-muted: #64748b;
            --border-subtle: rgba(148, 163, 184, 0.1);
            --border-glass: rgba(255, 255, 255, 0.12);
            --success: #10b981;
            --warning: #f59e0b;
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.12);
            --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.2);
            --shadow-lg: 0 20px 60px rgba(0, 0, 0, 0.35);
            --shadow-xl: 0 30px 90px rgba(0, 0, 0, 0.5);
        }

        /* Premium Animations */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); filter: blur(8px); }
            to { opacity: 1; transform: translateY(0); filter: blur(0); }
        }

        @keyframes slideInLeft {
            from { opacity: 0; transform: translateX(-30px); }
            to { opacity: 1; transform: translateX(0); }
        }

        @keyframes scanline {
            0% { transform: translateY(-100%); opacity: 0; }
            50% { opacity: 1; }
            100% { transform: translateY(200%); opacity: 0; }
        }

        @keyframes pulseGlow {
            0%, 100% { opacity: 0.6; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.02); }
        }

        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        @keyframes gradientShift {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        /* Base Styles */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, var(--bg-main) 0%, var(--bg-secondary) 100%);
            background-attachment: fixed;
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
            display: flex; 
            flex-direction: column; 
            align-items: center;
            padding: 40px 20px;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }

        #bg-canvas {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1; opacity: 0.25; pointer-events: none; filter: blur(1px);
        }

        body::before {
            content: ""; position: fixed; top: -50%; right: -50%; width: 100%; height: 100%;
            background: radial-gradient(circle, var(--accent-glow) 0%, transparent 70%);
            opacity: 0.15; animation: float 20s ease-in-out infinite; z-index: -1;
        }

        .container {
            width: 100%; max-width: 920px; margin: 0 auto;
            animation: fadeInUp 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            position: relative; z-index: 1;
        }

        /* Navigation */
        .nav-bar { 
            display: flex; gap: 6px; margin-bottom: 50px; background: var(--bg-panel);
            padding: 8px; border-radius: 20px; border: 1px solid var(--border-glass);
            width: fit-content; margin-inline: auto; backdrop-filter: blur(24px) saturate(180%);
            box-shadow: var(--shadow-lg); animation: slideInLeft 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .nav-btn { 
            padding: 12px 28px; border-radius: 16px; text-decoration: none; font-size: 0.875rem; 
            font-weight: 600; color: var(--text-secondary); position: relative; transition: all 0.3s;
        }

        .active-nav { color: #ffffff; font-weight: 700; background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary)); }

        /* Banner */
        .last-updated-banner { 
            font-size: 0.7rem; font-weight: 800; color: var(--accent-primary); 
            text-align: center; margin-bottom: 16px; letter-spacing: 2px;
            text-transform: uppercase; font-family: 'JetBrains Mono', monospace;
            text-shadow: 0 0 20px var(--accent-glow);
        }

        h1 { 
            margin: 0 0 20px; font-size: clamp(3rem, 12vw, 4.5rem); text-align: center; font-weight: 900; 
            background: linear-gradient(135deg, #ffffff 0%, var(--accent-primary) 50%, var(--accent-secondary) 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            letter-spacing: -0.04em; animation: gradientShift 8s ease infinite; background-size: 200% auto;
        }

        #desc { 
            padding: 32px 40px; margin-bottom: 48px; border-radius: 28px; background: var(--bg-panel);
            border: 1px solid var(--border-glass); text-align: center; backdrop-filter: blur(32px);
            box-shadow: var(--shadow-lg); font-size: 1.05rem; position: relative; overflow: hidden;
        }

        /* Countdown */
        .countdown {
            margin-bottom: 48px; padding: 40px; 
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.1) 0%, rgba(139, 92, 246, 0.05) 100%);
            border-radius: 32px; border: 1px solid var(--border-glass); display: flex; 
            flex-direction: column; align-items: center; gap: 20px;
        }

        #timer { 
            font-size: clamp(2rem, 8vw, 3.5rem); font-weight: 900; 
            background: linear-gradient(135deg, var(--text-primary), var(--accent-primary));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            font-family: 'JetBrains Mono', monospace;
        }

        /* Auth Box */
        #authBox { display: flex; gap: 12px; margin-bottom: 48px; justify-content: center; flex-wrap: wrap; }
        input { 
            background: rgba(15, 20, 35, 0.7); border: 1px solid var(--border-subtle);
            color: var(--text-primary); padding: 16px 24px; border-radius: 16px; outline: none;
        }
        button { 
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            border: none; color: #ffffff; padding: 16px 32px; border-radius: 16px; font-weight: 700;
            cursor: pointer; transition: 0.3s;
        }

        /* Table - VISIBLE TO EVERYONE */
        .table-container { 
            overflow: hidden; border-radius: 32px; border: 1px solid var(--border-glass);
            box-shadow: var(--shadow-xl); background: var(--bg-panel); backdrop-filter: blur(32px);
        }

        table { width: 100%; border-collapse: collapse; }
        th { 
            color: var(--accent-primary); padding: 24px 28px; font-size: 0.75rem; 
            font-weight: 800; text-transform: uppercase; font-family: 'JetBrains Mono', monospace;
        }
        td { padding: 24px 28px; text-align: center; color: var(--text-secondary); border-bottom: 1px solid var(--border-subtle); }
        td:first-child { text-align: left; color: var(--text-primary); font-weight: 600; }

        /* Interaction Control */
        .locked-content {
            filter: none !important; /* Forces visibility */
            pointer-events: none;    /* Prevents clicking/editing by guests */
            user-select: text;       /* Allows copying text */
        }

        .admin-editable {
            outline: 1px dashed var(--accent-primary);
            cursor: text !important;
            pointer-events: auto !important;
        }

        @media (max-width: 768px) {
            .nav-bar { padding: 6px; }
            .nav-btn { padding: 10px 20px; font-size: 0.8rem; }
            .table-container { overflow-x: auto; }
        }
    </style>
</head>
<body>

    <canvas id="bg-canvas"></canvas>

    <div class="container">
        <nav class="nav-bar">
            <a href="#" class="nav-btn active-nav"><span>Project Atlas</span></a>
            <a href="#" class="nav-btn"><span>Updates</span></a>
        </nav>

        <div id="lastUpdateBanner" class="last-updated-banner">ESTABLISHING NEURAL LINK...</div>

        <h1 id="title">Syncing</h1>
        <div id="desc">Decrypting strength data from secure servers...</div>

        <div class="countdown">
            <strong>NEXT RM CYCLE</strong>
            <div id="timer">00D 00H 00M 00S</div>
        </div>

        <div id="authBox">
            <input id="email" placeholder="Admin ID" type="email">
            <input id="password" type="password" placeholder="Keyphrase">
            <button id="loginBtn">Login</button>
            <button id="logoutBtn" style="display:none; background: #ef4444;">Logout</button>
        </div>

        <div class="table-container">
            <table id="table" class="locked-content">
                <thead>
                    <tr>
                        <th style="text-align:left">Exercise</th>
                        <th>Current</th>
                        <th>1RM</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="tbody">
                    <tr><td colspan="4" style="height: 80px; opacity: 0.5;">INITIALIZING DATABASE...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <script>
        // BACKGROUND ANIMATION
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        let dots = [];
        function initCanvas() {
            canvas.width = window.innerWidth; canvas.height = window.innerHeight;
            dots = [];
            for(let i = 0; i < 60; i++) {
                dots.push({ x: Math.random() * canvas.width, y: Math.random() * canvas.height, vx: (Math.random() - 0.5) * 0.5, vy: (Math.random() - 0.5) * 0.5, radius: 1.5 });
            }
        }
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            dots.forEach((dot, i) => {
                dot.x += dot.vx; dot.y += dot.vy;
                if(dot.x < 0 || dot.x > canvas.width) dot.vx *= -1;
                if(dot.y < 0 || dot.y > canvas.height) dot.vy *= -1;
                ctx.fillStyle = 'rgba(99, 102, 241, 0.5)';
                ctx.beginPath(); ctx.arc(dot.x, dot.y, dot.radius, 0, Math.PI * 2); ctx.fill();
            });
            requestAnimationFrame(draw);
        }
        window.addEventListener('resize', initCanvas);
        initCanvas(); draw();

        // FIREBASE
        firebase.initializeApp({
            apiKey: "AIzaSyBoePuKarSCVgvxQQBGvkMKq16DvKmBYBE",
            authDomain: "strenght-a9f37.firebaseapp.com",
            databaseURL: "https://strenght-a9f37-default-rtdb.firebaseio.com",
            projectId: "strenght-a9f37",
            storageBucket: "strenght-a9f37.firebasestorage.app",
            messagingSenderId: "469926449178",
            appId: "1:469926449178:web:b9623947a1c1865b0f81a3"
        });

        const auth = firebase.auth();
        const db = firebase.database();
        const titleEl = document.getElementById("title");
        const descEl = document.getElementById("desc");
        const tbody = document.getElementById("tbody");
        const updateBanner = document.getElementById("lastUpdateBanner");

        // DATA SYNC
        db.ref("log").on("value", snap => {
            const d = snap.val() || {};
            titleEl.innerText = d.title || "Strength Log";
            descEl.innerHTML = d.desc || "Neural link active...";
            tbody.innerHTML = d.table || "<tr><td colspan='4'>No data available</td></tr>";
        });

        db.ref("meta/lastUpdate").on("value", snap => {
            updateBanner.innerText = "SYSTEM ACTIVE // LAST SYNC: " + (snap.val() || "UNKNOWN");
        });

        // AUTH & PERMISSIONS
        let isAdmin = false;
        auth.onAuthStateChanged(user => {
            isAdmin = !!user;
            const tableEl = document.getElementById("table");
            
            // Toggle interaction classes
            tableEl.classList.toggle("locked-content", !isAdmin);
            [titleEl, descEl, tbody].forEach(el => {
                el.contentEditable = isAdmin;
                if(isAdmin) el.classList.add("admin-editable");
                else el.classList.remove("admin-editable");
            });

            document.getElementById("email").style.display = user ? "none" : "inline-block";
            document.getElementById("password").style.display = user ? "none" : "inline-block";
            document.getElementById("loginBtn").style.display = user ? "none" : "inline-block";
            document.getElementById("logoutBtn").style.display = user ? "inline-block" : "none";
        });

        document.getElementById("loginBtn").onclick = () => {
            auth.signInWithEmailAndPassword(document.getElementById("email").value, document.getElementById("password").value)
                .catch(e => alert("Access Denied"));
        };
        document.getElementById("logoutBtn").onclick = () => auth.signOut();

        // SAVE DATA WITH FULL TIME FORMAT
        function saveData() {
            if(!isAdmin) return;
            const now = new Date();
            
            // Format: 11 January 2026 @ 9:10 AM
            const dateStr = now.toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' });
            const timeStr = now.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', hour12: true });
            const fullStamp = `${dateStr} @ ${timeStr}`;

            db.ref("log").set({ 
                title: titleEl.innerText, 
                desc: descEl.innerHTML, 
                table: tbody.innerHTML 
            });
            db.ref("meta/lastUpdate").set(fullStamp);
        }

        [titleEl, descEl, tbody].forEach(el => {
            el.addEventListener("blur", saveData);
        });

        // COUNTDOWN
        const targetDate = new Date("February 3, 2026 00:00:00").getTime();
        setInterval(() => {
            const diff = targetDate - Date.now();
            if(diff <= 0) { document.getElementById("timer").innerText = "LIMIT BREAKER 🔥"; return; }
            const d = Math.floor(diff / 86400000), h = Math.floor((diff % 86400000) / 3600000), 
                  m = Math.floor((diff % 3600000) / 60000), s = Math.floor((diff % 60000) / 1000);
            document.getElementById("timer").textContent = `${String(d).padStart(2,'0')}D ${String(h).padStart(2,'0')}H ${String(m).padStart(2,'0')}M ${String(s).padStart(2,'0')}S`;
        }, 1000);

    </script>
</body>
</html>
