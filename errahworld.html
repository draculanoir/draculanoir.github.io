<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Strength Log – 1RM Tracking</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />

<style>
:root{
  --bg-main:#0c0e12;
  --bg-panel:#14161c;
  --bg-header:#1b1e26;
  --border:#2a2d36;
  --text:#d9dbe1;
  --muted:#9da1ac;
  --accent:#bfc6d6;
}

body{
  visibility:hidden;
  font-family:"Segoe UI", Arial, sans-serif;
  background:radial-gradient(circle at top,#12141b,var(--bg-main));
  color:var(--text);
  padding:24px;
}

/* 🔒 VIEWER LOCK */
.locked-content,
.locked-content *{
  pointer-events:none !important;
  user-select:none !important;
  caret-color:transparent !important;
}

*:focus{
  outline:none !important;
}

.top-bar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  max-width:1020px;
  margin-bottom:12px;
}

#authBox input,
#authBox button{
  background:transparent;
  border:1px solid var(--border);
  color:var(--accent);
  padding:6px 10px;
  border-radius:6px;
}

table{
  width:100%;
  max-width:1020px;
  border-collapse:collapse;
  background:var(--bg-panel);
  box-shadow:0 0 0 1px var(--border);
}

th, td{
  border:1px solid var(--border);
  padding:10px;
  text-align:center;
}

th{
  background:var(--bg-header);
  font-size:.75rem;
}

/* 🏋️ BARBELL */
.calculator{
  max-width:1020px;
  margin:24px 0;
  background:var(--bg-panel);
  padding:16px;
  border:1px solid var(--border);
  border-radius:10px;
}

.calc-controls input{
  background:transparent;
  border:1px solid var(--border);
  color:var(--text);
  padding:6px;
  width:120px;
  border-radius:6px;
}

.calc-controls button{
  padding:6px 12px;
  border:1px solid var(--border);
  background:transparent;
  color:var(--accent);
  border-radius:6px;
  cursor:pointer;
}

.barbell{
  display:flex;
  align-items:center;
  justify-content:center;
  margin-top:16px;
}

.side{
  display:flex;
  align-items:center;
}

.bar{
  width:140px;
  height:8px;
  background:#777;
  border-radius:4px;
  margin:0 10px;
}

.plate{
  height:70px;
  margin:0 2px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:.7rem;
  font-weight:600;
  color:#000;
  background:#ccc;
}

.p45{ width:42px }
.p35{ width:38px }
.p25{ width:34px }
.p10{ width:28px }
.p5{ width:24px }
.p2_5{ width:20px }

/* 🔇 remove number arrows */
input[type=number]::-webkit-inner-spin-button,
input[type=number]::-webkit-outer-spin-button{
  -webkit-appearance:none;
}
input[type=number]{ -moz-appearance:textfield }
</style>
</head>

<body>

<h1 id="title"></h1>
<p id="desc"></p>

<div class="top-bar">
  <div id="authBox">
    <input id="email" placeholder="admin email">
    <input id="password" type="password" placeholder="password">
    <button id="loginBtn">Login</button>
    <button id="logoutBtn" style="display:none">Logout</button>
  </div>
  <div id="lastUpdated"></div>
</div>

<table id="table" class="locked-content">
<thead>
<tr>
<th>Lift</th><th>Current</th><th>1RM</th><th>Level</th>
</tr>
</thead>
<tbody id="tbody"></tbody>
</table>

<!-- 🏋️ CALCULATOR -->
<div class="calculator" id="calculator">
  <div class="calc-controls">
    <input id="targetWeight" type="number" placeholder="Target lbs">
    <label>
      <input type="checkbox" id="includeBar" checked> Include bar (45)
    </label>
    <button id="calcBtn">Calculate</button>
    <span id="roundNote"></span>
  </div>

  <div class="barbell">
    <div id="leftSide" class="side"></div>
    <div class="bar"></div>
    <div id="rightSide" class="side"></div>
  </div>
</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>
firebase.initializeApp({
  apiKey: "AIzaSyBoePuKarSCVgvxQQBGvkMKq16DvKmBYBE",
  authDomain: "strenght-a9f37.firebaseapp.com",
  databaseURL: "https://strenght-a9f37-default-rtdb.firebaseio.com",
  projectId: "strenght-a9f37"
});

const auth=firebase.auth(), db=firebase.database();
const titleEl=title=document.getElementById("title"),
descEl=document.getElementById("desc"),
tbody=document.getElementById("tbody"),
table=document.getElementById("table");

const emailEl=document.getElementById("email"),
passEl=document.getElementById("password"),
loginBtn=document.getElementById("loginBtn"),
logoutBtn=document.getElementById("logoutBtn");

let isAdmin=false;

/* viewer shield */
document.addEventListener("click",e=>{
  if(isAdmin) return;
  if(e.target.closest("#authBox")||e.target.closest("#calculator")) return;
  e.preventDefault();e.stopPropagation();
},true);

function lockAll(){
  isAdmin=false;
  table.classList.add("locked-content");
}

function enableEdit(){
  isAdmin=true;
  table.classList.remove("locked-content");
}

loginBtn.onclick=()=>auth.signInWithEmailAndPassword(emailEl.value,passEl.value)
.catch(e=>alert(e.message));
logoutBtn.onclick=()=>auth.signOut();

auth.onAuthStateChanged(u=>{
  if(u){enableEdit();loginBtn.style.display="none";logoutBtn.style.display="inline"}
  else{lockAll();loginBtn.style.display="inline";logoutBtn.style.display="none"}
});

/* 🏋️ CALC */
document.getElementById("calcBtn").onclick=()=>{
  const plates=[45,35,25,10,5,2.5];
  const left=document.getElementById("leftSide"),
        right=document.getElementById("rightSide"),
        note=document.getElementById("roundNote");

  left.innerHTML=right.innerHTML=note.innerText="";

  let target=Number(document.getElementById("targetWeight").value);
  if(!target) return;

  if(document.getElementById("includeBar").checked) target-=45;
  let remaining=target/2, used=[];

  plates.forEach(p=>{
    while(remaining>=p){
      remaining-=p;
      used.push(p);
    }
  });

  if(remaining>0) note.innerText="Rounded down.";

  used.forEach(p=>{
    const cls=p===2.5?"p2_5":"p"+p;
    right.innerHTML+=`<div class="plate ${cls}">${p}</div>`;
  });

  [...used].reverse().forEach(p=>{
    const cls=p===2.5?"p2_5":"p"+p;
    left.innerHTML+=`<div class="plate ${cls}">${p}</div>`;
  });
};

document.body.style.visibility="visible";
</script>

</body>
</html>
