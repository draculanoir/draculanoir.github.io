<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>ErrahWorld | AI Strength Log</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;600&display=swap');
        :root {
            --bg-main: #0a0e1a; --bg-secondary: #0f1423; --bg-panel: rgba(15, 20, 35, 0.85);
            --accent-primary: #6366f1; --accent-secondary: #8b5cf6; --accent-glow: rgba(99, 102, 241, 0.35);
            --text-primary: #f8fafc; --text-secondary: #cbd5e1; --border-glass: rgba(255, 255, 255, 0.12);
            --danger: #ef4444;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', sans-serif; background: linear-gradient(135deg, var(--bg-main) 0%, var(--bg-secondary) 100%);
            background-attachment: fixed; color: var(--text-primary); min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 40px 20px;
        }
        .container { width: 100%; max-width: 920px; }
        .visitor-counter { font-family: 'JetBrains Mono'; font-size: 0.75rem; color: var(--accent-secondary); text-align: center; margin-bottom: 10px; letter-spacing: 2px; font-weight: 600; }
        .nav-bar { display: flex; gap: 6px; margin-bottom: 50px; background: var(--bg-panel); padding: 8px; border-radius: 20px; border: 1px solid var(--border-glass); width: fit-content; margin-inline: auto; backdrop-filter: blur(24px); }
        .nav-btn { padding: 12px 28px; border-radius: 16px; text-decoration: none; font-size: 0.875rem; font-weight: 600; color: var(--text-secondary); transition: 0.3s; }
        .active-nav { color: #ffffff; background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary)); }
        h1 { margin: 0 0 20px; font-size: clamp(3rem, 12vw, 4.5rem); text-align: center; font-weight: 900; color: white; }
        .panel { background: var(--bg-panel); border: 1px solid var(--border-glass); border-radius: 32px; padding: 40px; margin-bottom: 48px; backdrop-filter: blur(32px); }
        #timer { font-size: clamp(2rem, 8vw, 3.5rem); font-weight: 900; font-family: 'JetBrains Mono'; text-align: center; color: var(--accent-primary); }
        .table-container { overflow-x: auto; border-radius: 24px; border: 1px solid var(--border-glass); background: rgba(0,0,0,0.2); }
        table { width: 100%; border-collapse: collapse; }
        th { color: var(--accent-primary); padding: 20px; font-size: 0.75rem; text-transform: uppercase; font-family: 'JetBrains Mono'; }
        td { padding: 20px; text-align: center; color: var(--text-secondary); border-bottom: 1px solid rgba(255,255,255,0.05); }
        #trafficSection { margin-top: 60px; display: none; width: 100%; }
        .log-row { cursor: pointer; transition: background 0.2s; }
        .log-row:hover { background: rgba(255,255,255,0.05); }
        .purge-btn { background: rgba(239, 68, 68, 0.1); border: 1px solid var(--danger); color: var(--danger); padding: 8px 16px; border-radius: 8px; font-size: 0.7rem; font-weight: 700; cursor: pointer; }
        #authBox { display: flex; gap: 10px; margin-top: 40px; justify-content: center; flex-wrap: wrap; }
        input { background: rgba(0,0,0,0.3); border: 1px solid var(--border-glass); color: #fff; padding: 12px; border-radius: 12px; outline: none; }
        button { background: var(--accent-primary); color: white; border: none; padding: 12px 24px; border-radius: 12px; cursor: pointer; font-weight: 700; }
        .admin-editable { outline: 1px dashed var(--accent-primary); cursor: text; }
    </style>
</head>
<body>

    <div class="container">
        <div class="visitor-counter">UNIQUE UPLINKS: <span id="v-count">SYNCING...</span></div>
        <nav class="nav-bar">
            <a href="errahworld.html" class="nav-btn active-nav">Project Atlas</a>
            <a href="updates.html" class="nav-btn">Updates</a>
        </nav>
        <h1 id="title">Project Atlas</h1>
        <div id="desc" class="panel" style="text-align: center;">Neural link active...</div>
        <div class="panel">
            <div style="text-align: center; font-weight: 800; letter-spacing: 2px; margin-bottom: 10px; font-size: 0.8rem; color: var(--accent-primary);">NEXT RM CYCLE</div>
            <div id="timer">00D 00H 00M 00S</div>
        </div>
        <div class="table-container">
            <table>
                <thead><tr><th style="text-align:left">Exercise</th><th>Current</th><th>1RM</th><th>Status</th></tr></thead>
                <tbody id="tbody"></tbody>
            </table>
        </div>
        <div id="trafficSection">
            <div style="display:flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h2 style="font-family: 'JetBrains Mono'; color: var(--accent-primary); font-size: 1.2rem;">ACCESS LOGS (UNIQUE)</h2>
                <button class="purge-btn" id="purgeBtn">PURGE ALL</button>
            </div>
            <div class="table-container">
                <table>
                    <thead><tr style="background: rgba(255,255,255,0.05);"><th>First Access</th><th>IP Address</th><th>Location</th></tr></thead>
                    <tbody id="trafficBody" style="font-family: 'JetBrains Mono'; font-size: 12px;"></tbody>
                </table>
            </div>
        </div>
        <div id="authBox">
            <input id="email" placeholder="Admin ID">
            <input id="password" type="password" placeholder="Keyphrase">
            <button id="loginBtn">Login</button>
            <button id="logoutBtn" style="display:none; background:#ef4444;">Logout</button>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBoePuKarSCVgvxQQBGvkMKq16DvKmBYBE",
            authDomain: "strenght-a9f37.firebaseapp.com",
            databaseURL: "https://strenght-a9f37-default-rtdb.firebaseio.com",
            projectId: "strenght-a9f37"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.database();

        // 1. ADVANCED DEVICE & UNIQUE TRACKING
        function getDetailedModel() {
            const ua = navigator.userAgent;
            let model = "Unknown Device";
            if (/iPhone/.test(ua)) model = "iPhone";
            else if (/iPad/.test(ua)) model = "iPad";
            else if (/Android/.test(ua)) {
                const match = ua.match(/Android\s([^\s;]+);\s([^\s;]+)/);
                model = match ? `Android (${match[2]})` : "Android Device";
            } else if (/Windows NT 10.0/.test(ua)) model = "Windows 10/11 PC";
            else if (/Macintosh/.test(ua)) model = "MacBook/iMac";
            return model;
        }

        async function trackVisitor() {
            // Live Unique Counter
            db.ref("visits").on("value", snap => { 
                document.getElementById("v-count").innerText = snap.numChildren(); 
            });

            try {
                const res = await fetch(`https://ipinfo.io/json?token=513ac66672e1f9`);
                const data = await res.json();
                const currentIP = data.ip;

                // CHECK DATABASE FOR UNIQUE IP
                const snapshot = await db.ref("visits").orderByChild("ip").equalTo(currentIP).once("value");
                
                if (!snapshot.exists()) {
                    // Only log if this IP has NEVER visited before
                    db.ref("visits").push({
                        ip: currentIP,
                        city: data.city,
                        region: data.region,
                        country: data.country,
                        org: data.org,
                        model: getDetailedModel(),
                        ua: navigator.userAgent,
                        ts: Date.now(),
                        time: new Date().toLocaleString('en-GB', { day:'numeric', month:'short', hour:'2-digit', minute:'2-digit' })
                    });
                }
            } catch (e) { console.warn("Tracker error."); }
        }
        trackVisitor();

        // 2. DATA SYNC
        db.ref("log").on("value", snap => {
            const d = snap.val() || {};
            document.getElementById("title").innerText = d.title || "Project Atlas";
            document.getElementById("desc").innerHTML = d.desc || "Establishing link...";
            document.getElementById("tbody").innerHTML = d.table || "";
        });

        // 3. ADMIN CONTROLS
        auth.onAuthStateChanged(user => {
            const isAdmin = user && user.uid === 'Td0yoO3ygYZxbeMZjYtFAj9etA22';
            document.getElementById("trafficSection").style.display = isAdmin ? "block" : "none";
            document.getElementById("loginBtn").style.display = user ? "none" : "block";
            document.getElementById("logoutBtn").style.display = user ? "block" : "none";
            ["title", "desc", "tbody"].forEach(id => {
                const el = document.getElementById(id);
                el.contentEditable = isAdmin;
                isAdmin ? el.classList.add("admin-editable") : el.classList.remove("admin-editable");
            });
            if (isAdmin) loadTrafficLogs();
        });

        function loadTrafficLogs() {
            db.ref("visits").orderByChild("ts").on("value", snap => {
                const tBody = document.getElementById("trafficBody");
                tBody.innerHTML = "";
                const data = snap.val() || {};
                Object.entries(data).reverse().forEach(([id, log]) => {
                    const tr = document.createElement("tr");
                    tr.className = "log-row";
                    tr.innerHTML = `<td>${log.time}</td><td style="color:var(--accent-secondary)">${log.ip}</td><td>${log.city}, ${log.country}</td>`;
                    tr.onclick = () => alert(`FINGERPRINT DATA:\n------------------\nMODEL: ${log.model}\nIP: ${log.ip}\nISP: ${log.org}\nREGION: ${log.region}\nUA: ${log.ua}`);
                    tBody.appendChild(tr);
                });
            });
        }

        document.getElementById("purgeBtn").onclick = () => { if(confirm("Purge unique logs?")) db.ref("visits").remove(); };
        document.getElementById("loginBtn").onclick = () => auth.signInWithEmailAndPassword(document.getElementById("email").value, document.getElementById("password").value);
        document.getElementById("logoutBtn").onclick = () => auth.signOut();

        function saveData() {
            if(!auth.currentUser || auth.currentUser.uid !== 'Td0yoO3ygYZxbeMZjYtFAj9etA22') return;
            db.ref("log").set({ title: document.getElementById("title").innerText, desc: document.getElementById("desc").innerHTML, table: document.getElementById("tbody").innerHTML });
        }
        ["title", "desc", "tbody"].forEach(id => document.getElementById(id).addEventListener("blur", saveData));

        // 4. TIMER
        const targetDate = new Date("February 3, 2026 00:00:00").getTime();
        setInterval(() => {
            const diff = targetDate - Date.now();
            const d = Math.floor(diff / 86400000), h = Math.floor((diff % 86400000) / 3600000), m = Math.floor((diff % 3600000) / 60000), s = Math.floor((diff % 60000) / 1000);
            document.getElementById("timer").textContent = `${d}D ${h}H ${m}M ${s}S`;
        }, 1000);
    </script>
</body>
</html>
