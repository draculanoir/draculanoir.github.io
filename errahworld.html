<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Strength Log – 1RM Tracking</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />

<style>
:root{
  --bg-main:#0c0e12;
  --bg-panel:#14161c;
  --bg-header:#1b1e26;
  --border:#2a2d36;
  --text:#d9dbe1;
  --muted:#9da1ac;
  --accent:#bfc6d6;
}

body{
  visibility:hidden;
  font-family:"Segoe UI", Arial, sans-serif;
  background:radial-gradient(circle at top,#12141b,var(--bg-main));
  color:var(--text);
  padding:24px;
}

/* 🔒 VIEWER LOCK */
.locked-content,
.locked-content *{
  pointer-events:none !important;
  user-select:none !important;
  caret-color:transparent !important;
}

.top-bar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  max-width:1020px;
  margin-bottom:12px;
}

#authBox input,
#authBox button{
  background:transparent;
  border:1px solid var(--border);
  color:var(--accent);
  padding:6px 10px;
  border-radius:6px;
  margin-right:4px;
}

table{
  width:100%;
  max-width:1020px;
  border-collapse:collapse;
  background:var(--bg-panel);
  box-shadow:0 0 0 1px var(--border);
}

th, td{
  border:1px solid var(--border);
  padding:10px;
  text-align:center;
}

th{
  background:var(--bg-header);
  color:var(--accent);
  font-size:.75rem;
}

td.left{ text-align:left; }

.last-updated{
  font-size:.75rem;
  color:var(--muted);
}

/* ============================= */
/* 🏋️ BARBELL CALCULATOR STYLES */
/* ============================= */
.calculator{
  max-width:1020px;
  margin-top:32px;
  padding:16px;
  background:var(--bg-panel);
  border:1px solid var(--border);
  border-radius:8px;
}

.calculator input,
.calculator label{
  background:transparent;
  border:1px solid var(--border);
  color:var(--accent);
  padding:8px 12px;
  border-radius:6px;
  margin-right:6px;
}

.calculator input[type="number"]::-webkit-inner-spin-button,
.calculator input[type="number"]::-webkit-outer-spin-button{
  -webkit-appearance:none;
}
.calculator input[type="number"]{
  -moz-appearance:textfield;
}

.barbell{
  margin-top:20px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.bar{
  width:260px;
  height:8px;
  background:#777;
  border-radius:4px;
}

.side{
  display:flex;
  align-items:center;
}

.plate{
  height:60px;
  border-radius:4px;
  margin:0 2px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:.7rem;
  font-weight:600;
  color:#111;
}

.p45{ width:26px; background:#c0392b; }
.p35{ width:24px; background:#d35400; }
.p25{ width:22px; background:#f1c40f; }
.p10{ width:18px; background:#3498db; color:#fff; }
.p5 { width:14px; background:#2ecc71; }
.p2_5{ width:10px; background:#95a5a6; }

.note{
  font-size:.75rem;
  color:var(--muted);
  margin-top:6px;
}
</style>
</head>

<body>

<h1 id="title"></h1>
<p id="desc"></p>

<div class="top-bar">
  <div id="authBox">
    <input id="email" placeholder="admin email">
    <input id="password" type="password" placeholder="password">
    <button id="loginBtn">Login</button>
    <button id="logoutBtn" style="display:none">Logout</button>
  </div>
  <div id="lastUpdated" class="last-updated"></div>
</div>

<table id="table" class="locked-content">
  <thead>
    <tr>
      <th class="left">Lift</th>
      <th>Current</th>
      <th>1RM</th>
      <th>Strength Level</th>
    </tr>
  </thead>
  <tbody id="tbody"></tbody>
</table>

<!-- 🏋️ BARBELL CALCULATOR -->
<div class="calculator">
  <h3>Barbell Target Weight (lbs)</h3>

  <input id="targetWeight" type="number" placeholder="Target weight">

  <input id="barWeight" type="number" value="45" placeholder="Bar weight">

  <label>
    <input type="checkbox" id="includeBar" checked>
    Include bar
  </label>

  <div class="barbell">
    <div id="leftSide" class="side"></div>
    <div class="bar"></div>
    <div id="rightSide" class="side"></div>
  </div>

  <div id="totalWeight" class="note"></div>
  <div id="trueLoad" class="note"></div>
  <div id="roundNote" class="note"></div>
</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>
firebase.initializeApp({
  apiKey: "AIzaSyBoePuKarSCVgvxQQBGvkMKq16DvKmBYBE",
  authDomain: "strenght-a9f37.firebaseapp.com",
  databaseURL: "https://strenght-a9f37-default-rtdb.firebaseio.com",
  projectId: "strenght-a9f37",
  storageBucket: "strenght-a9f37.firebasestorage.app",
  messagingSenderId: "469926449178",
  appId: "1:469926449178:web:b9623947a1c1865b0f81a3"
});

const auth = firebase.auth();
const db = firebase.database();

const titleEl = document.getElementById("title");
const descEl = document.getElementById("desc");
const tbody = document.getElementById("tbody");
const table = document.getElementById("table");
const lastUpdatedEl = document.getElementById("lastUpdated");

const emailEl = document.getElementById("email");
const passEl = document.getElementById("password");
const loginBtn = document.getElementById("loginBtn");
const logoutBtn = document.getElementById("logoutBtn");

let isAdmin = false;

/* 🔒 LOCK */
function lockAll(){
  isAdmin = false;
  table.classList.add("locked-content");
  titleEl.contentEditable = "false";
  descEl.contentEditable = "false";
  tbody.contentEditable = "false";
}

/* ✏️ ADMIN */
function enableEdit(){
  isAdmin = true;
  table.classList.remove("locked-content");
  titleEl.contentEditable = "true";
  descEl.contentEditable = "true";
  tbody.contentEditable = "true";
}

/* 🔐 AUTH */
loginBtn.onclick = () =>
  auth.signInWithEmailAndPassword(emailEl.value, passEl.value)
    .catch(e => alert(e.message));

logoutBtn.onclick = () => auth.signOut();

auth.onAuthStateChanged(user=>{
  if(user){
    enableEdit();
    loginBtn.style.display = "none";
    logoutBtn.style.display = "inline-block";
  }else{
    lockAll();
    loginBtn.style.display = "inline-block";
    logoutBtn.style.display = "none";
  }
});

/* 💾 SAVE DATA (DO NOT TOUCH) */
function saveData(){
  if(!isAdmin) return;

  const now = new Date();
  const date = now.toLocaleDateString("en-GB",{day:"numeric",month:"long",year:"numeric"});
  const time = now.toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit",hour12:true});
  const updated = `${date} · ${time}`;

  db.ref("log").set({
    title: titleEl.innerText,
    desc: descEl.innerHTML,
    table: tbody.innerHTML,
    updated
  });

  lastUpdatedEl.innerText = "Last updated: " + updated;
}

["blur","input"].forEach(evt=>{
  titleEl.addEventListener(evt, saveData);
  descEl.addEventListener(evt, saveData);
  tbody.addEventListener(evt, saveData);
});

/* 📥 LOAD */
db.ref("log").once("value").then(snap=>{
  const d = snap.val();
  if(!d) return;
  titleEl.innerText = d.title;
  descEl.innerHTML = d.desc;
  tbody.innerHTML = d.table;
  lastUpdatedEl.innerText = "Last updated: " + d.updated;
  document.body.style.visibility = "visible";
});

/* 🏋️ LIVE BARBELL */
const plates = [45,35,25,10,5,2.5];
const targetInput = document.getElementById("targetWeight");
const barInput = document.getElementById("barWeight");
const includeBarEl = document.getElementById("includeBar");
const left = document.getElementById("leftSide");
const right = document.getElementById("rightSide");
const note = document.getElementById("roundNote");
const totalEl = document.getElementById("totalWeight");
const trueEl = document.getElementById("trueLoad");

function updateBarbell(){
  left.innerHTML = "";
  right.innerHTML = "";
  note.innerText = "";
  totalEl.innerText = "";
  trueEl.innerText = "";

  const target = Number(targetInput.value);
  const barWeight = Number(barInput.value) || 0;
  if(!target) return;

  const bar = includeBarEl.checked ? barWeight : 0;
  let remaining = (target - bar) / 2;

  if(remaining < 0){
    note.innerText = "Target weight is less than the bar.";
    return;
  }

  let used = [];
  plates.forEach(p=>{
    while(remaining >= p){
      remaining -= p;
      used.push(p);
    }
  });

  const platesTotal = used.reduce((a,b)=>a+b,0) * 2;
  const trueLoad = platesTotal + bar;

  totalEl.innerText = "Plates loaded: " + platesTotal + " lb";
  trueEl.innerText = "True load (plates + bar): " + trueLoad + " lb";

  if(remaining > 0){
    note.innerText = "Rounded down to nearest achievable weight.";
  }

  used.forEach(p=>{
    const cls = p === 2.5 ? "p2_5" : "p"+p;
    right.innerHTML += `<div class="plate ${cls}">${p}</div>`;
  });

  [...used].reverse().forEach(p=>{
    const cls = p === 2.5 ? "p2_5" : "p"+p;
    left.innerHTML += `<div class="plate ${cls}">${p}</div>`;
  });
}

[targetInput, barInput].forEach(el=>el.addEventListener("input", updateBarbell));
includeBarEl.addEventListener("change", updateBarbell);

lockAll();
</script>

</body>
</html>
