<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Strength Log – 1RM Tracking</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />

<style>
:root{
  --bg-main:#0c0e12;
  --bg-panel:#14161c;
  --bg-header:#1b1e26;
  --border:#2a2d36;
  --text:#d9dbe1;
  --muted:#9da1ac;
  --accent:#bfc6d6;
}

body{
  font-family:"Segoe UI", Arial, sans-serif;
  background:radial-gradient(circle at top,#12141b,var(--bg-main));
  color:var(--text);
  padding:24px;
}

/* 🔒 HARD READ-ONLY LOCK */
.locked-content,
.locked-content *{
  pointer-events:none !important;
  user-select:none !important;
  touch-action:none !important;
  caret-color:transparent !important;
}

.hidden{ display:none; }

.top-bar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  max-width:1020px;
  margin-bottom:12px;
  gap:8px;
}

#authBox input,
#authBox button{
  background:transparent;
  border:1px solid var(--border);
  color:var(--accent);
  padding:6px 10px;
  border-radius:6px;
}

table{
  width:100%;
  max-width:1020px;
  border-collapse:collapse;
  background:var(--bg-panel);
  box-shadow:0 0 0 1px var(--border);
  margin-bottom:24px;
}

th, td{
  border:1px solid var(--border);
  padding:8px;
  font-size:.75rem;
  text-align:center;
}

th{
  background:var(--bg-header);
  color:var(--accent);
}

td.left{ text-align:left; }

.last-updated{
  font-size:.75rem;
  color:var(--muted);
}

/* 🏋️ CALCULATOR */
.calculator{
  max-width:1020px;
  margin-top:32px;
  padding:16px;
  background:var(--bg-panel);
  border:1px solid var(--border);
  border-radius:8px;
}

/* 🧾 VISITS */
.visits-box{
  max-width:1020px;
  background:var(--bg-panel);
  border:1px solid var(--border);
  border-radius:8px;
  padding:16px;
}

.visits-box h3{
  margin:0 0 12px;
  font-size:.9rem;
  color:var(--accent);
}

.visits-table{
  max-height:300px;
  overflow:auto;
}
</style>
</head>

<body>

<h1 id="title"></h1>
<p id="desc"></p>

<div class="top-bar">
  <div id="authBox">
    <input id="email" placeholder="admin email">
    <input id="password" type="password" placeholder="password">
    <button id="loginBtn">Login</button>
    <button id="logoutBtn" style="display:none">Logout</button>
  </div>
  <div id="lastUpdated" class="last-updated"></div>
</div>

<table id="table" class="locked-content">
<thead>
<tr>
  <th class="left">Lift</th>
  <th>Current</th>
  <th>1RM</th>
  <th>Strength</th>
</tr>
</thead>
<tbody id="tbody"></tbody>
</table>

<!-- 👁️ ADMIN VISITS SECTION -->
<div id="visitsSection" class="visits-box hidden">
  <h3>Visitor Logs</h3>
  <div class="visits-table">
    <table>
      <thead>
        <tr>
          <th>IP</th>
          <th>Country</th>
          <th>City</th>
          <th>ISP</th>
          <th>Page</th>
          <th>Time</th>
        </tr>
      </thead>
      <tbody id="visitsBody"></tbody>
    </table>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>
firebase.initializeApp({
  apiKey: "AIzaSyBoePuKarSCVgvxQQBGvkMKq16DvKmBYBE",
  authDomain: "strenght-a9f37.firebaseapp.com",
  databaseURL: "https://strenght-a9f37-default-rtdb.firebaseio.com",
  projectId: "strenght-a9f37",
  storageBucket: "strenght-a9f37.firebasestorage.app",
  messagingSenderId: "469926449178",
  appId: "1:469926449178:web:b9623947a1c1865b0f81a3"
});

const auth=firebase.auth();
const db=firebase.database();

const visitsSection=document.getElementById("visitsSection");
const visitsBody=document.getElementById("visitsBody");

/* 🔐 AUTH */
loginBtn.onclick=()=>auth.signInWithEmailAndPassword(email.value,password.value);
logoutBtn.onclick=()=>auth.signOut();

auth.onAuthStateChanged(user=>{
  visitsSection.classList.toggle("hidden",!user);
  loginBtn.style.display=user?"none":"inline-block";
  logoutBtn.style.display=user?"inline-block":"none";
  if(user) loadVisits();
});

/* 📥 LOAD VISITS */
function loadVisits(){
  db.ref("visits").limitToLast(100).on("value",snap=>{
    visitsBody.innerHTML="";
    snap.forEach(s=>{
      const v=s.val();
      visitsBody.innerHTML=
        `<tr>
          <td>${v.ip||""}</td>
          <td>${v.country||""}</td>
          <td>${v.city||""}</td>
          <td>${v.org||""}</td>
          <td>${v.page||""}</td>
          <td>${new Date(v.time).toLocaleString()}</td>
        </tr>` + visitsBody.innerHTML;
    });
  });
}
</script>

<!-- 🌍 LOG VISITOR -->
<script>
(function(){
  const last=localStorage.getItem("visitLogged");
  if(last && Date.now()-last<86400000) return;

  fetch("https://ipinfo.io/json?token=513ac66672e1f9",{cache:"no-store"})
    .then(r=>r.json())
    .then(d=>{
      firebase.database().ref("visits").push({
        ip:d.ip,
        country:d.country,
        city:d.city,
        org:d.org,
        page:location.pathname,
        time:new Date().toISOString()
      });
      localStorage.setItem("visitLogged",Date.now());
    });
})();
</script>

</body>
</html>
