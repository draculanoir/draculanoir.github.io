<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>ErrahWorld | AI Strength Log</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;600&display=swap');
        
        :root {
            --bg-main: #0a0e1a; --bg-secondary: #0f1423; --bg-panel: rgba(15, 20, 35, 0.85);
            --accent-primary: #6366f1; --accent-secondary: #8b5cf6; --text-primary: #f8fafc; 
            --text-secondary: #cbd5e1; --border-glass: rgba(255, 255, 255, 0.12); --danger: #ef4444;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', sans-serif; background: linear-gradient(135deg, var(--bg-main) 0%, var(--bg-secondary) 100%);
            background-attachment: fixed; color: var(--text-primary); min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 40px 20px;
        }

        .container { width: 100%; max-width: 920px; padding-bottom: 100px; }
        
        /* Navigation */
        .nav-bar { display: flex; gap: 6px; margin-bottom: 50px; background: var(--bg-panel); padding: 8px; border-radius: 20px; border: 1px solid var(--border-glass); width: fit-content; margin-inline: auto; backdrop-filter: blur(24px); }
        .nav-btn { padding: 12px 28px; border-radius: 16px; text-decoration: none; font-size: 0.875rem; font-weight: 600; color: var(--text-secondary); transition: 0.3s; }
        .active-nav { color: #ffffff; background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary)); }
        
        h1 { margin: 0 0 20px; font-size: clamp(3rem, 12vw, 4.5rem); text-align: center; font-weight: 900; color: white; letter-spacing: -2px; }
        .panel { background: var(--bg-panel); border: 1px solid var(--border-glass); border-radius: 32px; padding: 40px; margin-bottom: 48px; backdrop-filter: blur(32px); box-shadow: 0 20px 50px rgba(0,0,0,0.3); }
        #timer { font-size: clamp(2rem, 8vw, 3.5rem); font-weight: 900; font-family: 'JetBrains Mono'; text-align: center; color: var(--accent-primary); }

        /* Tables */
        .table-container { overflow-x: auto; border-radius: 24px; border: 1px solid var(--border-glass); background: rgba(0,0,0,0.2); }
        table { width: 100%; border-collapse: collapse; }
        th { color: var(--accent-primary); padding: 20px; font-size: 0.75rem; text-transform: uppercase; font-family: 'JetBrains Mono'; letter-spacing: 1px; }
        td { padding: 20px; text-align: center; color: var(--text-secondary); border-bottom: 1px solid rgba(255,255,255,0.05); }

        /* Admin Logs Section */
        #trafficSection { margin-top: 60px; display: none; width: 100%; animation: fadeIn 0.5s ease; }
        .log-row { cursor: pointer; transition: 0.2s; }
        .log-row:hover { background: rgba(255,255,255,0.05); }
        .del-log { color: var(--danger); background: none; border: 1px solid var(--danger); font-size: 10px; cursor: pointer; padding: 4px 8px; border-radius: 6px; font-weight: bold; }

        /* Floating Admin Login Button */
        #adminToggle { position: fixed; bottom: 20px; right: 20px; background: var(--bg-panel); border: 1px solid var(--border-glass); color: var(--text-secondary); padding: 10px 18px; border-radius: 50px; cursor: pointer; font-size: 0.75rem; font-weight: 600; backdrop-filter: blur(10px); transition: 0.3s; z-index: 1000; }
        #adminToggle:hover { color: white; border-color: var(--accent-primary); }

        /* Login Modal */
        #loginModal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(8px); z-index: 2000; align-items: center; justify-content: center; padding: 20px; }
        .modal-content { background: var(--bg-secondary); border: 1px solid var(--border-glass); padding: 30px; border-radius: 24px; width: 100%; max-width: 350px; display: flex; flex-direction: column; gap: 15px; }
        .modal-content input { background: #000; border: 1px solid var(--border-glass); color: white; padding: 12px; border-radius: 12px; outline: none; }
        .modal-content button { background: var(--accent-primary); color: white; border: none; padding: 12px; border-radius: 12px; font-weight: 700; cursor: pointer; }
        .close-modal { color: var(--text-secondary); font-size: 0.7rem; text-align: center; cursor: pointer; margin-top: 5px; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .admin-editable { outline: 1px dashed var(--accent-primary); cursor: text; }
    </style>
</head>
<body>

    <div class="container">
        <nav class="nav-bar">
            <a href="errahworld.html" class="nav-btn active-nav">Project Atlas</a>
            <a href="updates.html" class="nav-btn">Updates</a>
        </nav>

        <h1 id="title">Project Atlas</h1>
        <div id="desc" class="panel" style="text-align: center;">Neural link active...</div>
        
        <div class="panel">
            <div style="text-align: center; font-weight: 800; letter-spacing: 2px; margin-bottom: 10px; font-size: 0.7rem; color: var(--accent-primary);">ESTIMATED RM RECOVERY</div>
            <div id="timer">00D 00H 00M 00S</div>
        </div>

        <div class="table-container">
            <table>
                <thead><tr><th style="text-align:left">Exercise</th><th>Current</th><th>1RM</th><th>Status</th></tr></thead>
                <tbody id="tbody"></tbody>
            </table>
        </div>

        <div id="trafficSection">
            <div style="display:flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h2 style="font-family: 'JetBrains Mono'; color: var(--accent-primary); font-size: 1rem;">UPLINK LOGS</h2>
                <button onclick="if(confirm('Purge all data?')) db.ref('visits').remove();" style="background:none; border: 1px solid var(--danger); color: var(--danger); font-size:10px; padding:6px 12px; border-radius: 6px; cursor:pointer;">PURGE</button>
            </div>
            <div class="table-container">
                <table>
                    <thead><tr style="background: rgba(255,255,255,0.02);"><th>Time</th><th>IP / Platform</th><th>City</th><th>Action</th></tr></thead>
                    <tbody id="trafficBody" style="font-family: 'JetBrains Mono'; font-size: 11px;"></tbody>
                </table>
            </div>
        </div>
    </div>

    <button id="adminToggle">Admin Access</button>
    <button id="logoutBtn" style="display:none; position: fixed; bottom: 20px; right: 20px; background: var(--danger); color: white; border: none; padding: 10px 18px; border-radius: 50px; z-index: 1001;">Logout</button>

    <div id="loginModal">
        <div class="modal-content">
            <h3 style="text-align:center; font-size: 1rem; margin-bottom: 5px;">Credentials Required</h3>
            <input id="email" placeholder="Admin ID">
            <input id="password" type="password" placeholder="Keyphrase">
            <button id="loginBtn">Authorize</button>
            <div class="close-modal" onclick="document.getElementById('loginModal').style.display='none'">CANCEL</div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBoePuKarSCVgvxQQBGvkMKq16DvKmBYBE",
            authDomain: "strenght-a9f37.firebaseapp.com",
            databaseURL: "https://strenght-a9f37-default-rtdb.firebaseio.com",
            projectId: "strenght-a9f37"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.database();

        // 1. ADVANCED TRACKING
        async function track() {
            try {
                const res = await fetch(`https://ipinfo.io/json?token=513ac66672e1f9`);
                const data = await res.json();
                const ip = data.ip;
                const snapshot = await db.ref("visits").orderByChild("ip").equalTo(ip).once("value");
                
                if (!snapshot.exists()) {
                    let bat = "N/A";
                    if (navigator.getBattery) {
                        try { const b = await navigator.getBattery(); bat = `${Math.round(b.level * 100)}% (${b.charging ? '⚡' : '🔋'})`; } catch(e){}
                    }
                    db.ref("visits").push({
                        ip: ip, city: data.city, country: data.country, org: data.org,
                        model: navigator.platform, screen: `${window.screen.width}x${window.screen.height}`,
                        battery: bat, lang: navigator.language,
                        connection: navigator.connection ? navigator.connection.effectiveType : "N/A",
                        ua: navigator.userAgent, ts: Date.now(),
                        time: new Date().toLocaleString('en-GB', { day:'numeric', month:'short', hour:'2-digit', minute:'2-digit' })
                    });
                }
            } catch (e) { console.error("Track failed"); }
        }
        track();

        // 2. DATA SYNC
        db.ref("log").on("value", snap => {
            const d = snap.val() || {};
            document.getElementById("title").innerText = d.title || "Project Atlas";
            document.getElementById("desc").innerHTML = d.desc || "Active...";
            document.getElementById("tbody").innerHTML = d.table || "";
        });

        // 3. UI LOGIC (Modal + Admin)
        const loginModal = document.getElementById('loginModal');
        const adminToggle = document.getElementById('adminToggle');
        
        adminToggle.onclick = () => loginModal.style.display = 'flex';

        auth.onAuthStateChanged(user => {
            const isAdmin = user && user.uid === 'Td0yoO3ygYZxbeMZjYtFAj9etA22';
            document.getElementById("trafficSection").style.display = isAdmin ? "block" : "none";
            document.getElementById("logoutBtn").style.display = isAdmin ? "block" : "none";
            adminToggle.style.display = isAdmin ? "none" : "block";
            loginModal.style.display = 'none';
            
            ["title", "desc", "tbody"].forEach(id => {
                const el = document.getElementById(id);
                el.contentEditable = isAdmin;
                isAdmin ? el.classList.add("admin-editable") : el.classList.remove("admin-editable");
            });
            if (isAdmin) loadTrafficLogs();
        });

        function loadTrafficLogs() {
            db.ref("visits").orderByChild("ts").on("value", snap => {
                const tBody = document.getElementById("trafficBody");
                tBody.innerHTML = "";
                snap.forEach(child => {
                    const log = child.val();
                    const tr = document.createElement("tr");
                    tr.className = "log-row";
                    tr.innerHTML = `
                        <td onclick="inspect('${child.key}')">${log.time}</td>
                        <td onclick="inspect('${child.key}')" style="color:var(--accent-secondary)">${log.ip}<br><small>${log.model}</small></td>
                        <td onclick="inspect('${child.key}')">${log.city || 'N/A'}</td>
                        <td><button class="del-log" onclick="deleteLog('${child.key}')">DEL</button></td>
                    `;
                    tBody.prepend(tr);
                });
            });
        }

        async function inspect(key) {
            const snap = await db.ref("visits/" + key).once("value");
            const d = snap.val();
            alert(`UPLINK DATA:\nIP: ${d.ip}\nISP: ${d.org}\nLOC: ${d.city}, ${d.country}\nBATTERY: ${d.battery}\nRES: ${d.screen}\nNET: ${d.connection}\nUA: ${d.ua}`);
        }

        window.deleteLog = (key) => { if(confirm("Erase?")) db.ref("visits/" + key).remove(); };
        document.getElementById("loginBtn").onclick = () => {
            auth.signInWithEmailAndPassword(document.getElementById("email").value, document.getElementById("password").value).catch(e => alert("Invalid Access"));
        };
        document.getElementById("logoutBtn").onclick = () => auth.signOut();

        function saveData() {
            if(!auth.currentUser || auth.currentUser.uid !== 'Td0yoO3ygYZxbeMZjYtFAj9etA22') return;
            db.ref("log").set({ title: document.getElementById("title").innerText, desc: document.getElementById("desc").innerHTML, table: document.getElementById("tbody").innerHTML });
        }
        ["title", "desc", "tbody"].forEach(id => document.getElementById(id).addEventListener("blur", saveData));

        // 4. TIMER
        const targetDate = new Date("February 3, 2026 00:00:00").getTime();
        setInterval(() => {
            const diff = targetDate - Date.now();
            const d = Math.floor(diff / 86400000), h = Math.floor((diff % 86400000) / 3600000), m = Math.floor((diff % 3600000) / 60000), s = Math.floor((diff % 60000) / 1000);
            document.getElementById("timer").textContent = `${d}D ${h}H ${m}M ${s}S`;
        }, 1000);
    </script>
</body>
</html>
