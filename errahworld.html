<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Strength Log – 1RM Tracking</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />

<style>
:root{
  --bg-main:#0c0e12;
  --bg-panel:#14161c;
  --bg-header:#1b1e26;
  --border:#2a2d36;
  --text:#d9dbe1;
  --muted:#9da1ac;
  --accent:#bfc6d6;
}

body{
  visibility:hidden;
  font-family:"Segoe UI",Arial,sans-serif;
  background:radial-gradient(circle at top,#12141b,var(--bg-main));
  color:var(--text);
  padding:24px;
}

/* ================= VIEWER LOCK ================= */
.locked-content,
.locked-content *{
  pointer-events:none !important;
  user-select:none !important;
  caret-color:transparent !important;
}

.locked-content td,
.locked-content th{
  touch-action:none !important;
}

*:focus{
  outline:none !important;
  box-shadow:none !important;
}

.top-bar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  max-width:1020px;
  margin-bottom:12px;
}

#authBox input,
#authBox button{
  background:transparent;
  border:1px solid var(--border);
  color:var(--accent);
  padding:6px 10px;
  border-radius:6px;
  margin-right:4px;
}

table{
  width:100%;
  max-width:1020px;
  border-collapse:collapse;
  background:var(--bg-panel);
  box-shadow:0 0 0 1px var(--border);
}

th,td{
  border:1px solid var(--border);
  padding:10px;
  text-align:center;
}

th{
  background:var(--bg-header);
  color:var(--accent);
  font-size:.75rem;
}

td.left{text-align:left}

.last-updated{
  font-size:.75rem;
  color:var(--muted);
}

/* ================= BARBELL CALCULATOR ================= */
.barbell-box{
  max-width:520px;
  background:#14161c;
  border:1px solid #2a2d36;
  border-radius:14px;
  padding:18px;
  margin:30px auto 40px;
}

.barbell-box h2{
  margin:0 0 14px;
  font-size:1.1rem;
  color:#bfc6d6;
}

.controls{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.controls input,
.controls select{
  background:#0c0e12;
  border:1px solid #2a2d36;
  color:#d9dbe1;
  padding:8px;
  border-radius:8px;
}

.controls label{
  font-size:.75rem;
  color:#9da1ac;
}

.toggle{
  display:flex;
  align-items:center;
  gap:6px;
  font-size:.8rem;
}

.calc-btn{
  width:100%;
  margin-top:12px;
  padding:10px;
  background:#1b1e26;
  border:1px solid #2a2d36;
  color:#bfc6d6;
  border-radius:10px;
  cursor:pointer;
}

.calc-btn:hover{
  background:#232635;
}

.bar{
  margin-top:20px;
  display:flex;
  justify-content:center;
}

.bar-shaft{
  height:10px;
  width:100%;
  background:#777;
  border-radius:6px;
  position:relative;
}

.plates{
  position:absolute;
  display:flex;
  left:50%;
  transform:translateX(-50%);
}

.plate{
  height:46px;
  margin:0 2px;
  border-radius:4px;
  animation:pop .25s ease;
}

@keyframes pop{
  from{transform:scale(.7);opacity:0}
  to{transform:scale(1);opacity:1}
}

.red{width:18px;background:#c0392b}
.blue{width:16px;background:#2980b9}
.yellow{width:14px;background:#f1c40f}
.green{width:12px;background:#27ae60}
.black{width:10px;background:#555}

.result{
  margin-top:12px;
  font-size:.8rem;
  color:#9da1ac;
  text-align:center;
}
</style>
</head>

<body>

<h1 id="title"></h1>
<p id="desc"></p>

<div class="top-bar">
  <div id="authBox">
    <input id="email" placeholder="admin email">
    <input id="password" type="password" placeholder="password">
    <button id="loginBtn">Login</button>
    <button id="logoutBtn" style="display:none">Logout</button>
  </div>
  <div id="lastUpdated" class="last-updated"></div>
</div>

<table id="table" class="locked-content">
<thead>
<tr>
  <th class="left">Lift</th>
  <th>Current</th>
  <th>1RM</th>
  <th>Strength Level</th>
</tr>
</thead>
<tbody id="tbody"></tbody>
</table>

<!-- ================= BARBELL CALCULATOR ================= -->
<div class="barbell-box">
  <h2>Barbell Calculator</h2>

  <div class="controls">
    <div>
      <label>Target Lift</label>
      <input id="targetWeight" type="number" placeholder="225">
    </div>

    <div>
      <label>Units</label>
      <select id="unit">
        <option value="lb">lb</option>
        <option value="kg">kg</option>
      </select>
    </div>

    <div>
      <label>Bar Weight</label>
      <input id="barWeight" type="number" value="45">
    </div>

    <div class="toggle">
      <input id="includeBar" type="checkbox" checked>
      <span>Include bar</span>
    </div>
  </div>

  <button class="calc-btn" id="calcBtn">Calculate</button>

  <div class="bar">
    <div class="bar-shaft">
      <div class="plates" id="plates"></div>
    </div>
  </div>

  <div class="result" id="result"></div>
</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>
firebase.initializeApp({
  apiKey:"AIzaSyBoePuKarSCVgvxQQBGvkMKq16DvKmBYBE",
  authDomain:"strenght-a9f37.firebaseapp.com",
  databaseURL:"https://strenght-a9f37-default-rtdb.firebaseio.com",
  projectId:"strenght-a9f37",
  storageBucket:"strenght-a9f37.firebasestorage.app",
  messagingSenderId:"469926449178",
  appId:"1:469926449178:web:b9623947a1c1865b0f81a3"
});

const auth=firebase.auth();
const db=firebase.database();

const titleEl=document.getElementById("title");
const descEl=document.getElementById("desc");
const tbody=document.getElementById("tbody");
const table=document.getElementById("table");
const lastUpdatedEl=document.getElementById("lastUpdated");
const emailEl=document.getElementById("email");
const passEl=document.getElementById("password");
const loginBtn=document.getElementById("loginBtn");
const logoutBtn=document.getElementById("logoutBtn");

let isAdmin=false;
let firstLoad=true;

/* viewer shield */
function viewerShield(e){
  if(isAdmin) return;
  if(e.target.closest("#authBox")) return;
  e.preventDefault();
  e.stopPropagation();
  if(document.activeElement) document.activeElement.blur();
}
["touchstart","touchend","click","focus"].forEach(evt=>{
  document.addEventListener(evt,viewerShield,true);
});

function lockAll(){
  isAdmin=false;
  table.classList.add("locked-content");
  titleEl.contentEditable="false";
  descEl.contentEditable="false";
  document.querySelectorAll("td,th").forEach(el=>{
    el.contentEditable="false";
    el.setAttribute("tabindex","-1");
    el.blur();
  });
}

function enableEdit(){
  isAdmin=true;
  table.classList.remove("locked-content");
  titleEl.contentEditable="true";
  descEl.contentEditable="true";
  document.querySelectorAll("td,th").forEach(el=>{
    el.contentEditable="true";
    el.removeAttribute("tabindex");
  });
}

loginBtn.onclick=()=>auth.signInWithEmailAndPassword(emailEl.value,passEl.value)
  .catch(e=>alert(e.message));
logoutBtn.onclick=()=>auth.signOut();

auth.onAuthStateChanged(user=>{
  if(user){
    enableEdit();
    loginBtn.style.display="none";
    logoutBtn.style.display="inline-block";
  }else{
    lockAll();
    loginBtn.style.display="inline-block";
    logoutBtn.style.display="none";
  }
});

db.ref("log").once("value").then(snap=>{
  const d=snap.val();
  if(!d) return;
  titleEl.innerText=d.title;
  descEl.innerHTML=d.desc;
  tbody.innerHTML=d.table;
  lastUpdatedEl.innerText="Last updated: "+d.updated;
  document.body.style.visibility="visible";
});

db.ref("log").on("value",snap=>{
  if(firstLoad){firstLoad=false;return;}
  if(isAdmin) return;
  const d=snap.val();
  if(!d) return;
  titleEl.innerText=d.title;
  descEl.innerHTML=d.desc;
  tbody.innerHTML=d.table;
  lastUpdatedEl.innerText="Last updated: "+d.updated;
});

document.addEventListener("input",()=>{
  if(!isAdmin) return;
  const now=new Date();
  const date=now.toLocaleDateString("en-GB",{day:"numeric",month:"long",year:"numeric"});
  const time=now.toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit",hour12:true});
  db.ref("log").set({
    title:titleEl.innerText,
    desc:descEl.innerHTML,
    table:tbody.innerHTML,
    updated:`${date} · ${time}`
  });
});

/* ================= CALCULATOR LOGIC ================= */
const PLATES={
  lb:[
    {w:45,c:"red"},
    {w:35,c:"blue"},
    {w:25,c:"yellow"},
    {w:10,c:"green"},
    {w:5,c:"black"},
    {w:2.5,c:"black"}
  ],
  kg:[
    {w:25,c:"red"},
    {w:20,c:"blue"},
    {w:15,c:"yellow"},
    {w:10,c:"green"},
    {w:5,c:"black"},
    {w:2.5,c:"black"},
    {w:1.25,c:"black"}
  ]
};

const target=document.getElementById("targetWeight");
const unit=document.getElementById("unit");
const barWeight=document.getElementById("barWeight");
const includeBar=document.getElementById("includeBar");
const platesEl=document.getElementById("plates");
const result=document.getElementById("result");
const calcBtn=document.getElementById("calcBtn");

calcBtn.onclick=()=>{
  platesEl.innerHTML="";
  result.innerText="";

  const total=Number(target.value);
  if(!total||total<=0){
    result.innerText="Enter a valid lift weight";
    return;
  }

  const bar=includeBar.checked?Number(barWeight.value)||0:0;
  const perSide=(total-bar)/2;

  if(perSide<=0){
    result.innerText="Only the bar is loaded";
    return;
  }

  let remaining=perSide;
  const used=[];

  PLATES[unit.value].forEach(p=>{
    while(remaining>=p.w-0.001){
      remaining-=p.w;
      used.push(p);
    }
  });

  if(!used.length){
    result.innerText="No plates needed per side";
    return;
  }

  used.forEach(p=>{
    const el=document.createElement("div");
    el.className=`plate ${p.c}`;
    platesEl.appendChild(el);
  });

  result.innerText=`Per side: ${used.map(p=>p.w).join(" + ")} ${unit.value}`;
};

lockAll();
</script>

</body>
</html>
