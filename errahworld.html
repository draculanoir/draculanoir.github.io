<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Strength Log – 1RM Tracking</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />

<style>
:root {
  --bg-main:#0c0e12;
  --bg-panel:#14161c;
  --bg-header:#1b1e26;
  --border:#2a2d36;
  --text:#d9dbe1;
  --muted:#9da1ac;
  --accent:#bfc6d6;
}

body {
  font-family: "Segoe UI", Arial, sans-serif;
  background: radial-gradient(circle at top,#12141b,var(--bg-main));
  color: var(--text);
  padding:24px;
}

/* 🔒 HARD READ-ONLY */
.locked, .locked * {
  pointer-events:none !important;
  user-select:none !important;
  caret-color:transparent !important;
}

*:focus {
  outline:none !important;
  box-shadow:none !important;
}

table {
  width:100%;
  max-width:1020px;
  margin-top:24px;
  border-collapse:collapse;
  background:var(--bg-panel);
  box-shadow:0 0 0 1px var(--border);
}

th,td {
  border:1px solid var(--border);
  padding:10px;
  text-align:center;
}

th {
  background:var(--bg-header);
  color:var(--accent);
  font-size:.75rem;
}

td.left {
  text-align:left;
}

.top-bar {
  display:flex;
  justify-content:space-between;
  align-items:center;
  max-width:1020px;
}

button {
  background:transparent;
  border:1px solid var(--border);
  color:var(--accent);
  padding:6px 14px;
  border-radius:6px;
  cursor:pointer;
}

.last-updated {
  font-size:.75rem;
  color:var(--muted);
}
</style>
</head>

<body>

<h1 id="title">Strength Log</h1>

<p id="desc">
Current BW: 64 kg / 140 lb<br>
Current lifts don't include bar weight.
</p>

<div class="top-bar">
  <div>
    <button id="loginBtn">Admin Login</button>
    <button id="logoutBtn" style="display:none">Logout</button>
  </div>
  <div class="last-updated" id="lastUpdated"></div>
</div>

<table id="table" class="locked">
<thead>
<tr>
  <th class="left">Lift</th>
  <th>Current</th>
  <th>1RM</th>
  <th>Level</th>
</tr>
</thead>
<tbody id="tbody"></tbody>
</table>

<!-- 🔥 Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>
/* 🔥 Firebase Config */
firebase.initializeApp({
  apiKey: "AIzaSyBoePuKarSCVgvxQQBGvkMKq16DvKmBYBE",
  authDomain: "strenght-a9f37.firebaseapp.com",
  databaseURL: "https://strenght-a9f37-default-rtdb.firebaseio.com",
  projectId: "strenght-a9f37",
  storageBucket: "strenght-a9f37.firebasestorage.app",
  messagingSenderId: "469926449178",
  appId: "1:469926449178:web:b9623947a1c1865b0f81a3"
});

const auth = firebase.auth();
const db = firebase.database();

const title = document.getElementById("title");
const desc = document.getElementById("desc");
const table = document.getElementById("table");
const tbody = document.getElementById("tbody");
const lastUpdated = document.getElementById("lastUpdated");
const loginBtn = document.getElementById("loginBtn");
const logoutBtn = document.getElementById("logoutBtn");

let isAdmin = false;

/* 🚫 HARD BLOCK KEYBOARD */
document.addEventListener("keydown", e => {
  if (!isAdmin) e.preventDefault();
});

/* 🔒 LOCK EVERYTHING */
function lockAll() {
  isAdmin = false;
  table.classList.add("locked");
  title.contentEditable = "false";
  desc.contentEditable = "false";
  document.querySelectorAll("td").forEach(td => {
    td.contentEditable = "false";
    td.blur();
  });
}

/* ✏️ ENABLE EDIT */
function enableEdit() {
  isAdmin = true;
  table.classList.remove("locked");
  title.contentEditable = "true";
  desc.contentEditable = "true";
  document.querySelectorAll("td").forEach(td => td.contentEditable = "true");
}

/* 🔐 AUTH */
loginBtn.onclick = () =>
  auth.signInWithPopup(new firebase.auth.GoogleAuthProvider());

logoutBtn.onclick = () => auth.signOut();

auth.onAuthStateChanged(user => {
  if (user) {
    enableEdit();
    loginBtn.style.display = "none";
    logoutBtn.style.display = "inline-block";
  } else {
    lockAll();
    loginBtn.style.display = "inline-block";
    logoutBtn.style.display = "none";
  }
});

/* 📥 LOAD DATA (NO FLASH) */
db.ref("data").on("value", snap => {
  const d = snap.val();
  if (!d) return;

  title.innerText = d.title;
  desc.innerHTML = d.desc;
  tbody.innerHTML = d.table;
  lastUpdated.innerText = "Last updated: " + d.updated;
});

/* 💾 SAVE */
function save() {
  if (!isAdmin) return;

  const now = new Date();
  const date =
    String(now.getDate()).padStart(2,"0") + "/" +
    String(now.getMonth()+1).padStart(2,"0") + "/" +
    now.getFullYear();

  db.ref("data").set({
    title: title.innerText,
    desc: desc.innerHTML,
    table: tbody.innerHTML,
    updated: date
  });
}

document.addEventListener("input", save);

/* 🧱 INITIAL DATA */
db.ref("data").once("value").then(snap => {
  if (snap.exists()) return;

  tbody.innerHTML = `
<tr><td class="left">Overhead Press</td><td>95 lb · 3×6</td><td></td><td></td></tr>
<tr><td class="left">Incline Bench</td><td>70 lb · 3×8</td><td></td><td></td></tr>
<tr><td class="left">Pull-Up</td><td>BW · 3×10</td><td></td><td></td></tr>
<tr><td class="left">Hex Deadlift</td><td>210 lb · 3×4</td><td></td><td></td></tr>
`;

  save();
});

lockAll();
</script>
</body>
</html>
