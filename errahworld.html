<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Strength Log – 1RM Tracking</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />

<style>
:root {
  --bg-main:#0c0e12;
  --bg-panel:#14161c;
  --bg-header:#1b1e26;
  --border:#2a2d36;
  --text:#d9dbe1;
  --muted:#9da1ac;
  --accent:#bfc6d6;
}

body {
  visibility:hidden;
  font-family:"Segoe UI",Arial,sans-serif;
  background:radial-gradient(circle at top,#12141b,var(--bg-main));
  color:var(--text);
  padding:24px;
}

.locked-content,
.locked-content * {
  pointer-events:none !important;
  user-select:none !important;
  caret-color:transparent !important;
}

*:focus { outline:none !important; }

.top-bar {
  display:flex;
  justify-content:space-between;
  align-items:center;
  max-width:1100px;
  margin-bottom:12px;
}

#authBox input, #authBox button {
  background:transparent;
  border:1px solid var(--border);
  color:var(--accent);
  padding:6px 10px;
  border-radius:6px;
  margin-right:4px;
}

table {
  width:100%;
  max-width:1100px;
  border-collapse:collapse;
  background:var(--bg-panel);
  box-shadow:0 0 0 1px var(--border);
}

th,td {
  border:1px solid var(--border);
  padding:10px;
  text-align:center;
}

th {
  background:var(--bg-header);
  color:var(--accent);
  font-size:.75rem;
}

td.left { text-align:left; }

.last-updated,
.row-updated {
  font-size:.7rem;
  color:var(--muted);
}
</style>
</head>

<body>

<h1 id="title"></h1>
<p id="desc"></p>

<div class="top-bar">
  <div id="authBox">
    <input id="email" placeholder="admin email">
    <input id="password" type="password" placeholder="password">
    <button id="loginBtn">Login</button>
    <button id="logoutBtn" style="display:none">Logout</button>
  </div>
  <div class="last-updated" id="lastUpdated"></div>
</div>

<table id="table" class="locked-content">
<thead>
<tr>
  <th class="left">Lift</th>
  <th>Current</th>
  <th>1RM</th>
  <th>Strength Level</th>
  <th>Last updated</th>
</tr>
</thead>
<tbody id="tbody"></tbody>
</table>
