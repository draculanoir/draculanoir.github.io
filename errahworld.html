<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Strength Log</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
:root{
  --bg-main:#0a0c13; --bg-panel:rgba(22,26,42,.88); --bg-header:rgba(32,38,64,.95);
  --border:rgba(255,255,255,.08); --text:#eef0f6; --muted:#9aa1b3; --accent:#cfd6ff;
}
*{ box-sizing:border-box; }
body{
  margin:0; padding:20px; font-family:"Inter",sans-serif;
  background: radial-gradient(1200px 600px at top,#1c2340,transparent 60%), var(--bg-main);
  color:var(--text);
}

/* Nav */
.nav-bar { display: flex; gap: 8px; margin-bottom: 20px; justify-content: center; }
.nav-btn { background: rgba(255,255,255,0.05); border: 1px solid var(--border); color: var(--accent); padding: 8px 12px; border-radius: 10px; text-decoration: none; font-size: 0.85rem; flex: 1; text-align: center; }
.active-nav { background: var(--accent); color: #000; }

/* Last Updated Banner */
.last-updated-banner { font-size: 0.75rem; color: var(--muted); text-align: center; margin-bottom: 15px; opacity: 0.8; }

.locked-content, .locked-content *{ pointer-events:none!important; user-select:none!important; }
h1{ margin:0 0 10px; font-size:2rem; text-align: center; font-weight: 700; }
#desc{ padding:18px; margin-bottom:20px; background:rgba(255,255,255,.04); border:1px solid var(--border); border-radius:18px; color:var(--muted); line-height: 1.6; }

.countdown{
  margin: 10px 0 20px; padding:15px; background:linear-gradient(135deg,#2b3160,#1b1f3d);
  border-radius:15px; display:flex; justify-content:space-between; align-items:center; font-size: 0.85rem;
}
#timer{ font-weight:700; color:var(--accent); }

.top-bar{ display:flex; flex-direction: column; gap: 15px; margin-bottom:18px; }
#authBox{ display:flex; gap:10px; padding:12px; background:rgba(255,255,255,.05); border-radius:15px; border: 1px solid var(--border); }
#authBox input{ background:rgba(0,0,0,.25); border:1px solid var(--border); color:var(--accent); padding:10px; border-radius:10px; width: 100%; outline: none; }
#authBox button{ background:#3a43a0; border:none; color:#fff; padding:10px 15px; border-radius:10px; cursor:pointer; font-weight: 600; }

table{ width:100%; border-collapse:collapse; background:var(--bg-panel); border-radius:18px; overflow:hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
th,td{ padding:12px; text-align:center; border-bottom:1px solid var(--border); }
th{ background:var(--bg-header); color:var(--accent); text-transform:uppercase; font-size: 0.65rem; letter-spacing: 0.1em; }
</style>
</head>
<body>

<div class="nav-bar">
  <a href="errahworld.html" class="nav-btn active-nav">🏋️ Log</a>
  <a href="updates.html" class="nav-btn">📢 Updates</a>
</div>

<div id="lastUpdateBanner" class="last-updated-banner">Syncing...</div>

<h1 id="title">Strength Log</h1>
<p id="desc">Loading...</p>

<div class="countdown">
  <strong>Road to RM Drop 🏋️</strong>
  <div id="timer">Loading…</div>
</div>

<div class="top-bar">
  <div id="authBox">
    <input id="email" placeholder="Email">
    <input id="password" type="password" placeholder="Password">
    <button id="loginBtn">Login</button>
    <button id="logoutBtn" style="display:none">Logout</button>
  </div>
</div>

<table id="table" class="locked-content">
  <thead><tr><th style="text-align:left">Lift</th><th>Current</th><th>1RM</th><th>Level</th></tr></thead>
  <tbody id="tbody"></tbody>
</table>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>
firebase.initializeApp({
  apiKey:"AIzaSyBoePuKarSCVgvxQQBGvkMKq16DvKmBYBE",
  authDomain:"strenght-a9f37.firebaseapp.com",
  databaseURL:"https://strenght-a9f37-default-rtdb.firebaseio.com",
  projectId:"strenght-a9f37",
  storageBucket:"strenght-a9f37.firebasestorage.app",
  messagingSenderId:"469926449178",
  appId:"1:469926449178:web:b9623947a1c1865b0f81a3"
});

const auth=firebase.auth();
const db=firebase.database();
auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);

const emailEl=document.getElementById("email"), passEl=document.getElementById("password"),
      loginBtn=document.getElementById("loginBtn"), logoutBtn=document.getElementById("logoutBtn"),
      titleEl=document.getElementById("title"), descEl=document.getElementById("desc"),
      tbody=document.getElementById("tbody"), table=document.getElementById("table"),
      updateBanner=document.getElementById("lastUpdateBanner");

let isAdmin=false;

// Custom Date Formatter
function getFormattedDate() {
  const now = new Date();
  const months = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
  const day = now.getDate();
  const month = months[now.getMonth()];
  const year = now.getFullYear();
  let hours = now.getHours();
  let minutes = now.getMinutes();
  const ampm = hours >= 12 ? 'PM' : 'AM';
  hours = hours % 12 || 12;
  minutes = minutes < 10 ? '0'+minutes : minutes;
  return `${day} ${month} ${year} ${hours}:${minutes} ${ampm}`;
}

loginBtn.onclick=()=>auth.signInWithEmailAndPassword(emailEl.value,passEl.value).catch(e=>alert(e.message));
logoutBtn.onclick=()=>auth.signOut();

auth.onAuthStateChanged(user=>{
  isAdmin=!!user;
  table.classList.toggle("locked-content",!isAdmin);
  [titleEl,descEl,tbody].forEach(el=>el.contentEditable=isAdmin);
  loginBtn.style.display=user?"none":"inline-block";
  emailEl.style.display=user?"none":"inline-block";
  passEl.style.display=user?"none":"inline-block";
  logoutBtn.style.display=user?"inline-block":"none";
});

// Load table data
db.ref("log").on("value", snap=>{
  const d=snap.val()||{};
  titleEl.innerText=d.title||"Strength Log";
  descEl.innerHTML=d.desc||"";
  tbody.innerHTML=d.table||"";
});

// Sync "Last Updated" text from database
db.ref("meta/lastUpdate").on("value", snap => {
  updateBanner.innerText = "Website Last Updated: " + (snap.val() || "Unknown");
});

function saveData(){
  if(!isAdmin) return;
  const dateStr = getFormattedDate();
  db.ref("log").set({
    title:titleEl.innerText, desc:descEl.innerHTML,
    table:tbody.innerHTML
  });
  // Also update the global time so both pages see it
  db.ref("meta/lastUpdate").set(dateStr);
}

["input","blur"].forEach(e=>{ 
  titleEl.addEventListener(e,saveData); 
  descEl.addEventListener(e,saveData); 
  tbody.addEventListener(e,saveData); 
});

// Timer
const targetDate=new Date("February 3, 2026 00:00:00").getTime();
setInterval(()=>{
  const diff=targetDate-Date.now();
  if(diff<=0){ document.getElementById("timer").textContent="RM DAY 🔥"; return; }
  const d=Math.floor(diff/86400000), h=Math.floor(diff/3600000)%24, m=Math.floor(diff/60000)%60, s=Math.floor(diff/1000)%60;
  document.getElementById("timer").textContent=`${d}d ${h}h ${m}m ${s}s`;
},1000);
</script>
</body>
</html>
