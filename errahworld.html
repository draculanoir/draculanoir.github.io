<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Strength Log – 1RM Tracking</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />

<style>
:root{
  --bg-main:#0c0e12;
  --bg-panel:#14161c;
  --bg-header:#1b1e26;
  --border:#2a2d36;
  --text:#d9dbe1;
  --muted:#9da1ac;
  --accent:#bfc6d6;
}

body{
  visibility:hidden;
  font-family:"Segoe UI", Arial, sans-serif;
  background:radial-gradient(circle at top,#12141b,var(--bg-main));
  color:var(--text);
  padding:24px;
}

/* 🔒 VIEWER LOCK */
.locked-content,
.locked-content *{
  pointer-events:none !important;
  user-select:none !important;
  caret-color:transparent !important;
}

.top-bar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  max-width:1020px;
  margin-bottom:12px;
}

#authBox input,
#authBox button{
  background:transparent;
  border:1px solid var(--border);
  color:var(--accent);
  padding:6px 10px;
  border-radius:6px;
  margin-right:4px;
}

table{
  width:100%;
  max-width:1020px;
  border-collapse:collapse;
  background:var(--bg-panel);
  box-shadow:0 0 0 1px var(--border);
}

th, td{
  border:1px solid var(--border);
  padding:10px;
  text-align:center;
}

th{
  background:var(--bg-header);
  color:var(--accent);
  font-size:.75rem;
}

td.left{ text-align:left; }

.last-updated{
  font-size:.75rem;
  color:var(--muted);
}

/* 🏋️ BARBELL */
.calculator{
  max-width:1020px;
  margin-top:32px;
  padding:16px;
  background:var(--bg-panel);
  border:1px solid var(--border);
  border-radius:8px;
}

.calculator input,
.calculator label{
  background:transparent;
  border:1px solid var(--border);
  color:var(--accent);
  padding:8px 12px;
  border-radius:6px;
  margin-right:6px;
}

.barbell{
  margin-top:20px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.bar{
  width:260px;
  height:8px;
  background:#777;
  border-radius:4px;
}

.side{
  display:flex;
  align-items:center;
}

.plate{
  height:60px;
  border-radius:4px;
  margin:0 2px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:.7rem;
  font-weight:600;
  color:#111;
}

.p45{ width:26px; background:#c0392b; }
.p35{ width:24px; background:#d35400; }
.p25{ width:22px; background:#f1c40f; }
.p10{ width:18px; background:#3498db; color:#fff; }
.p5 { width:14px; background:#2ecc71; }
.p2_5{ width:10px; background:#95a5a6; }

.note{ font-size:.75rem; color:var(--muted); margin-top:8px; }
.total{ margin-top:6px; font-size:.85rem; }
</style>
</head>

<body>

<h1 id="title"></h1>
<p id="desc"></p>

<div class="top-bar">
  <div id="authBox">
    <input id="email" placeholder="admin email">
    <input id="password" type="password" placeholder="password">
    <button id="loginBtn">Login</button>
    <button id="logoutBtn" style="display:none">Logout</button>
  </div>
  <div id="lastUpdated" class="last-updated"></div>
</div>

<table id="table" class="locked-content">
  <thead>
    <tr>
      <th class="left">Lift</th>
      <th>Current</th>
      <th>1RM</th>
      <th>Strength Level</th>
    </tr>
  </thead>
  <tbody id="tbody"></tbody>
</table>

<div class="calculator">
  <h3>Barbell Calculator (lbs)</h3>

  <input id="targetWeight" type="number" placeholder="Loaded weight">
  <input id="barWeight" type="number" value="45" placeholder="Bar weight">

  <label>
    <input type="checkbox" id="includeBar" checked>
    Include bar for plates
  </label>

  <div class="barbell">
    <div id="leftSide" class="side"></div>
    <div class="bar"></div>
    <div id="rightSide" class="side"></div>
  </div>

  <div id="roundNote" class="note"></div>
  <div id="trueLoad" class="total"></div>
</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>
firebase.initializeApp({
  apiKey: "AIzaSyBoePuKarSCVgvxQQBGvkMKq16DvKmBYBE",
  authDomain: "strenght-a9f37.firebaseapp.com",
  databaseURL: "https://strenght-a9f37-default-rtdb.firebaseio.com",
  projectId: "strenght-a9f37",
  storageBucket: "strenght-a9f37.firebasestorage.app",
  messagingSenderId: "469926449178",
  appId: "1:469926449178:web:b9623947a1c1865b0f81a3"
});

const plates=[45,35,25,10,5,2.5];
const left=leftSide,right=rightSide,note=roundNote,trueLoadEl=trueLoad;

function updateBarbell(){
  left.innerHTML=""; right.innerHTML=""; note.innerText="";
  const loaded=Number(targetWeight.value);
  const bar=Number(barWeight.value)||0;
  const include=includeBar.checked;
  if(!loaded) return;

  let remaining=(loaded-(include?bar:0))/2;
  if(remaining<0){ note.innerText="Target is less than bar."; return; }

  let used=[];
  plates.forEach(p=>{ while(remaining>=p){ remaining-=p; used.push(p); }});
  if(remaining>0) note.innerText="Rounded down.";

  used.forEach(p=>{
    const c=p===2.5?"p2_5":"p"+p;
    right.innerHTML+=`<div class="plate ${c}">${p}</div>`;
  });
  [...used].reverse().forEach(p=>{
    const c=p===2.5?"p2_5":"p"+p;
    left.innerHTML+=`<div class="plate ${c}">${p}</div>`;
  });

  /* ✅ FIXED TRUE LOAD LOGIC */
  trueLoadEl.innerText =
    `Loaded: ${loaded} lbs · True load: ${loaded + bar} lbs`;
}

[targetWeight,barWeight,includeBar].forEach(el=>{
  el.addEventListener("input",updateBarbell);
});
</script>
</body>
</html>
