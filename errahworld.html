<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Strength Log – 1RM Tracking</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />

<style>
:root{
  --bg-main:#0c0e12;
  --bg-panel:#14161c;
  --bg-header:#1b1e26;
  --border:#2a2d36;
  --text:#e4e6eb;
  --muted:#9da1ac;
  --accent:#cfd6ff;
}

*{ box-sizing:border-box; }

body{
  margin:0;
  padding:24px;
  font-family:Inter,"Segoe UI",system-ui,sans-serif;
  background:
    radial-gradient(900px 500px at top,#1a1f33,transparent 60%),
    var(--bg-main);
  color:var(--text);
}

/* 🔒 READ ONLY LOCK */
.locked-content,
.locked-content *{
  pointer-events:none!important;
  user-select:none!important;
  caret-color:transparent!important;
}

/* HEADER */
h1{ margin:0 0 6px; font-size:1.8rem; }
p{ margin:0 0 18px; color:var(--muted); }

/* TOP BAR */
.top-bar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  max-width:1100px;
  margin-bottom:16px;
  flex-wrap:wrap;
}

#authBox{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

#authBox input,
#authBox button{
  background:#0f1118;
  border:1px solid var(--border);
  color:var(--accent);
  padding:8px 12px;
  border-radius:8px;
}

#authBox button{
  cursor:pointer;
}

/* TABLE */
table{
  width:100%;
  max-width:1100px;
  border-collapse:collapse;
  background:var(--bg-panel);
  border-radius:14px;
  overflow:hidden;
  box-shadow:0 20px 40px rgba(0,0,0,.5);
}

th,td{
  padding:14px;
  text-align:center;
  border-bottom:1px solid var(--border);
}

th{
  background:var(--bg-header);
  font-size:.7rem;
  letter-spacing:.12em;
  text-transform:uppercase;
  color:var(--accent);
}

td.left{ text-align:left; }

tr:last-child td{ border-bottom:none; }

.last-updated{
  font-size:.75rem;
  color:var(--muted);
}

/* CALCULATOR */
.calculator{
  max-width:1100px;
  margin-top:40px;
  padding:20px;
  background:var(--bg-panel);
  border-radius:16px;
  border:1px solid var(--border);
}

.calculator-controls{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

.calculator input{
  background:#0f1118;
  border:1px solid var(--border);
  color:var(--accent);
  padding:10px 14px;
  border-radius:10px;
}

.calculator label{
  display:flex;
  align-items:center;
  gap:6px;
  padding:10px 14px;
  border-radius:10px;
  border:1px solid var(--border);
}

/* BARBELL */
.barbell{
  margin-top:22px;
  display:flex;
  justify-content:center;
  align-items:center;
}

.bar{
  width:280px;
  height:10px;
  background:linear-gradient(#aaa,#666);
  border-radius:5px;
}

.side{ display:flex; }

.plate{
  height:62px;
  margin:0 2px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:.7rem;
  font-weight:700;
  border-radius:5px;
  box-shadow:inset 0 -3px 6px rgba(0,0,0,.4);
}

.p45{ width:28px; background:#c0392b; }
.p35{ width:26px; background:#d35400; }
.p25{ width:24px; background:#f1c40f; color:#222; }
.p10{ width:20px; background:#3498db; color:#fff; }
.p5 { width:16px; background:#2ecc71; }
.p2_5{ width:12px; background:#bdc3c7; }

.total{ margin-top:8px; font-size:.85rem; color:var(--muted); }

@media(max-width:600px){
  .calculator-controls{ flex-direction:column; }
}
</style>
</head>

<body>

<h1 id="title"></h1>
<p id="desc"></p>

<div class="top-bar">
  <div id="authBox">
    <input id="email" placeholder="admin email">
    <input id="password" type="password" placeholder="password">
    <button id="loginBtn">Login</button>
    <button id="logoutBtn" style="display:none">Logout</button>
  </div>
  <div id="lastUpdated" class="last-updated"></div>
</div>

<table id="table" class="locked-content">
<thead>
<tr>
<th class="left">Lift</th>
<th>Current</th>
<th>1RM</th>
<th>Strength Level</th>
</tr>
</thead>
<tbody id="tbody"></tbody>
</table>

<div class="calculator">
<h3>Barbell Calculator (lbs)</h3>
<div class="calculator-controls">
  <input id="targetWeight" type="number" placeholder="Loaded weight">
  <input id="barWeight" type="number" value="45">
  <label><input type="checkbox" id="includeBar" checked> Include bar</label>
</div>

<div class="barbell">
  <div id="leftSide" class="side"></div>
  <div class="bar"></div>
  <div id="rightSide" class="side"></div>
</div>

<div id="trueLoad" class="total"></div>
</div>

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>
firebase.initializeApp({
  apiKey:"AIzaSyBoePuKarSCVgvxQQBGvkMKq16DvKmBYBE",
  authDomain:"strenght-a9f37.firebaseapp.com",
  databaseURL:"https://strenght-a9f37-default-rtdb.firebaseio.com",
  projectId:"strenght-a9f37",
  storageBucket:"strenght-a9f37.firebasestorage.app",
  messagingSenderId:"469926449178",
  appId:"1:469926449178:web:b9623947a1c1865b0f81a3"
});

const auth=firebase.auth();
const db=firebase.database();

/* DOM refs */
const titleEl=document.getElementById("title");
const descEl=document.getElementById("desc");
const tbody=document.getElementById("tbody");
const table=document.getElementById("table");
const lastUpdatedEl=document.getElementById("lastUpdated");

const emailEl=document.getElementById("email");
const passEl=document.getElementById("password");
const loginBtn=document.getElementById("loginBtn");
const logoutBtn=document.getElementById("logoutBtn");

/* calculator refs */
const targetWeight=document.getElementById("targetWeight");
const barWeight=document.getElementById("barWeight");
const includeBar=document.getElementById("includeBar");
const leftSide=document.getElementById("leftSide");
const rightSide=document.getElementById("rightSide");
const trueLoad=document.getElementById("trueLoad");

let isAdmin=false;

/* DATE */
function formatDate(d){
  return d.toLocaleString("en-US",{
    month:"long",day:"2-digit",year:"numeric",
    hour:"numeric",minute:"2-digit",hour12:true
  });
}

/* AUTH */
loginBtn.onclick=()=>auth.signInWithEmailAndPassword(emailEl.value,passEl.value).catch(e=>alert(e.message));
logoutBtn.onclick=()=>auth.signOut();

auth.onAuthStateChanged(user=>{
  isAdmin=!!user;
  table.classList.toggle("locked-content",!isAdmin);
  [titleEl,descEl,tbody].forEach(el=>el.contentEditable=isAdmin);
  loginBtn.style.display=user?"none":"inline-block";
  logoutBtn.style.display=user?"inline-block":"none";
});

/* LOAD DATA */
db.ref("log").once("value").then(snap=>{
  const d=snap.val()||{};
  titleEl.innerText=d.title||"";
  descEl.innerHTML=d.desc||"";
  tbody.innerHTML=d.table||"";
  lastUpdatedEl.innerText=d.updated?`Last updated: ${d.updated}`:"";
});

/* SAVE */
function saveData(){
  if(!isAdmin) return;
  const updated=formatDate(new Date());
  db.ref("log").set({
    title:titleEl.innerText,
    desc:descEl.innerHTML,
    table:tbody.innerHTML,
    updated
  });
  lastUpdatedEl.innerText=`Last updated: ${updated}`;
}

["input","keyup","paste","blur"].forEach(e=>{
  titleEl.addEventListener(e,saveData);
  descEl.addEventListener(e,saveData);
  tbody.addEventListener(e,saveData);
});

/* BARBELL */
const plates=[45,35,25,10,5,2.5];

function updateBarbell(){
  leftSide.innerHTML="";
  rightSide.innerHTML="";
  const t=+targetWeight.value;
  const b=+barWeight.value||0;
  if(!t) return;

  let r=(includeBar.checked?(t-b):t)/2;
  let used=[];
  plates.forEach(p=>{
    while(r>=p){ r-=p; used.push(p); }
  });

  used.forEach(p=>rightSide.innerHTML+=`<div class="plate ${p===2.5?"p2_5":"p"+p}">${p}</div>`);
  [...used].reverse().forEach(p=>leftSide.innerHTML+=`<div class="plate ${p===2.5?"p2_5":"p"+p}">${p}</div>`);

  trueLoad.innerText=`Loaded: ${t} lbs · True load: ${includeBar.checked?t:(used.reduce((s,p)=>s+p*2,0)+b)} lbs`;
}

[targetWeight,barWeight,includeBar].forEach(el=>el.addEventListener("input",updateBarbell));
</script>

</body>
</html>
