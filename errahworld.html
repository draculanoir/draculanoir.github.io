<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>ErrahWorld | AI Strength Log</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap');
        
        :root {
            --bg-main: #06080f;
            --bg-panel: rgba(15, 18, 35, 0.7);
            --accent: #7c89ff;
            --accent-glow: rgba(124, 137, 255, 0.4);
            --text-main: #ffffff;
            --text-muted: #8a91ad;
            --border-glass: rgba(255, 255, 255, 0.08);
            --card-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
        }

        * { box-sizing: border-box; transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1); }
        
        body {
            margin: 0; padding: 20px; font-family: "Plus Jakarta Sans", sans-serif;
            background: 
                radial-gradient(circle at 50% -20%, #1e264d 0%, transparent 50%),
                radial-gradient(circle at 0% 100%, #0d1121 0%, transparent 40%),
                var(--bg-main);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
        }

        /* Navigation - Floating Pill Style */
        .nav-bar { 
            display: flex; gap: 8px; margin-bottom: 30px; 
            background: rgba(255,255,255,0.03); padding: 6px; 
            border-radius: 18px; border: 1px solid var(--border-glass);
            width: fit-content; margin-inline: auto;
            backdrop-filter: blur(10px);
        }
        .nav-btn { 
            padding: 10px 24px; border-radius: 14px; 
            text-decoration: none; font-size: 0.85rem; font-weight: 600;
            color: var(--text-muted); text-align: center;
        }
        .active-nav { 
            background: var(--accent); color: #000; 
            box-shadow: 0 4px 15px var(--accent-glow);
        }

        /* Header Section */
        .last-updated-banner { 
            font-size: 0.65rem; color: var(--accent); text-align: center; 
            margin-bottom: 8px; font-weight: 800; letter-spacing: 2px; text-transform: uppercase;
            opacity: 0.8;
        }
        h1 { 
            margin: 0 0 15px; font-size: clamp(2rem, 8vw, 3rem); text-align: center; font-weight: 800; 
            background: linear-gradient(to bottom, #fff 50%, var(--accent));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            letter-spacing: -1.5px;
        }
        #desc { 
            padding: 24px; margin-bottom: 30px; border-radius: 24px; 
            background: var(--bg-panel); border: 1px solid var(--border-glass);
            color: var(--text-muted); text-align: center; font-size: 1rem;
            backdrop-filter: blur(15px); line-height: 1.6;
            outline: none;
        }

        /* Countdown Card */
        .countdown {
            margin-bottom: 30px; padding: 24px; 
            background: linear-gradient(145deg, rgba(30,38,77,0.4), rgba(10,12,20,0.4));
            border-radius: 28px; border: 1px solid rgba(124,137,255,0.15);
            box-shadow: var(--card-shadow); display: flex; flex-direction: column; align-items: center; gap: 8px;
        }
        .countdown strong { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 4px; color: var(--accent); }
        #timer { 
            font-size: 2.2rem; font-weight: 800; font-variant-numeric: tabular-nums;
            text-shadow: 0 0 30px var(--accent-glow); color: #fff;
        }

        /* Auth/Login UI */
        #authBox { 
            display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 30px; 
            justify-content: center;
        }
        #authBox input { 
            background: rgba(0,0,0,0.4); 
            border: 1px solid var(--border-glass); color: #fff; padding: 14px 18px; 
            border-radius: 16px; outline: none; font-size: 0.9rem; min-width: 200px;
        }
        #authBox input:focus { border-color: var(--accent); box-shadow: 0 0 0 4px rgba(124,137,255,0.1); }
        #authBox button { 
            background: #fff; border: none; color: #000; padding: 14px 28px; 
            border-radius: 16px; cursor: pointer; font-weight: 700; font-size: 0.9rem;
        }
        #authBox button:hover { transform: translateY(-3px); box-shadow: 0 10px 20px rgba(255,255,255,0.15); }

        /* The Data Table */
        .table-container { 
            overflow-x: auto; border-radius: 28px; border: 1px solid var(--border-glass); 
            box-shadow: var(--card-shadow); background: var(--bg-panel);
            backdrop-filter: blur(20px);
        }
        table { width: 100%; border-collapse: collapse; min-width: 500px; }
        th { 
            background: rgba(255,255,255,0.03); color: var(--text-muted); 
            padding: 20px; font-size: 0.7rem; font-weight: 800; letter-spacing: 2px;
            text-transform: uppercase; border-bottom: 1px solid var(--border-glass);
        }
        td { padding: 22px 15px; text-align: center; border-bottom: 1px solid var(--border-glass); font-weight: 500; font-size: 1rem; }
        tr:last-child td { border-bottom: none; }
        tr:hover td { background: rgba(124, 137, 255, 0.05); color: var(--accent); }

        /* Editable State */
        [contenteditable="true"] { cursor: cell; }
        [contenteditable="true"]:focus { background: rgba(124, 137, 255, 0.1) !important; outline: 2px solid var(--accent); border-radius: 8px; }
        .locked-content { opacity: 0.95; }

        @media (max-width: 600px) {
            body { padding: 15px; }
            h1 { font-size: 2.2rem; }
            #timer { font-size: 1.6rem; }
            #authBox input { width: 100%; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="nav-bar">
            <a href="errahworld.html" class="nav-btn active-nav">Project Atlas</a>
            <a href="updates.html" class="nav-btn">Updates</a>
        </div>

        <div id="lastUpdateBanner" class="last-updated-banner">NEURAL SYNCING...</div>

        <h1 id="title">Syncing...</h1>
        <div id="desc">Accessing secure server...</div>

        <div class="countdown">
            <strong>RMs drop</strong>
            <div id="timer">--D --H --M --S</div>
        </div>

        <div id="authBox">
            <input id="email" placeholder="Admin Identification">
            <input id="password" type="password" placeholder="Keyphrase">
            <button id="loginBtn">Login</button>
            <button id="logoutBtn" style="display:none">Logout</button>
        </div>

        <div class="table-container">
            <table id="table" class="locked-content">
                <thead>
                    <tr>
                        <th style="text-align:left; padding-left: 30px;">Exercise</th>
                        <th>Current</th>
                        <th>1RM</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="tbody"></tbody>
            </table>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <script>
        firebase.initializeApp({
            apiKey:"AIzaSyBoePuKarSCVgvxQQBGvkMKq16DvKmBYBE",
            authDomain:"strenght-a9f37.firebaseapp.com",
            databaseURL:"https://strenght-a9f37-default-rtdb.firebaseio.com",
            projectId:"strenght-a9f37",
            storageBucket:"strenght-a9f37.firebasestorage.app",
            messagingSenderId:"469926449178",
            appId:"1:469926449178:web:b9623947a1c1865b0f81a3"
        });

        const auth = firebase.auth();
        const db = firebase.database();
        auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);

        const emailEl = document.getElementById("email"), 
              passEl = document.getElementById("password"),
              loginBtn = document.getElementById("loginBtn"), 
              logoutBtn = document.getElementById("logoutBtn"),
              titleEl = document.getElementById("title"), 
              descEl = document.getElementById("desc"),
              tbody = document.getElementById("tbody"), 
              table = document.getElementById("table"),
              updateBanner = document.getElementById("lastUpdateBanner");

        let isAdmin = false;

        function getFormattedDate() {
            const now = new Date();
            const months = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
            return `${now.getDate()} ${months[now.getMonth()]} ${now.getFullYear()} ${now.getHours() % 12 || 12}:${String(now.getMinutes()).padStart(2, '0')} ${now.getHours() >= 12 ? 'PM' : 'AM'}`;
        }

        loginBtn.onclick = () => auth.signInWithEmailAndPassword(emailEl.value, passEl.value).catch(e => alert(e.message));
        logoutBtn.onclick = () => { if(confirm("Terminate session?")) auth.signOut(); };

        auth.onAuthStateChanged(user => {
            isAdmin = !!user;
            table.classList.toggle("locked-content", !isAdmin);
            [titleEl, descEl, tbody].forEach(el => el.contentEditable = isAdmin);
            loginBtn.style.display = user ? "none" : "inline-block";
            emailEl.style.display = user ? "none" : "inline-block";
            passEl.style.display = user ? "none" : "inline-block";
            logoutBtn.style.display = user ? "inline-block" : "none";
        });

        db.ref("log").once("value", snap => {
            const d = snap.val() || {};
            titleEl.innerText = d.title || "Strength Log";
            descEl.innerHTML = d.desc || "Neural link active. Edit description...";
            tbody.innerHTML = d.table || "";
        });

        db.ref("meta/lastUpdate").on("value", snap => {
            updateBanner.innerText = "SYSTEM LAST UPDATED: " + (snap.val() || "UNKNOWN");
        });

        function saveData() {
            if(!isAdmin) return;
            const dateStr = getFormattedDate();
            db.ref("log").set({ title: titleEl.innerText, desc: descEl.innerHTML, table: tbody.innerHTML });
            db.ref("meta/lastUpdate").set(dateStr);
        }
        [titleEl, descEl, tbody].forEach(el => el.addEventListener("blur", saveData));

        const targetDate = new Date("February 3, 2026 00:00:00").getTime();
        setInterval(() => {
            const diff = targetDate - Date.now();
            if(diff <= 0) { document.getElementById("timer").textContent = "LIMIT BREAKER DAY 🔥"; return; }
            const d = Math.floor(diff/86400000), 
                  h = Math.floor(diff/3600000)%24, 
                  m = Math.floor(diff/60000)%60, 
                  s = Math.floor(diff/1000)%60;
            document.getElementById("timer").textContent = `${d}D ${h}H ${m}M ${s}S`;
        }, 1000);
    </script>
</body>
</html>
