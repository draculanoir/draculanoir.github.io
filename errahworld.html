<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Strength Log – 1RM Tracking</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />

<style>
:root{
  --bg-main:#0b0d12;
  --bg-panel:rgba(20,22,28,.75);
  --bg-header:rgba(30,34,44,.9);
  --border:rgba(255,255,255,.08);
  --text:#e7e9ef;
  --muted:#a5a9b6;
  --accent:#cfd6ff;
  --glow:0 20px 40px rgba(0,0,0,.6);
}

*{ box-sizing:border-box; }

body{
  margin:0;
  font-family:"Inter","Segoe UI",system-ui,sans-serif;
  background:
    radial-gradient(1200px 600px at top,#1a1f33,transparent 60%),
    radial-gradient(800px 400px at bottom,#0f1320,transparent 60%),
    var(--bg-main);
  color:var(--text);
  padding:28px;
}

/* 🔒 HARD READ-ONLY LOCK */
.locked-content,
.locked-content *{
  pointer-events:none!important;
  user-select:none!important;
  caret-color:transparent!important;
}

/* HEADER */
h1{
  font-size:1.9rem;
  letter-spacing:.5px;
  margin-bottom:4px;
}
p{
  color:var(--muted);
  max-width:720px;
}

/* TOP BAR */
.top-bar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  max-width:1100px;
  margin:20px auto;
  flex-wrap:wrap;
}

#authBox{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

#authBox input,
#authBox button{
  background:rgba(255,255,255,.03);
  border:1px solid var(--border);
  color:var(--accent);
  padding:8px 12px;
  border-radius:10px;
  backdrop-filter:blur(12px);
}

#authBox button{
  cursor:pointer;
  transition:.25s;
}
#authBox button:hover{
  transform:translateY(-1px);
  box-shadow:0 6px 16px rgba(0,0,0,.4);
}

/* TABLE */
table{
  width:100%;
  max-width:1100px;
  margin:auto;
  border-collapse:collapse;
  background:var(--bg-panel);
  backdrop-filter:blur(18px);
  border-radius:16px;
  overflow:hidden;
  box-shadow:var(--glow);
}

th,td{
  padding:14px;
  text-align:center;
  border-bottom:1px solid var(--border);
}

th{
  background:var(--bg-header);
  font-size:.7rem;
  letter-spacing:.12em;
  text-transform:uppercase;
  color:var(--accent);
}

td.left{ text-align:left; }

tr:hover td{
  background:rgba(255,255,255,.02);
}

.last-updated{
  font-size:.75rem;
  color:var(--muted);
}

/* 🏋️ CALCULATOR */
.calculator{
  max-width:1100px;
  margin:48px auto 0;
  padding:22px;
  background:var(--bg-panel);
  backdrop-filter:blur(18px);
  border-radius:18px;
  border:1px solid var(--border);
  box-shadow:var(--glow);
}

.calculator h3{
  margin-top:0;
  font-weight:500;
  letter-spacing:.4px;
}

.calculator-controls{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

.calculator input{
  background:rgba(255,255,255,.03);
  border:1px solid var(--border);
  color:var(--accent);
  padding:10px 14px;
  border-radius:12px;
}

.calculator label{
  display:flex;
  align-items:center;
  gap:6px;
  padding:10px 14px;
  border-radius:12px;
  border:1px solid var(--border);
  background:rgba(255,255,255,.03);
}

/* BARBELL */
.barbell{
  margin-top:26px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
}

.bar{
  width:300px;
  height:10px;
  background:linear-gradient(#aaa,#666);
  border-radius:6px;
  box-shadow:inset 0 2px 3px rgba(0,0,0,.6);
}

.side{ display:flex; align-items:center; }

.plate{
  height:64px;
  margin:0 2px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:.7rem;
  font-weight:700;
  border-radius:6px;
  box-shadow:
    inset 0 2px 4px rgba(255,255,255,.2),
    inset 0 -4px 6px rgba(0,0,0,.4),
    0 6px 14px rgba(0,0,0,.5);
}

.p45{ width:28px; background:#c0392b; }
.p35{ width:26px; background:#d35400; }
.p25{ width:24px; background:#f1c40f; color:#222; }
.p10{ width:20px; background:#3498db; color:#fff; }
.p5 { width:16px; background:#2ecc71; }
.p2_5{ width:12px; background:#bdc3c7; }

.note{
  margin-top:10px;
  font-size:.75rem;
  color:var(--muted);
}
.total{
  margin-top:6px;
  font-size:.85rem;
}

/* MOBILE */
@media(max-width:600px){
  body{ padding:16px; }
  .calculator-controls{ flex-direction:column; }
}
</style>
</head>

<body>

<h1 id="title"></h1>
<p id="desc"></p>

<div class="top-bar">
  <div id="authBox">
    <input id="email" placeholder="admin email">
    <input id="password" type="password" placeholder="password">
    <button id="loginBtn">Login</button>
    <button id="logoutBtn" style="display:none">Logout</button>
  </div>
  <div id="lastUpdated" class="last-updated"></div>
</div>

<table id="table" class="locked-content">
<thead>
<tr>
<th class="left">Lift</th>
<th>Current</th>
<th>1RM</th>
<th>Strength Level</th>
</tr>
</thead>
<tbody id="tbody"></tbody>
</table>

<div class="calculator">
<h3>Barbell Calculator (lbs)</h3>
<div class="calculator-controls">
<input id="targetWeight" type="number" placeholder="Loaded weight">
<input id="barWeight" type="number" value="45">
<label><input type="checkbox" id="includeBar" checked> Include bar</label>
</div>

<div class="barbell">
<div id="leftSide" class="side"></div>
<div class="bar"></div>
<div id="rightSide" class="side"></div>
</div>

<div id="trueLoad" class="total"></div>
</div>

<!-- 🔥 YOUR EXISTING FIREBASE + JS LOGIC STAYS EXACTLY THE SAME -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<!-- keep your JS exactly as before -->
</body>
</html>
