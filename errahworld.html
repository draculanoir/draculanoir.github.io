<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Strength Log – 1RM Tracking</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />

<style>
:root{
  --bg-main:#0c0e12;
  --bg-panel:#14161c;
  --bg-header:#1b1e26;
  --border:#2a2d36;
  --text:#d9dbe1;
  --muted:#9da1ac;
  --accent:#bfc6d6;
}

body{
  visibility:hidden;
  font-family:"Segoe UI",Arial,sans-serif;
  background:radial-gradient(circle at top,#12141b,var(--bg-main));
  color:var(--text);
  padding:24px;
}

.locked-content,
.locked-content *{
  pointer-events:none !important;
  user-select:none !important;
  caret-color:transparent !important;
}

*:focus{ outline:none !important; }

.top-bar{
  display:flex;
  justify-content:space-between;
  max-width:1020px;
  margin-bottom:12px;
}

table{
  width:100%;
  max-width:1020px;
  border-collapse:collapse;
  background:var(--bg-panel);
}

th,td{
  border:1px solid var(--border);
  padding:10px;
  text-align:center;
}

th{ background:var(--bg-header); font-size:.75rem; }

td.left{ text-align:left; }

button{
  background:transparent;
  border:1px solid var(--border);
  color:var(--accent);
  padding:4px 8px;
  border-radius:6px;
  cursor:pointer;
}

/* 🔲 Modal */
#historyModal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.6);
  justify-content:center;
  align-items:center;
}

#historyBox{
  background:var(--bg-panel);
  padding:16px;
  width:360px;
  border-radius:10px;
}

.history-item{
  display:flex;
  justify-content:space-between;
  border-bottom:1px solid var(--border);
  padding:6px 0;
}
</style>
</head>

<body>

<h1 id="title"></h1>
<p id="desc"></p>

<div class="top-bar">
  <div id="authBox">
    <input id="email" placeholder="admin email">
    <input id="password" type="password">
    <button id="loginBtn">Login</button>
    <button id="logoutBtn" style="display:none">Logout</button>
  </div>
  <div id="lastUpdated"></div>
</div>

<table id="table" class="locked-content">
<thead>
<tr>
  <th class="left">Lift</th>
  <th>Current</th>
  <th>1RM</th>
  <th>Strength Level</th>
  <th>History</th>
</tr>
</thead>
<tbody id="tbody"></tbody>
</table>

<!-- 🔲 History Modal -->
<div id="historyModal">
  <div id="historyBox">
    <h3 id="historyTitle"></h3>
    <div id="historyList"></div>
    <button onclick="closeHistory()">Close</button>
  </div>
</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>
firebase.initializeApp({
  apiKey: "AIzaSyBoePuKarSCVgvxQQBGvkMKq16DvKmBYBE",
  authDomain: "strenght-a9f37.firebaseapp.com",
  databaseURL: "https://strenght-a9f37-default-rtdb.firebaseio.com",
  projectId: "strenght-a9f37"
});

const auth=firebase.auth(), db=firebase.database();

const tbody=document.getElementById("tbody");
const lastUpdatedEl=document.getElementById("lastUpdated");

let isAdmin=false, historyData={};

/* 🔐 Auth */
auth.onAuthStateChanged(u=>{
  isAdmin=!!u;
  document.getElementById("table").classList.toggle("locked-content",!isAdmin);
});

/* 📥 Load */
db.ref("log").once("value").then(s=>{
  const d=s.val(); if(!d)return;
  tbody.innerHTML=d.table;
  historyData=d.history||{};
  lastUpdatedEl.innerText="Last updated: "+d.updated;
  attachHistoryButtons();
  document.body.style.visibility="visible";
});

/* ➕ Attach history buttons */
function attachHistoryButtons(){
  tbody.querySelectorAll("tr").forEach(row=>{
    const lift=row.children[0].innerText;
    const id=lift.toLowerCase().replace(/\s+/g,"_");

    row.dataset.id=id;
    const btn=document.createElement("button");
    btn.innerText="View";
    btn.onclick=()=>openHistory(id,lift);

    const td=document.createElement("td");
    td.appendChild(btn);
    row.appendChild(td);
  });
}

/* 🧾 Open history */
function openHistory(id,name){
  document.getElementById("historyTitle").innerText=name+" History";
  const list=document.getElementById("historyList");
  list.innerHTML="";

  (historyData[id]||[]).forEach((h,i)=>{
    const div=document.createElement("div");
    div.className="history-item";
    div.innerHTML=`<span contenteditable="${isAdmin}">${h.value}</span>
                   <small>${h.date}</small>`;
    list.appendChild(div);
  });

  document.getElementById("historyModal").style.display="flex";
}

function closeHistory(){
  document.getElementById("historyModal").style.display="none";
}

/* 💾 Save + push history */
document.addEventListener("input",e=>{
  if(!isAdmin) return;
  const row=e.target.closest("tr");
  if(!row) return;

  const id=row.dataset.id;
  const value=row.children[1].innerText;

  const now=new Date();
  const date=`${now.toLocaleDateString("en-GB",{day:"numeric",month:"long",year:"numeric"})} · ${now.toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit"})}`;

  historyData[id]=historyData[id]||[];
  historyData[id].unshift({value,date});

  db.ref("log").set({
    table:tbody.innerHTML,
    history:historyData,
    updated:date
  });
});
</script>

</body>
</html>
