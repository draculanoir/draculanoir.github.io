<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Strength Log – 1RM Tracking</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

:root{
  --bg-main:#0a0c13;
  --bg-panel:rgba(22,26,42,.88);
  --bg-header:rgba(32,38,64,.95);
  --border:rgba(255,255,255,.08);
  --text:#eef0f6;
  --muted:#9aa1b3;
  --accent:#cfd6ff;
  --shadow:0 18px 40px rgba(0,0,0,.55);
}

*{ box-sizing:border-box; }

body{
  margin:0;
  padding:28px;
  font-family:"Inter",system-ui,sans-serif;
  background:var(--bg-main);
  color:var(--text);
}

.locked-content,
.locked-content *{
  pointer-events:none!important;
  user-select:none!important;
}

#notifBell{ cursor:pointer; font-size:1.2rem; }
#notifCount{
  background:#ff4757;
  color:#fff;
  font-size:.65rem;
  padding:2px 6px;
  border-radius:999px;
}

#notifPanel{
  position:fixed;
  top:90px;
  right:30px;
  width:320px;
  max-height:420px;
  overflow:auto;
  background:var(--bg-panel);
  border-radius:18px;
  display:none;
  padding:14px;
  z-index:999;
}

.notif{
  padding:10px;
  margin-bottom:8px;
  border-radius:12px;
  background:rgba(255,255,255,.05);
  font-size:.85rem;
}
</style>
</head>

<body>

<h1 id="title"></h1>
<p id="desc"></p>

<div class="top-bar">
  <div id="authBox">
    <input id="email" placeholder="admin email">
    <input id="password" type="password" placeholder="password">
    <button id="loginBtn">Login</button>
    <button id="logoutBtn" style="display:none">Logout</button>
  </div>

  <div>
    <span id="notifBell">🔔 <span id="notifCount">0</span></span>
  </div>
</div>

<div id="notifPanel">
  <h4>Notifications</h4>
  <div id="notifList"></div>
</div>

<table id="table" class="locked-content">
<thead>
<tr>
<th class="left">Lift</th>
<th>Current</th>
<th>1RM</th>
<th>Strength</th>
</tr>
</thead>
<tbody id="tbody"></tbody>
</table>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>
/* 🔥 FIREBASE INIT */
firebase.initializeApp({
  apiKey:"AIzaSyBoePuKarSCVgvxQQBGvkMKq16DvKmBYBE",
  authDomain:"strenght-a9f37.firebaseapp.com",
  databaseURL:"https://strenght-a9f37-default-rtdb.firebaseio.com",
  projectId:"strenght-a9f37",
  storageBucket:"strenght-a9f37.firebasestorage.app",
  messagingSenderId:"469926449178",
  appId:"1:469926449178:web:b9623947a1c1865b0f81a3"
});

const auth=firebase.auth();
const db=firebase.database();

/* 🔐 AUTH */
const emailEl=document.getElementById("email");
const passEl=document.getElementById("password");
const loginBtn=document.getElementById("loginBtn");
const logoutBtn=document.getElementById("logoutBtn");

loginBtn.onclick=()=>{
  auth.signInWithEmailAndPassword(emailEl.value,passEl.value)
    .catch(e=>alert(e.message));
};
logoutBtn.onclick=()=>auth.signOut();

/* ✏️ EDITING */
const titleEl=document.getElementById("title");
const descEl=document.getElementById("desc");
const tbody=document.getElementById("tbody");
const table=document.getElementById("table");

auth.onAuthStateChanged(user=>{
  table.classList.toggle("locked-content",!user);
  [titleEl,descEl,tbody].forEach(el=>el.contentEditable=!!user);
  loginBtn.style.display=user?"none":"inline-block";
  logoutBtn.style.display=user?"inline-block":"none";
});

/* 💾 LOAD LOG */
db.ref("log").once("value").then(snap=>{
  const d=snap.val()||{};
  titleEl.innerText=d.title||"";
  descEl.innerHTML=d.desc||"";
  tbody.innerHTML=d.table||"";
});

/* 💾 SAVE LOG */
function saveData(){
  if(!auth.currentUser) return;
  db.ref("log").set({
    title:titleEl.innerText,
    desc:descEl.innerHTML,
    table:tbody.innerHTML,
    updated:new Date().toLocaleString()
  });
}

["input","blur","keyup","paste"].forEach(e=>{
  titleEl.addEventListener(e,saveData);
  descEl.addEventListener(e,saveData);
  tbody.addEventListener(e,saveData);
});

/* 🔊 VOICE */
function playVoice(text){
  const msg=new SpeechSynthesisUtterance(text);
  msg.rate=.9;
  msg.pitch=1.05;
  speechSynthesis.speak(msg);
}

/* 🔔 NOTIFICATIONS */
const notifBell=document.getElementById("notifBell");
const notifPanel=document.getElementById("notifPanel");
const notifList=document.getElementById("notifList");
const notifCount=document.getElementById("notifCount");

let lastSeen=localStorage.getItem("lastSeenNotif")||0;

notifBell.onclick=()=>{
  notifPanel.style.display=
    notifPanel.style.display==="block"?"none":"block";
  localStorage.setItem("lastSeenNotif",Date.now());
  notifCount.textContent="0";
};

db.ref("notifications").on("value",snap=>{
  const data=snap.val()||{};
  notifList.innerHTML="";
  let unread=0;

  Object.values(data)
    .sort((a,b)=>b.timestamp-a.timestamp)
    .forEach(n=>{
      notifList.innerHTML+=`<div class="notif">${n.text}</div>`;
      if(n.timestamp>lastSeen) unread++;
    });

  notifCount.textContent=unread;
  if(unread>0) playVoice("New update available");
});
</script>

</body>
</html>
