<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Strength Log – 1RM Tracking</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />

<style>
:root{
  --bg-main:#0c0e12;
  --bg-panel:#14161c;
  --bg-header:#1b1e26;
  --border:#2a2d36;
  --text:#d9dbe1;
  --muted:#9da1ac;
  --accent:#bfc6d6;
}

body{
  visibility:hidden;
  font-family:"Segoe UI",Arial,sans-serif;
  background:radial-gradient(circle at top,#12141b,var(--bg-main));
  color:var(--text);
  padding:24px;
}

/* Lock viewers */
.locked-content,
.locked-content *{
  pointer-events:none!important;
  user-select:none!important;
  caret-color:transparent!important;
}

*:focus{outline:none}

/* Layout */
.top-bar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  max-width:1020px;
  margin-bottom:12px;
}

#authBox input,
#authBox button{
  background:transparent;
  border:1px solid var(--border);
  color:var(--accent);
  padding:6px 10px;
  border-radius:6px;
  margin-right:4px;
}

table{
  width:100%;
  max-width:1020px;
  border-collapse:collapse;
  background:var(--bg-panel);
  box-shadow:0 0 0 1px var(--border);
}

th,td{
  border:1px solid var(--border);
  padding:10px;
  text-align:center;
}

th{
  background:var(--bg-header);
  color:var(--accent);
  font-size:.75rem;
}

td.left{text-align:left}

.last-updated{
  font-size:.75rem;
  color:var(--muted);
}

/* ===== BARBELL CALC ===== */

.calculator{
  max-width:1020px;
  margin-top:40px;
  background:var(--bg-panel);
  border:1px solid var(--border);
  padding:20px;
  border-radius:10px;
}

.calc-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:10px;
}

.unit-toggle button{
  background:transparent;
  border:1px solid var(--border);
  color:var(--accent);
  padding:6px 12px;
  border-radius:6px;
  cursor:pointer;
}

.controls{
  display:flex;
  gap:12px;
  margin:10px 0;
  flex-wrap:wrap;
}

.controls input{
  width:80px;
  background:transparent;
  border:1px solid var(--border);
  color:var(--text);
  padding:6px;
  border-radius:6px;
}

.barbell{
  display:flex;
  justify-content:center;
  align-items:center;
  margin:25px 0;
}

.bar{
  width:260px;
  height:8px;
  background:#888;
  border-radius:4px;
}

.sleeve{
  display:flex;
  align-items:center;
}

.plate{
  margin:0 2px;
  border-radius:4px;
}

/* Sizes */
.big{height:90px;width:26px}
.mid{height:75px;width:22px}
.small{height:60px;width:18px}
.tiny{height:45px;width:14px}

/* Colors */
.p45,.p25kg{background:#d32f2f}
.p35,.p20kg{background:#1976d2}
.p25,.p15kg{background:#fbc02d}
.p10,.p10kg{background:#388e3c}
.p5,.p5kg{background:#555}
.p2_5,.p2_5kg,.p1_25kg{background:#999}

.plates{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  justify-content:center;
}

.plates button{
  background:transparent;
  border:1px solid var(--border);
  color:var(--text);
  padding:6px 10px;
  border-radius:6px;
  cursor:pointer;
}

.total{
  text-align:center;
  font-size:1.2rem;
  margin-top:10px;
  color:var(--accent);
}
</style>
</head>

<body>

<h1 id="title"></h1>
<p id="desc"></p>

<div class="top-bar">
  <div id="authBox">
    <input id="email" placeholder="admin email">
    <input id="password" type="password" placeholder="password">
    <button id="loginBtn">Login</button>
    <button id="logoutBtn" style="display:none">Logout</button>
  </div>
  <div id="lastUpdated" class="last-updated"></div>
</div>

<table id="table" class="locked-content">
<thead>
<tr>
<th class="left">Lift</th>
<th>Current</th>
<th>1RM</th>
<th>Strength Level</th>
</tr>
</thead>
<tbody id="tbody"></tbody>
</table>

<div class="calculator">
  <div class="calc-header">
    <div>Barbell Calculator</div>
    <div class="unit-toggle">
      <button onclick="setUnit('kg')">KG</button>
      <button onclick="setUnit('lb')">LB</button>
    </div>
  </div>

  <div class="controls">
    <label>Bar weight:
      <input id="barInput" type="number" step="0.5">
    </label>
    <label>
      <input id="barToggle" type="checkbox" checked>
      Include bar
    </label>
  </div>

  <div class="barbell">
    <div id="left" class="sleeve"></div>
    <div class="bar"></div>
    <div id="right" class="sleeve"></div>
  </div>

  <div class="plates" id="plateButtons"></div>

  <div class="plates">
    <button onclick="removePlate()">Undo</button>
    <button onclick="resetBar()">Reset</button>
  </div>

  <div class="total" id="total"></div>
</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>
firebase.initializeApp({
  apiKey:"AIzaSyBoePuKarSCVgvxQQBGvkMKq16DvKmBYBE",
  authDomain:"strenght-a9f37.firebaseapp.com",
  databaseURL:"https://strenght-a9f37-default-rtdb.firebaseio.com",
  projectId:"strenght-a9f37"
});

const db = firebase.database();

/* LOAD DATA */
db.ref("log").once("value").then(s=>{
  const d=s.val();
  if(!d) return;
  title.innerText=d.title;
  desc.innerHTML=d.desc;
  tbody.innerHTML=d.table;
  lastUpdated.innerText="Last updated: "+d.updated;
  document.body.style.visibility="visible";
});

/* AUTH */
const emailEl = document.getElementById("email");
const passwordEl = document.getElementById("password");
const loginBtn = document.getElementById("loginBtn");
const logoutBtn = document.getElementById("logoutBtn");
const tableEl = document.getElementById("table");

loginBtn.onclick = ()=>{
  firebase.auth()
    .signInWithEmailAndPassword(emailEl.value, passwordEl.value)
    .catch(err=>alert(err.message));
};

logoutBtn.onclick = ()=>firebase.auth().signOut();

firebase.auth().onAuthStateChanged(user=>{
  if(user){
    tableEl.classList.remove("locked-content");
    loginBtn.style.display="none";
    logoutBtn.style.display="inline-block";
  }else{
    tableEl.classList.add("locked-content");
    loginBtn.style.display="inline-block";
    logoutBtn.style.display="none";
  }
});

/* CALCULATOR */
const left=document.getElementById("left");
const right=document.getElementById("right");
const totalEl=document.getElementById("total");
const plateBtns=document.getElementById("plateButtons");
const barInput=document.getElementById("barInput");
const barToggle=document.getElementById("barToggle");

let unit="kg";
let barWeight=20;
let plates=[];

const configs={
  kg:{ bar:20, plates:[
    {w:25,c:"p25kg big"},{w:20,c:"p20kg mid"},
    {w:15,c:"p15kg mid"},{w:10,c:"p10kg small"},
    {w:5,c:"p5kg small"},{w:2.5,c:"p2_5kg tiny"},
    {w:1.25,c:"p1_25kg tiny"} ]},
  lb:{ bar:45, plates:[
    {w:45,c:"p45 big"},{w:35,c:"p35 mid"},
    {w:25,c:"p25 mid"},{w:10,c:"p10 small"},
    {w:5,c:"p5 small"},{w:2.5,c:"p2_5 tiny"} ]}
};

function setUnit(u){
  unit=u;
  plates=[];
  barWeight=configs[u].bar;
  barInput.value=barWeight;
  buildButtons();
  render();
}

function buildButtons(){
  plateBtns.innerHTML="";
  configs[unit].plates.forEach(p=>{
    const b=document.createElement("button");
    b.textContent=`+${p.w} ${unit}`;
    b.onclick=()=>{ plates.push(p); render(); };
    plateBtns.appendChild(b);
  });
}

function removePlate(){ plates.pop(); render(); }
function resetBar(){ plates=[]; render(); }

barInput.oninput=()=>{ barWeight=parseFloat(barInput.value)||0; render(); };
barToggle.onchange=render;

function render(){
  left.innerHTML=""; right.innerHTML="";
  let total = barToggle.checked ? barWeight : 0;
  [...plates].sort((a,b)=>b.w-a.w).forEach(p=>{
    left.innerHTML+=`<div class="plate ${p.c}"></div>`;
    right.innerHTML+=`<div class="plate ${p.c}"></div>`;
    total+=p.w*2;
  });
  totalEl.textContent=`Total: ${total} ${unit}`;
}

setUnit("kg");
</script>

</body>
</html>
