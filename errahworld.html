<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Strength Log – 1RM Tracking</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

:root{
  --bg-main:#0a0c13;
  --bg-panel:rgba(22,26,42,.88);
  --bg-header:rgba(32,38,64,.95);
  --border:rgba(255,255,255,.08);
  --text:#eef0f6;
  --muted:#9aa1b3;
  --accent:#cfd6ff;
  --shadow:0 18px 40px rgba(0,0,0,.55);
}

*{ box-sizing:border-box; }

body{
  margin:0;
  padding:28px;
  font-family:"Inter",system-ui,sans-serif;
  background:
    radial-gradient(1200px 600px at top,#1c2340,transparent 60%),
    radial-gradient(900px 500px at bottom,#0b0f22,transparent 60%),
    var(--bg-main);
  color:var(--text);
}

@keyframes float{
  0%,100%{ transform:translateY(0); }
  50%{ transform:translateY(-6px); }
}

/* LOCK */
.locked-content,
.locked-content *{
  pointer-events:none!important;
  user-select:none!important;
  caret-color:transparent!important;
}

/* TITLE */
h1{ margin:0 0 12px; font-size:2.2rem; }

/* DESCRIPTION */
#desc{
  max-width:900px;
  padding:18px 22px;
  margin-bottom:26px;
  background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.02));
  border:1px solid var(--border);
  border-radius:18px;
  color:var(--muted);
  box-shadow:var(--shadow);
  animation:float 9s ease-in-out infinite;
}

/* COUNTDOWN */
.countdown{
  max-width:1020px;
  margin-bottom:28px;
  padding:18px 22px;
  background:linear-gradient(135deg,#2b3160,#1b1f3d);
  border-radius:18px;
  box-shadow:var(--shadow);
  display:flex;
  justify-content:space-between;
  align-items:center;
}

#timer{ font-weight:700; color:var(--accent); }

/* TOP BAR */
.top-bar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  max-width:1020px;
  margin-bottom:18px;
  gap:12px;
  flex-wrap:wrap;
}

/* AUTH */
#authBox{
  display:flex;
  gap:10px;
  padding:14px 16px;
  background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.03));
  border:1px solid var(--border);
  border-radius:20px;
  box-shadow:var(--shadow);
}

#authBox input{
  background:rgba(0,0,0,.25);
  border:1px solid var(--border);
  color:var(--accent);
  padding:10px 14px;
  border-radius:12px;
}

#authBox button{
  background:linear-gradient(135deg,#3a43a0,#2a2f66);
  border:none;
  color:#fff;
  padding:10px 18px;
  border-radius:14px;
  font-weight:600;
  cursor:pointer;
}

/* 🔔 NOTIFICATIONS */
#notifBell{
  cursor:pointer;
  font-size:1.2rem;
}

#notifCount{
  background:#ff4757;
  color:#fff;
  font-size:.65rem;
  padding:2px 6px;
  border-radius:999px;
  margin-left:6px;
}

#notifPanel{
  position:fixed;
  top:90px;
  right:30px;
  width:320px;
  max-height:420px;
  overflow:auto;
  background:var(--bg-panel);
  border:1px solid var(--border);
  border-radius:18px;
  box-shadow:var(--shadow);
  display:none;
  padding:14px;
  z-index:999;
}

.notif{
  padding:10px 12px;
  margin-bottom:8px;
  border-radius:12px;
  background:rgba(255,255,255,.05);
  font-size:.85rem;
}

/* TABLE */
table{
  width:100%;
  max-width:1020px;
  border-collapse:collapse;
  background:var(--bg-panel);
  border-radius:22px;
  overflow:hidden;
  box-shadow:var(--shadow);
}

th,td{
  padding:16px;
  text-align:center;
  border-bottom:1px solid var(--border);
}

th{
  background:var(--bg-header);
  font-size:.7rem;
  text-transform:uppercase;
  color:var(--accent);
}

td.left{ text-align:left; }
</style>
</head>

<body>

<h1 id="title"></h1>
<p id="desc"></p>

<div class="countdown">
  <strong>Road to RM Drop 🏋️</strong>
  <div id="timer"></div>
</div>

<div class="top-bar">
  <div id="authBox">
    <input id="email" placeholder="admin email">
    <input id="password" type="password" placeholder="password">
    <button id="loginBtn">Login</button>
    <button id="logoutBtn" style="display:none">Logout</button>
  </div>

  <div>
    <span id="notifBell">🔔 <span id="notifCount">0</span></span>
  </div>
</div>

<div id="notifPanel">
  <h4>Notifications</h4>
  <div id="notifList"></div>
</div>

<table id="table" class="locked-content">
<thead>
<tr>
<th class="left">Lift</th>
<th>Current</th>
<th>1RM</th>
<th>Strength</th>
</tr>
</thead>
<tbody id="tbody"></tbody>
</table>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>
firebase.initializeApp({
  apiKey:"AIzaSyBoePuKarSCVgvxQQBGvkMKq16DvKmBYBE",
  authDomain:"strenght-a9f37.firebaseapp.com",
  databaseURL:"https://strenght-a9f37-default-rtdb.firebaseio.com",
  projectId:"strenght-a9f37",
  storageBucket:"strenght-a9f37.firebasestorage.app",
  messagingSenderId:"469926449178",
  appId:"1:469926449178:web:b9623947a1c1865b0f81a3"
});

const auth=firebase.auth();
const db=firebase.database();

/* AUTH */
loginBtn.onclick=()=>auth.signInWithEmailAndPassword(email.value,password.value);
logoutBtn.onclick=()=>auth.signOut();

auth.onAuthStateChanged(u=>{
  table.classList.toggle("locked-content",!u);
  loginBtn.style.display=u?"none":"inline-block";
  logoutBtn.style.display=u?"inline-block":"none";
});

/* 🔊 VOICE */
function playVoice(text){
  const msg=new SpeechSynthesisUtterance(text);
  msg.rate=.9; msg.pitch=1.05;
  speechSynthesis.speak(msg);
}

/* 🔔 NOTIFICATIONS */
const notifBell=document.getElementById("notifBell");
const notifPanel=document.getElementById("notifPanel");
const notifList=document.getElementById("notifList");
const notifCount=document.getElementById("notifCount");

let lastSeen=localStorage.getItem("lastSeenNotif")||0;

notifBell.onclick=()=>{
  notifPanel.style.display=notifPanel.style.display==="block"?"none":"block";
  notifCount.textContent="0";
  localStorage.setItem("lastSeenNotif",Date.now());
  playVoice("Notifications opened");
};

db.ref("notifications").on("value",snap=>{
  const data=snap.val()||{};
  notifList.innerHTML="";
  let unread=0;

  Object.values(data).sort((a,b)=>b.timestamp-a.timestamp).forEach(n=>{
    notifList.innerHTML+=`<div class="notif">${n.text}</div>`;
    if(n.timestamp>lastSeen) unread++;
  });

  notifCount.textContent=unread;
  if(unread>0) playVoice("New update available");
});

/* COUNTDOWN */
const targetDate=new Date("February 3, 2026").getTime();
const timerEl=document.getElementById("timer");
setInterval(()=>{
  const d=targetDate-Date.now();
  timerEl.textContent=d<=0?"RM DAY 🔥":
    Math.floor(d/86400000)+"d "+
    Math.floor(d/3600000)%24+"h "+
    Math.floor(d/60000)%60+"m";
},1000);
</script>

</body>
</html>
