<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Strength Log – 1RM Tracking</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />

<style>
:root{
  --bg-main:#0c0e12;
  --bg-panel:#14161c;
  --bg-header:#1b1e26;
  --border:#2a2d36;
  --text:#d9dbe1;
  --muted:#9da1ac;
  --accent:#bfc6d6;
}

body{
  visibility:hidden;
  font-family:"Segoe UI",Arial,sans-serif;
  background:radial-gradient(circle at top,#12141b,var(--bg-main));
  color:var(--text);
  padding:24px;
}

.locked-content,
.locked-content *{
  pointer-events:none !important;
  user-select:none !important;
  caret-color:transparent !important;
}

*:focus{
  outline:none !important;
  box-shadow:none !important;
}

.top-bar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  max-width:1020px;
  margin-bottom:12px;
}

#authBox input,
#authBox button{
  background:transparent;
  border:1px solid var(--border);
  color:var(--accent);
  padding:6px 10px;
  border-radius:6px;
  margin-right:4px;
}

table{
  width:100%;
  max-width:1020px;
  border-collapse:collapse;
  background:var(--bg-panel);
  box-shadow:0 0 0 1px var(--border);
}

th, td{
  border:1px solid var(--border);
  padding:10px;
  text-align:center;
}

th{
  background:var(--bg-header);
  color:var(--accent);
  font-size:.75rem;
}

td.left{ text-align:left; }

.last-updated{
  font-size:.75rem;
  color:var(--muted);
}

.exercise-updates{
  max-width:1020px;
  margin-top:12px;
  font-size:.75rem;
  color:var(--muted);
}
.exercise-updates div{
  margin-bottom:4px;
}
</style>
</head>

<body>

<h1 id="title"></h1>
<p id="desc"></p>

<div class="top-bar">
  <div id="authBox">
    <input id="email" placeholder="admin email">
    <input id="password" type="password" placeholder="password">
    <button id="loginBtn">Login</button>
    <button id="logoutBtn" style="display:none">Logout</button>
  </div>
  <div id="lastUpdated" class="last-updated"></div>
</div>

<table id="table" class="locked-content">
  <thead>
    <tr>
      <th class="left">Lift</th>
      <th>Current</th>
      <th>1RM</th>
      <th>Strength Level</th>
    </tr>
  </thead>
  <tbody id="tbody">
    <!-- IMPORTANT: each row MUST have data-id -->
    <!-- example stored in Firebase -->
  </tbody>
</table>

<!-- Viewer-only per exercise updates -->
<div id="exerciseUpdates" class="exercise-updates"></div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>
firebase.initializeApp({
  apiKey: "AIzaSyBoePuKarSCVgvxQQBGvkMKq16DvKmBYBE",
  authDomain: "strenght-a9f37.firebaseapp.com",
  databaseURL: "https://strenght-a9f37-default-rtdb.firebaseio.com",
  projectId: "strenght-a9f37",
  storageBucket: "strenght-a9f37.firebasestorage.app",
  messagingSenderId: "469926449178",
  appId: "1:469926449178:web:b9623947a1c1865b0f81a3"
});

const auth = firebase.auth();
const db   = firebase.database();

const titleEl   = document.getElementById("title");
const descEl    = document.getElementById("desc");
const tbody     = document.getElementById("tbody");
const table     = document.getElementById("table");
const lastEl    = document.getElementById("lastUpdated");
const updatesEl = document.getElementById("exerciseUpdates");

const emailEl   = document.getElementById("email");
const passEl    = document.getElementById("password");
const loginBtn  = document.getElementById("loginBtn");
const logoutBtn = document.getElementById("logoutBtn");

let isAdmin=false, firstLoad=true;

/* lock */
function lockAll(){
  isAdmin=false;
  table.classList.add("locked-content");
  titleEl.contentEditable=false;
  descEl.contentEditable=false;
  document.querySelectorAll("td").forEach(td=>{
    td.contentEditable=false;
    td.blur();
  });
}

/* edit */
function enableEdit(){
  isAdmin=true;
  table.classList.remove("locked-content");
  titleEl.contentEditable=true;
  descEl.contentEditable=true;
  document.querySelectorAll("td").forEach(td=>{
    td.contentEditable=true;
  });
}

/* auth */
loginBtn.onclick=()=>{
  auth.signInWithEmailAndPassword(emailEl.value,passEl.value)
    .catch(e=>alert(e.message));
};
logoutBtn.onclick=()=>auth.signOut();

auth.onAuthStateChanged(u=>{
  if(u){
    enableEdit();
    loginBtn.style.display="none";
    logoutBtn.style.display="inline-block";
  }else{
    lockAll();
    loginBtn.style.display="inline-block";
    logoutBtn.style.display="none";
  }
});

/* render per-exercise timestamps */
function renderExerciseUpdates(rows, map){
  updatesEl.innerHTML="";
  rows.forEach(tr=>{
    const id = tr.dataset.id;
    if(!id || !map[id]) return;
    const name = tr.querySelector("td")?.innerText || id;
    const div=document.createElement("div");
    div.textContent = `${name} — Last updated: ${map[id]}`;
    updatesEl.appendChild(div);
  });
}

/* initial load */
db.ref("log").once("value").then(s=>{
  const d=s.val();
  titleEl.innerText=d.title;
  descEl.innerHTML=d.desc;
  tbody.innerHTML=d.table;
  lastEl.innerText="Last updated: "+d.updated;
  renderExerciseUpdates([...tbody.children], d.rowUpdates || {});
  document.body.style.visibility="visible";
});

/* live updates (viewers) */
db.ref("log").on("value",s=>{
  if(firstLoad){ firstLoad=false; return; }
  if(isAdmin) return;
  const d=s.val();
  tbody.innerHTML=d.table;
  lastEl.innerText="Last updated: "+d.updated;
  renderExerciseUpdates([...tbody.children], d.rowUpdates || {});
});

/* save edits + per-row timestamp */
document.addEventListener("input",e=>{
  if(!isAdmin) return;
  const tr = e.target.closest("tr");
  if(!tr || !tr.dataset.id) return;

  const now=new Date();
  const t =
    String(now.getDate()).padStart(2,"0")+"/"+
    String(now.getMonth()+1).padStart(2,"0")+"/"+
    now.getFullYear()+" · "+
    String(now.getHours()).padStart(2,"0")+":"+
    String(now.getMinutes()).padStart(2,"0");

  db.ref("log/rowUpdates/"+tr.dataset.id).set(t);

  db.ref("log").update({
    title:titleEl.innerText,
    desc:descEl.innerHTML,
    table:tbody.innerHTML,
    updated:t
  });
});

lockAll();
</script>

</body>
</html>
