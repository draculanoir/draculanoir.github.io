<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Strength Log – 1RM Tracking</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />

<style>
:root{
  --bg-main:#0c0e12;
  --bg-panel:#14161c;
  --bg-header:#1b1e26;
  --border:#2a2d36;
  --text:#d9dbe1;
  --muted:#9da1ac;
  --accent:#bfc6d6;
}

body{
  visibility:hidden;
  font-family:"Segoe UI", Arial, sans-serif;
  background:radial-gradient(circle at top,#12141b,var(--bg-main));
  color:var(--text);
  padding:24px;
}

/* 🔒 HARD READ-ONLY LOCK */
.locked-content,
.locked-content *{
  pointer-events:none !important;
  user-select:none !important;
  -webkit-user-select:none !important;
  touch-action:none !important;
  caret-color:transparent !important;
}

.top-bar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  max-width:1020px;
  margin-bottom:12px;
  flex-wrap:wrap;
  gap:8px;
}

#authBox input,
#authBox button{
  background:transparent;
  border:1px solid var(--border);
  color:var(--accent);
  padding:6px 10px;
  border-radius:6px;
}

table{
  width:100%;
  max-width:1020px;
  border-collapse:collapse;
  background:var(--bg-panel);
  box-shadow:0 0 0 1px var(--border);
}

th, td{
  border:1px solid var(--border);
  padding:10px;
  text-align:center;
}

th{
  background:var(--bg-header);
  color:var(--accent);
  font-size:.75rem;
}

td.left{ text-align:left; }

.last-updated{
  font-size:.75rem;
  color:var(--muted);
}

/* 🏋️ BARBELL CALCULATOR */
.calculator{
  max-width:1020px;
  margin-top:32px;
  padding:16px;
  background:var(--bg-panel);
  border:1px solid var(--border);
  border-radius:8px;
}

/* ✅ CONTROLS FIX */
.calculator-controls{
  display:flex;
  gap:8px;
  align-items:center;
  flex-wrap:wrap;
}

.calculator input{
  background:transparent;
  border:1px solid var(--border);
  color:var(--accent);
  padding:8px 12px;
  border-radius:6px;
}

.calculator label{
  display:flex;
  align-items:center;
  gap:6px;
  border:1px solid var(--border);
  padding:8px 12px;
  border-radius:6px;
  color:var(--accent);
  white-space:nowrap;
}

/* 📱 MOBILE ONLY */
@media (max-width:600px){
  .calculator-controls{
    flex-direction:column;
    align-items:stretch;
  }

  .calculator-controls input,
  .calculator-controls label{
    width:100%;
  }
}

.barbell{
  margin-top:20px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.bar{
  width:260px;
  height:8px;
  background:#777;
  border-radius:4px;
}

.side{
  display:flex;
  align-items:center;
}

.plate{
  height:60px;
  border-radius:4px;
  margin:0 2px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:.7rem;
  font-weight:600;
  color:#111;
}

.p45{ width:26px; background:#c0392b; }
.p35{ width:24px; background:#d35400; }
.p25{ width:22px; background:#f1c40f; }
.p10{ width:18px; background:#3498db; color:#fff; }
.p5 { width:14px; background:#2ecc71; }
.p2_5{ width:10px; background:#95a5a6; }

.note{
  font-size:.75rem;
  color:var(--muted);
  margin-top:8px;
}

.total{
  margin-top:6px;
  font-size:.85rem;
}
</style>
</head>

<body>

<h1 id="title"></h1>
<p id="desc"></p>

<div class="top-bar">
  <div id="authBox">
    <input id="email" placeholder="admin email">
    <input id="password" type="password" placeholder="password">
    <button id="loginBtn">Login</button>
    <button id="logoutBtn" style="display:none">Logout</button>
  </div>
  <div id="lastUpdated" class="last-updated"></div>
</div>

<table id="table" class="locked-content">
  <thead>
    <tr>
      <th class="left">Lift</th>
      <th>Current</th>
      <th>1RM</th>
      <th>Strength Level</th>
    </tr>
  </thead>
  <tbody id="tbody"></tbody>
</table>

<div class="calculator">
  <h3>Barbell Calculator (lbs)</h3>

  <div class="calculator-controls">
    <input id="targetWeight" type="number" placeholder="Loaded weight">
    <input id="barWeight" type="number" value="45" placeholder="Bar weight">
    <label>
      <input type="checkbox" id="includeBar" checked>
      Include bar for plates
    </label>
  </div>

  <div class="barbell">
    <div id="leftSide" class="side"></div>
    <div class="bar"></div>
    <div id="rightSide" class="side"></div>
  </div>

  <div id="roundNote" class="note"></div>
  <div id="trueLoad" class="total"></div>
</div>
