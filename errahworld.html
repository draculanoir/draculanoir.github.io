<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Strength Log – 1RM Tracking</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

:root{
  --bg-main:#0a0c13;
  --bg-panel:rgba(22,26,42,.82);
  --bg-header:rgba(32,38,64,.95);
  --border:rgba(255,255,255,.08);
  --text:#eef0f6;
  --muted:#9aa1b3;
  --accent:#cfd6ff;

  --shadow-float:
    0 18px 40px rgba(0,0,0,.55),
    inset 0 1px 0 rgba(255,255,255,.05);
}

/* BASE */
*{ box-sizing:border-box; }

body{
  margin:0;
  padding:28px;
  font-family:"Inter",system-ui,sans-serif;
  background:
    radial-gradient(1200px 600px at top,#1c2340,transparent 60%),
    radial-gradient(900px 500px at bottom,#0b0f22,transparent 60%),
    var(--bg-main);
  color:var(--text);
}

/* FLOAT ANIMATION */
@keyframes floatIdle{
  0%,100%{ transform:translateY(0); }
  50%{ transform:translateY(-6px); }
}

/* 🔒 HARD READ-ONLY LOCK */
.locked-content,
.locked-content *{
  pointer-events:none!important;
  user-select:none!important;
  caret-color:transparent!important;
}

/* HEADER */
h1{
  font-size:2.1rem;
  font-weight:700;
  margin:0 0 6px;
}

p{
  margin:0 0 20px;
  color:var(--muted);
  max-width:760px;
  line-height:1.5;
}

/* COUNTDOWN */
.countdown{
  max-width:1020px;
  margin:18px 0 28px;
  padding:18px 22px;
  background:linear-gradient(135deg,#2b3160,#1b1f3d);
  border-radius:18px;
  box-shadow:var(--shadow-float);
  display:flex;
  justify-content:space-between;
  align-items:center;
  animation:floatIdle 7s ease-in-out infinite;
}

.countdown strong{
  font-weight:600;
  letter-spacing:.3px;
}

#timer{
  font-weight:700;
  color:var(--accent);
  font-size:1.05rem;
}

/* TOP BAR */
.top-bar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  max-width:1020px;
  margin-bottom:18px;
  gap:12px;
  flex-wrap:wrap;
  animation:floatIdle 8s ease-in-out infinite;
}

#authBox{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

#authBox input,
#authBox button{
  background:rgba(255,255,255,.05);
  border:1px solid var(--border);
  color:var(--accent);
  padding:10px 14px;
  border-radius:14px;
  backdrop-filter:blur(10px);
  transition:.25s ease;
}

#authBox button{
  cursor:pointer;
  font-weight:500;
}

#authBox button:hover{
  transform:translateY(-2px);
  box-shadow:0 12px 26px rgba(0,0,0,.45);
}

/* TABLE */
table{
  width:100%;
  max-width:1020px;
  border-collapse:collapse;
  background:var(--bg-panel);
  border-radius:22px;
  overflow:hidden;
  box-shadow:var(--shadow-float);
  backdrop-filter:blur(16px);
  animation:floatIdle 9s ease-in-out infinite;
}

th,td{
  padding:16px;
  text-align:center;
  border-bottom:1px solid var(--border);
}

th{
  background:var(--bg-header);
  font-size:.7rem;
  letter-spacing:.16em;
  text-transform:uppercase;
  color:var(--accent);
}

td.left{ text-align:left; }

tr:hover td{
  background:rgba(255,255,255,.035);
}

tr:last-child td{ border-bottom:none; }

.last-updated{
  font-size:.75rem;
  color:var(--muted);
}

/* CALCULATOR */
.calculator{
  max-width:1020px;
  margin-top:54px;
  padding:26px;
  background:var(--bg-panel);
  border-radius:24px;
  border:1px solid var(--border);
  box-shadow:var(--shadow-float);
  backdrop-filter:blur(16px);
  animation:floatIdle 10s ease-in-out infinite;
}

.calculator h3{
  margin:0 0 16px;
  font-weight:600;
}

.calculator-controls{
  display:flex;
  gap:12px;
  flex-wrap:wrap;
}

.calculator input{
  background:rgba(255,255,255,.05);
  border:1px solid var(--border);
  color:var(--accent);
  padding:12px 16px;
  border-radius:14px;
  transition:.25s ease;
}

.calculator input:focus{
  outline:none;
  transform:translateY(-1px);
}

.calculator label{
  display:flex;
  align-items:center;
  gap:8px;
  border:1px solid var(--border);
  padding:12px 16px;
  border-radius:14px;
  color:var(--accent);
  background:rgba(255,255,255,.05);
  cursor:pointer;
}

/* BARBELL */
.barbell{
  margin-top:30px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.bar{
  width:300px;
  height:12px;
  background:linear-gradient(#bbb,#666);
  border-radius:8px;
  box-shadow:inset 0 3px 6px rgba(0,0,0,.6);
}

.side{ display:flex; }

.plate{
  height:68px;
  margin:0 2px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:.7rem;
  font-weight:700;
  color:#111;
  border-radius:7px;
  box-shadow:0 8px 18px rgba(0,0,0,.6);
}

.p45{ width:30px; background:#c0392b; }
.p35{ width:28px; background:#d35400; }
.p25{ width:26px; background:#f1c40f; }
.p10{ width:22px; background:#3498db; color:#fff; }
.p5 { width:18px; background:#2ecc71; }
.p2_5{ width:14px; background:#bdc3c7; }

.note{ font-size:.75rem; color:var(--muted); margin-top:12px; }
.total{ margin-top:8px; font-weight:500; }

/* MOBILE */
@media(max-width:600px){
  body{ padding:16px; }
  .calculator-controls{ flex-direction:column; }
  .calculator-controls input,
  .calculator-controls label{ width:100%; }
}
</style>
</head>

<body>

<h1 id="title"></h1>
<p id="desc"></p>

<div class="countdown">
  <strong>Road to RM Drop 🏋️</strong>
  <div id="timer">Loading…</div>
</div>

<div class="top-bar">
  <div id="authBox">
    <input id="email" placeholder="admin email">
    <input id="password" type="password" placeholder="password">
    <button id="loginBtn">Login</button>
    <button id="logoutBtn" style="display:none">Logout</button>
  </div>
  <div id="lastUpdated" class="last-updated"></div>
</div>

<table id="table" class="locked-content">
  <thead>
    <tr>
      <th class="left">Lift</th>
      <th>Current</th>
      <th>1RM</th>
      <th>Strength Level</th>
    </tr>
  </thead>
  <tbody id="tbody"></tbody>
</table>

<div class="calculator">
  <h3>Barbell Calculator (lbs)</h3>
  <div class="calculator-controls">
    <input id="targetWeight" type="number" placeholder="Loaded weight">
    <input id="barWeight" type="number" value="45">
    <label><input type="checkbox" id="includeBar" checked> Include bar</label>
  </div>

  <div class="barbell">
    <div id="leftSide" class="side"></div>
    <div class="bar"></div>
    <div id="rightSide" class="side"></div>
  </div>

  <div id="roundNote" class="note"></div>
  <div id="trueLoad" class="total"></div>
</div>

<script>
/* ⏳ COUNTDOWN TIMER */
const targetDate = new Date("February 3, 2026 00:00:00").getTime();
const timerEl = document.getElementById("timer");

function updateTimer(){
  const now = Date.now();
  const diff = targetDate - now;

  if(diff <= 0){
    timerEl.textContent = "RM DAY 🔥";
    return;
  }

  const d = Math.floor(diff / (1000*60*60*24));
  const h = Math.floor((diff / (1000*60*60)) % 24);
  const m = Math.floor((diff / (1000*60)) % 60);
  const s = Math.floor((diff / 1000) % 60);

  timerEl.textContent = `${d}d ${h}h ${m}m ${s}s`;
}

updateTimer();
setInterval(updateTimer,1000);
</script>

</body>
</html>
