<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Strength Log – 1RM Tracking</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

:root{
  --bg-main:#0a0c13;
  --bg-panel:rgba(22,26,42,.88);
  --bg-header:rgba(32,38,64,.95);
  --border:rgba(255,255,255,.08);
  --text:#eef0f6;
  --muted:#9aa1b3;
  --accent:#cfd6ff;
  --shadow:0 18px 40px rgba(0,0,0,.55);
}

*{ box-sizing:border-box; }

body{
  margin:0;
  padding:28px;
  font-family:"Inter",system-ui,sans-serif;
  background:
    radial-gradient(1200px 600px at top,#1c2340,transparent 60%),
    radial-gradient(900px 500px at bottom,#0b0f22,transparent 60%),
    var(--bg-main);
  color:var(--text);
}

@keyframes float{
  0%,100%{ transform:translateY(0); }
  50%{ transform:translateY(-6px); }
}

/* LOCK */
.locked-content,
.locked-content *{
  pointer-events:none!important;
  user-select:none!important;
  caret-color:transparent!important;
}

h1{
  margin:0 0 12px;
  font-size:2.2rem;
  font-weight:700;
}

#desc{
  max-width:900px;
  padding:18px 22px;
  margin-bottom:26px;
  background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.02));
  border:1px solid var(--border);
  border-radius:18px;
  color:var(--muted);
  line-height:1.55;
  box-shadow:var(--shadow);
  backdrop-filter:blur(14px);
  animation:float 9s ease-in-out infinite;
}

/* COUNTDOWN */
.countdown{
  max-width:1020px;
  margin:18px 0 28px;
  padding:18px 22px;
  background:linear-gradient(135deg,#2b3160,#1b1f3d);
  border-radius:18px;
  box-shadow:var(--shadow);
  display:flex;
  justify-content:space-between;
  align-items:center;
  animation:float 8s ease-in-out infinite;
}

#timer{ font-weight:700; color:var(--accent); }

/* TOP BAR */
.top-bar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  max-width:1020px;
  margin-bottom:16px;
  gap:12px;
  flex-wrap:wrap;
}

/* UPDATES BUTTON */
.updates-btn{
  background:linear-gradient(135deg,#5b6cff,#3b46a6);
  border:none;
  color:white;
  padding:12px 22px;
  border-radius:18px;
  font-weight:600;
  cursor:pointer;
  box-shadow:var(--shadow);
  animation:float 10s ease-in-out infinite;
}

/* AUTH */
#authBox{
  display:flex;
  gap:10px;
  padding:14px 16px;
  background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.03));
  border:1px solid var(--border);
  border-radius:20px;
  box-shadow:var(--shadow);
  backdrop-filter:blur(16px);
  animation:float 11s ease-in-out infinite;
}

#authBox input{
  background:rgba(0,0,0,.25);
  border:1px solid var(--border);
  color:var(--accent);
  padding:10px 14px;
  border-radius:12px;
}

#authBox button{
  background:linear-gradient(135deg,#3a43a0,#2a2f66);
  border:none;
  color:#fff;
  padding:10px 18px;
  border-radius:14px;
  font-weight:600;
  cursor:pointer;
}

/* LAST UPDATED */
.last-updated{
  max-width:1020px;
  margin:12px 0 22px;
  padding:12px 18px;
  background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.02));
  border:1px solid var(--border);
  border-radius:14px;
  color:var(--muted);
  font-size:.75rem;
  box-shadow:var(--shadow);
  backdrop-filter:blur(12px);
  animation:float 13s ease-in-out infinite;
}

/* TABLE */
table{
  width:100%;
  max-width:1020px;
  border-collapse:collapse;
  background:var(--bg-panel);
  border-radius:22px;
  overflow:hidden;
  box-shadow:var(--shadow);
  animation:float 12s ease-in-out infinite;
}

th,td{
  padding:16px;
  text-align:center;
  border-bottom:1px solid var(--border);
}

th{
  background:var(--bg-header);
  font-size:.7rem;
  letter-spacing:.16em;
  text-transform:uppercase;
  color:var(--accent);
}

td.left{ text-align:left; }

/* CALCULATOR */
.calculator{
  max-width:1020px;
  margin-top:54px;
  padding:26px;
  background:var(--bg-panel);
  border-radius:24px;
  border:1px solid var(--border);
  box-shadow:var(--shadow);
  animation:float 12s ease-in-out infinite;
}

.calculator-controls{
  display:flex;
  gap:12px;
  flex-wrap:wrap;
}

.calculator input,
.calculator label{
  background:rgba(255,255,255,.06);
  border:1px solid var(--border);
  color:var(--accent);
  padding:12px 16px;
  border-radius:14px;
}

/* BARBELL */
.barbell{
  margin-top:30px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.bar{
  width:300px;
  height:12px;
  background:linear-gradient(#bbb,#666);
  border-radius:8px;
}

.side{ display:flex; }

.plate{
  height:68px;
  margin:0 2px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:.7rem;
  font-weight:700;
  color:#111;
  border-radius:7px;
  box-shadow:0 8px 18px rgba(0,0,0,.6);
}

.p45{ width:30px; background:#c0392b; }
.p35{ width:28px; background:#d35400; }
.p25{ width:26px; background:#f1c40f; }
.p10{ width:22px; background:#3498db; color:#fff; }
.p5 { width:18px; background:#2ecc71; }
.p2_5{ width:14px; background:#bdc3c7; }

.note{ font-size:.75rem; color:var(--muted); margin-top:12px; }
.total{ margin-top:8px; }

@media(max-width:600px){
  body{ padding:16px; }
  #authBox{ flex-direction:column; width:100%; }
  .calculator-controls{ flex-direction:column; }
}
</style>
</head>

<body>

<h1 id="title"></h1>
<p id="desc"></p>

<div class="countdown">
  <strong>Road to RM Drop 🏋️</strong>
  <div id="timer">Loading…</div>
</div>

<div class="top-bar">
  <button id="updatesBtn" class="updates-btn">View Updates</button>
  <div id="authBox">
    <input id="email" placeholder="admin email">
    <input id="password" type="password" placeholder="password">
    <button id="loginBtn">Login</button>
    <button id="logoutBtn" style="display:none">Logout</button>
  </div>
</div>

<div id="lastUpdated" class="last-updated"></div>

<table id="table" class="locked-content">
<thead>
<tr>
<th class="left">Lift</th>
<th>Current</th>
<th>1RM</th>
<th>Strength Level</th>
</tr>
</thead>
<tbody id="tbody"></tbody>
</table>

<!-- ✅ BARBELL CALCULATOR -->
<div class="calculator">
<h3>Barbell Calculator (lbs)</h3>
<div class="calculator-controls">
<input id="targetWeight" type="number" placeholder="Loaded weight">
<input id="barWeight" type="number" value="45">
<label><input type="checkbox" id="includeBar" checked> Include bar</label>
</div>

<div class="barbell">
<div id="leftSide" class="side"></div>
<div class="bar"></div>
<div id="rightSide" class="side"></div>
</div>

<div id="roundNote" class="note"></div>
<div id="trueLoad" class="total"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>
firebase.initializeApp({
  apiKey:"AIzaSyBoePuKarSCVgvxQQBGvkMKq16DvKmBYBE",
  authDomain:"strenght-a9f37.firebaseapp.com",
  databaseURL:"https://strenght-a9f37-default-rtdb.firebaseio.com",
  projectId:"strenght-a9f37",
  storageBucket:"strenght-a9f37.firebasestorage.app",
  messagingSenderId:"469926449178",
  appId:"1:469926449178:web:b9623947a1c1865b0f81a3"
});

const auth=firebase.auth();
const db=firebase.database();

loginBtn.onclick=()=>auth.signInWithEmailAndPassword(email.value,password.value).catch(e=>alert(e.message));
logoutBtn.onclick=()=>auth.signOut();

auth.onAuthStateChanged(user=>{
  table.classList.toggle("locked-content",!user);
  [title,desc,tbody].forEach(el=>el.contentEditable=!!user);
  loginBtn.style.display=user?"none":"inline-block";
  logoutBtn.style.display=user?"inline-block":"none";
});

db.ref("log").on("value",snap=>{
  const d=snap.val()||{};
  title.innerText=d.title||"";
  desc.innerHTML=d.desc||"";
  tbody.innerHTML=d.table||"";
  lastUpdated.innerText=d.updated?"Last updated: "+d.updated:"";
});

function saveData(){
  if(!auth.currentUser) return;
  const updated=new Date().toLocaleString("en-US",{
    day:"2-digit",month:"long",year:"numeric",
    hour:"numeric",minute:"2-digit",hour12:true
  });
  db.ref("log").set({
    title:title.innerText,
    desc:desc.innerHTML,
    table:tbody.innerHTML,
    updated
  });
}

["input","keyup","blur"].forEach(e=>{
  title.addEventListener(e,saveData);
  desc.addEventListener(e,saveData);
  tbody.addEventListener(e,saveData);
});

/* BARBELL LOGIC */
const plates=[45,35,25,10,5,2.5];
function updateBarbell(){
  leftSide.innerHTML="";
  rightSide.innerHTML="";
  let t=+targetWeight.value;
  let b=+barWeight.value||0;
  if(!t) return;
  let r=(includeBar.checked?(t-b):t)/2;
  let u=[];
  plates.forEach(p=>{ while(r>=p){ r-=p; u.push(p); } });
  u.forEach(p=>rightSide.innerHTML+=`<div class="plate ${p===2.5?"p2_5":"p"+p}">${p}</div>`);
  [...u].reverse().forEach(p=>leftSide.innerHTML+=`<div class="plate ${p===2.5?"p2_5":"p"+p}">${p}</div>`);
  trueLoad.innerText=`Loaded: ${t} lbs`;
}
[targetWeight,barWeight,includeBar].forEach(e=>e.addEventListener("input",updateBarbell));

document.getElementById("updatesBtn").onclick=()=>{
  window.location.href="updates.html";
};
</script>

<script>
const targetDate=new Date("February 3, 2026 00:00:00").getTime();
setInterval(()=>{
  const diff=targetDate-Date.now();
  if(diff<=0){ timer.textContent="RM DAY 🔥"; return; }
  const d=Math.floor(diff/86400000);
  const h=Math.floor(diff/3600000)%24;
  const m=Math.floor(diff/60000)%60;
  timer.textContent=`${d}d ${h}h ${m}m`;
},1000);
</script>

</body>
</html>
