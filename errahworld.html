<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>ErrahWorld | Project Atlas</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap');
        
        :root {
            --bg-main: #040508;
            --bg-panel: rgba(10, 14, 28, 0.7);
            --accent: #7c89ff;
            --accent-glow: rgba(124, 137, 255, 0.5);
            --text-main: #ffffff;
            --text-muted: #8a91ad;
            --border-glass: rgba(255, 255, 255, 0.08);
        }

        /* --- INTRO OVERLAY --- */
        #intro-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 10000;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: opacity 1s cubic-bezier(0.8, 0, 0.2, 1), visibility 1s;
        }
        .terminal-text { font-family: monospace; color: var(--accent); font-size: 0.8rem; margin-bottom: 20px; text-transform: uppercase; letter-spacing: 2px; }
        .intro-title { 
            font-size: 3rem; font-weight: 800; color: #fff; letter-spacing: 15px; 
            position: relative; animation: titlePulse 2s infinite;
        }
        @keyframes titlePulse { 0%, 100% { opacity: 1; filter: brightness(1); } 50% { opacity: 0.7; filter: brightness(1.5); } }
        .load-bar { width: 200px; height: 1px; background: rgba(255,255,255,0.1); margin-top: 20px; position: relative; }
        .load-fill { width: 0%; height: 100%; background: var(--accent); box-shadow: 0 0 15px var(--accent); transition: width 2.5s ease-in-out; }
        .overlay-hide { opacity: 0; visibility: hidden; }

        /* --- MAIN ANIMATIONS --- */
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        @keyframes glitch {
            0% { text-shadow: 2px 0 red, -2px 0 blue; }
            20% { text-shadow: -2px 0 red, 2px 0 blue; }
            100% { text-shadow: 2px 0 red, -2px 0 blue; }
        }

        body {
            margin: 0; padding: 20px; font-family: "Plus Jakarta Sans", sans-serif;
            background-color: var(--bg-main); color: var(--text-main);
            min-height: 100vh; overflow-x: hidden;
            display: flex; flex-direction: column; align-items: center;
        }

        #bg-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; opacity: 0.5; }

        .container { width: 100%; max-width: 900px; animation: fadeInUp 1.2s ease; }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }

        /* --- ALIVE TITLE --- */
        .title-wrapper { text-align: center; margin-bottom: 40px; }
        h1#title {
            font-size: clamp(3rem, 10vw, 5rem); font-weight: 800; margin: 0;
            background: linear-gradient(180deg, #fff 40%, var(--accent));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            animation: glitch 3s infinite linear alternate-reverse;
            letter-spacing: -3px;
        }

        /* --- THE BOARD (Glassmorphism) --- */
        .countdown, .table-container, #desc {
            background: var(--bg-panel); border: 1px solid var(--border-glass);
            backdrop-filter: blur(20px); border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            transition: transform 0.3s ease, border-color 0.3s ease;
        }
        .table-container:hover { border-color: var(--accent); transform: translateY(-5px); }

        /* --- TABLE STYLING --- */
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th { padding: 20px; text-align: left; color: var(--accent); font-size: 0.7rem; letter-spacing: 2px; text-transform: uppercase; }
        td { padding: 20px; border-top: 1px solid var(--border-glass); font-weight: 500; transition: all 0.2s; }
        tr:hover td { background: rgba(124, 137, 255, 0.05); color: var(--accent); }

        /* --- UI ELEMENTS --- */
        .nav-bar { display: flex; gap: 10px; margin-bottom: 40px; background: rgba(255,255,255,0.03); padding: 8px; border-radius: 20px; width: fit-content; margin-inline: auto; border: 1px solid var(--border-glass); }
        .nav-btn { padding: 12px 24px; border-radius: 15px; text-decoration: none; font-size: 0.8rem; font-weight: 700; color: var(--text-muted); }
        .active-nav { background: var(--accent); color: #000; box-shadow: 0 10px 20px var(--accent-glow); }

        #timer { font-size: 3rem; font-weight: 800; color: #fff; text-shadow: 0 0 30px var(--accent-glow); margin: 10px 0; }
        .locked-content { filter: blur(4px); pointer-events: none; opacity: 0.5; }
        
        button { background: #fff; color: #000; border: none; padding: 14px 28px; border-radius: 12px; font-weight: 800; cursor: pointer; transition: 0.3s; }
        button:hover { transform: scale(1.05); box-shadow: 0 0 20px #fff; }
        input { background: rgba(255,255,255,0.05); border: 1px solid var(--border-glass); color: #fff; padding: 14px; border-radius: 12px; outline: none; }
    </style>
</head>
<body>

    <div id="intro-overlay">
        <div class="terminal-text" id="terminal">INITIALIZING...</div>
        <div class="intro-title">ATLAS</div>
        <div class="load-bar"><div class="load-fill" id="load-fill"></div></div>
    </div>

    <canvas id="bg-canvas"></canvas>

    <div class="container">
        <div class="nav-bar">
            <a href="#" class="nav-btn active-nav">PROJECT ATLAS</a>
            <a href="#" class="nav-btn">UPDATES</a>
        </div>

        <div class="title-wrapper">
            <div id="lastUpdateBanner" style="font-size: 0.6rem; letter-spacing: 4px; color: var(--accent); font-weight: 800; margin-bottom: 10px;">NEURAL LINK ACTIVE</div>
            <h1 id="title">SYNCING</h1>
            <div id="desc" style="padding: 20px; margin-top: 20px; font-size: 0.9rem; color: var(--text-muted);">Decrypting biometric strength data...</div>
        </div>

        <div class="countdown" style="text-align: center; padding: 30px; margin-bottom: 30px;">
            <span style="letter-spacing: 5px; font-size: 0.7rem; font-weight: 800; color: var(--accent);">NEXT LIMIT BREAK</span>
            <div id="timer">00D 00H 00M 00S</div>
        </div>

        <div id="authBox" style="display: flex; gap: 10px; justify-content: center; margin-bottom: 30px;">
            <input id="email" placeholder="Admin ID">
            <input id="password" type="password" placeholder="Keyphrase">
            <button id="loginBtn">ACCESS</button>
            <button id="logoutBtn" style="display:none">DISCONNECT</button>
        </div>

        <div class="table-container">
            <table id="table" class="locked-content">
                <thead>
                    <tr>
                        <th>Exercise</th>
                        <th>Status</th>
                        <th>Target</th>
                        <th>1RM</th>
                    </tr>
                </thead>
                <tbody id="tbody">
                    <tr><td colspan="4" style="text-align: center; opacity: 0.3;">LOADING DATABASE...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <script>
        // 1. Intro Animation Logic
        const lines = ["CONNECTING...", "BYPASSING ENCRYPTION...", "EXTRACTING LOGS...", "NEURAL LINK STABLE."];
        let lineIdx = 0;
        const terminal = document.getElementById('terminal');
        const fill = document.getElementById('load-fill');

        function type() {
            if (lineIdx < lines.length) {
                terminal.innerText = lines[lineIdx++];
                setTimeout(type, 600);
            }
        }

        window.onload = () => {
            type();
            fill.style.width = '100%';
            setTimeout(() => {
                document.getElementById('intro-overlay').classList.add('overlay-hide');
            }, 3000);
        };

        // 2. Interactive Background
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        let dots = [];
        let mouse = { x: null, y: null };

        function init() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            dots = [];
            for(let i=0; i<80; i++) dots.push({ x: Math.random()*canvas.width, y: Math.random()*canvas.height, vx: Math.random()-0.5, vy: Math.random()-0.5 });
        }

        window.onmousemove = (e) => { mouse.x = e.x; mouse.y = e.y; };

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            dots.forEach(d => {
                d.x += d.vx; d.y += d.vy;
                if(d.x<0 || d.x>canvas.width) d.vx*=-1;
                if(d.y<0 || d.y>canvas.height) d.vy*=-1;
                
                // Interaction
                let dx = mouse.x - d.x; let dy = mouse.y - d.y;
                let dist = Math.sqrt(dx*dx + dy*dy);
                if(dist < 150) {
                    ctx.beginPath(); ctx.strokeStyle = `rgba(124, 137, 255, ${1 - dist/150})`;
                    ctx.moveTo(d.x, d.y); ctx.lineTo(mouse.x, mouse.y); ctx.stroke();
                }

                ctx.fillStyle = "rgba(124, 137, 255, 0.8)";
                ctx.beginPath(); ctx.arc(d.x, d.y, 1, 0, Math.PI*2); ctx.fill();
            });
            requestAnimationFrame(animate);
        }
        init(); animate();

        // 3. Firebase & Data (Replace your config if needed)
        firebase.initializeApp({
            apiKey:"AIzaSyBoePuKarSCVgvxQQBGvkMKq16DvKmBYBE",
            authDomain:"strenght-a9f37.firebaseapp.com",
            databaseURL:"https://strenght-a9f37-default-rtdb.firebaseio.com",
            projectId:"strenght-a9f37",
            storageBucket:"strenght-a9f37.firebasestorage.app",
            messagingSenderId:"469926449178",
            appId:"1:469926449178:web:b9623947a1c1865b0f81a3"
        });

        const auth = firebase.auth();
        const db = firebase.database();
        const titleEl = document.getElementById("title"), descEl = document.getElementById("desc"), tbody = document.getElementById("tbody");

        db.ref("log").on("value", snap => {
            const d = snap.val() || {};
            titleEl.innerText = d.title || "PROJECT ATLAS";
            descEl.innerHTML = d.desc || "Ready for synchronization.";
            tbody.innerHTML = d.table || "<tr><td colspan='4'>No data link...</td></tr>";
        });

        // 4. Timer Logic
        const targetDate = new Date("February 3, 2026 00:00:00").getTime();
        setInterval(() => {
            const diff = targetDate - Date.now();
            if(diff <= 0) { document.getElementById("timer").innerText = "SYSTEM OVERLOAD"; return; }
            const d = Math.floor(diff/86400000), h = Math.floor(diff/3600000)%24, m = Math.floor(diff/60000)%60, s = Math.floor(diff/1000)%60;
            document.getElementById("timer").innerText = `${d}D ${h}H ${m}M ${s}S`;
        }, 1000);

        // 5. Auth Logic
        const loginBtn = document.getElementById("loginBtn"), logoutBtn = document.getElementById("logoutBtn");
        loginBtn.onclick = () => auth.signInWithEmailAndPassword(document.getElementById("email").value, document.getElementById("password").value).catch(alert);
        logoutBtn.onclick = () => auth.signOut();

        auth.onAuthStateChanged(user => {
            const isAdmin = !!user;
            document.getElementById("table").classList.toggle("locked-content", !isAdmin);
            [titleEl, descEl, tbody].forEach(el => el.contentEditable = isAdmin);
            loginBtn.style.display = user ? "none" : "inline-block";
            logoutBtn.style.display = user ? "inline-block" : "none";
            document.getElementById("email").style.display = user ? "none" : "inline-block";
            document.getElementById("password").style.display = user ? "none" : "inline-block";
        });

        function saveData() {
            if(auth.currentUser) {
                db.ref("log").set({ title: titleEl.innerText, desc: descEl.innerHTML, table: tbody.innerHTML });
            }
        }
        [titleEl, descEl, tbody].forEach(el => el.addEventListener("blur", saveData));
    </script>
</body>
</html>
