<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ERRAH - Native Voice</title>
    <style>
        body { background: #0a0a0c; color: #00d4ff; font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .orb { width: 140px; height: 140px; border-radius: 50%; background: radial-gradient(circle, #00d4ff 0%, transparent 70%); box-shadow: 0 0 40px #00d4ff; cursor: pointer; transition: 0.4s; }
        .orb.pulse { animation: pulse 1.2s infinite; }
        @keyframes pulse { 0% { scale: 1; opacity: 0.8; } 50% { scale: 1.15; opacity: 1; box-shadow: 0 0 70px #00d4ff; } 100% { scale: 1; opacity: 0.8; } }
        #status { margin-top: 25px; font-size: 1.1rem; text-transform: uppercase; letter-spacing: 2px; }
        #log { margin-top: 15px; color: #555; font-size: 0.9rem; max-width: 80%; text-align: center; }
    </style>
</head>
<body>

    <div id="orb" class="orb" onclick="startListening()"></div>
    <div id="status">Tap to speak to Errah</div>
    <div id="log">Ready...</div>

    <script>
        const API_KEY = "AIzaSyB9lgOeKKW3DQBZU0-HiOP_Lv-izoeZ6cY";
        const orb = document.getElementById('orb');
        const status = document.getElementById('status');
        const log = document.getElementById('log');

        const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();

        function startListening() {
            recognition.start();
            orb.classList.add('pulse');
            status.innerText = "Listening...";
        }

        recognition.onresult = async (event) => {
            const userText = event.results[0][0].transcript;
            orb.classList.remove('pulse');
            status.innerText = "Errah is thinking...";
            log.innerText = `You: ${userText}`;

            try {
                // Request Gemini 2.0 to respond with AUDIO
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${API_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{
                            parts: [{ text: `You are Errah, a friendly, witty personal assistant. Respond warmly to: ${userText}` }]
                        }],
                        // THIS TELLS GEMINI TO USE ITS OWN VOICE
                        generationConfig: {
                            response_modalities: ["AUDIO"],
                            speech_config: {
                                voice_config: {
                                    prebuilt_voice_config: {
                                        voice_name: "Kore" // Options: Kore, Fenrir, Puck, Charon
                                    }
                                }
                            }
                        }
                    })
                });

                const data = await response.json();
                
                // Get the base64 audio data from the response
                const audioBase64 = data.candidates[0].content.parts[0].inline_data.data;
                
                playAudio(audioBase64);
                status.innerText = "Errah is speaking...";
            } catch (err) {
                console.error(err);
                status.innerText = "Connection Error";
            }
        };

        function playAudio(base64) {
            const audioSrc = `data:audio/wav;base64,${base64}`;
            const audio = new Audio(audioSrc);
            audio.onended = () => {
                status.innerText = "Tap to speak again";
            };
            audio.play();
        }
    </script>
</body>
</html>
