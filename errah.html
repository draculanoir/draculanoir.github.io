<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EDEX-OS_TERMINAL_V4</title>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-blue: #00d4ff;
            --neon-dim: rgba(0, 212, 255, 0.3);
            --bg-dark: #050507;
            --font-main: 'Share Tech Mono', monospace;
        }

        * { box-sizing: border-box; }

        body {
            background-color: var(--bg-dark);
            color: var(--neon-blue);
            font-family: var(--font-main);
            margin: 0;
            padding: 20px;
            height: 100vh;
            display: grid;
            grid-template-columns: 300px 1fr 300px;
            grid-template-rows: 60px 1fr 100px;
            gap: 15px;
            overflow: hidden;
            text-transform: uppercase;
        }

        /* Scanline and CRT Flicker */
        body::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
            z-index: 100;
            background-size: 100% 3px, 3px 100%;
            pointer-events: none;
        }

        /* Border Glow Styling */
        .frame {
            border: 1px solid var(--neon-blue);
            box-shadow: inset 0 0 10px var(--neon-dim), 0 0 5px var(--neon-dim);
            position: relative;
            background: rgba(0, 20, 30, 0.2);
            padding: 10px;
        }

        .frame-title {
            position: absolute;
            top: -10px;
            left: 10px;
            background: var(--bg-dark);
            padding: 0 5px;
            font-size: 0.8rem;
            color: white;
        }

        /* Header Layout */
        header {
            grid-column: 1 / 4;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .sys-info { display: flex; gap: 20px; }

        /* Sidebar Panels */
        aside {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* Central Terminal */
        main {
            grid-column: 2 / 3;
            display: flex;
            flex-direction: column;
        }

        #terminal-output {
            flex-grow: 1;
            font-size: 0.9rem;
            overflow-y: hidden;
            line-height: 1.4;
        }

        .cursor {
            display: inline-block;
            width: 8px;
            height: 15px;
            background: var(--neon-blue);
            animation: blink 0.8s infinite;
            vertical-align: middle;
        }

        /* Visual Elements */
        .data-stream { font-size: 0.7rem; color: var(--neon-dim); }
        
        .radar {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            border: 1px solid var(--neon-blue);
            margin: 20px auto;
            position: relative;
            background: radial-gradient(circle, var(--neon-dim) 0%, transparent 70%);
        }

        .radar::after {
            content: "";
            position: absolute;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent 50%, var(--neon-blue) 50%);
            opacity: 0.2;
            border-radius: 50%;
            animation: spin 2s linear infinite;
        }

        .bar-graph {
            display: flex;
            align-items: flex-end;
            gap: 4px;
            height: 50px;
        }

        .bar {
            flex: 1;
            background: var(--neon-blue);
            min-height: 5px;
            transition: height 0.3s ease;
        }

        /* Footer */
        footer {
            grid-column: 1 / 4;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.8rem;
        }

        @keyframes blink { 50% { opacity: 0; } }
        @keyframes spin { 100% { transform: rotate(360deg); } }

    </style>
</head>
<body>

    <header class="frame">
        <div class="frame-title">SYSTEM_HEADER</div>
        <div class="sys-info">
            <span>NODES: 12.0.4.1</span>
            <span>UPLINK: ACTIVE</span>
            <span>SIGNAL: 98%</span>
        </div>
        <div id="clock">00:00:00</div>
    </header>

    <aside>
        <div class="frame" style="flex: 1;">
            <div class="frame-title">FS_STRUCTURE</div>
            <div class="data-stream" id="fs-data"></div>
        </div>
        <div class="frame" style="height: 200px;">
            <div class="frame-title">CPU_LOAD</div>
            <div class="bar-graph" id="cpu-graph"></div>
        </div>
    </aside>

    <main class="frame">
        <div class="frame-title">CORE_KERNEL_TERMINAL</div>
        <div id="terminal-output"></div>
        <div><span style="color:white">guest@edex_os:~$</span> <span class="cursor"></span></div>
    </main>

    <aside>
        <div class="frame" style="height: 220px;">
            <div class="frame-title">POSITIONAL_RADAR</div>
            <div class="radar"></div>
            <center style="font-size: 10px;">SCANNING OBJECTS...</center>
        </div>
        <div class="frame" style="flex: 1;">
            <div class="frame-title">NETWORK_TRAFFIC</div>
            <div id="net-logs" style="font-size: 11px;"></div>
        </div>
    </aside>

    <footer class="frame">
        <div class="frame-title">IO_STATUS</div>
        <div>LATENCY: 14ms</div>
        <div style="width: 50%; height: 5px; background: #111; position: relative;">
            <div id="progress" style="position: absolute; height: 100%; background: var(--neon-blue); width: 0%;"></div>
        </div>
        <div>SECURE_ENCRYPTION: AES-256</div>
    </footer>

    <script>
        // 1. Clock functionality
        function updateClock() {
            const now = new Date();
            document.getElementById('clock').textContent = now.toTimeString().split(' ')[0];
        }
        setInterval(updateClock, 1000);

        // 2. Terminal Boot Sequence
        const logData = [
            "[OK] DEPLOYING CORE KERNEL",
            "[OK] INITIALIZING NETWORK VIRTUALIZATION",
            "[!!] BYPASSING LOCAL FIREWALLS",
            "[OK] ESTABLISHING HANDSHAKE WITH NODE 0xFF21",
            "-------------------------------------------",
            "EDEX-UI INITIALIZED SUCCESSFULY",
            "MOUNTING /DEV/SDA1 ... OK",
            "MOUNTING /SYS/USER ... OK",
            "READY FOR COMMAND INPUT."
        ];

        let logIdx = 0;
        const term = document.getElementById('terminal-output');
        function writeLog() {
            if(logIdx < logData.length) {
                const line = document.createElement('div');
                line.textContent = logData[logIdx];
                term.appendChild(line);
                logIdx++;
                setTimeout(writeLog, 600);
            }
        }

        // 3. Fake Data Stream (Left Side)
        const fsData = document.getElementById('fs-data');
        function updateFS() {
            let hex = Math.random().toString(16).substring(2, 10).toUpperCase();
            let div = document.createElement('div');
            div.textContent = `0x${hex} MOVED TO /TEMP`;
            fsData.prepend(div);
            if(fsData.childNodes.length > 20) fsData.removeChild(fsData.lastChild);
        }

        // 4. CPU Graph (Bottom Left)
        const graph = document.getElementById('cpu-graph');
        for(let i=0; i<20; i++) {
            let bar = document.createElement('div');
            bar.className = 'bar';
            graph.appendChild(bar);
        }
        function updateGraph() {
            document.querySelectorAll('.bar').forEach(bar => {
                bar.style.height = Math.random() * 100 + "%";
            });
        }

        // 5. Progress Bar
        let pWidth = 0;
        function updateProgress() {
            pWidth = (pWidth + 1) % 101;
            document.getElementById('progress').style.width = pWidth + "%";
        }

        // Initialize All
        writeLog();
        setInterval(updateFS, 800);
        setInterval(updateGraph, 300);
        setInterval(updateProgress, 100);
        updateClock();
    </script>
</body>
</html>
