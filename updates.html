<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>ErrahWorld | System Updates</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;600&display=swap');
        
        :root {
            --bg-main: #0a0e1a;
            --bg-secondary: #0f1423;
            --bg-panel: rgba(15, 20, 35, 0.85);
            --accent-primary: #6366f1;
            --accent-secondary: #8b5cf6;
            --accent-glow: rgba(99, 102, 241, 0.35);
            --text-primary: #f8fafc;
            --text-secondary: #cbd5e1;
            --border-glass: rgba(255, 255, 255, 0.12);
            --shadow-xl: 0 30px 90px rgba(0, 0, 0, 0.5);
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); filter: blur(8px); }
            to { opacity: 1; transform: translateY(0); filter: blur(0); }
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, var(--bg-main) 0%, var(--bg-secondary) 100%);
            background-attachment: fixed;
            color: var(--text-primary);
            min-height: 100vh;
            display: flex; flex-direction: column; align-items: center;
            padding: 40px 20px;
        }

        .container {
            width: 100%; max-width: 800px;
            animation: fadeInUp 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* Nav Bar - Matches Main */
        .nav-bar { 
            display: flex; gap: 6px; margin-bottom: 50px; background: var(--bg-panel);
            padding: 8px; border-radius: 20px; border: 1px solid var(--border-glass);
            width: fit-content; margin-inline: auto; backdrop-filter: blur(24px);
        }

        .nav-btn { 
            padding: 12px 28px; border-radius: 16px; text-decoration: none; font-size: 0.875rem; 
            font-weight: 600; color: var(--text-secondary); transition: 0.3s;
        }

        .active-nav { color: #ffffff; background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary)); }

        h1 { 
            margin: 0 0 40px; font-size: clamp(2.5rem, 10vw, 4rem); text-align: center; font-weight: 900; 
            background: linear-gradient(135deg, #ffffff 0%, var(--accent-primary) 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }

        /* Post Box (Admin Only) */
        #postBox { 
            background: var(--bg-panel); border: 1px solid var(--border-glass); 
            padding: 24px; border-radius: 24px; margin-bottom: 40px; display: none;
            backdrop-filter: blur(32px); box-shadow: var(--shadow-xl);
        }
        textarea { 
            width: 100%; min-height: 100px; background: rgba(0,0,0,0.2); 
            color: #fff; border: 1px solid var(--border-glass); border-radius: 16px; 
            padding: 16px; margin-bottom: 16px; font-family: inherit; resize: none; outline: none;
        }
        #postBtn { 
            width: 100%; padding: 16px; border-radius: 16px; border: none;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            color: white; font-weight: 800; cursor: pointer; text-transform: uppercase;
        }

        /* Updates Feed */
        .update-card {
            background: var(--bg-panel); border: 1px solid var(--border-glass);
            border-radius: 24px; padding: 24px; margin-bottom: 20px;
            backdrop-filter: blur(32px); box-shadow: var(--shadow-xl);
            position: relative; overflow: hidden;
        }

        .update-card::before {
            content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px;
            background: linear-gradient(to bottom, var(--accent-primary), var(--accent-secondary));
        }

        .update-time {
            font-family: 'JetBrains Mono', monospace; font-size: 0.7rem;
            color: var(--accent-primary); text-transform: uppercase;
            letter-spacing: 2px; margin-bottom: 12px;
        }

        .update-text {
            font-size: 1.1rem; line-height: 1.6; color: var(--text-primary);
        }

        .delete-btn {
            margin-top: 16px; background: none; border: none; color: #ef4444;
            font-size: 0.75rem; font-weight: 700; cursor: pointer; opacity: 0.6;
        }
        .delete-btn:hover { opacity: 1; text-decoration: underline; }

    </style>
</head>
<body>

    <div class="container">
        <nav class="nav-bar">
            <a href="errahworld.html" class="nav-btn">Project Atlas</a>
            <a href="updates.html" class="nav-btn active-nav">Updates</a>
        </nav>

        <h1>System Logs</h1>

        <div id="postBox">
            <textarea id="postText" placeholder="Example: Single Leg RDL rose by 5lb..."></textarea>
            <button id="postBtn">Broadcast Strength Update</button>
        </div>

        <div id="updates">
            </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <script>
        firebase.initializeApp({
            apiKey: "AIzaSyBoePuKarSCVgvxQQBGvkMKq16DvKmBYBE",
            authDomain: "strenght-a9f37.firebaseapp.com",
            databaseURL: "https://strenght-a9f37-default-rtdb.firebaseio.com",
            projectId: "strenght-a9f37"
        });

        const auth = firebase.auth();
        const db = firebase.database();

        auth.onAuthStateChanged(user => {
            document.getElementById("postBox").style.display = user ? "block" : "none";
            loadUpdates(!!user);
        });

        document.getElementById("postBtn").onclick = () => {
            const text = document.getElementById("postText").value;
            if(!text.trim()) return;
            
            const now = new Date();
            const timeStr = `${now.getDate()} ${now.toLocaleString('en-GB', {month:'long'})} ${now.getFullYear()} @ ${now.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}`;
            
            db.ref("updates").push({
                text: text,
                time: timeStr,
                ts: Date.now()
            }).then(() => {
                document.getElementById("postText").value = "";
            });
        };

        function loadUpdates(isAdmin) {
            db.ref("updates").orderByChild("ts").on("value", snap => {
                const container = document.getElementById("updates");
                container.innerHTML = "";
                const val = snap.val() || {};
                const entries = Object.entries(val).sort((a,b) => b[1].ts - a[1].ts);
                
                entries.forEach(([id, post]) => {
                    const div = document.createElement("div");
                    div.className = "update-card";
                    div.innerHTML = `
                        <div class="update-time">${post.time}</div>
                        <div class="update-text">${post.text.replace(/\n/g, '<br>')}</div>
                        ${isAdmin ? `<button class="delete-btn" onclick="deletePost('${id}')">ERASE LOG ENTRY</button>` : ""}
                    `;
                    container.appendChild(div);
                });
            });
        }

        window.deletePost = (id) => {
            if(confirm("Confirm deletion of this strength record?")) {
                db.ref("updates/" + id).remove();
            }
        };
    </script>
</body>
</html>
