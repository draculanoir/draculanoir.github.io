<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Updates</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
:root{
  --bg:#0a0c13; --panel:#161a2a; --border:rgba(255,255,255,.08);
  --text:#eef0f6; --muted:#9aa1b3; --accent:#cfd6ff; --danger:#ff6b6b;
}
body{ margin:0; padding:20px; font-family:Inter,sans-serif; background:var(--bg); color:var(--text); }

/* Navigation */
.nav-bar { display: flex; gap: 8px; margin-bottom: 25px; justify-content: center; }
.nav-btn { background: rgba(255,255,255,0.05); border: 1px solid var(--border); color: var(--accent); padding: 8px 12px; border-radius: 10px; text-decoration: none; font-size: 0.85rem; flex: 1; text-align: center; }
.active-nav { background: var(--accent); color: #000; }

/* Admin Controls */
#adminControls { display: none; margin-bottom: 20px; text-align: right; }
#logoutBtn { background: rgba(255,107,107,0.1); border: 1px solid var(--danger); color: var(--danger); padding: 6px 12px; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 0.8rem; border: 1px solid var(--danger); }

/* Posting Area */
#postBox{ display:none; background:var(--panel); border:1px solid var(--border); border-radius:15px; padding:15px; margin-bottom:25px; }
#postBox textarea{ width:100%; min-height:80px; background:#0f1324; color:#fff; border:1px solid var(--border); border-radius:10px; padding:12px; margin-bottom:10px; outline: none; font-family: inherit; resize: vertical; }
#postBtn { background:var(--accent); color:#000; border:none; padding:12px 20px; border-radius:10px; font-weight:700; cursor:pointer; width: 100%; }

/* Update Feed */
.update{ background:var(--panel); border:1px solid var(--border); border-radius:15px; padding:18px; margin-bottom:12px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
.time{ font-size:0.75rem; color:var(--accent); margin-bottom:8px; font-weight: 600; letter-spacing: 0.02em; }
.post-content { line-height: 1.5; color: var(--text); }
.delete{ color:var(--danger); font-size:0.75rem; cursor:pointer; background:none; border:none; margin-top:12px; padding: 0; opacity: 0.6; }
.delete:hover { opacity: 1; text-decoration: underline; }
</style>
</head>
<body>

<div class="nav-bar">
  <a href="errahworld.html" class="nav-btn">🏋️ Log</a>
  <a href="updates.html" class="nav-btn active-nav">📢 Updates</a>
</div>

<div id="adminControls">
  <button id="logoutBtn">Logout Admin</button>
</div>

<div id="postBox">
  <textarea id="postText" placeholder="Write an update..."></textarea>
  <button id="postBtn">Post Update</button>
</div>

<div id="updates"></div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>
// Firebase Config
firebase.initializeApp({
  apiKey:"AIzaSyBoePuKarSCVgvxQQBGvkMKq16DvKmBYBE",
  authDomain:"strenght-a9f37.firebaseapp.com",
  databaseURL:"https://strenght-a9f37-default-rtdb.firebaseio.com",
  projectId:"strenght-a9f37",
  storageBucket:"strenght-a9f37.firebasestorage.app",
  messagingSenderId:"469926449178",
  appId:"1:469926449178:web:b9623947a1c1865b0f81a3"
});

const auth = firebase.auth();
const db = firebase.database();
auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);

// Custom Date Formatter: "25 January 2026 8:10 PM"
function getFormattedDate() {
  const now = new Date();
  const months = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
  const day = now.getDate();
  const month = months[now.getMonth()];
  const year = now.getFullYear();
  
  let hours = now.getHours();
  let minutes = now.getMinutes();
  const ampm = hours >= 12 ? 'PM' : 'AM';
  hours = hours % 12;
  hours = hours ? hours : 12; 
  minutes = minutes < 10 ? '0'+minutes : minutes;
  
  return `${day} ${month} ${year} ${hours}:${minutes} ${ampm}`;
}

// Auth Listener
auth.onAuthStateChanged(user => {
  const isUser = !!user;
  document.getElementById("postBox").style.display = isUser ? "block" : "none";
  document.getElementById("adminControls").style.display = isUser ? "block" : "none";
  loadUpdates(isUser);
});

// Logout logic
document.getElementById("logoutBtn").onclick = () => {
  if(confirm("Sign out of admin mode?")) auth.signOut();
};

// Post logic
document.getElementById("postBtn").onclick = () => {
  const text = document.getElementById("postText").value;
  if(!text.trim()) return;
  
  const dateStr = getFormattedDate();
  
  db.ref("updates").push({ 
    text: text, 
    time: dateStr, 
    ts: Date.now() 
  });
  
  document.getElementById("postText").value = "";
};

// Load Feed
function loadUpdates(isAdmin) {
  db.ref("updates").orderByChild("ts").on("value", snap => {
    const updatesEl = document.getElementById("updates");
    updatesEl.innerHTML = "";
    const data = snap.val() || {};
    
    // Sort posts to show newest first
    Object.entries(data).reverse().forEach(([id, post]) => {
      const div = document.createElement("div");
      div.className = "update";
      div.innerHTML = `
        <div class="time">${post.time}</div>
        <div class="post-content">${post.text.replace(/\n/g,"<br>")}</div>
        ${isAdmin ? `<button class="delete" onclick="deleteUpdate('${id}')">Delete Post</button>` : ""}
      `;
      updatesEl.appendChild(div);
    });
  });
}

// Delete logic
window.deleteUpdate = (id) => { if(confirm("Permanently delete this post?")) db.ref("updates/"+id).remove(); };
</script>
</body>
</html>
