<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Updates</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
:root{
  --bg:#0a0c13; --panel:#161a2a; --border:rgba(255,255,255,.08);
  --text:#eef0f6; --muted:#9aa1b3; --accent:#cfd6ff; --danger:#ff6b6b;
}
body{ margin:0; padding:28px; font-family:Inter,sans-serif; background:var(--bg); color:var(--text); }
.container{ max-width:800px; margin:auto; }
.nav-bar { display: flex; gap: 15px; margin-bottom: 25px; }
.nav-btn { background: rgba(255,255,255,0.05); border: 1px solid var(--border); color: var(--accent); padding: 8px 16px; border-radius: 10px; text-decoration: none; }
.banner { font-size: 0.85rem; color: var(--muted); margin-bottom: 20px; padding: 10px; border-left: 3px solid var(--accent); background: rgba(207,214,255,0.05); }
#authBox{ display:flex; gap:10px; margin-bottom:20px; }
#authBox input{ background:#0f1324; border:1px solid var(--border); color:#fff; padding:10px; border-radius:10px; }
#authBox button{ background:#3a43a0; border:none; color:#fff; padding:10px 15px; border-radius:10px; cursor:pointer; }
#postBox{ display:none; background:var(--panel); border:1px solid var(--border); border-radius:18px; padding:18px; margin-bottom:26px; }
#postBox textarea{ width:100%; min-height:80px; background:#0f1324; color:#fff; border:1px solid var(--border); border-radius:12px; padding:12px; margin-bottom:10px; }
#postBtn { background:var(--accent); color:#000; border:none; padding:10px 20px; border-radius:10px; font-weight:700; cursor:pointer; }
.update{ background:var(--panel); border:1px solid var(--border); border-radius:15px; padding:16px; margin-bottom:12px; }
.time{ font-size:.7rem; color:var(--muted); margin-bottom:5px; }
.delete{ color:var(--danger); font-size:.75rem; cursor:pointer; background:none; border:none; margin-top:10px; }
</style>
</head>
<body>
<div class="container">
  <div class="nav-bar">
    <a href="errahworld.html" class="nav-btn">🏋️ Log</a>
    <a href="updates.html" class="nav-btn">📢 Updates</a>
  </div>

  <h1>Updates</h1>
  <div id="lastUpdateDisplay" class="banner">Checking for updates...</div>

  <div id="authBox">
    <input id="email" placeholder="admin email">
    <input id="password" type="password" placeholder="password">
    <button id="loginBtn">Login</button>
    <button id="logoutBtn" style="display:none">Logout</button>
  </div>

  <div id="postBox">
    <textarea id="postText" placeholder="What's new today?"></textarea>
    <button id="postBtn">Post update</button>
  </div>

  <div id="updates"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>
firebase.initializeApp({
  apiKey:"AIzaSyBoePuKarSCVgvxQQBGvkMKq16DvKmBYBE",
  authDomain:"strenght-a9f37.firebaseapp.com",
  databaseURL:"https://strenght-a9f37-default-rtdb.firebaseio.com",
  projectId:"strenght-a9f37",
  storageBucket:"strenght-a9f37.firebasestorage.app",
  messagingSenderId:"469926449178",
  appId:"1:469926449178:web:b9623947a1c1865b0f81a3"
});

const auth = firebase.auth();
const db = firebase.database();
auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);

auth.onAuthStateChanged(user => {
  const isUser = !!user;
  document.getElementById("postBox").style.display = isUser ? "block" : "none";
  document.getElementById("loginBtn").style.display = isUser ? "none" : "inline-block";
  document.getElementById("email").style.display = isUser ? "none" : "inline-block";
  document.getElementById("password").style.display = isUser ? "none" : "inline-block";
  document.getElementById("logoutBtn").style.display = isUser ? "inline-block" : "none";
  loadUpdates(isUser);
});

document.getElementById("loginBtn").onclick = () => 
  auth.signInWithEmailAndPassword(document.getElementById("email").value, document.getElementById("password").value).catch(e=>alert(e.message));
document.getElementById("logoutBtn").onclick = () => auth.signOut();

document.getElementById("postBtn").onclick = () => {
  const text = document.getElementById("postText").value;
  if(!text.trim()) return;
  const now = new Date().toLocaleString();

  db.ref("updates").push({ text: text, time: now, ts: Date.now() });
  db.ref("meta/lastUpdate").set(now); // Set the global last update time
  document.getElementById("postText").value = "";
};

function loadUpdates(isAdmin) {
  db.ref("updates").orderByChild("ts").on("value", snap => {
    const updatesEl = document.getElementById("updates");
    updatesEl.innerHTML = "";
    const data = snap.val() || {};
    Object.entries(data).reverse().forEach(([id, post]) => {
      const div = document.createElement("div");
      div.className = "update";
      div.innerHTML = `
        <div class="time">${post.time}</div>
        <div>${post.text.replace(/\n/g,"<br>")}</div>
        ${isAdmin ? `<button class="delete" onclick="deleteUpdate('${id}')">Delete</button>` : ""}
      `;
      updatesEl.appendChild(div);
    });
  });
}

db.ref("meta/lastUpdate").on("value", snap => {
  document.getElementById("lastUpdateDisplay").innerText = "Website Last Updated: " + (snap.val() || "Never");
});

window.deleteUpdate = (id) => { if(confirm("Delete this?")) db.ref("updates/"+id).remove(); };
</script>
</body>
</html>
