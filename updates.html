<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Updates</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

:root{
  --bg:#0a0c13;
  --panel:#161a2a;
  --border:rgba(255,255,255,.08);
  --text:#eef0f6;
  --muted:#9aa1b3;
  --accent:#cfd6ff;
  --danger:#ff6b6b;
  --shadow:0 18px 40px rgba(0,0,0,.55);
}

*{ box-sizing:border-box }

body{
  margin:0;
  padding:28px;
  font-family:Inter,system-ui,sans-serif;
  background:
    radial-gradient(1000px 500px at top,#1c2340,transparent 60%),
    var(--bg);
  color:var(--text);
}

.container{
  max-width:900px;
  margin:auto;
}

h1{
  margin-bottom:18px;
}

/* ADMIN AUTH (HIDDEN BY DEFAULT) */
#authBox{
  display:none;
  margin-bottom:24px;
  gap:10px;
  flex-wrap:wrap;
}

#authBox input{
  background:#0f1324;
  border:1px solid var(--border);
  color:var(--text);
  padding:10px 14px;
  border-radius:12px;
}

#authBox button{
  background:linear-gradient(135deg,#3a43a0,#2a2f66);
  border:none;
  color:#fff;
  padding:10px 18px;
  border-radius:14px;
  font-weight:600;
  cursor:pointer;
}

/* POST BOX */
#postBox{
  display:none;
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:18px;
  padding:18px;
  box-shadow:var(--shadow);
  margin-bottom:30px;
}

#postBox textarea{
  width:100%;
  min-height:90px;
  resize:none;
  background:#0f1324;
  color:var(--text);
  border:1px solid var(--border);
  border-radius:14px;
  padding:14px;
  font-family:inherit;
}

.update{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:18px;
  padding:16px 18px;
  margin-bottom:14px;
  box-shadow:var(--shadow);
}

.time{
  font-size:.7rem;
  color:var(--muted);
  margin-bottom:8px;
}

.delete{
  margin-top:10px;
  background:none;
  color:var(--danger);
  border:none;
  font-size:.75rem;
  cursor:pointer;
}
</style>
</head>

<body>
<div class="container">

<h1>Updates</h1>

<!-- ADMIN LOGIN -->
<div id="authBox">
  <input id="email" placeholder="admin email">
  <input id="password" type="password" placeholder="password">
  <button id="loginBtn">Login</button>
  <button id="logoutBtn" style="display:none">Logout</button>
</div>

<!-- ADMIN POST -->
<div id="postBox">
  <textarea id="postText" placeholder="Write an update..."></textarea>
  <button id="postBtn">Post Update</button>
</div>

<!-- PUBLIC UPDATES -->
<div id="updates"></div>

</div>

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>
firebase.initializeApp({
  apiKey:"AIzaSyBoePuKarSCVgvxQQBGvkMKq16DvKmBYBE",
  authDomain:"strenght-a9f37.firebaseapp.com",
  databaseURL:"https://strenght-a9f37-default-rtdb.firebaseio.com",
  projectId:"strenght-a9f37",
  storageBucket:"strenght-a9f37.firebasestorage.app",
  messagingSenderId:"469926449178",
  appId:"1:469926449178:web:b9623947a1c1865b0f81a3"
});

const auth = firebase.auth();
const db = firebase.database();

/* DOM */
const authBox = document.getElementById("authBox");
const emailEl = document.getElementById("email");
const passEl = document.getElementById("password");
const loginBtn = document.getElementById("loginBtn");
const logoutBtn = document.getElementById("logoutBtn");

const postBox = document.getElementById("postBox");
const postText = document.getElementById("postText");
const postBtn = document.getElementById("postBtn");

const updatesEl = document.getElementById("updates");

let isAdmin = false;

/* DATE FORMAT */
function formatDate(d){
  return d.toLocaleDateString("en-GB",{
    day:"2-digit",
    month:"long",
    year:"numeric"
  }) + " · " + d.toLocaleTimeString("en-US",{
    hour:"numeric",
    minute:"2-digit",
    hour12:true
  });
}

/* AUTH STATE */
auth.onAuthStateChanged(user=>{
  isAdmin = !!user;

  authBox.style.display = user ? "none" : "flex";
  postBox.style.display = isAdmin ? "block" : "none";

  loginBtn.style.display = user ? "none" : "inline-block";
  logoutBtn.style.display = user ? "inline-block" : "none";
});

/* LOGIN */
loginBtn.onclick = () =>
  auth.signInWithEmailAndPassword(emailEl.value, passEl.value)
    .catch(e=>alert(e.message));

logoutBtn.onclick = () => auth.signOut();

/* POST */
postBtn.onclick = () => {
  if(!postText.value.trim()) return;

  db.ref("updates").push({
    text: postText.value,
    time: formatDate(new Date()),
    ts: Date.now()
  });

  postText.value = "";
};

/* LOAD UPDATES (PUBLIC) */
db.ref("updates").orderByChild("ts").on("value", snap=>{
  updatesEl.innerHTML = "";
  const data = snap.val() || {};

  Object.entries(data).reverse().forEach(([id, post])=>{
    const div = document.createElement("div");
    div.className = "update";
    div.innerHTML = `
      <div class="time">${post.time}</div>
      <div>${post.text.replace(/\n/g,"<br>")}</div>
      ${isAdmin ? `<button class="delete">Delete</button>` : ""}
    `;

    if(isAdmin){
      div.querySelector(".delete").onclick = () =>
        db.ref("updates/"+id).remove();
    }

    updatesEl.appendChild(div);
  });
});
</script>

</body>
</html>
