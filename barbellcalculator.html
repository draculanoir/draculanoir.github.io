<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Barbell Calculator</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

:root{
  --bg-main:#0a0c13;
  --bg-panel:rgba(22,26,42,.88);
  --border:rgba(255,255,255,.08);
  --text:#eef0f6;
  --muted:#9aa1b3;
  --accent:#cfd6ff;
}

*{ box-sizing:border-box; }

body{
  margin:0; padding:28px;
  font-family:"Inter",sans-serif;
  background: radial-gradient(1000px 500px at top,#1c2340,transparent 60%), var(--bg-main);
  color:var(--text);
  display: flex; flex-direction: column; align-items: center;
}

/* NAV BAR */
.nav-bar { display: flex; gap: 12px; margin-bottom: 35px; width: 100%; max-width: 800px; }
.nav-btn { background: rgba(255,255,255,0.05); border: 1px solid var(--border); color: var(--accent); padding: 10px 18px; border-radius: 12px; text-decoration: none; font-weight: 500; font-size: 0.9rem; }
.nav-btn:hover { background: rgba(255,255,255,0.1); }
.active-nav { background: var(--accent); color: #000; }

.container { width: 100%; max-width: 800px; }
h1 { margin: 0 0 10px; font-size: 2.2rem; font-weight: 700; }

.calc-card {
  background: var(--bg-panel);
  border: 1px solid var(--border);
  border-radius: 24px;
  padding: 32px;
  box-shadow: 0 18px 40px rgba(0,0,0,.55);
}

.controls { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 30px; }
.input-group { display: flex; flex-direction: column; gap: 8px; }
.input-group label { font-size: 0.75rem; color: var(--muted); text-transform: uppercase; font-weight: 700; }

input[type="number"] {
  background: rgba(0,0,0,.3);
  border: 1px solid var(--border);
  color: var(--accent);
  padding: 14px;
  border-radius: 14px;
  font-size: 1.2rem;
  outline: none;
}

.check-box {
  grid-column: span 2;
  display: flex; align-items: center; gap: 10px;
  padding: 10px; cursor: pointer; color: var(--muted);
}

/* BARBELL VISUAL */
.visual-area { margin: 50px 0; display: flex; align-items: center; justify-content: center; }
.bar-shaft { width: 280px; height: 14px; background: linear-gradient(#ccc,#777); border-radius: 10px; position: relative; z-index: 1; }
.plate-stack { display: flex; align-items: center; }

.plate {
  margin: 0 2px;
  display: flex; align-items: center; justify-content: center;
  font-size: 0.7rem; font-weight: 800; color: #000;
  border-radius: 6px; box-shadow: 0 4px 10px rgba(0,0,0,0.4);
}

.p45{ width:34px; height:100px; background:#c0392b; }
.p35{ width:32px; height:92px; background:#d35400; }
.p25{ width:30px; height:85px; background:#f1c40f; }
.p10{ width:24px; height:65px; background:#3498db; color:#fff; }
.p5 { width:20px; height:55px; background:#2ecc71; }
.p2_5{ width:16px; height:45px; background:#bdc3c7; }

.result-box {
  text-align: center; padding: 25px;
  background: rgba(255,255,255,0.03);
  border-radius: 20px; border: 1px solid var(--border);
}
#totalDisplay { font-size: 1.8rem; font-weight: 800; color: var(--accent); margin-bottom: 5px; }
#plateBreakdown { color: var(--muted); font-size: 0.95rem; }

@media(max-width: 600px) {
  .controls { grid-template-columns: 1fr; }
  .bar-shaft { width: 140px; }
}
</style>
</head>
<body>

<div class="nav-bar">
  <a href="errahworld.html" class="nav-btn">🏋️ Log</a>
  <a href="updates.html" class="nav-btn">📢 Updates</a>
  <a href="barbellcalculator.html" class="nav-btn active-nav">⚖️ Calc</a>
</div>

<div class="container">
  <h1>Barbell Calc</h1>
  
  <div class="calc-card">
    <div class="controls">
      <div class="input-group">
        <label>Total Weight (lbs)</label>
        <input id="weightInput" type="number" placeholder="225" autofocus>
      </div>
      <div class="input-group">
        <label>Bar Weight</label>
        <input id="barInput" type="number" value="45">
      </div>
      <label class="check-box">
        <input type="checkbox" id="barCheck" checked>
        <span>Include bar in total</span>
      </label>
    </div>

    <div class="visual-area">
      <div id="lSide" class="plate-stack"></div>
      <div class="bar-shaft"></div>
      <div id="rSide" class="plate-stack"></div>
    </div>

    <div class="result-box">
      <div id="totalDisplay">0 lbs</div>
      <div id="plateBreakdown">Enter weight to see plates</div>
    </div>
  </div>
</div>

<script>
const plateSizes = [45, 35, 25, 10, 5, 2.5];

function calculate() {
  const lSide = document.getElementById("lSide"), rSide = document.getElementById("rSide");
  const weightInput = document.getElementById("weightInput"), barInput = document.getElementById("barInput");
  const barCheck = document.getElementById("barCheck"), totalDisplay = document.getElementById("totalDisplay");
  const breakdown = document.getElementById("plateBreakdown");

  lSide.innerHTML = ""; rSide.innerHTML = "";
  
  let target = parseFloat(weightInput.value);
  let bar = parseFloat(barInput.value) || 0;

  if (!target || target <= 0) {
    totalDisplay.innerText = "0 lbs";
    breakdown.innerText = "Enter weight to see plates";
    return;
  }

  let load = barCheck.checked ? (target - bar) : target;
  if (load < 0) {
    totalDisplay.innerText = "Below Bar Weight";
    return;
  }

  let weightPerSide = load / 2;
  let stack = [];
  let rem = weightPerSide;

  plateSizes.forEach(p => {
    while (rem >= p) {
      rem -= p;
      stack.push(p);
    }
  });

  stack.forEach(p => {
    const pClass = p === 2.5 ? "p2_5" : "p" + p;
    rSide.innerHTML += `<div class="plate ${pClass}">${p}</div>`;
  });

  [...stack].reverse().forEach(p => {
    const pClass = p === 2.5 ? "p2_5" : "p" + p;
    lSide.innerHTML += `<div class="plate ${pClass}">${p}</div>`;
  });

  const finalTotal = (stack.reduce((a, b) => a + b, 0) * 2) + (barCheck.checked ? bar : 0);
  totalDisplay.innerText = finalTotal + " lbs";
  breakdown.innerText = stack.length > 0 ? "Per side: " + stack.join(", ") + " lbs" : "Bar only";
}

[document.getElementById("weightInput"), document.getElementById("barInput"), document.getElementById("barCheck")].forEach(el => {
  el.addEventListener("input", calculate);
});
</script>

</body>
</html>
